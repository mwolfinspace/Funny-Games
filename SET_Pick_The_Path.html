<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET - Pick The Path</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .setup-screen, .game-screen, .end-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active, .end-screen.active {
            display: block;
        }

        .setup-group {
            margin-bottom: 25px;
        }

        .setup-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .color-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .symbol-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .symbol-option {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .symbol-option:hover {
            border-color: #667eea;
        }

        .symbol-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .orientation-select {
            display: flex;
            gap: 20px;
        }

        .orientation-option {
            padding: 15px 30px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .orientation-option:hover {
            border-color: #667eea;
        }

        .orientation-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 600px;
        }

        .path-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card-slot {
            width: 150px;
            height: 210px;
            border: 3px dashed #667eea;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slot-a, .slot-b {
            cursor: pointer;
            transition: all 0.3s;
        }

        .slot-a:hover, .slot-b:hover {
            background: #f0f0f0;
            border-color: #5568d3;
        }

        .slots {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .path {
            fill: none;
            stroke: #333;
            stroke-width: 5;
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .intersection {
            fill: #667eea;
        }

        .sign {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 5px;
            padding: 5px 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SET - Pick The Path</h1>
        
        <div class="setup-screen active">
            <div class="setup-container">
                <div class="setup-left">
                    <div class="setup-group">
                        <label>Choose 3 Colors:</label>
                        <div class="color-inputs">
                            <div class="color-input">
                                <input type="color" id="color1" value="#FF0000">
                                <span>Color 1</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color2" value="#00FF00">
                                <span>Color 2</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color3" value="#0000FF">
                                <span>Color 3</span>
                            </div>
                        </div>
                    </div>

                    <div class="setup-group">
                        <label>Card Background Color:</label>
                        <input type="color" id="cardBg" value="#FFFFFF">
                    </div>

                    <div class="setup-group">
                        <label>Choose 3 Symbols:</label>
                        <div class="symbol-select">
                            <div class="symbol-option selected" data-symbol="diamond">
                                <div></div>
                                <span>Diamond</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="circle">
                                <div></div>
                                <span>Circle</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="pill">
                                <div></div>
                                <span>Pill</span>
                            </div>
                            <div class="symbol-option" data-symbol="wave">
                                <div></div>
                                <span>Wave</span>
                            </div>
                            <div class="symbol-option" data-symbol="triangle">
                                <div></div>
                                <span>Triangle</span>
                            </div>
                            <div class="symbol-option" data-symbol="square">
                                <div></div>
                                <span>Square</span>
                            </div>
                            <div class="symbol-option" data-symbol="star">
                                <div></div>
                                <span>Star</span>
                            </div>
                        </div>
                        <div class="symbol-count">Selected: 3 symbols</div>
                    </div>

                    <div class="setup-group">
                        <label>Card Orientation:</label>
                        <div class="orientation-select">
                            <div class="orientation-option selected" data-orientation="vertical">Vertical</div>
                            <div class="orientation-option" data-orientation="horizontal">Horizontal</div>
                        </div>
                    </div>

                    <button class="start-btn" onclick="startGame()">Start The Game</button>
                </div>
                <div class="setup-right">
                    <label>Live Preview</label>
                    <div class="demo-area" id="demoArea"></div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div class="game-area">
                <div id="card-slot" class="card-slot"></div>
                <div class="path-area">
                    <svg id="path-svg" class="path-svg"></svg>
                    <div id="sign1" class="sign"></div>
                    <div id="sign2" class="sign"></div>
                </div>
                <div class="slots">
                    <div id="slot-a" class="card-slot slot-a">A</div>
                    <div id="slot-b" class="card-slot slot-b">B</div>
                </div>
            </div>
        </div>

        <div class="end-screen">
            <h2>Congratulations! 🎉</h2>
            <div class="stats" id="stats"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let settings = {
            colors: ['#FF0000', '#00FF00', '#0000FF'],
            cardBg: '#FFFFFF',
            symbols: ['diamond', 'circle', 'pill'],
            orientation: 'vertical'
        };

        let deck = [];
        let currentCard = null;
        let feature1 = null;
        let feature2 = null;
        let score = 0;

        const symbolNames = {
            'diamond': 'Diamond',
            'circle': 'Circle',
            'pill': 'Pill',
            'wave': 'Wave',
            'triangle': 'Triangle',
            'square': 'Square',
            'star': 'Star'
        };

        // Setup screen handlers
        document.querySelectorAll('.symbol-option').forEach(opt => {
            opt.addEventListener('click', function() {
                this.classList.toggle('selected');
                
                const count = document.querySelectorAll('.symbol-option.selected').length;
                document.querySelector('.symbol-count').textContent = `Selected: ${count} symbols`;
                updateDemo();
            });
        });

        document.querySelectorAll('.orientation-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.orientation-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                settings.orientation = this.dataset.orientation;
                updateDemo();
            });
        });

        function updateSymbolOptions() {
            document.querySelectorAll('.symbol-option').forEach(opt => {
                const symbol = opt.dataset.symbol;
                const svg = drawShape(symbol, '#333', 'solid', 40);
                opt.querySelector('div').innerHTML = '';
                opt.querySelector('div').appendChild(svg);
            });
        }

        function updateDemo() {
            const demoArea = document.getElementById('demoArea');
            demoArea.innerHTML = '';

            const colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            const cardBg = document.getElementById('cardBg').value;
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);

            if (selectedSymbols.length === 0) return;

            const shadings = ['solid', 'striped', 'outline'];

            for (let i = 0; i < 9; i++) {
                const card = document.createElement('div');
                card.className = 'demo-card';
                card.style.background = cardBg;
                
                const cardContent = document.createElement('div');
                cardContent.className = 'card-content';

                const symbol = selectedSymbols[i % selectedSymbols.length];
                const color = colors[Math.floor(i / 3) % colors.length];
                const shading = shadings[i % shadings.length];
                const count = (i % 3) + 1;

                for (let j = 0; j < count; j++) {
                    const shape = drawShape(symbol, color, shading, 20);
                    cardContent.appendChild(shape);
                }

                card.appendChild(cardContent);
                demoArea.appendChild(card);
            }
        }

        document.querySelectorAll('.color-input input').forEach(input => input.addEventListener('input', updateDemo));
        document.getElementById('cardBg').addEventListener('input', updateDemo);

        updateSymbolOptions();
        updateDemo();

        function createDeck() {
            deck = [];
            const counts = [1, 2, 3];
            const colors = [0, 1, 2];
            const shadings = ['solid', 'striped', 'outline'];
            const shapes = [0, 1, 2];

            for (let count of counts) {
                for (let color of colors) {
                    for (let shading of shadings) {
                        for (let shape of shapes) {
                            deck.push({ count, color, shading, shape });
                        }
                    }
                }
            }
            
            // Shuffle deck
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawShape(symbol, color, shading, size = 30) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.classList.add('shape');

            let shape;
            const fillColor = shading === 'solid' ? color : 'none';
            const strokeColor = color;
            const strokeWidth = 2;

            switch(symbol) {
                case 'circle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    shape.setAttribute('cx', size/2);
                    shape.setAttribute('cy', size/2);
                    shape.setAttribute('r', size/2 - 2);
                    break;
                case 'square':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', 2);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size - 4);
                    break;
                case 'diamond':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size/2} ${size/2},${size-2} 2,${size/2}`);
                    break;
                case 'triangle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size-2} 2,${size-2}`);
                    break;
                case 'pill':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', size/4);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size/2);
                    shape.setAttribute('rx', size/4);
                    break;
                case 'star':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const points = [];
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI) / 5 - Math.PI / 2;
                        const r = i % 2 === 0 ? size/2 - 2 : size/4;
                        points.push(`${size/2 + r * Math.cos(angle)},${size/2 + r * Math.sin(angle)}`);
                    }
                    shape.setAttribute('points', points.join(' '));
                    break;
                case 'wave':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const waveHeight = size / 4;
                    shape.setAttribute('d', `
                        M 2,${size/2 - waveHeight/2}
                        Q ${size/4},${size/2 - waveHeight*1.5} ${size/2},${size/2 - waveHeight/2}
                        T ${size-2},${size/2 - waveHeight/2}
                        L ${size-2},${size/2 + waveHeight/2}
                        Q ${size*3/4},${size/2 + waveHeight*2} ${size/2},${size/2 + waveHeight/2}
                        T 2,${size/2 + waveHeight/2}
                        Z
                    `);
                    break;
            }

            shape.setAttribute('fill', fillColor);
            shape.setAttribute('stroke', strokeColor);
            shape.setAttribute('stroke-width', strokeWidth);

            if (shading === 'striped') {
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                pattern.setAttribute('id', `stripe-${Math.random()}`);
                pattern.setAttribute('width', '4');
                pattern.setAttribute('height', '4');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '0');
                line.setAttribute('y1', '0');
                line.setAttribute('x2', '0');
                line.setAttribute('y2', '4');
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                
                pattern.appendChild(line);
                svg.appendChild(pattern);
                shape.setAttribute('fill', `url(#${pattern.getAttribute('id')})`);
            }

            svg.appendChild(shape);
            return svg;
        }

        function createCardElement(cardData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';

            const card = document.createElement('div');
            card.className = 'card';
            if (settings.orientation === 'horizontal') {
                card.classList.add('horizontal');
            }
            card.style.background = settings.cardBg;

            const content = document.createElement('div');
            content.className = 'card-content';

            const color = settings.colors[cardData.color];
            const symbol = settings.symbols[cardData.shape];
            
            for (let i = 0; i < cardData.count; i++) {
                const shape = drawShape(symbol, color, cardData.shading);
                content.appendChild(shape);
            }

            card.appendChild(content);

            const wrongMark = document.createElement('div');
            wrongMark.className = 'wrong-mark';
            wrongMark.textContent = '✗';
            card.appendChild(wrongMark);

            wrapper.appendChild(card);
            return wrapper;
        }

        function drawPath() {
            const svg = document.getElementById('path-svg');
            svg.innerHTML = '';
            const pathArea = document.querySelector('.path-area');
            const width = pathArea.offsetWidth;
            const height = pathArea.offsetHeight;

            const startX = 0, startY = height / 2;
            const int1X = width / 3, int1Y = height / 2;
            const int2X = width * 2 / 3, int2Y = height / 4;
            const slotAX = width, slotAY = height / 4;
            const slotBX = width, slotBY = height * 3 / 4;
            const mergeX = width * 2 / 3, mergeY = height * 3/4;

            // Visible paths
            svg.innerHTML = `
                <path d="M ${startX} ${startY} L ${int1X} ${int1Y}" class="path" />
                <path d="M ${int1X} ${int1Y} L ${int2X} ${int2Y}" class="path" />
                <path d="M ${int2X} ${int2Y} L ${slotAX} ${slotAY}" class="path" />
                <path d="M ${int1X} ${int1Y} L ${mergeX} ${mergeY}" class="path" />
                <path d="M ${int2X} ${int2Y} L ${mergeX} ${mergeY}" class="path" />
                <path d="M ${mergeX} ${mergeY} L ${slotBX} ${slotBY}" class="path" />
            `;

            // Invisible animation paths
            svg.innerHTML += `
                <path id="animation-path-a" d="M ${startX} ${startY} L ${int1X} ${int1Y} L ${int2X} ${int2Y} L ${slotAX} ${slotAY}" style="stroke:none; fill:none;" />
                <path id="animation-path-b1" d="M ${startX} ${startY} L ${int1X} ${int1Y} L ${mergeX} ${mergeY} L ${slotBX} ${slotBY}" style="stroke:none; fill:none;" />
                <path id="animation-path-b2" d="M ${startX} ${startY} L ${int1X} ${int1Y} L ${int2X} ${int2Y} L ${mergeX} ${mergeY} L ${slotBX} ${slotBY}" style="stroke:none; fill:none;" />
            `;
            
            const sign1 = document.getElementById('sign1');
            sign1.style.left = `${int1X + 20}px`;
            sign1.style.top = `${int1Y + 20}px`;

            const sign2 = document.getElementById('sign2');
            sign2.style.left = `${int2X + 20}px`;
            sign2.style.top = `${int2Y + 20}px`;
        }

        function hasFeature(card, feature) {
            if(feature.type === 'color') return card.color === feature.value;
            if(feature.type === 'shape') return card.shape === feature.value;
            if(feature.type === 'shading') return card.shading === feature.value;
            if(feature.type === 'count') return card.count === feature.value;
            return false;
        }

        function getFeatureText(feature) {
            if(feature.type === 'color') return `Color ${feature.value + 1}`;
            if(feature.type === 'shape') return symbolNames[settings.symbols[feature.value]];
            if(feature.type === 'shading') return feature.value;
            if(feature.type === 'count') return `${feature.value} shape(s)`;
            return '';
        }

        function drawCard() {
            const cardSlot = document.getElementById('card-slot');
            cardSlot.innerHTML = '';
            if (deck.length > 0) {
                currentCard = deck.pop();
                const cardEl = createCardElement(currentCard);
                cardSlot.appendChild(cardEl);
            } else {
                endGame();
            }
        }
        
        function animateCard(cardEl, pathId) {
            const path = document.getElementById(pathId);
            if (!path) return;
            const pathLength = path.getTotalLength();
            const duration = 2000;

            const gameArea = document.querySelector('.game-area');
            gameArea.appendChild(cardEl);
            cardEl.style.position = 'absolute';
            
            let start = null;

            function step(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                const progress = elapsed / duration;
                const point = path.getPointAtLength(progress * pathLength);
                
                cardEl.style.left = `${point.x - cardEl.offsetWidth / 2}px`;
                cardEl.style.top = `${point.y - cardEl.offsetHeight / 2}px`;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    cardEl.remove();
                    drawCard();
                }
            }

            requestAnimationFrame(step);
        }

        function handleChoice(slot) {
            const goesToB = hasFeature(currentCard, feature1) || hasFeature(currentCard, feature2);
            const correctSlot = goesToB ? 'b' : 'a';

            if (slot === correctSlot) {
                score++;
                new Audio('kid_yeah.wav').play();
                
                const cardEl = document.querySelector('#card-slot .card-wrapper');
                
                let pathId;
                if (goesToB) {
                    if(hasFeature(currentCard, feature1)){
                       pathId = 'animation-path-b1';
                    } else {
                       pathId = 'animation-path-b2';
                    }
                } else {
                    pathId = 'animation-path-a';
                }
                animateCard(cardEl, pathId);

            } else {
                const cardSlot = document.getElementById('card-slot');
                const wrongMark = cardSlot.querySelector('.wrong-mark');
                wrongMark.classList.add('show');
                new Audio('Ohh.wav').play();
                setTimeout(() => {
                    wrongMark.classList.remove('show');
                }, 1000);
            }
        }

        function endGame() {
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.end-screen').classList.add('active');
            document.getElementById('stats').textContent = `You sorted ${score} out of 81 cards correctly!`;
        }

        function startGame() {
            settings.colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            settings.cardBg = document.getElementById('cardBg').value;
            
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);
            
            if (selectedSymbols.length !== 3) {
                alert('Please select exactly 3 symbols');
                return;
            }
            
            settings.symbols = selectedSymbols;

            createDeck();
            
            // Choose 2 random features
            const features = [
                { type: 'color', value: Math.floor(Math.random() * 3) },
                { type: 'shape', value: Math.floor(Math.random() * 3) },
                { type: 'shading', value: ['solid', 'striped', 'outline'][Math.floor(Math.random() * 3)] },
                { type: 'count', value: Math.floor(Math.random() * 3) + 1 }
            ];
            feature1 = features.splice(Math.floor(Math.random() * features.length), 1)[0];
            feature2 = features.splice(Math.floor(Math.random() * features.length), 1)[0];
            
            document.getElementById('sign1').textContent = getFeatureText(feature1);
            document.getElementById('sign2').textContent = getFeatureText(feature2);

            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            drawPath();
            drawCard();

            document.getElementById('slot-a').addEventListener('click', () => handleChoice('a'));
            document.getElementById('slot-b').addEventListener('click', () => handleChoice('b'));
        }
    </script>
</body>
</html>

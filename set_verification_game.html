<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is This A SET?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 100vw;
            width: 100%;
            height: 98vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .setup-screen, .game-screen, .end-screen {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .setup-screen.active, .game-screen.active, .end-screen.active {
            display: flex;
            flex-direction: column;
        }

        .setup-group {
            margin-bottom: 25px;
        }

        .setup-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .color-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .symbol-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .symbol-option {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .symbol-option:hover {
            border-color: #667eea;
        }

        .symbol-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .orientation-select {
            display: flex;
            gap: 20px;
        }

        .orientation-option {
            padding: 15px 30px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .orientation-option:hover {
            border-color: #667eea;
        }

        .orientation-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .symbol-count {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .setup-container {
            display: flex;
            gap: 30px;
        }

        .setup-left {
            flex: 1;
        }

        .setup-right {
            width: 350px;
            padding-left: 30px;
            border-left: 2px solid #eee;
        }
        
        .demo-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .demo-card {
            border: 2px solid #ccc;
            border-radius: 5px;
            width: 100px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Screen */
        .game-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .top-zone {
            flex: 3;
            display: flex;
            padding: 10px;
            gap: 15px;
            min-height: 0;
            overflow: hidden;
        }

        .left-panel {
            width: 180px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 12px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .left-panel h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #667eea;
            flex-shrink: 0;
        }

        .deck-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            padding-right: 10px;
            margin-right: -10px;
        }
        
        .deck-cards::-webkit-scrollbar {
            width: 6px;
        }
        
        .deck-cards::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .deck-cards::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }
        
        .deck-cards::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .mini-card {
            width: 50px;
            height: 70px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-width: 0;
        }

        .question {
            font-size: 42px;
            font-weight: bold;
            color: #333;
            text-align: center;
            transition: all 0.5s;
        }

        .question.correct {
            color: #22c55e;
        }

        .question.incorrect {
            color: #ef4444;
        }

        .cards-display {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            transition: all 0.5s;
        }

        .game-card {
            background: white;
            border: 5px solid #333;
            border-radius: 15px;
            padding: 15px;
            width: 180px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.5s;
        }

        .game-card.horizontal {
            width: 250px;
            height: 180px;
        }

        .game-card.correct {
            border-color: #22c55e;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
        }

        .game-card.incorrect {
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .game-card.horizontal .card-content {
            flex-direction: row;
        }

        .cross-mark {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 120px;
            color: rgba(239, 68, 68, 0.6);
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .cross-mark.show {
            opacity: 1;
        }

        .right-panel {
            width: 180px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 12px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #22c55e;
            flex-shrink: 0;
        }

        .history-sets {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            padding-right: 10px;
            margin-right: 4px;
        }
        
        .history-sets::-webkit-scrollbar {
            width: 6px;
        }
        
        .history-sets::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .history-sets::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 3px;
        }
        
        .history-sets::-webkit-scrollbar-thumb:hover {
            background: #16a34a;
        }

        .history-set {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: white;
            border-radius: 5px;
        }

        .bottom-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-top: 3px solid #ddd;
            flex-shrink: 0;
        }

        .answer-btn {
            padding: 25px 60px;
            font-size: 32px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .answer-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .answer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .yes-btn {
            background: #22c55e;
            color: white;
        }

        .yes-btn:hover:not(:disabled) {
            background: #16a34a;
        }

        .no-btn {
            background: #ef4444;
            color: white;
        }

        .no-btn:hover:not(:disabled) {
            background: #dc2626;
        }

        .control-btns {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #667eea;
            color: white;
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 40px;
        }

        .end-screen h2 {
            font-size: 48px;
            color: #22c55e;
            margin-bottom: 30px;
        }

        .stats {
            font-size: 24px;
            color: #333;
            margin: 20px 0;
        }

        .stats div {
            margin: 10px 0;
        }

        .restart-btn {
            padding: 20px 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }

        .restart-btn:hover {
            background: #5568d3;
        }

        .shape {
            transition: all 0.3s;
        }

        @keyframes scale-in {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .cards-display.animate .game-card {
            animation: scale-in 0.5s ease;
        }
    </style>
    <style>
        a.return-to-menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(0,0,0,0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s;
            z-index: 1000;
        }
        a.return-to-menu:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<a class="return-to-menu" href="index.html">🏠</a>
    <div class="container">
        <div class="setup-screen active">
            <h1>Is This A SET?</h1>
            <div class="setup-container">
                <div class="setup-left">
                    <div class="setup-group">
                        <label>Choose 3 Colors:</label>
                        <div class="color-inputs">
                            <div class="color-input">
                                <input type="color" id="color1" value="#FF0000">
                                <span>Color 1</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color2" value="#00FF00">
                                <span>Color 2</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color3" value="#0000FF">
                                <span>Color 3</span>
                            </div>
                        </div>
                    </div>

                    <div class="setup-group">
                        <label>Card Background Color:</label>
                        <input type="color" id="cardBg" value="#FFFFFF">
                    </div>

                    <div class="setup-group">
                        <label>Choose 3 Symbols:</label>
                        <div class="symbol-select">
                            <div class="symbol-option selected" data-symbol="diamond">
                                <div></div>
                                <span>Diamond</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="circle">
                                <div></div>
                                <span>Circle</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="pill">
                                <div></div>
                                <span>Pill</span>
                            </div>
                            <div class="symbol-option" data-symbol="wave">
                                <div></div>
                                <span>Wave</span>
                            </div>
                            <div class="symbol-option" data-symbol="triangle">
                                <div></div>
                                <span>Triangle</span>
                            </div>
                            <div class="symbol-option" data-symbol="square">
                                <div></div>
                                <span>Square</span>
                            </div>
                            <div class="symbol-option" data-symbol="star">
                                <div></div>
                                <span>Star</span>
                            </div>
                        </div>
                        <div class="symbol-count">Selected: 3 symbols</div>
                    </div>

                    <div class="setup-group">
                        <label>Card Orientation:</label>
                        <div class="orientation-select">
                            <div class="orientation-option selected" data-orientation="vertical">Vertical</div>
                            <div class="orientation-option" data-orientation="horizontal">Horizontal</div>
                        </div>
                    </div>

                    <button class="start-btn" onclick="startGame()">Start Game</button>
                </div>
                <div class="setup-right">
                    <label>Live Preview</label>
                    <div class="demo-area" id="demoArea"></div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div class="game-layout">
                <div class="top-zone">
                    <div class="left-panel">
                        <h3>Remaining Cards</h3>
                        <div id="deckCount" style="text-align: center; font-size: 20px; font-weight: bold; color: #667eea; margin-bottom: 8px; flex-shrink: 0;">81</div>
                        <div class="deck-cards" id="deckCards"></div>
                    </div>
                    
                    <div class="center-area">
                        <div class="question" id="question">Is This A SET?</div>
                        <div class="cards-display" id="cardsDisplay"></div>
                    </div>
                    
                    <div class="right-panel">
                        <h3>Found SETs</h3>
                        <div id="setCount" style="text-align: center; font-size: 20px; font-weight: bold; color: #22c55e; margin-bottom: 8px; flex-shrink: 0;">0</div>
                        <div class="history-sets" id="historySets"></div>
                    </div>
                </div>
                
                <div class="bottom-zone">
                    <button class="answer-btn yes-btn" id="yesBtn" onclick="answer(true)">YES</button>
                    <button class="answer-btn no-btn" id="noBtn" onclick="answer(false)">NO</button>
                    <div class="control-btns">
                        <button class="control-btn" onclick="location.reload()">🏠 Home</button>
                        <button class="control-btn" id="nextBtn" onclick="nextPuzzle()" disabled>Next Puzzle ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="end-screen">
            <h2>🎉 Congratulations! 🎉</h2>
            <div class="stats" id="endStats"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let settings = {
            colors: ['#FF0000', '#00FF00', '#0000FF'],
            cardBg: '#FFFFFF',
            symbols: ['diamond', 'circle', 'pill'],
            orientation: 'vertical'
        };

        let deck = [];
        let currentCards = [];
        let currentCardIndices = []; // Track which cards are currently shown
        let foundSets = [];
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let answered = false;
        let consecutiveNonSets = 0; // Track consecutive non-sets for pity system

        // Setup handlers
        document.querySelectorAll('.symbol-option').forEach(opt => {
            opt.addEventListener('click', function() {
                this.classList.toggle('selected');
                const count = document.querySelectorAll('.symbol-option.selected').length;
                document.querySelector('.symbol-count').textContent = `Selected: ${count} symbols`;
                updateDemo();
            });
        });

        document.querySelectorAll('.orientation-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.orientation-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                settings.orientation = this.dataset.orientation;
                updateDemo();
            });
        });

        document.querySelectorAll('.color-input input').forEach(input => input.addEventListener('input', updateDemo));
        document.getElementById('cardBg').addEventListener('input', updateDemo);

        function updateSymbolOptions() {
            document.querySelectorAll('.symbol-option').forEach(opt => {
                const symbol = opt.dataset.symbol;
                const svg = drawShape(symbol, '#333', 'solid', 40);
                opt.querySelector('div').innerHTML = '';
                opt.querySelector('div').appendChild(svg);
            });
        }

        function updateDemo() {
            const demoArea = document.getElementById('demoArea');
            demoArea.innerHTML = '';

            const colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            const cardBg = document.getElementById('cardBg').value;
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);

            if (selectedSymbols.length === 0) return;

            const shadings = ['solid', 'striped', 'outline'];

            for (let i = 0; i < 9; i++) {
                const card = document.createElement('div');
                card.className = 'demo-card';
                card.style.background = cardBg;
                
                const cardContent = document.createElement('div');
                cardContent.className = 'card-content';

                const symbol = selectedSymbols[i % selectedSymbols.length];
                const color = colors[Math.floor(i / 3) % colors.length];
                const shading = shadings[i % shadings.length];
                const count = (i % 3) + 1;

                for (let j = 0; j < count; j++) {
                    const shape = drawShape(symbol, color, shading, 20);
                    cardContent.appendChild(shape);
                }

                card.appendChild(cardContent);
                demoArea.appendChild(card);
            }
        }

        updateSymbolOptions();
        updateDemo();

        function drawShape(symbol, color, shading, size = 30) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.classList.add('shape');

            let shape;
            const fillColor = shading === 'solid' ? color : 'none';
            const strokeColor = color;
            const strokeWidth = 2;

            switch(symbol) {
                case 'circle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    shape.setAttribute('cx', size/2);
                    shape.setAttribute('cy', size/2);
                    shape.setAttribute('r', size/2 - 2);
                    break;
                case 'square':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', 2);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size - 4);
                    break;
                case 'diamond':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size/2} ${size/2},${size-2} 2,${size/2}`);
                    break;
                case 'triangle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size-2} 2,${size-2}`);
                    break;
                case 'pill':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', size/4);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size/2);
                    shape.setAttribute('rx', size/4);
                    break;
                case 'star':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const points = [];
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI) / 5 - Math.PI / 2;
                        const r = i % 2 === 0 ? size/2 - 2 : size/4;
                        points.push(`${size/2 + r * Math.cos(angle)},${size/2 + r * Math.sin(angle)}`);
                    }
                    shape.setAttribute('points', points.join(' '));
                    break;
                case 'wave':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const waveHeight = size / 4;
                    shape.setAttribute('d', `
                        M 2,${size/2 - waveHeight/2}
                        Q ${size/4},${size/2 - waveHeight*1.5} ${size/2},${size/2 - waveHeight/2}
                        T ${size-2},${size/2 - waveHeight/2}
                        L ${size-2},${size/2 + waveHeight/2}
                        Q ${size*3/4},${size/2 + waveHeight*2} ${size/2},${size/2 + waveHeight/2}
                        T 2,${size/2 + waveHeight/2}
                        Z
                    `);
                    break;
            }

            shape.setAttribute('fill', fillColor);
            shape.setAttribute('stroke', strokeColor);
            shape.setAttribute('stroke-width', strokeWidth);

            if (shading === 'striped') {
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                pattern.setAttribute('id', `stripe-${Math.random()}`);
                pattern.setAttribute('width', '4');
                pattern.setAttribute('height', '4');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '0');
                line.setAttribute('y1', '0');
                line.setAttribute('x2', '0');
                line.setAttribute('y2', '4');
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                
                pattern.appendChild(line);
                svg.appendChild(pattern);
                shape.setAttribute('fill', `url(#${pattern.getAttribute('id')})`);
            }

            svg.appendChild(shape);
            return svg;
        }

        function createDeck() {
            deck = [];
            const counts = [1, 2, 3];
            const colors = [0, 1, 2];
            const shadings = ['solid', 'striped', 'outline'];
            const shapes = [0, 1, 2];

            for (let count of counts) {
                for (let color of colors) {
                    for (let shading of shadings) {
                        for (let shape of shapes) {
                            deck.push({ count, color, shading, shape });
                        }
                    }
                }
            }
            
            // Shuffle deck
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function isSet(cards) {
            if (cards.length !== 3) return false;
            
            const counts = [cards[0].count, cards[1].count, cards[2].count];
            const colors = [cards[0].color, cards[1].color, cards[2].color];
            const shadings = [cards[0].shading, cards[1].shading, cards[2].shading];
            const shapes = [cards[0].shape, cards[1].shape, cards[2].shape];
            
            const countValid = (counts[0] === counts[1] && counts[1] === counts[2]) || 
                              (counts[0] !== counts[1] && counts[1] !== counts[2] && counts[0] !== counts[2]);
            const colorValid = (colors[0] === colors[1] && colors[1] === colors[2]) || 
                              (colors[0] !== colors[1] && colors[1] !== colors[2] && colors[0] !== colors[2]);
            const shadingValid = (shadings[0] === shadings[1] && shadings[1] === shadings[2]) || 
                                (shadings[0] !== shadings[1] && shadings[1] !== shadings[2] && shadings[0] !== shadings[2]);
            const shapeValid = (shapes[0] === shapes[1] && shapes[1] === shapes[2]) || 
                              (shapes[0] !== shapes[1] && shapes[1] !== shapes[2] && shapes[0] !== shapes[2]);
            
            return countValid && colorValid && shadingValid && shapeValid;
        }

        function drawNewCards() {
            if (deck.length < 3) {
                endGame();
                return;
            }
            
            // Dynamic probability based on deck size and pity system
            let setProbability = 0.4; // Base 40% chance
            
            // Adjust based on deck size (increase probability as deck shrinks)
            if (deck.length < 30) {
                setProbability = 0.6; // 60% when deck is small
            } else if (deck.length < 50) {
                setProbability = 0.5; // 50% when deck is medium
            }
            
            // Pity system: increase probability after consecutive non-sets
            if (consecutiveNonSets >= 3) {
                setProbability = 0.8; // 80% after 3 non-sets
            } else if (consecutiveNonSets >= 2) {
                setProbability = 0.65; // 65% after 2 non-sets
            }
            
            const shouldBeSet = Math.random() < setProbability;
            
            if (shouldBeSet) {
                // Try to find a valid set in the deck
                const setFound = findAndDrawSet();
                if (!setFound) {
                    // If no set found, draw random cards
                    drawRandomCards();
                }
            } else {
                // Draw random non-set cards
                drawRandomNonSet();
            }
            
            answered = false;
            displayCards();
            updateDeckDisplay();
            
            document.getElementById('question').textContent = 'Is This A SET?';
            document.getElementById('question').className = 'question';
            document.getElementById('yesBtn').disabled = false;
            document.getElementById('noBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
        }
        
        function findAndDrawSet() {
            // Try to find a valid set in the deck
            const maxAttempts = 1000;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                if (deck.length < 3) return false;
                
                // Pick 3 random indices
                const indices = [];
                while (indices.length < 3) {
                    const idx = Math.floor(Math.random() * deck.length);
                    if (!indices.includes(idx)) {
                        indices.push(idx);
                    }
                }
                
                const cards = [deck[indices[0]], deck[indices[1]], deck[indices[2]]];
                
                if (isSet(cards)) {
                    // Store the cards and their indices (don't remove yet)
                    currentCards = [...cards];
                    currentCardIndices = [...indices].sort((a, b) => b - a); // Sort descending for safe removal
                    consecutiveNonSets = 0; // Reset pity counter
                    return true;
                }
            }
            
            return false;
        }
        
        function drawRandomNonSet() {
            const maxAttempts = 1000;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                if (deck.length < 3) {
                    drawRandomCards();
                    return;
                }
                
                // Pick 3 random cards
                const indices = [];
                while (indices.length < 3) {
                    const idx = Math.floor(Math.random() * deck.length);
                    if (!indices.includes(idx)) {
                        indices.push(idx);
                    }
                }
                
                const cards = [deck[indices[0]], deck[indices[1]], deck[indices[2]]];
                
                if (!isSet(cards)) {
                    // Store the cards and indices (don't remove yet)
                    currentCards = [...cards];
                    currentCardIndices = [...indices].sort((a, b) => b - a);
                    consecutiveNonSets++; // Increment pity counter
                    return;
                }
            }
            
            // If we can't find a non-set, just draw random cards
            drawRandomCards();
        }
        
        function drawRandomCards() {
            const count = Math.min(3, deck.length);
            const indices = [];
            for (let i = 0; i < count; i++) {
                indices.push(i);
            }
            currentCards = indices.map(i => deck[i]);
            currentCardIndices = indices.sort((a, b) => b - a);
            
            if (!isSet(currentCards)) {
                consecutiveNonSets++;
            } else {
                consecutiveNonSets = 0;
            }
        }

        function displayCards() {
            const display = document.getElementById('cardsDisplay');
            display.innerHTML = '';
            display.classList.add('animate');
            
            setTimeout(() => display.classList.remove('animate'), 500);
            
            currentCards.forEach(cardData => {
                const card = document.createElement('div');
                card.className = 'game-card';
                if (settings.orientation === 'horizontal') {
                    card.classList.add('horizontal');
                }
                card.style.background = settings.cardBg;
                
                const content = document.createElement('div');
                content.className = 'card-content';
                
                const color = settings.colors[cardData.color];
                const symbol = settings.symbols[cardData.shape];
                
                for (let i = 0; i < cardData.count; i++) {
                    const shape = drawShape(symbol, color, cardData.shading, 50);
                    content.appendChild(shape);
                }
                
                card.appendChild(content);
                
                const cross = document.createElement('div');
                cross.className = 'cross-mark';
                cross.textContent = '✗';
                card.appendChild(cross);
                
                display.appendChild(card);
            });
        }

        function answer(userSaysSet) {
            if (answered) return;
            answered = true;
            
            const actuallySet = isSet(currentCards);
            const correct = userSaysSet === actuallySet;
            
            if (correct) {
                correctAnswers++;
                playSuccessSound();
                createConfetti();
                
                const question = document.getElementById('question');
                if (actuallySet) {
                    question.textContent = 'This IS a SET ✓';
                    question.className = 'question correct';
                } else {
                    question.textContent = 'This IS NOT a SET ✓';
                    question.className = 'question correct';
                }
                
                const cards = document.querySelectorAll('.game-card');
                cards.forEach(card => card.classList.add('correct'));
                
                if (actuallySet) {
                    // If it's a SET and user got it right, remove from deck permanently
                    currentCardIndices.forEach(idx => {
                        deck.splice(idx, 1);
                    });
                    foundSets.push([...currentCards]);
                    updateHistoryDisplay();
                } else {
                    // If NOT a SET and user got it right, cards stay in deck
                    // Mark the cards that break the set
                    const violatingIndices = findViolatingCards();
                    violatingIndices.forEach(idx => {
                        const cross = cards[idx].querySelector('.cross-mark');
                        cross.classList.add('show');
                    });
                }
            } else {
                wrongAnswers++;
                
                const question = document.getElementById('question');
                if (actuallySet) {
                    question.textContent = 'This IS a SET ✗';
                    question.className = 'question incorrect';
                } else {
                    question.textContent = 'This IS NOT a SET ✗';
                    question.className = 'question incorrect';
                }
                
                const cards = document.querySelectorAll('.game-card');
                cards.forEach(card => card.classList.add('incorrect'));
                
                if (!actuallySet) {
                    // Show which cards violate the set rules
                    const violatingIndices = findViolatingCards();
                    violatingIndices.forEach(idx => {
                        const cross = cards[idx].querySelector('.cross-mark');
                        cross.classList.add('show');
                    });
                }
                // Cards always stay in deck if user got it wrong
            }
            
            document.getElementById('yesBtn').disabled = true;
            document.getElementById('noBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
            
            // Update deck display to show current state
            updateDeckDisplay();
        }

        function findViolatingCards() {
            // Find which card(s) break the set rules
            const cards = currentCards;
            const violating = new Set();
            
            // Check each attribute
            const counts = [cards[0].count, cards[1].count, cards[2].count];
            const colors = [cards[0].color, cards[1].color, cards[2].color];
            const shadings = [cards[0].shading, cards[1].shading, cards[2].shading];
            const shapes = [cards[0].shape, cards[1].shape, cards[2].shape];
            
            // Find mismatches
            if (!isValidAttribute(counts)) {
                // Find the outlier
                if (counts[0] === counts[1]) violating.add(2);
                else if (counts[0] === counts[2]) violating.add(1);
                else if (counts[1] === counts[2]) violating.add(0);
            }
            
            if (!isValidAttribute(colors)) {
                if (colors[0] === colors[1]) violating.add(2);
                else if (colors[0] === colors[2]) violating.add(1);
                else if (colors[1] === colors[2]) violating.add(0);
            }
            
            if (!isValidAttribute(shadings)) {
                if (shadings[0] === shadings[1]) violating.add(2);
                else if (shadings[0] === shadings[2]) violating.add(1);
                else if (shadings[1] === shadings[2]) violating.add(0);
            }
            
            if (!isValidAttribute(shapes)) {
                if (shapes[0] === shapes[1]) violating.add(2);
                else if (shapes[0] === shapes[2]) violating.add(1);
                else if (shapes[1] === shapes[2]) violating.add(0);
            }
            
            return Array.from(violating);
        }

        function isValidAttribute(arr) {
            return (arr[0] === arr[1] && arr[1] === arr[2]) || 
                   (arr[0] !== arr[1] && arr[1] !== arr[2] && arr[0] !== arr[2]);
        }

        function nextPuzzle() {
            // Clear current card references
            currentCards = [];
            currentCardIndices = [];
            
            drawNewCards();
        }

        function updateDeckDisplay() {
            document.getElementById('deckCount').textContent = deck.length;
            
            const deckCards = document.getElementById('deckCards');
            deckCards.innerHTML = '';
            
            // Show first 30 cards as mini previews
            const cardsToShow = Math.min(30, deck.length);
            for (let i = 0; i < cardsToShow; i++) {
                const cardData = deck[i];
                const mini = document.createElement('div');
                mini.className = 'mini-card';
                mini.style.background = settings.cardBg;
                
                const color = settings.colors[cardData.color];
                const symbol = settings.symbols[cardData.shape];
                const shape = drawShape(symbol, color, cardData.shading, 15);
                
                mini.appendChild(shape);
                deckCards.appendChild(mini);
            }
        }

        function updateHistoryDisplay() {
            document.getElementById('setCount').textContent = foundSets.length;
            
            const history = document.getElementById('historySets');
            history.innerHTML = '';
            
            foundSets.forEach(set => {
                const setDiv = document.createElement('div');
                setDiv.className = 'history-set';
                
                set.forEach(cardData => {
                    const mini = document.createElement('div');
                    mini.className = 'mini-card';
                    mini.style.background = settings.cardBg;
                    
                    const color = settings.colors[cardData.color];
                    const symbol = settings.symbols[cardData.shape];
                    const shape = drawShape(symbol, color, cardData.shading, 15);
                    
                    mini.appendChild(shape);
                    setDiv.appendChild(mini);
                });
                
                history.appendChild(setDiv);
            });
        }

        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 523.25; // C5
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    container.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        function endGame() {
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.end-screen').classList.add('active');
            
            const stats = document.getElementById('endStats');
            const accuracy = correctAnswers + wrongAnswers > 0 
                ? Math.round((correctAnswers / (correctAnswers + wrongAnswers)) * 100) 
                : 0;
            
            stats.innerHTML = `
                <div>✅ Correct Answers: ${correctAnswers}</div>
                <div>❌ Wrong Answers: ${wrongAnswers}</div>
                <div>🎯 Accuracy: ${accuracy}%</div>
                <div>🏆 SETs Found: ${foundSets.length} / 27</div>
            `;
        }

        function startGame() {
            settings.colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            settings.cardBg = document.getElementById('cardBg').value;
            
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);
            
            if (selectedSymbols.length !== 3) {
                alert('Please select exactly 3 symbols');
                return;
            }
            
            settings.symbols = selectedSymbols;

            createDeck();
            
            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            drawNewCards();
        }
    </script>
</body>

function getTileFromMouseEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const { tileSize, zoom, panX, panY, rows, cols } = GS;
    const mapW = cols * tileSize;
    const mapH = rows * tileSize;
    const ox   = (canvas.width  - mapW * zoom) / 2 + panX;
    const oy   = (canvas.height - mapH * zoom) / 2 + panY;
    const mx   = mouseX - ox;
    const my   = mouseY - oy;
    const c    = Math.floor(mx / (tileSize * zoom));
    const r    = Math.floor(my / (tileSize * zoom));
    
    if (r >= 0 && r < rows && c >= 0 && c < cols) return { row: r, col: c };
    return null;
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (GS.mode === 'CUSTOM') {
    const tile = getTileFromMouseEvent(e);
    if (!tile) return;

    if (e.button === 0) { // Left click: Draw/Erase
      GS.editorIsDrawing = true;
      if (!GS.grid[tile.row]) return;

      const isStart = tile.row === GS.startTile.row && tile.col === GS.startTile.col;
      const isEnd = tile.row === GS.endTile.row && tile.col === GS.endTile.col;
      if (isStart || isEnd) return; // Don't allow toggling start/end tiles

      // Toggle the state of the clicked tile
      GS.grid[tile.row][tile.col] = 1 - GS.grid[tile.row][tile.col];
      // Set the draw mode for the drag operation to the new state
      GS.editorDrawMode = GS.grid[tile.row][tile.col];
      
      G.updateMapAfterEdit();

    } else if (e.button === 2) { // Right click: Cycle Start/End
      if (!GS.grid[tile.row] || GS.grid[tile.row][tile.col] === 0) return; // Must be on a path

      if (GS.editorNextRightClick === 'START') {
        // Prevent placing start on the current end tile
        if (tile.row === GS.endTile.row && tile.col === GS.endTile.col) {
          showToast('Cannot place Start on the End tile.');
          return;
        }
        GS.startTile = tile;
        GS.editorNextRightClick = 'END';
        showToast('Start point set. Next right-click sets End point.');
      } else { // 'END'
        // Prevent placing end on the current start tile
        if (tile.row === GS.startTile.row && tile.col === GS.startTile.col) {
          showToast('Cannot place End on the Start tile.');
          return;
        }
        GS.endTile = tile;
        GS.editorNextRightClick = 'START';
        showToast('End point set. Next right-click sets Start point.');
      }
      G.updateMapAfterEdit();
    }
  }

  // Pan logic (middle mouse button)
  if (e.button === 1) {
    GS.isDragging = true;
    GS.dragStartX = e.clientX; GS.dragStartY = e.clientY;
    GS.dragPanX   = GS.panX;   GS.dragPanY   = GS.panY;
  }
});

window.addEventListener('mousemove', e => {
  // Handle panning if dragging with middle mouse
  if (GS.isDragging) {
    GS.panX = GS.dragPanX + (e.clientX - GS.dragStartX);
    GS.panY = GS.dragPanY + (e.clientY - GS.dragStartY);
    if (GS.autoZoom) {
        GS.autoZoom = false;
        document.getElementById('btnAutoZoom').classList.remove('active');
    }
    render();
  }

  // Handle editor mode logic
  if (GS.mode === 'CUSTOM') {
    const tile = getTileFromMouseEvent(e);

    // If mouse is off-grid, clear hover and stop.
    if (!tile) {
        if (GS.hoveredTile) {
            GS.hoveredTile = null;
            render();
        }
        return;
    }

    // If hover changed, update and render.
    if (!GS.hoveredTile || tile.row !== GS.hoveredTile.row || tile.col !== GS.hoveredTile.col) {
        GS.hoveredTile = tile;
        render();
    }
    
    // Handle drawing with left click.
    if (GS.editorIsDrawing) {
        const isStart = tile.row === GS.startTile.row && tile.col === GS.startTile.col;
        const isEnd = tile.row === GS.endTile.row && tile.col === GS.endTile.col;
        if (!isStart && !isEnd && GS.grid[tile.row]?.[tile.col] !== GS.editorDrawMode) {
            if (GS.grid[tile.row]) {
              GS.grid[tile.row][tile.col] = GS.editorDrawMode;
              G.updateMapAfterEdit();
            }
        }
    }
  }
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 0) {
    GS.editorIsDrawing = false;
  }
  if (e.button === 0 || e.button === 1) {
    GS.isDragging = false;
  }
});



canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomAmount = e.deltaY < 0 ? 1.15 : 1 / 1.15;

    // --- Correct Zoom-to-Cursor Logic ---
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const mapW = GS.cols * GS.tileSize;
    const mapH = GS.rows * GS.tileSize;

    // 1. Get world coordinate under the mouse BEFORE zoom
    const old_ox = (canvas.width - mapW * GS.zoom) / 2 + GS.panX;
    const old_oy = (canvas.height - mapH * GS.zoom) / 2 + GS.panY;
    const worldX_abs = (mouseX - old_ox) / GS.zoom;
    const worldY_abs = (mouseY - old_oy) / GS.zoom;

    // 2. Apply new zoom
    const newZoom = Math.max(0.1, Math.min(GS.zoom * zoomAmount, 20));
    GS.zoom = newZoom;

    // 3. Find the new screen position of the world coordinate
    const new_screenX = worldX_abs * newZoom;
    const new_screenY = worldY_abs * newZoom;

    // 4. Adjust pan so that the new screen position of the world coord is at the mouse position
    const new_ox = mouseX - new_screenX;
    const new_oy = mouseY - new_screenY;
    GS.panX = new_ox - (canvas.width - mapW * newZoom) / 2;
    GS.panY = new_oy - (canvas.height - mapH * newZoom) / 2;
    
    if (GS.autoZoom) {
        GS.autoZoom = false;
        document.getElementById('btnAutoZoom').classList.remove('active');
    }
    render();
});

// ═══════════════════════════════════════════════════
//  TOUCH HANDLING
// ═══════════════════════════════════════════════════
let longPressTimer = null;
const longPressDuration = 600; // ms
let touchStartX, touchStartY, touchMoved;

function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0] || e.changedTouches[0];
  return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
}



canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    GS.lastPinchDist = 0;
    touchMoved = false;

    if (e.touches.length === 1) {
        const { x, y } = getTouchPos(e);
        touchStartX = x;
        touchStartY = y;
        GS.isDragging = true;
        GS.dragStartX = e.touches[0].clientX;
        GS.dragStartY = e.touches[0].clientY;
        GS.dragPanX = GS.panX;
        GS.dragPanY = GS.panY;
        
        // Editor mode: start drawing immediately
        if (GS.mode === 'CUSTOM') {
            const worldPos = screenToWorld(x, y);
            const tile = worldToTile(worldPos.x, worldPos.y);
            if (tile) {
                GS.editorIsDrawing = true;
                GS.editorDrawMode = GS.grid[tile.row][tile.col] === 1 ? 0 : 1;
                GS.grid[tile.row][tile.col] = GS.editorDrawMode;
                render();
            }
        }
        
    } else if (e.touches.length === 2) {
        GS.isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        GS.lastPinchDist = Math.sqrt(dx * dx + dy * dy);
        
        GS.dragStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        GS.dragStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        GS.dragPanX = GS.panX;
        GS.dragPanY = GS.panY;
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();

    const currentX = e.touches[0]?.clientX ?? 0;
    const currentY = e.touches[0]?.clientY ?? 0;
    const dx_move = Math.abs(currentX - GS.dragStartX);
    const dy_move = Math.abs(currentY - GS.dragStartY);

    if (dx_move > 5 || dy_move > 5) {
        touchMoved = true;
    }

    if (e.touches.length === 1 && GS.isDragging) {
        const { x, y } = getTouchPos(e);
        if (GS.mode === 'CUSTOM' && GS.editorIsDrawing) {
            const worldPos = screenToWorld(x, y);
            const tile = worldToTile(worldPos.x, worldPos.y);
            if (tile && (tile.row !== GS.hoveredTile?.row || tile.col !== GS.hoveredTile?.col)) {
                GS.hoveredTile = tile;
                if (GS.grid[tile.row][tile.col] !== GS.editorDrawMode) {
                   GS.grid[tile.row][tile.col] = GS.editorDrawMode;
                   render();
                }
            }
        } else { // Not in editor mode, so pan
            GS.panX = GS.dragPanX + (currentX - GS.dragStartX);
            GS.panY = GS.dragPanY + (currentY - GS.dragStartY);
            GS.autoZoom = false;
            document.getElementById('btnAutoZoom').classList.remove('active');
            render();
        }

    } else if (e.touches.length === 2) {
        // Pan with two fingers
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        GS.panX = GS.dragPanX + (midX - GS.dragStartX);
        GS.panY = GS.dragPanY + (midY - GS.dragStartY);

        // Zoom with two fingers
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (GS.lastPinchDist > 0) {
            const zoomFactor = dist / GS.lastPinchDist;
            const newZoom = GS.zoom * zoomFactor;
            
            // Get screen point under pinch center
            const rect = canvas.getBoundingClientRect();
            const pinchScreenX = midX - rect.left;
            const pinchScreenY = midY - rect.top;

            // Convert to world coords before zoom
            const worldBefore = screenToWorld(pinchScreenX, pinchScreenY);

            // Apply zoom
            GS.zoom = Math.max(0.1, Math.min(5, newZoom));
            
            // Get world coords after zoom
            const worldAfter = screenToWorld(pinchScreenX, pinchScreenY);
            
            // Pan to keep the pinch point stationary
            GS.panX -= (worldAfter.x - worldBefore.x) * GS.zoom;
            GS.panY -= (worldAfter.y - worldBefore.y) * GS.zoom;
            
            GS.autoZoom = false;
            document.getElementById('btnAutoZoom').classList.remove('active');
        }
        GS.lastPinchDist = dist;
        render();
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    initAudio();
    
    if (GS.mode === 'CUSTOM' && GS.editorIsDrawing) {
        if (isTouchDevice()) {
            autoPlaceStartEnd();
        }
        const path = bfs(GS.grid, GS.startTile, GS.endTile, GS.rows, GS.cols);
        GS.optimalCommands = path ? computeOptimalCommands(path, GS.grid, GS.rows, GS.cols, GS.initialAngle) : [];
        computeMapId();
    }
    
    GS.isDragging = false;
    GS.editorIsDrawing = false;
    GS.lastPinchDist = 0;
}, { passive: false });





// ═══════════════════════════════════════════════════
//  LOCAL STORAGE
// ═══════════════════════════════════════════════════
function saveSettings() {
  try {
    localStorage.setItem('RC_settings', JSON.stringify({
      level:     GS.level,
      robotSkin: GS.robotSkin,
      speed:     GS.speed,
      camera:    GS.camera,
      autoZoom:  GS.autoZoom,
      mode:      GS.mode,
      difficulty:GS.difficulty,
      colors:    GS.buildingColors,
    }));
  } catch {}
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('RC_settings') || '{}');
    if (s.level)       GS.level       = Math.max(1, Math.min(15, s.level));
    if (s.robotSkin !== undefined)   GS.robotSkin   = s.robotSkin;
    if (s.speed)       GS.speed       = s.speed;
    if (s.camera)      GS.camera      = s.camera;
    if (s.autoZoom !== undefined) GS.autoZoom = s.autoZoom;
    if (s.mode)        GS.mode        = s.mode;
    if (s.difficulty)  GS.difficulty  = s.difficulty;
    if (s.colors && Array.isArray(s.colors) && s.colors.length > 0) GS.buildingColors = s.colors;
  } catch {}

  document.getElementById('speedLabel').textContent  = `×${GS.speed}`;
  document.getElementById('levelLabel').textContent  = `L${GS.level}`;
  document.getElementById('skinLabel').textContent   = GS.robotSkin;
  document.getElementById('cameraLabel').textContent = GS.camera === 'LOCK_MAP' ? 'Map' : 'Bot';
  document.getElementById('difficultyLabel').textContent = GS.difficulty === 'HARD' ? 'Hard' : 'Easy';
  document.getElementById('btnAutoZoom').classList.toggle('active', GS.autoZoom);
  G.selectMode(GS.mode);
  updateStatusUI();
}


async function init() {
  resizeCanvas();
  await preloadRobots();
  loadSettings();
  if (isTouchDevice()) {
    document.getElementById('btnRandStartEndTouch').style.display = 'inline-flex';
    document.getElementById('btnRandStartEndTouch').onclick = () => {
        if (GS.mode === 'CUSTOM') {
            autoPlaceStartEnd();
            const path = bfs(GS.grid, GS.startTile, GS.endTile, GS.rows, GS.cols);
            GS.optimalCommands = path ? computeOptimalCommands(path, GS.grid, GS.rows, GS.cols, GS.initialAngle) : [];
            computeMapId();
            render();
        }
    };
  }
  generateMap(!GS.buildingColors.length);
  render();

  // Hide loading screen
  const ls = document.getElementById('loadingScreen');
  ls.style.transition = 'opacity 0.4s';
  ls.style.opacity = '0';
  setTimeout(() => ls.remove(), 450);
  document.addEventListener('contextmenu', e => e.preventDefault());
}

init();
</script>

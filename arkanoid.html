                        // Use visual position (actual y + scroll offset)
                        const visualY = br.y + brickScrollOffset;
                        const hit = hitTest(b, {
                            x: br.x,
                            y: visualY,
                            w: br.w,
                            h: br.h,
                        });
                        if (hit) {
                            playSound("hit");
                            if (!b.isIron) {
                                hit === "horizontal"
                                    ? (b.dx *= -1)
                                    : (b.dy *= -1);
                            }
                            b.tickSpeed();
                            b.clampSpeed();
                            br.health -= b.isIron ? br.maxHealth : 1;
                            const pts =
                                10 * Math.min(Math.max(comboCount, 1), 5);
                            if (b.ownerId && players[b.ownerId]) {
                                players[b.ownerId].score += pts;
                                players[b.ownerId].peakScore = Math.max(
                                    players[b.ownerId].peakScore,
                                    players[b.ownerId].score,
                                );
                            }
                            comboCount++;
                            comboTimer = 400;
                            if (br.health <= 0) {
                                spawnParts(
                                    br.x + br.w / 2,
                                    br.y + br.h / 2,
                                    (
                                        BRICK_COLORS[br.maxHealth] ||
                                        BRICK_COLORS[1]
                                    ).glow,
                                    12,
                                );
                                if (br.hasPowerup) {
                                    const p = new PowerUp(
                                        br.x + br.w / 2,
                                        br.y + br.h / 2,
                                    );
                                    const isFlushActive =
                                        Date.now() < flushEndTime &&
                                        flushEndTime > 0;
                                    const hasFlushOnScreen =
                                        powerups.some(
                                            (pu) => pu.type === "FLUSH",
                                        ) || isFlushActive;
                                    if (
                                        p.type === "FLUSH" &&
                                        hasFlushOnScreen
                                    ) {
                                        spawnParts(
                                            br.x + br.w / 2,
                                            br.y + br.h / 2,
                                            "#ff0000",
                                            5,
                                        );
                                    } else if (
                                        p.type === "FLUSH" &&
                                        !hasFlushOnScreen
                                    ) {
                                        powerups.push(p);
                                    } else if (p.type !== "FLUSH") {
                                        powerups.push(p);
                                    }
                                }
                                const flushIdx = flushBricks.indexOf(br);
                                if (flushIdx > -1)
                                    flushBricks.splice(flushIdx, 1);
                                bricks.splice(j, 1);
                                if (b.ownerId && players[b.ownerId]) {
                                    players[b.ownerId].score += 20;
                                    players[b.ownerId].peakScore = Math.max(
                                        players[b.ownerId].peakScore,
                                        players[b.ownerId].score,
                                    );
                                }
                            }
                            break;
                        }
                    }

                    // Ball lost
                    if (b.y + b.radius > ch) {
                        const oid = b.ownerId;
                        balls.splice(i, 1);
                        if (oid && players[oid] && playerBallCount(oid) === 0) {
                            players[oid].alive = false;
                            // If no paddle, remove player entirely
                            if (!paddles[oid]) {
                                delete players[oid];
                            }
                            playSound("out");
                        }
                    }
                }

                bricks.forEach((b) => b.update());
                
                // Update Emoji Bricks
                emojiBricks.forEach((eb) => eb.update());
                emojiBricks = emojiBricks.filter(eb => eb.active);

                // Powerups
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const pu = powerups[i];
                    pu.update();
                    // Use visual position (actual y + scroll offset)
                    const visualPuy = pu.y + brickScrollOffset;
                    let caught = false;
                    for (const pid in paddles) {
                        const pad = paddles[pid];
                        if (
                            visualPuy + pu.radius > pad.y - pad.h / 2 &&
                            pu.x > pad.x - pad.w / 2 &&
                            pu.x < pad.x + pad.w / 2
                        ) {
                            applyPowerup(
                                pu.type,
                                pu.x,
                                pu.y,
                                pid !== "bot" ? pid : null,
                            );
                            powerups.splice(i, 1);
                            caught = true;
                            break;
                        }
                    }
                    // Check if powerup has scrolled off screen (visual position)
                    if (!caught && visualPuy > ch) powerups.splice(i, 1);
                }

                if (gameState === "PLAYING" && balls.length === 0) {
                    playerOrder.forEach((id) => {
                        if (players[id])
                            players[id].peakScore = Math.max(
                                players[id].peakScore,
                                players[id].score,
                            );
                    });
                    playSound("gameover");
                    gameState = "GAMEOVER";
                    paddles = {};
                }
            }

            // ─── DRAW ─────────────────────────────────────────────────────────────────────
            function drawBG() {
                // Use theme-based background
                const bgColor = isDarkMode ? "#070710" : "#d0d0d0";
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, cw, ch);
                ctx.strokeStyle = isDarkMode ? "rgba(0,255,200,.04)" : "rgba(0,180,160,.08)";
                ctx.lineWidth = 1;
                for (let x = 0; x < cw; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, ch);
                    ctx.stroke();
                }
                for (let y = 0; y < ch; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(cw, y);
                    ctx.stroke();
                }
                const zy = paddleZoneTop();
                ctx.fillStyle = isDarkMode ? "rgba(255,30,30,.04)" : "rgba(200,50,50,.06)";
                ctx.fillRect(0, zy, cw, ch - zy);
                ctx.save();
                ctx.setLineDash([12, 8]);
                ctx.lineDashOffset = -(Date.now() / 60) % 20;
                ctx.strokeStyle = isDarkMode ? "rgba(255,60,60,.65)" : "rgba(200,40,40,.7)";
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#ff2222";
                ctx.beginPath();
                ctx.moveTo(0, zy);
                ctx.lineTo(cw, zy);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
                ctx.fillStyle = isDarkMode ? "rgba(255,80,80,.5)" : "rgba(180,50,50,.6)";
                ctx.font = "10px Share Tech Mono";
                ctx.textAlign = "left";
                ctx.fillText("▼ PADDLE ZONE", 10, zy - 5);
                ctx.restore();
            }

            function drawPaddle(p) {
                const cidx = p.colorIdx ?? -1,
                    col = PALETTE[cidx] ?? {
                        main: "#00ffc8",
                        glow: "#00ffaa",
                        dark: "#006650",
                    };
                const sizeBonus = paddleSizeBonus + (p.extraSize || 0);
                const pw = p.w + sizeBonus,
                    px = p.x - pw / 2,
                    py = p.y - p.h / 2;
                const isFrozen =
                    Object.prototype.hasOwnProperty.call(frozenPaddles, p.id) &&
                    frozenPaddles[p.id] > Date.now();
                ctx.save();
                if (isFrozen) {
                    ctx.shadowBlur = 28;
                    ctx.shadowColor = "#00ff00";
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 100) * 0.3;
                } else {
                    ctx.shadowBlur = 22;
                    ctx.shadowColor = col.glow;
                }
                ctx.beginPath();
                ctx.moveTo(px, py + p.h);
                ctx.lineTo(px + pw, py + p.h);
                ctx.lineTo(px + pw, py + p.h * 0.5);
                ctx.quadraticCurveTo(
                    p.x,
                    py - PADDLE_CURVE,
                    px,
                    py + p.h * 0.5,
                );
                ctx.closePath();
                const g = ctx.createLinearGradient(
                    px,
                    py - PADDLE_CURVE,
                    px,
                    py + p.h,
                );
                if (isFrozen) {
                    g.addColorStop(0, "#88ff88");
                    g.addColorStop(0.25, "#00ff00");
                    g.addColorStop(1, "#006600");
                } else {
                    g.addColorStop(0, "#ffffff");
                    g.addColorStop(0.25, col.main);
                    g.addColorStop(1, col.dark);
                }
                ctx.fillStyle = g;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(px + pw * 0.15, py + p.h * 0.45);
                ctx.quadraticCurveTo(
                    p.x,
                    py - PADDLE_CURVE + 3,
                    px + pw * 0.85,
                    py + p.h * 0.45,
                );
                ctx.strokeStyle = "rgba(255,255,255,.4)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            function drawHUD() {
                if (gameState === "DEMO") {
                    ctx.save();
                    ctx.textAlign = "right";
                    const rowH = 58,
                        panelX = cw - 12,
                        startY = 14;
                    demoPlayers.forEach((dp, i) => {
                        const pl = players[dp.pid];
                        if (!pl) return;
                        const col = PALETTE[pl.colorIdx];
                        const y = startY + i * rowH;
                        ctx.globalAlpha = 1;
                        ctx.save();
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = col.main;
                        ctx.fillStyle = col.main;
                        ctx.beginPath();
                        ctx.arc(panelX - 4, y + 12, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        ctx.font = "9px Share Tech Mono";
                        ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.45)" : "rgba(0,0,0,.5)";
                        ctx.fillText(col.label, panelX - 14, y + 7);
                        ctx.font = "bold 18px Orbitron";
                        ctx.fillStyle = col.main;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = col.glow;
                        ctx.fillText(String(pl.score).padStart(6, "0"), panelX - 14, y + 28);
                        ctx.shadowBlur = 0;
                    });
                    ctx.restore();
                    return;
                }
                // Time — top center
                const mins = Math.floor(timePlayed / 60),
                    secs = timePlayed % 60;
                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "10px Share Tech Mono";
                ctx.fillStyle = isDarkMode ? "rgba(0,255,200,.45)" : "rgba(0,150,120,.5)";
                ctx.fillText("TIME", cw / 2, 17);
                ctx.font = "bold 20px Orbitron";
                ctx.fillStyle = isDarkMode ? "#00ffc8" : "#008866";
                ctx.shadowBlur = isDarkMode ? 12 : 6;
                ctx.shadowColor = isDarkMode ? "#00ffc8" : "#00ffc8";
                ctx.fillText(
                    `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`,
                    cw / 2,
                    40,
                );
                ctx.shadowBlur = 0;
                ctx.restore();

                // Player score cards — right side, stacked
                const rowH = 58,
                    panelX = cw - 12,
                    startY = 14;
                ctx.save();
                ctx.textAlign = "right";
                playerOrder.forEach((id, i) => {
                    const pl = players[id];
                    if (!pl) return;
                    const col = PALETTE[pl.colorIdx],
                        ballsLeft = playerBallCount(id);
                    const alive = pl.alive && ballsLeft > 0;
                    const y = startY + i * rowH;
                    ctx.globalAlpha = alive ? 1 : 0.35;
                    // Colour pip
                    ctx.save();
                    ctx.shadowBlur = alive ? 12 : 0;
                    ctx.shadowColor = col.main;
                    ctx.fillStyle = alive ? col.main : "#444";
                    ctx.beginPath();
                    ctx.arc(panelX - 4, y + 12, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.font = "9px Share Tech Mono";
                    ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.45)" : "rgba(0,0,0,.5)";
                    ctx.fillText(
                        col.label + (alive ? "" : " ✕"),
                        panelX - 14,
                        y + 7,
                    );
                    ctx.font = "bold 18px Orbitron";
                    ctx.fillStyle = alive ? col.main : "#555";
                    ctx.shadowBlur = alive ? 8 : 0;
                    ctx.shadowColor = col.glow;
                    ctx.fillText(
                        String(pl.score).padStart(6, "0"),
                        panelX - 14,
                        y + 28,
                    );
                    ctx.shadowBlur = 0;
                    // Ball count dots
                    for (let k = 0; k < Math.min(ballsLeft, 6); k++) {
                        ctx.save();
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = col.glow;
                        ctx.fillStyle = col.main;
                        ctx.beginPath();
                        ctx.arc(
                            panelX -
                                14 -
                                k * 11 -
                                (Math.min(ballsLeft, 6) - 1) * 11 +
                                k * 11 +
                                (Math.min(ballsLeft, 6) - 1) * 11 -
                                k * 11,
                            y + 42,
                            3.5,
                            0,
                            Math.PI * 2,
                        );
                        // Simpler: right-aligned dots
                        ctx.arc(
                            panelX - 12 - k * 11,
                            y + 44,
                            3.5,
                            0,
                            Math.PI * 2,
                        );
                        ctx.fill();
                        ctx.restore();
                    }
                    if (ballsLeft > 6) {
                        ctx.font = "8px Share Tech Mono";
                        ctx.fillStyle = col.main;
                        ctx.fillText(
                            `+${ballsLeft - 6}`,
                            panelX - 12 - 6 * 11,
                            y + 47,
                        );
                    }
                    if (!alive) {
                        ctx.font = "8px Share Tech Mono";
                        ctx.fillStyle = isDarkMode ? "rgba(255,120,120,.7)" : "rgba(200,0,0,.6)";
                        ctx.fillText(
                            `BEST ${String(pl.peakScore).padStart(6, "0")}`,
                            panelX - 14,
                            y + 52,
                        );
                    }
                    ctx.globalAlpha = 1;
                });
                ctx.restore();

                // Ball dots — left, per player colour
                ctx.save();
                ctx.textAlign = "left";
                ctx.font = "9px Share Tech Mono";
                ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.4)";
                ctx.fillText("BALLS", 14, 16);
                playerOrder.forEach((id, pi) => {
                    const pl = players[id];
                    if (!pl) return;
                    const col = PALETTE[pl.colorIdx],
                        cnt = playerBallCount(id);
                    for (let k = 0; k < Math.min(cnt, 8); k++) {
                        ctx.save();
                        ctx.shadowBlur = 7;
                        ctx.shadowColor = col.main;
                        ctx.fillStyle = col.main;
                        ctx.beginPath();
                        ctx.arc(14 + k * 14, 28 + pi * 14, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    if (cnt > 8) {
                        ctx.fillStyle = col.main;
                        ctx.font = "8px Share Tech Mono";
                        ctx.fillText(`+${cnt - 8}`, 14 + 8 * 14, 32 + pi * 14);
                    }
                });
                ctx.restore();

                // Combo
                if (comboCount > 2 && comboTimer > 0) {
                    const a = Math.min(comboTimer / 200, 1);
                    ctx.save();
                    ctx.textAlign = "center";
                    ctx.font = `bold ${Math.min(cw * 0.05, 28)}px Orbitron`;
                    ctx.fillStyle = isDarkMode ? `rgba(255,200,0,${a})` : `rgba(200,150,0,${a})`;
                    ctx.shadowBlur = isDarkMode ? 20 * a : 10 * a;
                    ctx.shadowColor = isDarkMode ? "#ffcc00" : "#aa8800";
                    ctx.fillText(`${comboCount}× COMBO`, cw / 2, 74);
                    ctx.restore();
                }
            }

            function drawOverlay() {
                if (gameState === "DEMO") {
                    // No overlay - show gameplay clearly
                    ctx.save();
                    ctx.textAlign = "center";
                    ctx.fillStyle = isDarkMode ? "#00ffc8" : "#008866";
                    ctx.shadowBlur = isDarkMode ? 30 : 8;
                    ctx.shadowColor = isDarkMode ? "#00ffc8" : "#00ffc8";
                    ctx.font = `bold ${Math.min(cw * 0.09, 56)}px Orbitron`;
                    ctx.fillText("ARKANOID ∞", cw / 2, ch / 2 - 70);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.85)" : "rgba(0,0,0,.7)";
                    ctx.font = `${Math.min(cw * 0.04, 22)}px Share Tech Mono`;
                    ctx.fillText("TAP OR CLICK TO START", cw / 2, ch / 2 - 15);
                    ctx.fillStyle = isDarkMode ? "rgba(0,255,200,.5)" : "rgba(0,100,80,.6)";
                    ctx.font = `${Math.min(cw * 0.028, 14)}px Share Tech Mono`;
                    ctx.fillText(
                        "each new finger = a new player with their own coloured ball",
                        cw / 2,
                        ch / 2 + 18,
                    );
                    ctx.fillText(
                        "hold in bottom ⅓ zone to spawn a paddle  •  powerups apply to ALL",
                        cw / 2,
                        ch / 2 + 38,
                    );

                    // Powerup legend
                    const ly = ch / 2 + 80;
                    ctx.font = "12px Share Tech Mono";
                    ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.4)";
                    ctx.fillText("POWER-UPS:", cw / 2, ly);
                    const types = Object.entries(POWERUP_DEFS),
                        sp = Math.min(100, (cw / types.length) * 0.9),
                        sx = cw / 2 - ((types.length - 1) * sp) / 2;
                    types.forEach(([, def], i) => {
                        const lx = sx + i * sp;
                        ctx.fillStyle = isDarkMode ? def.color : def.glow;
                        ctx.shadowBlur = isDarkMode ? 8 : 4;
                        ctx.shadowColor = isDarkMode ? def.glow : def.color;
                        ctx.font = "13px Share Tech Mono";
                        ctx.fillText(def.label, lx, ly + 26);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.3)" : "rgba(0,0,0,.4)";
                        ctx.font = "9px Share Tech Mono";
                        ctx.fillText(def.desc, lx, ly + 40);
                    });

                    // Show player colour chips
                    const chipY = ch / 2 + 138;
                    ctx.font = "10px Share Tech Mono";
                    ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.3)" : "rgba(0,0,0,.4)";
                    ctx.fillText("PLAYERS:", cw / 2, chipY);
                    PALETTE.forEach((col, i) => {
                        const lx = cw / 2 + (i - PALETTE.length / 2 + 0.5) * 44;
                        ctx.save();
                        ctx.shadowBlur = isDarkMode ? 10 : 6;
                        ctx.shadowColor = isDarkMode ? col.glow : col.dark;
                        ctx.fillStyle = col.main;
                        ctx.beginPath();
                        ctx.arc(lx, chipY + 20, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.4)" : "rgba(0,0,0,.5)";
                        ctx.font = "8px Share Tech Mono";
                        ctx.fillText(col.label, lx, chipY + 36);
                    });
                    ctx.restore();
                }

                if (gameState === "GAMEOVER") {
                    ctx.fillStyle = gameOverOverlay;
                    ctx.fillRect(0, 0, cw, ch);
                    ctx.save();
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#ff3333";
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = "#ff0000";
                    ctx.font = `bold ${Math.min(cw * 0.11, 60)}px Orbitron`;
                    ctx.fillText("GAME OVER", cw / 2, ch / 2 - 140);
                    ctx.shadowBlur = 0;

                    // Sorted player results
                    const valid = playerOrder
                        .filter((id) => players[id])
                        .sort(
                            (a, b) =>
                                players[b].peakScore - players[a].peakScore,
                        );
                    const totalW = Math.min(valid.length * 140, cw * 0.92),
                        colW = totalW / Math.max(valid.length, 1);
                    const bx = cw / 2 - totalW / 2 + colW / 2,
                        baseY = ch / 2 - 70;

                    valid.forEach((id, i) => {
                        const pl = players[id],
                            col = PALETTE[pl.colorIdx],
                            cx = bx + i * colW;
                        const isFirst = i === 0;
                        if (isFirst) {
                            ctx.fillStyle = "#f1c40f";
                            ctx.shadowBlur = 14;
                            ctx.shadowColor = "#f1c40f";
                            ctx.font = "bold 14px Orbitron";
                            ctx.fillText("🏆 WINNER", cx, baseY - 18);
                            ctx.shadowBlur = 0;
                        }
                        ctx.save();
                        ctx.shadowBlur = isFirst ? 18 : 8;
                        ctx.shadowColor = col.glow;
                        ctx.fillStyle = col.main;
                        ctx.beginPath();
                        ctx.arc(
                            cx,
                            baseY + 8,
                            isFirst ? 12 : 9,
                            0,
                            Math.PI * 2,
                        );
                        ctx.fill();
                        ctx.restore();
                        ctx.font = `bold 10px Orbitron`;
                        ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.6)" : "rgba(0,0,0,.7)";
                        ctx.fillText(col.label, cx, baseY + 30);
                        ctx.font = `bold ${isFirst ? 26 : 20}px Orbitron`;
                        ctx.fillStyle = col.main;
                        ctx.shadowBlur = isFirst ? 12 : 6;
                        ctx.shadowColor = col.glow;
                        ctx.fillText(
                            String(pl.peakScore).padStart(6, "0"),
                            cx,
                            baseY + 56,
                        );
                        ctx.shadowBlur = 0;
                        ctx.font = "8px Share Tech Mono";
                        ctx.fillStyle = isDarkMode ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.4)";
                        ctx.fillText("BEST SCORE", cx, baseY + 68);
                    });

                    // Buttons
                    const btnY = ch / 2 + 60,
                        btnW = 120,
                        btnH = 44,
                        btnGap = 20;
                    const homeBtn = {
                        x: cw / 2 - btnW - btnGap / 2,
                        y: btnY,
                        w: btnW,
                        h: btnH,
                    };
                    const restartBtn = {
                        x: cw / 2 + btnGap / 2,
                        y: btnY,
                        w: btnW,
                        h: btnH,
                    };

                    // Home button
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff6600";
                    ctx.strokeStyle = "#ff6600";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(homeBtn.x, homeBtn.y, homeBtn.w, homeBtn.h);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = isDarkMode ? "rgba(255,102,0,.15)" : "rgba(255,102,0,.25)";
                    ctx.fillRect(homeBtn.x, homeBtn.y, homeBtn.w, homeBtn.h);
                    ctx.font = "bold 14px Orbitron";
                    ctx.fillStyle = "#ff6600";
                    ctx.fillText("HOME", homeBtn.x + btnW / 2, btnY + 28);
                    ctx.restore();

                    // Restart button
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#00ffc8";
                    ctx.strokeStyle = "#00ffc8";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(
                        restartBtn.x,
                        restartBtn.y,
                        restartBtn.w,
                        restartBtn.h,
                    );
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = isDarkMode ? "rgba(0,255,200,.15)" : "rgba(0,180,140,.25)";
                    ctx.fillRect(
                        restartBtn.x,
                        restartBtn.y,
                        restartBtn.w,
                        restartBtn.h,
                    );
                    ctx.font = "bold 14px Orbitron";
                    ctx.fillStyle = "#00ffc8";
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = "#00ffc8";
                    ctx.fillText("RESTART", restartBtn.x + btnW / 2, btnY + 28);
                    ctx.shadowBlur = 0;
                    ctx.restore();

                    // Store button bounds for click detection
                    window._gameOverBtns = {
                        home: homeBtn,
                        restart: restartBtn,
                    };

                    const pulse = (Math.sin(Date.now() / 400) + 1) / 2;
                    ctx.fillStyle = isDarkMode ? `rgba(0,255,200,${0.3 + pulse * 0.5})` : `rgba(0,150,120,${0.4 + pulse * 0.4})`;
                    ctx.shadowBlur = pulse * 12;
                    ctx.shadowColor = "#00ffc8";
                    ctx.font = `${Math.min(cw * 0.03, 14)}px Share Tech Mono`;
                    ctx.fillText(
                        "TAP A BUTTON ABOVE",
                        cw / 2,
                        btnY + btnH + 24,
                    );
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            function draw() {
                drawBG();
                if (flashAlpha > 0) {
                    ctx.fillStyle = `rgba(0,255,200,${Math.max(0, flashAlpha)})`;
                    ctx.fillRect(0, 0, cw, ch);
                }
                bricks.forEach((b) => b.draw());
                emojiBricks.forEach((eb) => eb.draw());
                powerups.forEach((p) => p.draw());
                particles.forEach((p) => p.draw());
                for (const id in paddles) drawPaddle(paddles[id]);
                balls.forEach((b) => b.draw());
                drawHUD();
                drawOverlay();
            }

            // ─── LOOP ─────────────────────────────────────────────────────────────────────
            function loop(ts) {
                const dt = Math.min(ts - lastTime, 50);
                lastTime = ts;
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            // ─── INPUT ────────────────────────────────────────────────────────────────────
            function handleStart(x, y, id) {
                audioCtx.resume();
                if (gameState === "DEMO" || gameState === "GAMEOVER") {
                    if (gameState === "GAMEOVER") {
                        const btns = window._gameOverBtns;
                        if (
                            btns &&
                            btns.home &&
                            x >= btns.home.x &&
                            x <= btns.home.x + btns.home.w &&
                            y >= btns.home.y &&
                            y <= btns.home.y + btns.home.h
                        ) {
                            window.location.href = "index.html";
                            return;
                        }
                        if (
                            btns &&
                            btns.restart &&
                            x >= btns.restart.x &&
                            x <= btns.restart.x + btns.restart.w &&
                            y >= btns.restart.y &&
                            y <= btns.restart.y + btns.restart.h
                        ) {
                            gameState = "DEMO";
                            initGame();
                            balls = [];
                            paddles = {};
                            powerups = [];
                            particles = [];
                            return;
                        }
                    }
                    gameState = "PLAYING";
                    initGame();
                    getOrCreatePlayer(id);
                    spawnBallForPlayer(id, x, ch * 0.55);
                    paddles[id] = {
                        x,
                        y: clampPY(y),
                        w: PADDLE_W,
                        h: PADDLE_H,
                        colorIdx: players[id].colorIdx,
                        id: id,
                    };
                    return;
                }
                // Tap powerup (anywhere)
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const p = powerups[i];
                    if (Math.hypot(p.x - x, p.y - y) < p.radius + 22) {
                        applyPowerup(p.type, p.x, p.y, players[id] ? id : null);
                        powerups.splice(i, 1);
                        return;
                    }
                }
                if (y < paddleZoneTop()) return; // ignore touches above zone
                if (!players[id]) {
                    // Brand-new player joining mid-game
                    getOrCreatePlayer(id);
                    spawnBallForPlayer(id, x, paddleZoneTop() - 60);
                } else if (playerBallCount(id) === 0) {
                    // Rejoin: reset score to 0, new ball
                    players[id].score = 0;
                    players[id].alive = true;
                    spawnBallForPlayer(id, x, paddleZoneTop() - 60);
                    playSound("join");
                }
                paddles[id] = {
                    x,
                    y: clampPY(y),
                    w: PADDLE_W,
                    h: PADDLE_H,
                    colorIdx: players[id].colorIdx,
                    id: id,
                };
            }
            function handleMove(x, y, id) {
                if (paddles[id] && !frozenPaddles[id]) {
                    paddles[id].x = x;
                    paddles[id].y = clampPY(y);
                }
            }
            function handleEnd(id) {
                if (id !== "mouse") delete paddles[id];
            }

            // Track active touches to handle multi-touch properly
            const activeTouches = new Map();

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                [...e.changedTouches].forEach((t) => {
                    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                    handleStart(t.clientX, t.clientY, t.identifier);
                });
            }, { passive: false, capture: true });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                [...e.changedTouches].forEach((t) => {
                    if (activeTouches.has(t.identifier)) {
                        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
                        handleMove(t.clientX, t.clientY, t.identifier);
                    }
                });
                
                // Prevent pinch zoom and all multi-touch gestures
                if (e.touches.length > 1) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, { passive: false, capture: true });

            // CRITICAL FIX: Handle ALL touch end scenarios including touchcancel which iPad uses heavily
            function handleTouchEnd(e) {
                e.preventDefault();
                e.stopPropagation();
                
                [...e.changedTouches].forEach((t) => {
                    const id = t.identifier;
                    activeTouches.delete(id);
                    handleEnd(id);
                });
            }

            canvas.addEventListener('touchend', handleTouchEnd, { passive: false, capture: true });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false, capture: true });

            // Prevent double-tap zoom
            let lastTouchEnd = 0;
            canvas.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                lastTouchEnd = now;
            }, { passive: false, capture: true });
            canvas.addEventListener("mousedown", (e) =>
                handleStart(e.clientX, e.clientY, "mouse"),
            );
            canvas.addEventListener("mousemove", (e) => {
                mousePos = { x: e.clientX, y: e.clientY };
                handleMove(e.clientX, e.clientY, "mouse");
            });
            canvas.addEventListener(
                "mouseleave",
                () => delete paddles["mouse"],
            );
            // Block ALL gesture events at document level
            ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
                document.addEventListener(evt, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, { passive: false, capture: true });
            });

            // Dynamically ensure viewport stays locked
            function lockViewport() {
                const viewport = document.querySelector('meta[name="viewport"]');
                if (viewport) {
                    viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
                }
            }

            // Re-lock on orientation change and visibility changes
            window.addEventListener('orientationchange', lockViewport);
            window.addEventListener('resize', lockViewport);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) lockViewport();
            });

            // Emergency cleanup when app goes to background (fixes stuck paddles)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // Clear all paddles when app backgrounds
                    activeTouches.forEach((_, id) => handleEnd(id));
                    activeTouches.clear();
                    for (const id in paddles) {
                        if (id !== 'mouse' && id !== 'bot') {
                            delete paddles[id];
                        }
                    }
                }
            });

            // CSS Hard Lock for gestures
            const gestureCSS = document.createElement('style');
            gestureCSS.textContent = `
                * {
                    touch-action: none !important;
                    -webkit-touch-callout: none !important;
                    -webkit-user-select: none !important;
                    user-select: none !important;
                    -webkit-tap-highlight-color: transparent !important;
                }
                canvas {
                    touch-action: none !important;
                    -webkit-touch-action: none !important;
                }
                html, body {
                    overflow: hidden !important;
                    position: fixed !important;
                    width: 100% !important;
                    height: 100% !important;
                    overscroll-behavior: none !important;
                }
            `;
            document.head.appendChild(gestureCSS);

            // Initialize viewport lock
            lockViewport();

            initGame();
            requestAnimationFrame(loop);
        </script>
    </body>
</html>

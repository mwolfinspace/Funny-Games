<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Battleship</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }
        canvas {
            background-color: #F0F9FF; /* sky-50 */
            border-radius: 0.5rem;
            border: 2px solid #D1D5DB; /* gray-300 */
        }
        .game-screen {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
        }
        /* Replaced Tailwind @apply rules with plain CSS so the file works without a build step */
        .btn {
            padding: 0.5rem 1rem; /* py-2 px-4 */
            border-radius: 0.5rem; /* rounded-lg */
            font-weight: 600; /* font-semibold */
            color: #ffffff; /* text-white */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* shadow-md */
            transition: all 200ms ease; /* transition-all duration-200 */
            border: none;
            cursor: pointer;
            background-color: #2563EB; /* default to blue-600 for buttons unless overridden */
        }
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.25); /* focus ring approximation */
        }

        .btn-primary {
            background-color: #2563EB; /* blue-600 */
        }
        .btn-primary:hover { background-color: #1D4ED8; /* blue-700 */ }
        .btn-primary:focus { box-shadow: 0 0 0 4px rgba(37,99,235,0.30); }

        .btn-secondary {
            background-color: #6B7280; /* gray-500 */
        }
        .btn-secondary:hover { background-color: #4B5563; /* gray-600 */ }
        .btn-secondary:focus { box-shadow: 0 0 0 4px rgba(107,114,128,0.20); }

        .btn-danger {
            background-color: #DC2626; /* red-600 */
        }
        .btn-danger:hover { background-color: #B91C1C; /* red-700 */ }
        .btn-danger:focus { box-shadow: 0 0 0 4px rgba(220,38,38,0.20); }

        .btn-utility {
            background-color: #EAB308; /* yellow-500 */
            color: #000000; /* text-black */
        }
        .btn-utility:hover { background-color: #D97706; /* yellow-600 */ }
        .btn-utility:focus { box-shadow: 0 0 0 4px rgba(234,179,8,0.18); }

        .screen {
            width: 100%;
            height: 100%;
            max-width: 64rem; /* approx max-w-4xl */
            margin-left: auto;
            margin-right: auto;
            padding: 0.5rem; /* p-2 */
            position: relative; /* allow overlays positioned inside screens */
        }
        @media (min-width: 640px) {
            .screen { padding: 1rem; /* sm:p-4 */ }
        }

        /* Feedback overlay styles */
        .feedback-overlay {
            position: absolute;
            inset: 0; /* cover parent */
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* clicks pass through */
            z-index: 60;
        }

        .feedback-emoji {
            font-size: 6rem;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
            opacity: 0;
            transform: scale(0.6);
            will-change: transform, opacity;
            /* default animation: fade in (1.5s) then stay then fade out */
            animation: feedbackFadeIn 1.5s forwards, feedbackFadeOut 0.6s 1.6s forwards;
        }

        @keyframes feedbackFadeIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        @keyframes feedbackFadeOut {
            0% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(1.25); }
        }

        /* Start screen/card sizing to avoid title wrapping */
        .start-card {
            max-width: 1000px; /* allow wide title */
            min-width: 640px; /* ensure enough room for controls on desktop/tablet */
            padding: 2.5rem; /* larger padding */
        }

        /* Make sure buttons and control text don't wrap and are comfortably sized */
        .btn {
            white-space: nowrap;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
        }

        /* Title should prefer a single line but scale on small screens */
        #title {
            white-space: nowrap;
            overflow-wrap: normal;
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            line-height: 1.02;
        }

        /* Make start screen controls comfortably large */
        #team-count, #lang-select {
            min-width: 180px;
            font-size: 1rem;
            white-space: nowrap;
        }

        /* Ensure grid size display doesn't wrap */
        #grid-size-display { white-space: nowrap; }

        /* Circle labels shouldn't wrap */
        .team-circle-label { white-space: nowrap; }

        /* Scoreboard entries shouldn't wrap */
        #scoreboard > div { white-space: nowrap; }

        /* Turn info should not wrap on larger screens; allow smaller font on narrow screens */
        #turn-info { white-space: nowrap; }

        /* On very small screens allow smaller min-width so layout doesn't overflow the viewport */
        @media (max-width: 760px) {
            .start-card { min-width: 320px; padding: 1rem; }
            #title { white-space: normal; font-size: 1.4rem; }
            #team-count, #lang-select { min-width: 120px; }
            .team-circle { width:48px; height:48px; }
            .team-circle-label { font-size:0.72rem; }
            .btn { font-size:0.95rem; padding:0.6rem 1rem; }
        }

        /* Team circle UI */
        .team-circle {
            width: 56px;
            height: 56px;
            border-radius: 9999px;
            background: #ffffff;
            border: 2px solid rgba(0,0,0,0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
        }
        .team-circle:active { transform: scale(0.96); }
    .team-circle-label { display:block; text-align:center; font-size:0.78rem; margin-top:6px; color:#333; min-width:100px; }

        .team-circle.small { width:48px; height:48px; }
        .team-circle-wrapper { display:flex; flex-direction:column; align-items:center; min-width:120px; }

        /* reduce wrapper min-width on small screens */
        @media (max-width: 760px) {
            .team-circle-wrapper { min-width:84px; }
        }

        /* Windows 11 Style Hover Effect */
        .btn, .team-circle {
            position: relative;
            overflow: hidden;
        }

        .btn::before, .team-circle::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--x) var(--y), rgba(255, 255, 255, 0.6) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            pointer-events: none;
        }

        .btn:hover::before, .team-circle:hover::before {
            opacity: 1;
        }
    </style>
    <style>
        a.return-to-menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(0,0,0,0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s;
            z-index: 1000;
        }
        a.return-to-menu:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden">
<a class="return-to-menu" href="index.html">🏠</a>

    <!-- Step 1: Team Setup -->
    <div id="team-setup-screen" class="screen flex flex-col items-center justify-center h-full">
    <div class="bg-white p-8 rounded-lg shadow-xl text-center start-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                <h1 id="title" class="text-3xl font-bold mb-6">🚢 Coordinate Battleship</h1>
                <div style="margin-left:8px;">
                    <label for="lang-select" class="sr-only">Language</label>
                    <select id="lang-select" aria-label="Language" style="padding:6px;border-radius:8px;font-weight:600;">
                        <option value="en">English</option>
                        <option value="vi">Tiếng Việt</option>
                    </select>
                </div>
            </div>
            <label for="team-count" class="block text-lg mb-2">Select number of teams (1-5):</label>
            <label id="team-count-label" for="team-count" class="sr-only">Select number of teams</label>
            <select id="team-count" class="bg-gray-200 text-gray-900 border border-gray-300 p-2 rounded-lg text-lg mb-4 w-full">
                <option value="1">1 Team</option>
                <option value="2" selected>2 Teams</option>
                <option value="3">3 Teams</option>
                <option value="4">4 Teams</option>
                <option value="5">5 Teams</option>
            </select>

            <!-- Team color circles: allow quick selection by clicking. -->
            <div id="team-circles" style="display:flex;justify-content:center;gap:22px;margin-bottom:12px;">
                <!-- will be populated by JS if not present -->
            </div>

            <!-- Extra Turn Rules Toggle -->
            <div class="mb-6">
                <label for="extra-turn-toggle" class="flex items-center justify-center cursor-pointer select-none">
                    <input type="checkbox" id="extra-turn-toggle" class="sr-only peer">
                    <div class="relative w-14 h-7 bg-gray-300 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-blue-600"></div>
                    <span id="extra-turn-label" class="ml-3 text-lg font-medium text-gray-900">⚔️ Extra Turn Rules</span>
                </label>
                <p id="extra-turn-desc" class="text-sm text-gray-600 mt-2">Hit an enemy ship? Get an extra turn! (Until miss)</p>
            </div>

            <button id="start-setup-btn" class="btn btn-primary text-xl w-full mb-3">Continue to Grid Setup 🚢</button>
            <button id="menu-btn-setup" class="btn btn-secondary text-lg w-full">◀️ Back to Menu</button>
        </div>
    </div>

        <!-- Feedback overlay for hit/miss emoji animations -->
        <div id="feedback-overlay" class="feedback-overlay" aria-hidden="true"></div>

    <!-- Step 2: Grid Setup -->
    <div id="grid-setup-screen" class="screen hidden flex flex-col h-full items-center justify-center">
        <div class="bg-white p-4 md:p-6 rounded-lg shadow-xl w-full flex flex-col flex-grow min-h-0 max-w-3xl" style="max-height: 90vh;">
            <h2 class="text-2xl font-bold mb-4 text-center flex-shrink-0">Setup Grid Size</h2>
            <div class="flex items-center justify-center space-x-4 mb-2 flex-shrink-0">
                <button id="decrease-grid-btn" class="btn btn-secondary w-16 text-2xl">–</button>
                <span id="grid-size-display" class="text-3xl font-bold w-40 text-center">5 x 5</span>
                <button id="increase-grid-btn" class="btn btn-secondary w-16 text-2xl">+</button>
            </div>
            <p class="text-gray-600 mb-2 text-center flex-shrink-0">Adjust the coordinate system size. (Min 5x5, Max 20x20)</p>
            <div class="flex-grow w-full min-h-0 mb-2 flex items-center justify-center" style="max-height: 70vh;">
                <canvas id="grid-setup-canvas" style="width: 100%; height: 100%; max-width: 900px; max-height: 70vh;"></canvas>
            </div>
                <button id="confirm-grid-btn" class="btn btn-primary text-lg w-full flex-shrink-0 mb-2">Confirm Grid & Start Placement ⚓</button>
            <button id="menu-btn-grid" class="btn btn-secondary text-sm w-full flex-shrink-0">◀️ Back to Menu</button>
        </div>
    </div>

    <!-- Step 3 & 4: Placement & Game -->
    <div id="game-container" class="screen hidden flex-col h-full overflow-hidden items-center justify-center">
        <div class="w-full max-w-4xl flex flex-col h-full" style="max-height: 95vh;">
            <!-- Header: Turn Info & Messages -->
            <div class="flex-shrink-0 p-4 bg-white rounded-lg shadow-lg mb-2">
                <h2 id="turn-info" class="text-2xl font-bold text-center mb-2">Red Team: Place Your Ships</h2>
                <p id="message-box" class="text-center text-indigo-600 h-6"></p>
            </div>

            <!-- Main Content: Game Board -->
            <div class="flex-grow w-full min-h-0 flex items-center justify-center mb-2" style="max-height: 65vh;">
                <canvas id="game-canvas" style="width: 100%; height: 100%; max-width: 1000px; max-height: 65vh;"></canvas>
            </div>
            
            <!-- Footer: Scoreboard & Controls -->
            <div class="flex-shrink-0">
                <!-- Scoreboard -->
                <div id="scoreboard" class="flex flex-wrap justify-center gap-2 mb-2">
                    <!-- Scores will be injected here by JS -->
                </div>
                <!-- Controls -->
                <div class="flex flex-wrap justify-center gap-2">
                    <button id="next-btn" class="btn btn-primary text-lg">Next Team ➡️</button>
                    <button id="start-game-btn" class="btn btn-primary text-lg hidden">Start Game ▶️</button>
                    <button id="end-game-btn" class="btn btn-utility text-lg hidden">End Game (Bonus) 🔚</button>
                    <button id="reveal-all-btn" class="btn btn-danger text-lg hidden">Reveal All 🔍</button>
                    <button id="new-game-btn" class="btn btn-primary text-lg hidden">New Game 🔄</button>
                    <button id="menu-btn-game" class="btn btn-secondary text-lg hidden">◀️ Back to Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CONSTANTS & STATE ---
            const TEAM_COLORS = [
                { name: 'Red', color: '#EF4444' },    // red-500
                { name: 'Blue', color: '#1D4ED8' },   // blue-700 (darker blue)
                { name: 'Green', color: '#22C55E' },  // green-500
                { name: 'Yellow', color: '#EAB308' }, // yellow-500
                { name: 'Purple', color: '#A855F7' }, // purple-500
            ];
            // Current UI language
            let currentLang = 'en';

            // Simple translation dictionary (short and tidy)
            const I18N = {
                title: { en: '🚢 Coordinate Battleship', vi: '🚢 Trận chiến Tọa độ' },
                select_teams: { en: 'Select number of teams (1-5):', vi: 'Chọn số đội (1-5):' },
                extra_turn_label: { en: '⚔️ Extra Turn Rules', vi: '⚔️ Luật lượt thêm' },
                extra_turn_desc: { en: 'Hit an enemy ship? Get an extra turn! (Until miss)', vi: 'Trúng tàu địch? Được lượt thêm! (Cho đến khi trượt)' },
                continue_btn: { en: 'Continue to Grid Setup 🚢', vi: 'Tiếp tục tới lưới 🚢' },
                back_menu: { en: '◀️ Back to Menu', vi: '◀️ Trở về' },
                setup_grid_title: { en: 'Setup Grid Size', vi: 'Cài kích thước lưới' },
                adjust_grid_desc: { en: 'Adjust the coordinate system size. (Min 5x5, Max 20x20)', vi: 'Điều chỉnh kích thước hệ tọa độ. (Tối thiểu 5x5, tối đa 20x20)' },
                confirm_grid: { en: 'Confirm Grid & Start Placement ⚓', vi: 'Xác nhận & Bắt đầu đặt tàu ⚓' },
                next_team: { en: 'Next Team ➡️', vi: 'Đội tiếp theo ➡️' },
                start_game: { en: 'Start Game ▶️', vi: 'Bắt đầu ▶️' },
                end_game: { en: 'End Game (Bonus) 🔚', vi: 'Kết thúc (Thưởng) 🔚' },
                reveal_all: { en: 'Reveal All 🔍', vi: 'Hiện tất cả 🔍' },
                new_game: { en: 'New Game 🔄', vi: 'Trò chơi mới 🔄' },
                place_ships: { en: 'Place Your Ships', vi: 'Đặt tàu' },
                team_turn: { en: "Team's Turn", vi: 'Lượt của đội' },
                extra_turn_badge: { en: '(Extra Turn)', vi: '(Lượt thêm)' },
                placement_help: { en: 'Click once: place ship | Click twice: promote to Commander (3pts) | Click thrice: remove', vi: 'Nhấn 1 lần: đặt tàu | 2 lần: thăng hạng Chỉ huy (3 điểm) | 3 lần: gỡ' },
                promoted: { en: 'Promoted to Commander Ship! (Worth 3 points)', vi: 'Đã thăng Chỉ huy! (3 điểm)' },
                ship_removed: { en: 'Ship removed!', vi: 'Đã gỡ tàu!' },
                ship_placed: { en: 'Ship placed! Click again to promote to Commander', vi: 'Đã đặt tàu! Nhấn lại để thăng Chỉ huy' },
                cant_place: { en: "Can't place ship here! (Too close to enemy or spot taken)", vi: 'Không thể đặt ở đây! (Quá gần kẻ địch hoặc chỗ đã có)' },
                victory_bonus: { en: 'Victory! {team} Team gets bonus for surviving ships!', vi: 'Chiến thắng! Đội {team} nhận thưởng cho tàu sống sót!' },
                all_revealed: { en: 'All ships revealed! No survival bonus.', vi: 'Tất cả tàu đã lộ! Không có thưởng.' },
                hit_own: { en: '{player} hit their own {shipType}! -{points}!', vi: '{player} bắn trúng tàu đội mình {shipType}! -{points}!' },
                hit_own_single: { en: '{player} hit their own {shipType}! +{points}!', vi: '{player} bắn trúng tàu đội mình {shipType}! +{points}!' },
                hit_enemy: { en: '{player} hit {team} team\'s {shipType}! +{points}!{extra}', vi: '{player} trúng tàu đội {team} {shipType}! +{points}!{extra}' },
                already_revealed: { en: 'This spot has already been revealed.', vi: 'Vị trí này đã được lộ.' },
                miss: { en: 'Miss!', vi: 'Trượt!' },
                bonus_awarded: { en: 'Bonus points awarded to all surviving ships!', vi: 'Đã cộng điểm thưởng cho tàu sống sót!' },
                tie_message: { en: '🎉 Game Over! Tie between: {teams}!', vi: '🎉 Trò chơi kết thúc! Hòa giữa: {teams}!' },
                game_over_win: { en: '🏆 Game Over! {team} Team wins!', vi: '🏆 Kết thúc! Đội {team} thắng!' },
                already_playing: { en: ' (Extra turn applied)', vi: ' (áp dụng lượt thêm)' },
                color_Red: { en: 'Red', vi: 'Đỏ' },
                color_Blue: { en: 'Blue', vi: 'Xanh dương' },
                color_Green: { en: 'Green', vi: 'Xanh lá' },
                color_Yellow: { en: 'Yellow', vi: 'Vàng' },
                color_Purple: { en: 'Purple', vi: 'Tím' },
            };

            function t(key, vars = {}) {
                const entry = I18N[key];
                const str = entry ? (entry[currentLang] || entry.en) : key;
                return str.replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : ''));
            }

            function getTeamLabel(team) {
                // team.name contains the English color name (e.g., 'Red')
                const key = 'color_' + team.name;
                return I18N[key] ? t(key) : team.name;
            }
            const GRID_COLOR_EMPTY = '#DBEAFE'; // blue-100 (very light blue)
            const GRID_COLOR_BANNED = '#6B7281'; // gray-500
            const GRID_COLOR_HIDDEN_SHIP = '#4B5563'; // gray-600
            const GRID_COLOR_MISS = '#E5E7EB'; // gray-200
            const GRID_COLOR_UNREVEALED = '#93C5FD'; // blue-300

            let gameState = 'TEAM_SETUP'; // 'TEAM_SETUP', 'GRID_SETUP', 'PLACEMENT', 'GAME', 'GAME_OVER'
            let teams = [];
            let gridSize = { x: 5, y: 5 };
            let board = []; // 2D array of cell objects
            let currentPlacingTeamIndex = 0;
            let currentPlayerIndex = 0;
            let revealAll = false;
            let extraTurnEnabled = false;
            let isExtraTurn = false;
            let canvas, ctx;
            let setupCanvas, setupCtx;
            let hoveredCell = { x: -1, y: -1 };
            let mousePos = { x: 0, y: 0 };
            // Audio context - created lazily on first interaction to satisfy browser autoplay
            let audioCtx = null;
            function ensureAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // --- UI ELEMENTS ---
            const screens = {
                teamSetup: document.getElementById('team-setup-screen'),
                gridSetup: document.getElementById('grid-setup-screen'),
                game: document.getElementById('game-container'),
            };
            const teamCountSelect = document.getElementById('team-count');
            const extraTurnToggle = document.getElementById('extra-turn-toggle');
            const startSetupBtn = document.getElementById('start-setup-btn');
            const langSelect = document.getElementById('lang-select');
            
            const gridSizeDisplay = document.getElementById('grid-size-display');
            const decreaseGridBtn = document.getElementById('decrease-grid-btn');
            const increaseGridBtn = document.getElementById('increase-grid-btn');
            const confirmGridBtn = document.getElementById('confirm-grid-btn');
            setupCanvas = document.getElementById('grid-setup-canvas');
            setupCtx = setupCanvas.getContext('2d');
            
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            const teamCirclesContainer = document.getElementById('team-circles');
            const turnInfo = document.getElementById('turn-info');
            const messageBox = document.getElementById('message-box');
            const scoreboard = document.getElementById('scoreboard');
            const nextBtn = document.getElementById('next-btn');
            const startGameBtn = document.getElementById('start-game-btn');
            const endGameBtn = document.getElementById('end-game-btn');
            const revealAllBtn = document.getElementById('reveal-all-btn');
            const newGameBtn = document.getElementById('new-game-btn');
            const menuBtnSetup = document.getElementById('menu-btn-setup');
            const menuBtnGrid = document.getElementById('menu-btn-grid');
            const menuBtnGame = document.getElementById('menu-btn-game');

            // --- Team circles UI state ---
            const CIRCLE_COUNT = 5;
            // circleState holds color index (0..TEAM_COLORS.length-1) or null for white/unassigned
            let circleState = new Array(CIRCLE_COUNT).fill(null);
            const COLOR_EMOJIS = ['🔴','🔵','🟢','🟡','🟣'];

            function createCircleElement(i) {
                const wrapper = document.createElement('div');
                wrapper.className = 'team-circle-wrapper';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'team-circle';
                btn.dataset.index = String(i);
                btn.setAttribute('aria-label', `Team circle ${i+1}`);

                const label = document.createElement('span');
                label.className = 'team-circle-label';
                label.id = `circle-label-${i}`;
                label.textContent = '';

                btn.addEventListener('click', () => {
                    // cycle color: null(white) -> 0 -> 1 -> ... -> last -> null
                    const cur = circleState[i];
                    const cycleLen = TEAM_COLORS.length + 1; // include null state
                    let nextIdx;
                    if (cur === null) nextIdx = 0;
                    else {
                        const k = (cur + 1) % cycleLen;
                        nextIdx = (k === TEAM_COLORS.length) ? null : k;
                    }
                    circleState[i] = nextIdx;
                    renderCircle(i);
                    updateSelectFromCircles();
                });

                wrapper.appendChild(btn);
                wrapper.appendChild(label);
                return wrapper;
            }

            function renderCircle(i) {
                const wrapper = teamCirclesContainer.children[i];
                if (!wrapper) return;
                const btn = wrapper.querySelector('.team-circle');
                const label = wrapper.querySelector('.team-circle-label');
                const colorIdx = circleState[i];
                if (colorIdx === null || colorIdx === undefined) {
                    btn.style.background = '#ffffff';

            // Simple synthesized explosion sound using WebAudio
            function playExplosion() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                const bufferSize = 2 * ctx.sampleRate;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                // fill buffer with white noise shaped by an exponential decay envelope
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / ctx.sampleRate;
                    // white noise
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * t);
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.value = 1200;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                noise.connect(lp).connect(gain).connect(ctx.destination);
                noise.start();
                noise.stop(ctx.currentTime + 1.3);
            }

            // Simple synthesized sad beep
            function playSadBeep() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(680, ctx.currentTime);
                g.gain.setValueAtTime(0.0001, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
                o.connect(g).connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.55);
            }

            // Helper: choose readable contrast color (black or white) for a background hex color
            function getContrastColor(hex) {
                if (!hex) return '#000000';
                // strip # if present
                const h = hex.replace('#', '');
                const r = parseInt(h.substring(0,2),16);
                const g = parseInt(h.substring(2,4),16);
                const b = parseInt(h.substring(4,6),16);
                // Perceived luminance
                const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
                return luminance > 0.6 ? '#000000' : '#FFFFFF';
            }

            // --- CANVAS DRAWING UTILITIES ---
            function getDrawingMetrics(c, gridW, gridH) {
                const axisPadding = { top: 30, right: 30, bottom: 70, left: 70 };
                const canvasWidth = c.canvas.width;
                const canvasHeight = c.canvas.height;
                if (canvasWidth === 0 || canvasHeight === 0) {
                    return { cellS: 20, radius: 7, originX: 70, originY: 130, gridW, gridH };
                }
                const gridWidth = canvasWidth - axisPadding.left - axisPadding.right;
                const gridHeight = canvasHeight - axisPadding.top - axisPadding.bottom;
                const cellS_W = gridWidth / gridW;
                const cellS_H = gridHeight / gridH;
                const cellS = Math.min(cellS_W, cellS_H);
                const radius = (cellS * 0.7) / 2;
                const originX = axisPadding.left;
                const originY = c.canvas.height - axisPadding.bottom;
                return { cellS, radius, originX, originY, gridW, gridH };
            }

            function getCircleCenter(x, y, cellS, originX, originY) {
                const cx = originX + (x + 0.5) * cellS;
                const cy = originY - (y + 0.5) * cellS;
                return { cx, cy };
            }

            function drawAxes(c, metrics) {
                const { cellS, originX, originY, gridW, gridH } = metrics;
                // Theme: both axes and grid lines share the same color
                const axisColor = '#0f9ed5'; // axis stroke color (Ox and Oy)
                const axisWidth = 8;
                const arrowheadSize = 20;
                const gridLineColor = '#0f9ed5'; // grid line color matches axis

                // Number colors: X-axis numbers blue, Y-axis numbers red, corner zero black
                const xNumberColor = '#0f9ed5';
                const yNumberColor = '#ff0000';
                const cornerZeroColor = '#000000';

                const gridWidth = gridW * cellS;
                const gridHeight = gridH * cellS;

                // --- Draw Grid Lines ---
                c.strokeStyle = gridLineColor;
                c.lineWidth = 4;
                for (let x = 0; x < gridW; x++) {
                    const lineX = originX + (x + 0.5) * cellS;
                    c.beginPath();
                    c.moveTo(lineX, originY);
                    c.lineTo(lineX, originY - gridHeight);
                    c.stroke();
                }
                for (let y = 0; y < gridH; y++) {
                    const lineY = originY - (y + 0.5) * cellS;
                    c.beginPath();
                    c.moveTo(originX, lineY);
                    c.lineTo(originX + gridWidth, lineY);
                    c.stroke();
                }

                // --- Draw Numbers and Axes ---
                c.strokeStyle = axisColor;
                c.fillStyle = axisColor;
                c.lineWidth = axisWidth;

                // Dynamic font size: matches circle size (0.7 * cellS)
                const numberFontSize = cellS * 0.7;
                c.font = `bold ${numberFontSize}px sans-serif`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';

                // --- X-Axis Numbers (only x > 0) ---
                c.textBaseline = 'top';
                c.textAlign = 'center';
                for (let x = 1; x < gridW; x++) {
                    const cx = originX + (x + 0.5) * cellS;
                    const cy = originY + 10;
                    c.fillStyle = xNumberColor;
                    c.fillText(x, cx, cy);
                }

                // --- Y-Axis Numbers (only y > 0) ---
                c.textAlign = 'right';
                c.textBaseline = 'middle';
                for (let y = 1; y < gridH; y++) {
                    const cx = originX - 10;
                    const cy = originY - (y + 0.5) * cellS;
                    c.fillStyle = yNumberColor;
                    c.fillText(y, cx, cy);
                }

                // --- Single corner zero (0) ---
                c.fillStyle = cornerZeroColor;
                // place corner 0 just outside the axes intersection (left and below)
                const cornerX = originX - 10;
                const cornerY = originY + 10;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('0', cornerX, cornerY);
                
                // --- Draw Axes Lines ---
                const yAxisX = originX + (0.5 * cellS);
                const yAxisTop = originY - gridHeight - 10;
                const yAxisBottom = originY;
                c.beginPath();
                c.moveTo(yAxisX, yAxisBottom);
                c.lineTo(yAxisX, yAxisTop);
                c.stroke();
                c.beginPath();
                c.moveTo(yAxisX, yAxisTop - arrowheadSize);
                c.lineTo(yAxisX - arrowheadSize / 2, yAxisTop);
                c.lineTo(yAxisX + arrowheadSize / 2, yAxisTop);
                c.closePath();
                // ensure arrowhead fills use the axis color (blue)
                c.fillStyle = axisColor;
                c.fill();

                const xAxisY = originY - (0.5 * cellS);
                const xAxisLeft = originX;
                const xAxisRight = originX + gridWidth + 10;
                c.beginPath();
                c.moveTo(xAxisLeft, xAxisY);
                c.lineTo(xAxisRight, xAxisY);
                c.stroke();
                c.beginPath();
                c.moveTo(xAxisRight + arrowheadSize, xAxisY);
                c.lineTo(xAxisRight, xAxisY - arrowheadSize / 2);
                c.lineTo(xAxisRight, xAxisY + arrowheadSize / 2);
                c.closePath();
                // ensure arrowhead fills use the axis color (blue)
                c.fillStyle = axisColor;
                c.fill();
            }

            function drawCircle(c, x, y, radius, color, isFill = true) {
                c.beginPath();
                c.arc(x, y, radius, 0, Math.PI * 2);
                if (isFill) {
                    c.fillStyle = color;
                    c.fill();
                } else {
                    c.strokeStyle = color;
                    c.lineWidth = 2;
                    c.stroke();
                }
            }

            function drawStar(c, x, y, radius) {
                const fontSize = radius * 1.5;
                c.font = `${fontSize}px Arial`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('⭐', x, y);
            }

            function drawQuestionMark(c, x, y, radius) {
                const fontSize = radius * 1.3;
                c.font = `${fontSize}px Arial`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText('❓', x, y);
            }

            // --- GAME LOGIC ---

            function drawGameBoard() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const metrics = getDrawingMetrics(ctx, gridSize.x, gridSize.y);
                const { cellS, radius, originX, originY } = metrics;

                drawAxes(ctx, metrics);

                if (gameState === 'PLACEMENT') {
                    const currentTeam = teams[currentPlacingTeamIndex];
                    for (let y = 0; y < gridSize.y; y++) {
                        for (let x = 0; x < gridSize.x; x++) {
                            const { cx, cy } = getCircleCenter(x, y, cellS, originX, originY);
                            const cell = board[y][x];
                            
                            if (cell.teamId === currentTeam.id) {
                                drawCircle(ctx, cx, cy, radius, currentTeam.color);
                                if (cell.isCommander) {
                                    drawStar(ctx, cx, cy, radius);
                                }
                            } else if (cell.teamId !== null) {
                                drawCircle(ctx, cx, cy, radius, GRID_COLOR_EMPTY, true);
                            } else if (isAvailableForPlacing(x, y, currentTeam.id)) {
                                drawCircle(ctx, cx, cy, radius, GRID_COLOR_EMPTY);
                            } else {
                                drawCircle(ctx, cx, cy, radius, GRID_COLOR_EMPTY, true);
                            }

                            // Draw hover effect
                            if (hoveredCell.x === x && hoveredCell.y === y) {
                                ctx.strokeStyle = '#000000';
                                ctx.lineWidth = 4;
                                ctx.beginPath();
                                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                                ctx.stroke();
                            }
                        }
                    }
                } else if (gameState === 'GAME' || gameState === 'GAME_OVER') {
                    for (let y = 0; y < gridSize.y; y++) {
                        for (let x = 0; x < gridSize.x; x++) {
                            const { cx, cy } = getCircleCenter(x, y, cellS, originX, originY);
                            const cell = board[y][x];

                            if (revealAll) {
                                if (cell.teamId !== null) {
                                    const team = teams.find(t => t.id === cell.teamId);
                                    drawCircle(ctx, cx, cy, radius, team.color, true);
                                    if (cell.isCommander) {
                                        drawStar(ctx, cx, cy, radius);
                                    }
                                } else {
                                    drawCircle(ctx, cx, cy, radius, GRID_COLOR_MISS, true);
                                }
                            } else {
                                if (cell.revealed) {
                                    if (cell.hitShipColor) {
                                        drawCircle(ctx, cx, cy, radius, cell.hitShipColor, true);
                                        if (cell.isCommander) {
                                            drawStar(ctx, cx, cy, radius);
                                        }
                                    } else {
                                        drawCircle(ctx, cx, cy, radius, GRID_COLOR_MISS, true);
                                    }
                                } else {
                                    drawCircle(ctx, cx, cy, radius, GRID_COLOR_UNREVEALED);
                                    drawQuestionMark(ctx, cx, cy, radius);
                                }
                            }

                            // Draw hover effect (only in GAME state)
                            if (gameState ==='GAME' && hoveredCell.x === x && hoveredCell.y === y) {
                                ctx.strokeStyle = '#000000';
                                ctx.lineWidth = 4;
                                ctx.beginPath();
                                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            function resizeAndDrawGame() {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                if (canvas.width !== rect.width || canvas.height !== rect.height) {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                }
                drawGameBoard();
            }

            function drawGridSetupBoard() {
                const container = setupCanvas.parentElement;
                const rect = container.getBoundingClientRect();
                if (setupCanvas.width !== rect.width || setupCanvas.height !== rect.height) {
                    setupCanvas.width = rect.width;
                    setupCanvas.height = rect.height;
                }
                const metrics = getDrawingMetrics(setupCtx, gridSize.x, gridSize.y);
                const { cellS, radius, originX, originY } = metrics;

                setupCtx.clearRect(0, 0, setupCanvas.width, setupCanvas.height);
                drawAxes(setupCtx, metrics);
                
                for (let y = 0; y < gridSize.y; y++) {
                    for (let x = 0; x < gridSize.x; x++) {
                        const { cx, cy } = getCircleCenter(x, y, cellS, originX, originY);
                        drawCircle(setupCtx, cx, cy, radius, GRID_COLOR_EMPTY);
                    }
                }
            }
            
            function setGameState(newState) {
                gameState = newState;
                Object.values(screens).forEach(screen => screen.classList.add('hidden'));

                switch (gameState) {
                    case 'TEAM_SETUP':
                        screens.teamSetup.classList.remove('hidden');
                        break;
                    case 'GRID_SETUP':
                        screens.gridSetup.classList.remove('hidden');
                        setTimeout(drawGridSetupBoard, 0);
                        break;
                    case 'PLACEMENT':
                        screens.game.classList.remove('hidden');
                        nextBtn.classList.remove('hidden');
                        startGameBtn.classList.add('hidden');
                        endGameBtn.classList.add('hidden');
                        revealAllBtn.classList.add('hidden');
                        newGameBtn.classList.add('hidden');
                        menuBtnGame.classList.add('hidden');
                        updateTurnInfo();
                        updateScoreboard();
                        setTimeout(resizeAndDrawGame, 0);
                        break;
                    case 'GAME':
                        screens.game.classList.remove('hidden');
                        nextBtn.classList.add('hidden');
                        startGameBtn.classList.add('hidden');
                        endGameBtn.classList.remove('hidden');
                        revealAllBtn.classList.remove('hidden');
                        newGameBtn.classList.add('hidden');
                        menuBtnGame.classList.add('hidden');
                        isExtraTurn = false;
                        updateTurnInfo();
                        setTimeout(resizeAndDrawGame, 0);
                        break;
                    case 'GAME_OVER':
                        screens.game.classList.remove('hidden');
                        nextBtn.classList.add('hidden');
                        startGameBtn.classList.add('hidden');
                        endGameBtn.classList.add('hidden');
                        revealAllBtn.classList.add('hidden');
                        newGameBtn.classList.remove('hidden');
                        menuBtnGame.classList.remove('hidden');
                        // Do NOT call updateTurnInfo() here — winner text will set color
                        setTimeout(resizeAndDrawGame, 0);
                        break;
                }
            }

            function handleTeamSetup() {
                // If circles have assigned colors, derive teams from unique circle colors (in order of first occurrence)
                extraTurnEnabled = extraTurnToggle.checked;
                teams = [];
                const unique = [];
                circleState.forEach(ci => {
                    if (ci === null || unique.includes(ci)) return;
                    unique.push(ci);
                });
                if (unique.length > 0) {
                    unique.forEach((ci, idx) => {
                        const colorObj = TEAM_COLORS[ci];
                        teams.push({ id: idx + 1, ...colorObj, ships: [], score: 0 });
                    });
                } else {
                    // fallback to select value
                    const numTeams = parseInt(teamCountSelect.value) || 1;
                    for (let i = 0; i < numTeams; i++) {
                        teams.push({ id: i + 1, ...TEAM_COLORS[i], ships: [], score: 0 });
                    }
                }
                // apply language to team labels immediately
                updateScoreboard();
                setGameState('GRID_SETUP');
            }

            function handleGridAdjust(change) {
                let newSize = gridSize.x + change;
                if (newSize >= 5 && newSize <= 20) {
                    gridSize = { x: newSize, y: newSize };
                    gridSizeDisplay.textContent = `${newSize} x ${newSize}`;
                    drawGridSetupBoard();
                }
            }

            function handleGridConfirm() {
                board = [];
                for (let y = 0; y < gridSize.y; y++) {
                    const row = [];
                    for (let x = 0; x < gridSize.x; x++) {
                        row.push({
                            x, y,
                            teamId: null,
                            isCommander: false,
                            revealed: false,
                            hitShipColor: null,
                            miss: false,
                        });
                    }
                    board.push(row);
                }
                currentPlacingTeamIndex = 0;
                setGameState('PLACEMENT');
            }

            function isAvailableForPlacing(x, y, placingTeamId) {
                if (x < 0 || x >= gridSize.x || y < 0 || y >= gridSize.y) return false;
                const cell = board[y][x];
                if (cell.teamId !== null && cell.teamId !== placingTeamId) return false;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < gridSize.x && ny >= 0 && ny < gridSize.y) {
                            const neighborTeamId = board[ny][nx].teamId;
                            if (neighborTeamId !== null && neighborTeamId !== placingTeamId) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }

            function placeShip(x, y) {
                if (x < 0 || x >= gridSize.x || y < 0 || y >= gridSize.y) return;
                const currentTeam = teams[currentPlacingTeamIndex];
                const cell = board[y][x];
                
                if (cell.teamId === currentTeam.id) {
                    if (!cell.isCommander) {
                        cell.isCommander = true;
                        const shipIndex = currentTeam.ships.findIndex(s => s.x === x && s.y === y);
                        if (shipIndex !== -1) {
                            currentTeam.ships[shipIndex].isCommander = true;
                        }
                        showMessage(t('promoted'));
                    } else {
                        cell.teamId = null;
                        cell.isCommander = false;
                        currentTeam.ships = currentTeam.ships.filter(s => !(s.x === x && s.y === y));
                        showMessage(t('ship_removed'));
                    }
                    resizeAndDrawGame();
                    return;
                }
                
                if (isAvailableForPlacing(x, y, currentTeam.id)) {
                    cell.teamId = currentTeam.id;
                    cell.isCommander = false;
                    currentTeam.ships.push({ x, y, isCommander: false });
                    showMessage(t('ship_placed'));
                    resizeAndDrawGame();
                } else {
                    showMessage(t('cant_place'));
                }
            }

            // --- NEW: Check for last team standing (with bonus) ---
            function checkLastTeamStanding() {
                // If only one team in the game, don't treat them as "last team standing" immediately.
                // This allows single-player mode to continue until all ships are revealed or the player ends the game.
                if (teams.length <= 1) return false;

                const activeTeamIds = new Set();
                for (let y = 0; y < gridSize.y; y++) {
                    for (let x = 0; x < gridSize.x; x++) {
                        const cell = board[y][x];
                        if (cell.teamId !== null && !cell.revealed) {
                            activeTeamIds.add(cell.teamId);
                        }
                    }
                }

                if (activeTeamIds.size === 1) {
                    const winnerId = Array.from(activeTeamIds)[0];
                    const winnerTeam = teams.find(t => t.id === winnerId);

                    // Award bonus points for all surviving ships
                    for (let y = 0; y < gridSize.y; y++) {
                        for (let x = 0; x < gridSize.x; x++) {
                            const cell = board[y][x];
                            if (cell.teamId === winnerId && !cell.revealed) {
                                const bonus = cell.isCommander ? 3 : 1;
                                winnerTeam.score += bonus;
                            }
                        }
                    }

                    updateScoreboard();
                    revealAll = true;
                    setGameState('GAME_OVER');
                    showFinalWinnerMessage();
                    showMessage(t('victory_bonus', { team: getTeamLabel(winnerTeam) }));
                    return true;
                }
                return false;
            }

            // --- Centralized winner calculation ---
            function showFinalWinnerMessage() {
                let maxScore = -Infinity;
                let winners = [];

                teams.forEach(team => {
                    if (team.score > maxScore) {
                        maxScore = team.score;
                        winners = [team];
                    } else if (team.score === maxScore) {
                        winners.push(team);
                    }
                });

                if (winners.length > 1) {
                    // For tie: use neutral color (black)
                    const names = winners.map(t => getTeamLabel(t)).join(', ');
                    turnInfo.textContent = t('tie_message', { teams: names });
                    turnInfo.style.color = '#000000';
                } else {
                    // Single winner: use their team color
                    const winner = winners[0];
                    turnInfo.textContent = t('game_over_win', { team: getTeamLabel(winner) });
                    turnInfo.style.color = winner.color;
                }
            }

            function checkGameOver() {
                let totalShips = 0, revealedShips = 0;
                for (let y = 0; y < gridSize.y; y++) {
                    for (let x = 0; x < gridSize.x; x++) {
                        const cell = board[y][x];
                        if (cell.teamId !== null) {
                            totalShips++;
                            if (cell.revealed) revealedShips++;
                        }
                    }
                }

                // 1. All ships revealed → end with no bonus
                if (totalShips > 0 && revealedShips === totalShips) {
                    revealAll = true;
                    setGameState('GAME_OVER');
                    showFinalWinnerMessage();
                    showMessage(t('all_revealed'));
                    return;
                }

                // 2. Last team standing → bonus applied
                if (checkLastTeamStanding()) {
                    return;
                }
            }

            function makeGuess(x, y) {
                if (x < 0 || x >= gridSize.x || y < 0 || y >= gridSize.y) return;
                const cell = board[y][x];
                if (cell.revealed) {
                    showMessage(t('already_revealed'));
                    return;
                }

                cell.revealed = true;
                const currentPlayer = teams[currentPlayerIndex];
                const hitTeamId = cell.teamId;

                if (hitTeamId !== null) {
                    const hitTeam = teams.find(t => t.id === hitTeamId);
                    cell.hitShipColor = hitTeam.color;
                    const pointValue = cell.isCommander ? 3 : 1;

                    if (hitTeamId === currentPlayer.id) {
                        const shipType = cell.isCommander ? (currentLang === 'vi' ? 'Chỉ huy' : 'Commander ship') : (currentLang === 'vi' ? 'tàu' : 'ship');
                        if (teams.length === 1) {
                            // Single-team mode: reward player instead of penalize
                            currentPlayer.score += pointValue;
                            showMessage(t('hit_own_single', { player: currentPlayer.name, shipType: shipType, points: pointValue }));
                        } else {
                            currentPlayer.score -= pointValue;
                            showMessage(t('hit_own', { player: currentPlayer.name, shipType: shipType, points: pointValue }));
                        }
                        isExtraTurn = false;
                        nextTurn();
                        // show explosion even for self-hit (can be changed)
                        showFeedback('hit');
                        playExplosion();
                    } else {
                        currentPlayer.score += pointValue;
                        const shipType = cell.isCommander ? (currentLang === 'vi' ? 'Chỉ huy' : 'Commander ship') : (currentLang === 'vi' ? 'tàu' : 'ship');
                        const extraMsg = extraTurnEnabled ? t('already_playing') : '';
                        showMessage(t('hit_enemy', { player: currentPlayer.name, team: getTeamLabel(hitTeam), shipType: shipType, points: pointValue, extra: extraMsg }));
                        if (extraTurnEnabled) {
                            isExtraTurn = true;
                            updateTurnInfo();
                            showFeedback('hit');
                            playExplosion();
                        } else {
                            showFeedback('hit');
                            playExplosion();
                            nextTurn();
                        }
                    }
                } else {
                    cell.miss = true;
                    showMessage(t('miss'));
                    isExtraTurn = false;
                    nextTurn();
                    // miss feedback
                    showFeedback('miss');
                    playSadBeep();
                }

                updateScoreboard();
                resizeAndDrawGame();
                checkGameOver();
            }

            function nextTurn() {
                isExtraTurn = false;
                currentPlayerIndex = (currentPlayerIndex + 1) % teams.length;
                updateTurnInfo();
            }

            function handleNextTeam() {
                currentPlacingTeamIndex++;
                if (currentPlacingTeamIndex >= teams.length) {
                    setGameState('GAME');
                } else {
                    if (currentPlacingTeamIndex === teams.length - 1) {
                        nextBtn.classList.add('hidden');
                        startGameBtn.classList.remove('hidden');
                    }
                    updateTurnInfo();
                    resizeAndDrawGame();
                }
            }
            
            function handleCanvasClick(event) {
                const rect = canvas.getBoundingClientRect();
                const canvasX = event.clientX - rect.left;
                const canvasY = event.clientY - rect.top;
                const { cellS, originX, originY } = getDrawingMetrics(ctx, gridSize.x, gridSize.y);
                const gridX = canvasX - originX;
                const gridY = originY - canvasY;
                const x = Math.floor(gridX / cellS);
                const y = Math.floor(gridY / cellS);

                if (gameState === 'PLACEMENT') {
                    placeShip(x, y);
                } else if (gameState === 'GAME') {
                    makeGuess(x, y);
                }
            }

            function handleEndGame() {
                // Award bonus for all unrevealed ships (all teams)
                for (let y = 0; y < gridSize.y; y++) {
                    for (let x = 0; x < gridSize.x; x++) {
                        const cell = board[y][x];
                        if (cell.teamId !== null && !cell.revealed) {
                            const team = teams.find(t => t.id === cell.teamId);
                            const bonus = cell.isCommander ? 3 : 1;
                            team.score += bonus;
                        }
                    }
                }
                updateScoreboard();
                revealAll = true;
                setGameState('GAME_OVER');
                showFinalWinnerMessage();
                showMessage("Bonus points awarded to all surviving ships!");
            }

            function handleRevealAll() {
                revealAll = true;
                setGameState('GAME_OVER');
                showFinalWinnerMessage();
                showMessage("All ships revealed! No survival bonus.");
            }

            function handleNewGame() {
                teams = [];
                board = [];
                currentPlacingTeamIndex = 0;
                currentPlayerIndex = 0;
                revealAll = false;
                isExtraTurn = false;
                gridSize = { x: 5, y: 5 };
                gridSizeDisplay.textContent = '5 x 5';
                extraTurnToggle.checked = false;
                setGameState('TEAM_SETUP');
            }

            function handleBackToMenu() {
                window.location.href = 'index.html';
            }

            // --- EVENT LISTENERS ---
            startSetupBtn.addEventListener('click', handleTeamSetup);
            decreaseGridBtn.addEventListener('click', () => handleGridAdjust(-1));
            increaseGridBtn.addEventListener('click', () => handleGridAdjust(1));
            confirmGridBtn.addEventListener('click', handleGridConfirm);
            // change select updates circles
            teamCountSelect.addEventListener('change', applySelectToCircles);
            window.addEventListener('resize', () => {
                if (gameState === 'GRID_SETUP') drawGridSetupBoard();
                if (gameState === 'PLACEMENT' || gameState === 'GAME' || gameState === 'GAME_OVER') {
                    resizeAndDrawGame();
                }
            });

            canvas.addEventListener('click', handleCanvasClick);

            canvas.addEventListener('mousemove', e => {
                if (gameState !== 'GAME' && gameState !== 'PLACEMENT') return;

                const rect = canvas.getBoundingClientRect();
                const canvasX = e.clientX - rect.left;
                const canvasY = e.clientY - rect.top;
                const { cellS, originX, originY } = getDrawingMetrics(ctx, gridSize.x, gridSize.y);

                const gridX = canvasX - originX;
                const gridY = originY - canvasY;
                const x = Math.floor(gridX / cellS);
                const y = Math.floor(gridY / cellS);

                mousePos = { x: canvasX, y: canvasY };

                if (x !== hoveredCell.x || y !== hoveredCell.y) {
                    if (x >= 0 && x < gridSize.x && y >= 0 && y < gridSize.y) {
                        hoveredCell = { x, y };
                    } else {
                        hoveredCell = { x: -1, y: -1 };
                    }
                    drawGameBoard();
                }
            });

            canvas.addEventListener('mouseout', () => {
                if (hoveredCell.x !== -1 || hoveredCell.y !== -1) {
                    hoveredCell = { x: -1, y: -1 };
                    drawGameBoard();
                }
            });

            nextBtn.addEventListener('click', handleNextTeam);
            startGameBtn.addEventListener('click', () => setGameState('GAME'));
            endGameBtn.addEventListener('click', handleEndGame);
            revealAllBtn.addEventListener('click', handleRevealAll);
            newGameBtn.addEventListener('click', handleNewGame);
            menuBtnSetup.addEventListener('click', handleBackToMenu);
            menuBtnGrid.addEventListener('click', handleBackToMenu);
            menuBtnGame.addEventListener('click', handleBackToMenu);

            // --- Windows 11 Style Hover Effect (delegated) ---
            document.body.addEventListener('mousemove', e => {
                const el = e.target.closest('.btn, .team-circle');
                if (el) {
                    const rect = el.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    el.style.setProperty('--x', `${x}px`);
                    el.style.setProperty('--y', `${y}px`);
                }
            });

            // --- INITIALIZE ---
            setGameState('TEAM_SETUP');
        });
    </script>
</body>

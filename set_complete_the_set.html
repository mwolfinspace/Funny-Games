<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SET Completion Game</title>
    <style>
      :root {
        --bg-color: #ecf0f1;
        --panel-bg: rgba(255, 255, 255, 0.9);
        --border-color: rgba(0, 0, 0, 0.12);
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg-color);
        min-height: 100vh;
        display: block;
        padding: 0;
        overflow: hidden;
        user-select: none;
      }

      .game-screen,
      .end-screen {
        display: none;
      }

      .game-screen.active,
      .end-screen.active {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .setup-group {
        margin-bottom: 25px;
      }
      .setup-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
        color: #555;
      }
      .color-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 10px;
      }
      .color-input {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .color-input input[type="color"] {
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .symbol-select {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 10px;
      }
      .symbol-option {
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .symbol-option:hover {
        border-color: #667eea;
      }
      .symbol-option.selected {
        border-color: #667eea;
        background: #667eea;
        color: white;
      }
      .orientation-select {
        display: flex;
        gap: 20px;
      }
      .orientation-option {
        padding: 15px 30px;
        border: 2px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .orientation-option:hover {
        border-color: #667eea;
      }
      .orientation-option.selected {
        border-color: #667eea;
        background: #667eea;
        color: white;
      }
      .setup-container {
        display: flex;
        gap: 30px;
      }
      .setup-left {
        flex: 1;
      }
      .setup-right {
        width: 350px;
        padding-left: 30px;
        border-left: 2px solid #eee;
      }
      .demo-area {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .demo-card {
        border: 2px solid #ccc;
        border-radius: 5px;
        width: 100px;
        height: 140px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .symbol-count {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
      }

      #game-viewport {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: grab;
      }

      #game-world {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 0 0;
      }

      .game-area {
        display: flex;
        flex-direction: column;
        gap: 40px; /* Increased gap */
        padding: 50px;
      }

      .top-zone {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 20px;
        background: transparent;
        border: none;
      }

      .bottom-zone-wrapper {
        background: transparent;
        border: none;
        padding: 0;
      }

      .floating-panel {
        position: fixed;
        backdrop-filter: blur(6px);
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
        border-radius: 12px;
        z-index: 10;
      }

      .bottom-controls {
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px;
        display: flex;
        gap: 12px;
      }

      .control-btn {
        padding: 10px 20px;
        background: #6c757d;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }
      .control-btn:hover {
        background: #5a6268;
      }
      .control-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #nextPuzzleBtn {
        background: #28a745;
      }
      #nextPuzzleBtn:hover {
        background: #218838;
      }

      .bottom-zone {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .card-wrapper {
        position: relative;
      }

      .card-label {
        position: absolute;
        top: 5px;
        left: 5px;
        background: #667eea;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 50px;
        z-index: 10;
      }

      .card {
        background: white;
        border: 3px solid #333;
        border-radius: 10px;
        padding: 15px;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        width: 180px;
        height: 250px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .card:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .card.horizontal {
        width: 250px;
        height: 180px;
      }
      .card-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .card.horizontal .card-content {
        flex-direction: row;
      }
      .shape {
        transition: all 0.3s;
      }

      .empty-slot {
        width: 180px;
        height: 250px;
        border: 5px dashed #aaa;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 100px;
        color: #ccc;
        background: rgba(255, 255, 255, 0.5);
      }
      .card.horizontal + .empty-slot {
        width: 250px;
        height: 180px;
      }

      .wrong-mark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 80px;
        color: red;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .wrong-mark.show {
        opacity: 1;
      }

      .history-panel {
        top: 12px;
        right: 12px;
        width: 280px;
        max-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
      }
      .history-panel h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #555;
      }
      #historySets {
        overflow-y: auto;
        padding: 4px;
      }
      .history-set {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
        padding: 5px;
        background: #eee;
        border-radius: 5px;
      }
      .history-card {
        width: 80px;
        height: 110px;
        border: 1px solid #999;
        border-radius: 5px;
        background: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        padding: 4px;
      }
      .history-set.horizontal .history-card {
        width: 110px;
        height: 80px;
        flex-direction: row;
      }

      #scoreboard {
        top: 12px;
        left: 12px;
        padding: 10px 15px;
        font-size: 18px;
        font-weight: bold;
        color: #1e88e5;
        background-color: var(--panel-bg);
      }

      .end-screen {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        gap: 20px;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
      }
      .end-screen.active {
        display: flex;
      }
      .end-screen-content {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .end-screen-icon {
        font-size: 100px;
        animation: icon-pop 0.5s ease-out;
      }
      #end-compliment {
        font-size: 48px;
        color: #667eea;
        font-weight: bold;
      }
      .stats {
        text-align: center;
        font-size: 22px;
        color: #555;
        line-height: 1.6;
        margin: 0;
      }
      .percentage {
        font-size: 32px;
        font-weight: bold;
        color: #333;
      }

      @keyframes icon-pop {
        0% {
          transform: scale(0);
        }
        80% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        opacity: 0.7;
        z-index: 101;
      }
      .restart-btn {
        padding: 15px 30px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
      }
      .restart-btn:hover {
        background: #5568d3;
      }

      .utility-controls {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        gap: 8px;
      }
      .utility-btn {
        background-color: var(--panel-bg);
        color: #333;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--border-color);
        font-size: 24px;
        cursor: pointer;
      }
      .utility-btn:hover {
        background-color: #e9ecef;
      }

      #settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #settings-popup {
        background: var(--panel-bg);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        width: min(1000px, 94vw);
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      #settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color);
      }
      #settings-header h2 {
        margin: 0;
        font-size: 1.25rem;
      }
      #settingsCloseBtn {
        font-size: 2rem;
        font-weight: 300;
        line-height: 1;
        background: transparent;
        border: none;
        color: #7f8c8d;
        cursor: pointer;
      }
      #settings-content {
        padding: 20px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="utility-controls">
      <a class="utility-btn" href="index.html" title="Go to Home">🏠</a>
      <button class="utility-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>

    <div id="settings-overlay">
      <div id="settings-popup">
        <div id="settings-header">
          <h2>Game Settings</h2>
          <button id="settingsCloseBtn">&times;</button>
        </div>
        <div id="settings-content">
          <div class="setup-container">
            <div class="setup-left">
              <div class="setup-group">
                <label>Choose 3 Colors:</label>
                <div class="color-inputs">
                  <div class="color-input">
                    <input type="color" id="color1" value="#FF0000" /><span
                      >Color 1</span
                    >
                  </div>
                  <div class="color-input">
                    <input type="color" id="color2" value="#00FF00" /><span
                      >Color 2</span
                    >
                  </div>
                  <div class="color-input">
                    <input type="color" id="color3" value="#0000FF" /><span
                      >Color 3</span
                    >
                  </div>
                </div>
              </div>
              <div class="setup-group">
                <label>Card Background Color:</label
                ><input type="color" id="cardBg" value="#FFFFFF" />
              </div>
              <div class="setup-group">
                <label>Choose 3 Symbols:</label>
                <div class="symbol-select">
                  <div class="symbol-option selected" data-symbol="diamond">
                    <div></div>
                    <span>Diamond</span>
                  </div>
                  <div class="symbol-option selected" data-symbol="circle">
                    <div></div>
                    <span>Circle</span>
                  </div>
                  <div class="symbol-option selected" data-symbol="pill">
                    <div></div>
                    <span>Pill</span>
                  </div>
                  <div class="symbol-option" data-symbol="wave">
                    <div></div>
                    <span>Wave</span>
                  </div>
                  <div class="symbol-option" data-symbol="triangle">
                    <div></div>
                    <span>Triangle</span>
                  </div>
                  <div class="symbol-option" data-symbol="square">
                    <div></div>
                    <span>Square</span>
                  </div>
                  <div class="symbol-option" data-symbol="star">
                    <div></div>
                    <span>Star</span>
                  </div>
                </div>
                <div class="symbol-count">Selected: 3 symbols</div>
              </div>
              <div class="setup-group">
                <label>Card Orientation:</label>
                <div class="orientation-select">
                  <div
                    class="orientation-option selected"
                    data-orientation="vertical"
                  >
                    Vertical
                  </div>
                  <div class="orientation-option" data-orientation="horizontal">
                    Horizontal
                  </div>
                </div>
              </div>
              <div class="setup-group">
                <label>Answer Label Style:</label>
                <select
                  id="labelStyle"
                  style="
                    width: 100%;
                    padding: 10px;
                    border: 2px solid #ddd;
                    border-radius: 8px;
                  "
                >
                  <option value="numbers">Numbers (1, 2, 3..)</option>
                  <option value="letters" selected>Letters (A, B, C..)</option>
                </select>
              </div>
            </div>
            <div class="setup-right">
              <label>Live Preview</label>
              <div class="demo-area" id="demoArea"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="game-screen">
      <div id="game-viewport">
        <div id="game-world">
          <div class="game-area">
            <div class="top-zone" id="topZone"></div>
            <div class="bottom-zone-wrapper">
              <div class="bottom-zone" id="bottomZone"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="scoreboard" class="floating-panel"></div>
      <div class="history-panel floating-panel" id="historyPanel">
        <h2>History</h2>
        <div id="historySets"></div>
      </div>
      <div class="bottom-controls floating-panel">
        <button class="control-btn" id="removeBtn" onclick="removeCard()">
          − Remove Choice
        </button>
        <button class="control-btn" id="addBtn" onclick="addCard()">
          + Add Choice
        </button>
        <button
          class="control-btn"
          id="nextPuzzleBtn"
          onclick="nextPuzzle()"
          style="display: none"
        >
          Next Puzzle →
        </button>
      </div>
    </div>
    <div class="end-screen">
      <div class="end-screen-content">
        <div class="end-screen-icon"></div>
        <h2 id="end-compliment"></h2>
        <div class="stats" id="stats"></div>
        <div class="percentage" id="percentage"></div>
        <button class="restart-btn" onclick="location.reload()">
          Play Again
        </button>
      </div>
    </div>

    <audio id="correctSound" src="kid_yeah.wav" preload="auto"></audio>
    <audio id="wrongSound" src="Ohh.wav" preload="auto"></audio>

    <script>
      let settings = {};
      let deck = [];
      let score = 0;
      let mistakes = 0;
      let puzzleCards = [];
      let correctCard = null;
      let completedSets = [];
      let bottomCardCount = 4;
      let puzzleSolved = false;

      const symbolNames = {
        diamond: "Diamond",
        circle: "Circle",
        pill: "Pill",
        wave: "Wave",
        triangle: "Triangle",
        square: "Square",
        star: "Star",
      };
      const correctSound = document.getElementById("correctSound");
      const wrongSound = document.getElementById("wrongSound");
      const SETTINGS_KEY = "set-complete-the-set-settings-v1";

      const camera = { x: 0, y: 0, zoom: 1 };
      const interaction = { panning: false, start: { x: 0, y: 0 } };
      let gameViewport = null;
      let gameWorld = null;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updateWorldTransform() {
        if (!gameWorld) return;
        gameWorld.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.zoom})`;
      }

      function handleMouseDown(e) {
        if (e.button === 1 || e.button === 2 || (e.button === 0 && e.ctrlKey)) {
          e.preventDefault();
        }
        const target = e.target;
        if (
          target.closest(".card") ||
          target.closest(".floating-panel") ||
          target.closest("a") ||
          target.closest("button")
        )
          return;

        if (e.button === 1 || e.button === 2 || (e.button === 0 && e.ctrlKey)) {
          interaction.panning = true;
          interaction.start.x = e.clientX - camera.x;
          interaction.start.y = e.clientY - camera.y;
          gameViewport.style.cursor = "grabbing";
        }
      }

      function handleMouseUp(e) {
        if (interaction.panning) {
          interaction.panning = false;
          gameViewport.style.cursor = "grab";
        }
      }

      function handleMouseMove(e) {
        if (interaction.panning) {
          e.preventDefault();
          camera.x = e.clientX - interaction.start.x;
          camera.y = e.clientY - interaction.start.y;
          updateWorldTransform();
        }
      }

      function handleWheel(e) {
        if (
          e.target.closest(".history-panel") ||
          e.target.closest("#settings-popup")
        )
          return;
        e.preventDefault();
        const zoomSpeed = 0.1;
        const minZoom = 0.2;
        const maxZoom = 3;
        const rect = gameViewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const zoomFactor = 1 - e.deltaY * 0.01 * zoomSpeed;
        const newZoom = clamp(camera.zoom * zoomFactor, minZoom, maxZoom);
        camera.x = mouseX - (mouseX - camera.x) * (newZoom / camera.zoom);
        camera.y = mouseY - (mouseY - camera.y) * (newZoom / camera.zoom);
        camera.zoom = newZoom;
        updateWorldTransform();
      }

      // --- SETTINGS ---
      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      function loadSettings() {
        const saved = localStorage.getItem(SETTINGS_KEY);
        const defaultSettings = {
          colors: ["#FF0000", "#00FF00", "#0000FF"],
          cardBg: "#FFFFFF",
          symbols: ["diamond", "circle", "pill"],
          orientation: "vertical",
          labelStyle: "letters",
        };
        settings = saved
          ? { ...defaultSettings, ...JSON.parse(saved) }
          : defaultSettings;
      }

      function redrawAll() {
        updateTopZone();
        updateBottomZone();
        updateHistory();
        updateSymbolOptions();
        updateDemo();
      }

      function initSettingsHandlers() {
        document.getElementById("settingsBtn").addEventListener("click", () => {
          document.getElementById("settings-overlay").style.display = "flex";
          updateSettingsUI();
          updateSymbolOptions();
        });
        document
          .getElementById("settingsCloseBtn")
          .addEventListener("click", () => {
            document.getElementById("settings-overlay").style.display = "none";
          });
        document
          .getElementById("settings-overlay")
          .addEventListener("click", (e) => {
            if (e.target.id === "settings-overlay") {
              document.getElementById("settings-overlay").style.display =
                "none";
            }
          });

        document.getElementById("color1").addEventListener("input", (e) => {
          settings.colors[0] = e.target.value;
          saveSettings();
          redrawAll();
        });
        document.getElementById("color2").addEventListener("input", (e) => {
          settings.colors[1] = e.target.value;
          saveSettings();
          redrawAll();
        });
        document.getElementById("color3").addEventListener("input", (e) => {
          settings.colors[2] = e.target.value;
          saveSettings();
          redrawAll();
        });
        document.getElementById("cardBg").addEventListener("input", (e) => {
          settings.cardBg = e.target.value;
          saveSettings();
          redrawAll();
        });
        document
          .getElementById("labelStyle")
          .addEventListener("change", (e) => {
            settings.labelStyle = e.target.value;
            saveSettings();
            redrawAll();
          });

        document
          .querySelectorAll("#settings-popup .symbol-option")
          .forEach((opt) => {
            opt.addEventListener("click", function () {
              const selectedSymbol = this.dataset.symbol;
              const isSelected = settings.symbols.includes(selectedSymbol);
              if (isSelected) {
                if (settings.symbols.length > 1) {
                  settings.symbols = settings.symbols.filter(
                    (s) => s !== selectedSymbol,
                  );
                }
              } else {
                if (settings.symbols.length < 3) {
                  settings.symbols.push(selectedSymbol);
                }
              }
              if (settings.symbols.length === 3) {
                saveSettings();
                redrawAll();
              }
              updateSettingsUI();
            });
          });

        document
          .querySelectorAll("#settings-popup .orientation-option")
          .forEach((opt) => {
            opt.addEventListener("click", function () {
              settings.orientation = this.dataset.orientation;
              saveSettings();
              redrawAll();
              updateSettingsUI();
            });
          });
      }

      function updateSettingsUI() {
        document.getElementById("color1").value = settings.colors[0];
        document.getElementById("color2").value = settings.colors[1];
        document.getElementById("color3").value = settings.colors[2];
        document.getElementById("cardBg").value = settings.cardBg;
        document.getElementById("labelStyle").value = settings.labelStyle;

        document
          .querySelectorAll("#settings-popup .symbol-option")
          .forEach((opt) => {
            opt.classList.toggle(
              "selected",
              settings.symbols.includes(opt.dataset.symbol),
            );
          });
        document.querySelector("#settings-popup .symbol-count").textContent =
          `Selected: ${settings.symbols.length} of 3 symbols`;

        document
          .querySelectorAll("#settings-popup .orientation-option")
          .forEach((opt) => {
            opt.classList.toggle(
              "selected",
              settings.orientation === opt.dataset.orientation,
            );
          });
        updateDemo();
      }

      function updateSymbolOptions() {
        document.querySelectorAll(".symbol-option").forEach((opt) => {
          const symbol = opt.dataset.symbol;
          const svgContainer = opt.querySelector("div");
          svgContainer.innerHTML = "";
          svgContainer.appendChild(drawShape(symbol, "#333", "solid", 40));
        });
      }

      function updateDemo() {
        const demoArea = document.getElementById("demoArea");
        if (!demoArea) return;
        demoArea.innerHTML = "";

        const shadings = ["solid", "striped", "outline"];
        const orientation = settings.orientation;

        for (let i = 0; i < 9; i++) {
          const cardEl = document.createElement("div");
          cardEl.className = "demo-card";
          cardEl.style.background = settings.cardBg;
          if (orientation === "horizontal") {
            cardEl.style.height = "100px";
            cardEl.style.width = "140px";
          }
          const cardContent = document.createElement("div");
          cardContent.className = "card-content";
          const symbol = settings.symbols[i % settings.symbols.length];
          const color =
            settings.colors[Math.floor(i / 3) % settings.colors.length];
          const shading = shadings[i % shadings.length];
          const count = (i % 3) + 1;
          for (let j = 0; j < count; j++) {
            cardContent.appendChild(drawShape(symbol, color, shading, 20));
          }
          cardEl.appendChild(cardContent);
          demoArea.appendChild(cardEl);
        }
      }

      // --- GAME LOGIC ---
      function findSetInDeck(deck) {
        for (let i = 0; i < deck.length; i++) {
          for (let j = i + 1; j < deck.length; j++) {
            const c1 = deck[i];
            const c2 = deck[j];
            const required = getThirdCard(c1, c2);
            const foundIndex = deck.findIndex(
              (card, index) =>
                index > j &&
                card.count === required.count &&
                card.color === required.color &&
                card.shading === required.shading &&
                card.shape === required.shape,
            );
            if (foundIndex !== -1) return [c1, c2, deck[foundIndex]];
          }
        }
        return null;
      }

      function getThirdCard(c1, c2) {
        const getProp = (p, sum) =>
          c1[p] === c2[p] ? c1[p] : sum - c1[p] - c2[p];
        const getPropStr = (p) => {
          if (c1[p] === c2[p]) return c1[p];
          const props = ["solid", "striped", "outline"];
          return props.find((val) => val !== c1[p] && val !== c2[p]);
        };
        return {
          count: getProp("count", 6),
          color: getProp("color", 3),
          shading: getPropStr("shading"),
          shape: getProp("shape", 3),
        };
      }

      function generatePuzzle() {
        const set = findSetInDeck(deck);
        if (!set) {
          if (score > 20 || deck.length < 3) {
            endGame();
            return;
          }
        }

        set.forEach((c) => {
          const index = deck.findIndex(
            (dc) => JSON.stringify(dc) === JSON.stringify(c),
          );
          if (index > -1) deck.splice(index, 1);
        });

        for (let i = set.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [set[i], set[j]] = [set[j], set[i]];
        }

        puzzleCards = [set[0], set[1]];
        correctCard = set[2];
        puzzleSolved = false;

        updateTopZone();
        updateBottomZone();
        updateScoreboard();
        document.getElementById("nextPuzzleBtn").style.display = "none";
      }

      function handleCardClick(wrapper, cardEl, cardData) {
        if (puzzleSolved) return;

        if (JSON.stringify(cardData) === JSON.stringify(correctCard)) {
          score++;
          correctSound.play();
          puzzleSolved = true;
          puzzleCards.push(correctCard);
          updateTopZone();
          document.getElementById("nextPuzzleBtn").style.display =
            "inline-block";
          
          const bottomZone = document.getElementById("bottomZone");
          bottomZone.style.opacity = 0.5;

          const overlay = document.createElement("div");
          overlay.style.position = "absolute";
          overlay.style.top = "0";
          overlay.style.left = "0";
          overlay.style.width = "100%";
          overlay.style.height = "100%";
          overlay.style.cursor = "pointer";
          overlay.style.zIndex = "2";
          overlay.addEventListener("click", nextPuzzle);
          bottomZone.appendChild(overlay);
        } else {
          mistakes++;
          wrongSound.play();
          const wrongMark = cardEl.querySelector(".wrong-mark");
          wrongMark.classList.add("show");
          setTimeout(() => wrongMark.classList.remove("show"), 1000);
        }
        updateScoreboard();
      }

      function nextPuzzle() {
        if (!puzzleSolved) return;
        completedSets.push(puzzleCards);
        if (completedSets.length > 5) completedSets.shift();
        updateHistory();
        generatePuzzle();
      }

      function createDeck() {
        deck = [];
        const counts = [1, 2, 3];
        const colors = [0, 1, 2];
        const shadings = ["solid", "striped", "outline"];
        const shapes = [0, 1, 2];
        for (let count of counts)
          for (let color of colors)
            for (let shading of shadings)
              for (let shape of shapes) {
                deck.push({ count, color, shading, shape });
              }
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
      }

      function endGame() {
        document.querySelector(".game-screen").classList.remove("active");
        const endScreen = document.querySelector(".end-screen");
        endScreen.classList.add("active");

        createConfetti(endScreen);

        const total = score + mistakes;
        const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;

        let compliment = "";
        let icon = "🤔";

        if (accuracy === 100) {
          compliment = "You're a SET Master! Perfect Score!";
          icon = "🏆";
        } else if (accuracy >= 90) {
          compliment = "Outstanding!";
          icon = "🎉";
        } else if (accuracy >= 75) {
          compliment = "Great Job!";
          icon = "👍";
        } else if (accuracy >= 50) {
          compliment = "Good Effort!";
          icon = "😊";
        } else {
          compliment = "Keep Practicing!";
          icon = "💪";
        }

        endScreen.querySelector(".end-screen-content").innerHTML = `
                <div class="end-screen-icon">${icon}</div>
                <h2 id="end-compliment">${compliment}</h2>
                <div class="stats">Correct: ${score} | Mistakes: ${mistakes}</div>
                <div class="percentage">Accuracy: ${accuracy}%</div>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            `;
      }

      function restartGame() {
        score = 0;
        mistakes = 0;
        completedSets = [];
        puzzleCards = [];
        correctCard = null;
        puzzleSolved = false;
        deck = [];

        document.querySelectorAll('.confetti').forEach(el => el.remove());
        
        document.querySelector('.end-screen').classList.remove('active');
        document.querySelector('.game-screen').classList.add('active');

        updateHistory();
        
        createDeck();
        generatePuzzle();
      }

      function createConfetti(container) {
        const colors = settings.colors || ["#FF0000", "#00FF00", "#0000FF"];
        for (let i = 0; i < 150; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.top = -20 + Math.random() * 20 + "px";
          confetti.style.backgroundColor = colors[i % colors.length];
          confetti.style.transform = "rotate(" + Math.random() * 360 + "deg)";
          container.appendChild(confetti);
          animateConfetti(confetti);
        }
      }

      function animateConfetti(confetti) {
        const duration = 3000 + Math.random() * 2000;
        const x = Math.random() * 200 - 100;
        confetti.animate(
          [
            {
              transform: `translate(0, 0) rotate(${Math.random() * 360}deg)`,
              opacity: 1,
            },
            {
              transform: `translate(${x}px, ${window.innerHeight}px) rotate(${Math.random() * 720}deg)`,
              opacity: 0,
            },
          ],
          { duration, easing: "ease-out", fill: "forwards" },
        ).onfinish = () => confetti.remove();
      }

      function updateTopZone() {
        const topZone = document.getElementById("topZone");
        topZone.innerHTML = "";
        puzzleCards.forEach((cardData) =>
          topZone.appendChild(createCardElement(cardData, false)),
        );
        if (!puzzleSolved) {
          const emptySlot = document.createElement("div");
          emptySlot.className = "empty-slot";
          if (settings.orientation === "horizontal")
            emptySlot.style.height = "180px";
          emptySlot.textContent = "?";
          topZone.appendChild(emptySlot);
        }
      }

      function updateBottomZone() {
        const bottomZone = document.getElementById("bottomZone");
        bottomZone.innerHTML = "";
        bottomZone.style.opacity = 1;

        let answerChoices = [correctCard];
        let distractors = deck.filter(
          (c) => JSON.stringify(c) !== JSON.stringify(correctCard),
        );

        while (
          answerChoices.length < bottomCardCount &&
          distractors.length > 0
        ) {
          const randomIndex = Math.floor(Math.random() * distractors.length);
          answerChoices.push(distractors.splice(randomIndex, 1)[0]);
        }

        for (let i = answerChoices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [answerChoices[i], answerChoices[j]] = [
            answerChoices[j],
            answerChoices[i],
          ];
        }

        answerChoices.forEach((card, index) => {
          let label =
            settings.labelStyle === "numbers"
              ? index + 1
              : String.fromCharCode(65 + index);
          bottomZone.appendChild(createCardElement(card, true, label));
        });
        updateControls();
      }

      function getDynamicShapeSize(cardData, longDim, shortDim, padding, gap) {
        const availableLength = longDim - 2 * padding;
        const availableCross = shortDim - 2 * padding;

        let size = (availableLength - (cardData.count - 1) * gap) / cardData.count;
        size = Math.min(size, availableCross);
        return Math.floor(size);
      }

      function createCardElement(cardData, isClickable, label = "") {
        const wrapper = document.createElement("div");
        wrapper.className = "card-wrapper";

        if (label) {
          const labelEl = document.createElement("div");
          labelEl.className = "card-label";
          labelEl.textContent = label;
          wrapper.appendChild(labelEl);
        }

        const card = document.createElement("div");
        card.className = "card";
        if (settings.orientation === "horizontal")
          card.classList.add("horizontal");
        card.style.background = settings.cardBg;

        const content = document.createElement("div");
        content.className = "card-content";
        const color = settings.colors[cardData.color];
        const symbol = settings.symbols[cardData.shape];
        
        const size = getDynamicShapeSize(cardData, 250, 180, 15, 10);

        for (let i = 0; i < cardData.count; i++) {
          content.appendChild(drawShape(symbol, color, cardData.shading, size));
        }
        card.appendChild(content);

        const wrongMark = document.createElement("div");
        wrongMark.className = "wrong-mark";
        wrongMark.textContent = "✗";
        card.appendChild(wrongMark);

        if (isClickable)
          card.addEventListener("click", () =>
            handleCardClick(wrapper, card, cardData),
          );
        wrapper.appendChild(card);
        return wrapper;
      }

      function drawShape(symbol, color, shading, size = 30) {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.classList.add("shape");
        let shape;
        const fillColor = shading === "solid" ? color : "none";
        const strokeColor = color;
        const strokeWidth = 4;
        switch (symbol) {
          case "circle":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            shape.setAttribute("cx", size / 2);
            shape.setAttribute("cy", size / 2);
            shape.setAttribute("r", size / 2 - 2);
            break;
          case "square":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect",
            );
            shape.setAttribute("x", 2);
            shape.setAttribute("y", 2);
            shape.setAttribute("width", size - 4);
            shape.setAttribute("height", size - 4);
            break;
          case "diamond":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polygon",
            );
            shape.setAttribute(
              "points",
              `${size / 2},2 ${size - 2},${size / 2} ${size / 2},${size - 2} 2,${size / 2}`,
            );
            break;
          case "triangle":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polygon",
            );
            shape.setAttribute(
              "points",
              `${size / 2},2 ${size - 2},${size - 2} 2,${size - 2}`,
            );
            break;
          case "pill":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect",
            );
            shape.setAttribute("x", 2);
            shape.setAttribute("y", size / 4);
            shape.setAttribute("width", size - 4);
            shape.setAttribute("height", size / 2);
            shape.setAttribute("rx", size / 4);
            break;
          case "star":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polygon",
            );
            const points = [];
            for (let i = 0; i < 10; i++) {
              const angle = (i * Math.PI) / 5 - Math.PI / 2;
              const r = i % 2 === 0 ? size / 2 - 2 : size / 4;
              points.push(
                `${size / 2 + r * Math.cos(angle)},${size / 2 + r * Math.sin(angle)}`,
              );
            }
            shape.setAttribute("points", points.join(" "));
            break;
          case "wave":
            shape = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path",
            );
            const waveHeight = size / 4;
            shape.setAttribute(
              "d",
              ` M 2,${size / 2 - waveHeight / 2} Q ${size / 4},${size / 2 - waveHeight * 1.5} ${size / 2},${size / 2 - waveHeight / 2} T ${size - 2},${size / 2 - waveHeight / 2} L ${size - 2},${size / 2 + waveHeight / 2} Q ${(size * 3) / 4},${size / 2 + waveHeight * 2} ${size / 2},${size / 2 + waveHeight / 2} T 2,${size / 2 + waveHeight / 2} Z`,
            );
            break;
        }
        shape.setAttribute("fill", fillColor);
        shape.setAttribute("stroke", strokeColor);
        shape.setAttribute("stroke-width", strokeWidth);
        if (shading === "striped") {
          const p = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "pattern",
          );
          p.setAttribute("id", `stripe-${Math.random()}`);
          const patternSize = strokeWidth * 2;
          p.setAttribute("width", patternSize);
          p.setAttribute("height", patternSize);
          p.setAttribute("patternUnits", "userSpaceOnUse");
          const l = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line",
          );
          l.setAttribute("x1", "0");
          l.setAttribute("y1", "0");
          l.setAttribute("x2", "0");
          l.setAttribute("y2", patternSize);
          l.setAttribute("stroke", color);
          l.setAttribute("stroke-width", strokeWidth);
          p.appendChild(l);
          svg.appendChild(p);
          shape.setAttribute("fill", `url(#${p.getAttribute("id")})`);
        }
        svg.appendChild(shape);
        return svg;
      }

      function updateScoreboard() {
        document.getElementById("scoreboard").textContent =
          `Correct: ${score} | Mistakes: ${mistakes} | Cards Left: ${deck.length}`;
      }

      function updateHistory() {
        const historySets = document.getElementById("historySets");
        historySets.innerHTML = "";
        completedSets
          .slice()
          .reverse()
          .forEach((set, index) => {
            const setEl = document.createElement("div");
            setEl.className = "history-set";
            if (settings.orientation === "horizontal")
              setEl.classList.add("horizontal");
            setEl.style.opacity = Math.max(0.2, 1 - index * 0.18);
            setEl.style.transition = "opacity 0.5s ease-in-out";
            set.forEach((cardData) => {
              const cardEl = document.createElement("div");
              cardEl.className = "history-card";
              const color = settings.colors[cardData.color];
              const symbol = settings.symbols[cardData.shape];
              const size = getDynamicShapeSize(cardData, 110, 80, 4, 4);
              for (let i = 0; i < cardData.count; i++)
                cardEl.appendChild(
                  drawShape(symbol, color, cardData.shading, size),
                );
              setEl.appendChild(cardEl);
            });
            historySets.appendChild(setEl);
          });
      }

      function updateControls() {
        document.getElementById("removeBtn").disabled = bottomCardCount <= 2;
        document.getElementById("addBtn").disabled = bottomCardCount >= 8;
      }

      function addCard() {
        if (bottomCardCount < 8) {
          bottomCardCount++;
          updateBottomZone();
        }
      }

      function removeCard() {
        if (bottomCardCount > 2) {
          bottomCardCount--;
          updateBottomZone();
        }
      }

      function initGame() {
        loadSettings();

        gameViewport = document.getElementById("game-viewport");
        gameWorld = document.getElementById("game-world");

        if (gameViewport) {
          gameViewport.addEventListener("mousedown", handleMouseDown);
          gameViewport.addEventListener("contextmenu", (e) =>
            e.preventDefault(),
          );
          window.addEventListener("mouseup", handleMouseUp);
          window.addEventListener("mousemove", handleMouseMove);
          gameViewport.addEventListener("wheel", handleWheel);
        }

        initSettingsHandlers();
        updateSettingsUI();

        document.querySelector(".game-screen").classList.add("active");

        createDeck();
        generatePuzzle();
      }

      initGame();
    </script>
  </body>

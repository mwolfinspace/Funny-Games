<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET Card Game Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .setup-screen, .game-screen, .end-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active, .end-screen.active {
            display: block;
        }

        .setup-group {
            margin-bottom: 25px;
        }

        .setup-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .color-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .symbol-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .symbol-option {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .symbol-option:hover {
            border-color: #667eea;
        }

        .symbol-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .orientation-select {
            display: flex;
            gap: 20px;
        }

        .orientation-option {
            padding: 15px 30px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .orientation-option:hover {
            border-color: #667eea;
        }

        .orientation-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 600px;
        }

        .top-zone, .bottom-zone {
            flex: 1;
            padding: 20px;
            border-radius: 15px;
            position: relative;
        }

        .top-zone {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            gap: 10px;
            position: relative;
        }

        .top-zone .card-wrapper {
            flex-shrink: 0;
            opacity: 0.4;
            transition: transform 0.5s ease, opacity 0.3s;
            cursor: pointer;
        }

        .top-zone .card-wrapper:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .top-zone .card-wrapper:last-child {
            opacity: 1;
            cursor: default;
        }

        .top-zone .card-wrapper:last-child:hover {
            transform: none;
        }

        .top-zone .card-wrapper:last-child .card {
            border: 5px solid #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        @keyframes flyToCenter {
            0% {
                transform: scale(0.5) translateY(200px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .card-wrapper.flying {
            animation: flyToCenter 0.5s ease;
        }

        .bottom-zone-wrapper {
            background: #fff8e1;
            border: 3px solid #ffa726;
            border-radius: 15px;
            padding: 20px;
        }

        .bottom-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #5568d3;
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .bottom-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .card-wrapper {
            position: relative;
        }

        .card-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }

        .card {
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            width: 140px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card.horizontal {
            width: 200px;
            height: 140px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .card.horizontal .card-content {
            flex-direction: row;
        }

        .card-info {
            margin-top: 10px;
            font-size: 11px;
            text-align: center;
            color: #666;
            line-height: 1.4;
        }

        .card-info .highlight {
            font-weight: bold;
            color: #667eea;
        }

        .shape {
            transition: all 0.3s;
        }

        .hint {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .wrong-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: red;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .wrong-mark.show {
            opacity: 1;
        }

        @keyframes fly {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        .card.flying {
            animation: fly 0.5s;
        }

        .end-screen {
            text-align: center;
        }

        .train-animation {
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            height: 400px;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            margin: 20px 0;
        }

        .snake-card {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 8px;
            width: 60px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .restart-btn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background: #5568d3;
        }

        .stats {
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            color: #333;
        }

        .symbol-count {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SET Card Game Trainer</h1>
        
        <div class="setup-screen active">
            <div class="setup-container">
                <div class="setup-left">
                    <div class="setup-group">
                        <label>Choose 3 Colors:</label>
                        <div class="color-inputs">
                            <div class="color-input">
                                <input type="color" id="color1" value="#FF0000">
                                <span>Color 1</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color2" value="#00FF00">
                                <span>Color 2</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color3" value="#0000FF">
                                <span>Color 3</span>
                            </div>
                        </div>
                    </div>

                    <div class="setup-group">
                        <label>Card Background Color:</label>
                        <input type="color" id="cardBg" value="#FFFFFF">
                    </div>

                    <div class="setup-group">
                        <label>Choose 3 Symbols:</label>
                        <div class="symbol-select">
                            <div class="symbol-option selected" data-symbol="diamond">Diamond</div>
                            <div class="symbol-option selected" data-symbol="circle">Circle</div>
                            <div class="symbol-option selected" data-symbol="pill">Pill</div>
                            <div class="symbol-option" data-symbol="wave">Wave</div>
                            <div class="symbol-option" data-symbol="triangle">Triangle</div>
                            <div class="symbol-option" data-symbol="square">Square</div>
                            <div class="symbol-option" data-symbol="star">Star</div>
                        </div>
                        <div class="symbol-count">Selected: 3 symbols</div>
                    </div>

                    <div class="setup-group">
                        <label>Card Orientation:</label>
                        <div class="orientation-select">
                            <div class="orientation-option selected" data-orientation="vertical">Vertical</div>
                            <div class="orientation-option" data-orientation="horizontal">Horizontal</div>
                        </div>
                    </div>

                    <button class="start-btn" onclick="startGame()">Start Training</button>
                </div>
                <div class="setup-right">
                    <label>Live Preview</label>
                    <div class="demo-area" id="demoArea"></div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div class="game-area">
                <div class="top-zone" id="topZone"></div>
                <div class="hint" id="hint">Available cards: 4</div>
                <div class="bottom-zone-wrapper">
                    <div class="bottom-controls">
                        <button class="control-btn" id="removeBtn" onclick="removeCard()">− Remove Card</button>
                        <button class="control-btn" id="addBtn" onclick="addCard()">+ Add Card</button>
                    </div>
                    <div class="bottom-zone" id="bottomZone"></div>
                </div>
            </div>
        </div>

        <div class="end-screen">
            <h2>Congratulations! 🎉</h2>
            <div class="stats" id="stats"></div>
            <div class="train-animation" id="trainAnimation"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let settings = {
            colors: ['#FF0000', '#00FF00', '#0000FF'],
            cardBg: '#FFFFFF',
            symbols: ['diamond', 'circle', 'pill'],
            orientation: 'vertical'
        };

        let deck = [];
        let train = [];
        let bottomCards = [];
        let usedCards = new Set();
        let bottomCardCount = 4;

        const symbolNames = {
            'diamond': 'Diamond',
            'circle': 'Circle',
            'pill': 'Pill',
            'wave': 'Wave',
            'triangle': 'Triangle',
            'square': 'Square',
            'star': 'Star'
        };

        // Setup screen handlers
        document.querySelectorAll('.symbol-option').forEach(opt => {
            opt.addEventListener('click', function() {
                this.classList.toggle('selected');
                
                const count = document.querySelectorAll('.symbol-option.selected').length;
                document.querySelector('.symbol-count').textContent = `Selected: ${count} symbols`;
            });
        });

        document.querySelectorAll('.orientation-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.orientation-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                settings.orientation = this.dataset.orientation;
            });
        });

        function createDeck() {
            deck = [];
            const counts = [1, 2, 3];
            const colors = [0, 1, 2];
            const shadings = ['solid', 'striped', 'outline'];
            const shapes = [0, 1, 2];

            for (let count of counts) {
                for (let color of colors) {
                    for (let shading of shadings) {
                        for (let shape of shapes) {
                            deck.push({ count, color, shading, shape });
                        }
                    }
                }
            }
            
            // Shuffle deck
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawShape(symbol, color, shading, size = 30) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.classList.add('shape');

            let shape;
            const fillColor = shading === 'solid' ? color : 'none';
            const strokeColor = color;
            const strokeWidth = 2;

            switch(symbol) {
                case 'circle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    shape.setAttribute('cx', size/2);
                    shape.setAttribute('cy', size/2);
                    shape.setAttribute('r', size/2 - 2);
                    break;
                case 'square':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', 2);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size - 4);
                    break;
                case 'diamond':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size/2} ${size/2},${size-2} 2,${size/2}`);
                    break;
                case 'triangle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size-2} 2,${size-2}`);
                    break;
                case 'pill':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', size/4);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size/2);
                    shape.setAttribute('rx', size/4);
                    break;
                case 'star':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const points = [];
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI) / 5 - Math.PI / 2;
                        const r = i % 2 === 0 ? size/2 - 2 : size/4;
                        points.push(`${size/2 + r * Math.cos(angle)},${size/2 + r * Math.sin(angle)}`);
                    }
                    shape.setAttribute('points', points.join(' '));
                    break;
                case 'wave':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    shape.setAttribute('d', `M2,${size/2} Q${size/4},${size/4} ${size/2},${size/2} T${size-2},${size/2}`);
                    break;
            }

            shape.setAttribute('fill', fillColor);
            shape.setAttribute('stroke', strokeColor);
            shape.setAttribute('stroke-width', strokeWidth);

            if (shading === 'striped') {
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                pattern.setAttribute('id', `stripe-${Math.random()}`);
                pattern.setAttribute('width', '4');
                pattern.setAttribute('height', '4');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '0');
                line.setAttribute('y1', '0');
                line.setAttribute('x2', '0');
                line.setAttribute('y2', '4');
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                
                pattern.appendChild(line);
                svg.appendChild(pattern);
                shape.setAttribute('fill', `url(#${pattern.getAttribute('id')})`);
            }

            svg.appendChild(shape);
            return svg;
        }

        function getCardInfoText(cardData, lastCard = null) {
            const countText = `${cardData.count}`;
            const colorText = `Color ${cardData.color + 1}`;
            const shadingText = cardData.shading;
            const shapeText = symbolNames[settings.symbols[cardData.shape]];

            if (!lastCard) {
                return `${countText} ${shapeText}<br>${colorText}, ${shadingText}`;
            }

            const countMatch = cardData.count === lastCard.count;
            const colorMatch = cardData.color === lastCard.color;
            const shadingMatch = cardData.shading === lastCard.shading;
            const shapeMatch = cardData.shape === lastCard.shape;

            const countHTML = countMatch ? `<span class="highlight">${countText}</span>` : countText;
            const colorHTML = colorMatch ? `<span class="highlight">${colorText}</span>` : colorText;
            const shadingHTML = shadingMatch ? `<span class="highlight">${shadingText}</span>` : shadingText;
            const shapeHTML = shapeMatch ? `<span class="highlight">${shapeText}</span>` : shapeText;

            return `${countHTML} ${shapeHTML}<br>${colorHTML}, ${shadingHTML}`;
        }

        function createCardElement(cardData, clickHandler = null, showLabel = false, label = '', showInfo = true, isHistory = false, historyIndex = -1) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';

            if (showLabel) {
                const labelEl = document.createElement('div');
                labelEl.className = 'card-label';
                labelEl.textContent = label;
                wrapper.appendChild(labelEl);
            }

            const card = document.createElement('div');
            card.className = 'card';
            if (settings.orientation === 'horizontal') {
                card.classList.add('horizontal');
            }
            card.style.background = settings.cardBg;

            const content = document.createElement('div');
            content.className = 'card-content';

            const color = settings.colors[cardData.color];
            const symbol = settings.symbols[cardData.shape];
            
            for (let i = 0; i < cardData.count; i++) {
                const shape = drawShape(symbol, color, cardData.shading);
                content.appendChild(shape);
            }

            card.appendChild(content);

            if (showInfo) {
                const info = document.createElement('div');
                info.className = 'card-info';
                const lastCard = train.length > 0 ? train[train.length - 1] : null;
                info.innerHTML = getCardInfoText(cardData, lastCard);
                card.appendChild(info);
            }

            const wrongMark = document.createElement('div');
            wrongMark.className = 'wrong-mark';
            wrongMark.textContent = '✗';
            card.appendChild(wrongMark);

            if (clickHandler) {
                card.addEventListener('click', () => clickHandler(wrapper, card, cardData));
            }

            if (isHistory && historyIndex >= 0) {
                wrapper.addEventListener('click', () => undoToCard(historyIndex));
            }

            wrapper.appendChild(card);
            return wrapper;
        }

        function hasOneDifference(card1, card2) {
            let similarities = 0;
            if (card1.count === card2.count) similarities++;
            if (card1.color === card2.color) similarities++;
            if (card1.shading === card2.shading) similarities++;
            if (card1.shape === card2.shape) similarities++;
            return similarities === 1;
        }

        function getAvailableCards() {
            if (train.length === 0) return deck.length;
            
            const lastCard = train[train.length - 1];
            return deck.filter(card => !usedCards.has(JSON.stringify(card)) && hasOneDifference(card, lastCard)).length;
        }

        function updateBottomZone() {
            const bottomZone = document.getElementById('bottomZone');
            bottomZone.innerHTML = '';
            bottomCards = [];

            const available = deck.filter(card => !usedCards.has(JSON.stringify(card)));
            
            if (train.length === 0) {
                for (let i = 0; i < Math.min(bottomCardCount, available.length); i++) {
                    bottomCards.push(available[i]);
                }
            } else {
                const lastCard = train[train.length - 1];
                const validCards = available.filter(card => hasOneDifference(card, lastCard));
                
                if (validCards.length > 0) {
                    bottomCards.push(validCards[Math.floor(Math.random() * validCards.length)]);
                }
                
                while (bottomCards.length < bottomCardCount && available.length > bottomCards.length) {
                    const card = available[Math.floor(Math.random() * available.length)];
                    if (!bottomCards.some(c => JSON.stringify(c) === JSON.stringify(card))) {
                        bottomCards.push(card);
                    }
                }
            }

            bottomCards.forEach((card, index) => {
                const label = String.fromCharCode(65 + index);
                const cardEl = createCardElement(card, handleCardClick, true, label);
                bottomZone.appendChild(cardEl);
            });

            updateHint();
            updateControls();
        }

        function updateControls() {
            document.getElementById('removeBtn').disabled = bottomCardCount <= 2;
            document.getElementById('addBtn').disabled = bottomCardCount >= 12;
        }

        function addCard() {
            if (bottomCardCount < 12) {
                bottomCardCount++;
                updateBottomZone();
            }
        }

        function removeCard() {
            if (bottomCardCount > 2) {
                bottomCardCount--;
                updateBottomZone();
            }
        }

        function updateHint() {
            const count = getAvailableCards();
            document.getElementById('hint').textContent = `Available cards: ${count}`;
        }

        function handleCardClick(wrapper, cardEl, cardData) {
            if (train.length === 0) {
                train.push(cardData);
                usedCards.add(JSON.stringify(cardData));
                cardEl.classList.add('flying');
                
                setTimeout(() => {
                    updateTopZone();
                    updateBottomZone();
                }, 500);
            } else {
                const lastCard = train[train.length - 1];
                
                if (hasOneDifference(cardData, lastCard)) {
                    train.push(cardData);
                    usedCards.add(JSON.stringify(cardData));
                    cardEl.classList.add('flying');
                    
                    setTimeout(() => {
                        updateTopZone();
                        updateBottomZone();
                        
                        if (train.length === 81) {
                            endGame();
                        }
                    }, 500);
                } else {
                    const wrongMark = cardEl.querySelector('.wrong-mark');
                    wrongMark.classList.add('show');
                    
                    setTimeout(() => {
                        wrongMark.classList.remove('show');
                    }, 1000);
                }
            }
        }

        function undoToCard(index) {
            // Don't allow undo on the current focused card
            if (index === train.length - 1) return;
            
            // Remove cards after the clicked index from usedCards
            for (let i = train.length - 1; i > index; i--) {
                usedCards.delete(JSON.stringify(train[i]));
            }
            
            // Truncate train to the clicked card
            train = train.slice(0, index + 1);
            
            // Update display
            updateTopZone();
            updateBottomZone();
        }

        function updateTopZone() {
            const topZone = document.getElementById('topZone');
            const cardWidth = settings.orientation === 'vertical' ? 140 : 200;
            const gap = 10;
            
            topZone.innerHTML = '';
            
            // Create a container for all cards that will be shifted
            const cardContainer = document.createElement('div');
            cardContainer.style.display = 'flex';
            cardContainer.style.gap = '10px';
            cardContainer.style.transition = 'transform 0.5s ease';
            
            train.forEach((card, index) => {
                const cardEl = createCardElement(card, null, false, '', false, true, index);
                
                // Add flying animation to the newest card
                if (index === train.length - 1) {
                    cardEl.classList.add('flying');
                }
                
                cardContainer.appendChild(cardEl);
            });
            
            // Calculate offset to keep the last card centered
            const totalCards = train.length;
            if (totalCards > 0) {
                const offset = (totalCards - 1) * (cardWidth + gap) / 2;
                cardContainer.style.transform = `translateX(-${offset}px)`;
            }
            
            topZone.appendChild(cardContainer);
        }

        function endGame() {
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.end-screen').classList.add('active');
            
            document.getElementById('stats').textContent = `You completed the train with all 81 cards!`;
            
            animateSnake();
        }

        function animateSnake() {
            const container = document.getElementById('trainAnimation');
            const cards = train.map((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'snake-card';
                cardEl.style.background = settings.cardBg;
                
                const color = settings.colors[card.color];
                const symbol = settings.symbols[card.shape];
                const shape = drawShape(symbol, color, card.shading, 20);
                cardEl.appendChild(shape);
                
                container.appendChild(cardEl);
                return { el: cardEl, angle: (i * 10) };
            });

            let time = 0;
            setInterval(() => {
                time += 0.02;
                cards.forEach((card, i) => {
                    const angle = time + (i * 0.2);
                    const x = 200 + Math.cos(angle) * 150;
                    const y = 200 + Math.sin(angle) * 100;
                    card.el.style.left = x + 'px';
                    card.el.style.top = y + 'px';
                });
            }, 20);
        }

        function startGame() {
            settings.colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            settings.cardBg = document.getElementById('cardBg').value;
            
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);
            
            if (selectedSymbols.length !== 3) {
                alert('Please select exactly 3 symbols');
                return;
            }
            
            settings.symbols = selectedSymbols;

            createDeck();
            
            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            updateBottomZone();
        }
    </script>
</body>
</html>

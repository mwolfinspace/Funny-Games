<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET Card Game Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .setup-screen, .game-screen, .end-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active, .end-screen.active {
            display: block;
        }

        .setup-group {
            margin-bottom: 25px;
        }

        .setup-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .color-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .symbol-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .symbol-option {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .symbol-option:hover {
            border-color: #667eea;
        }

        .symbol-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .orientation-select {
            display: flex;
            gap: 20px;
        }

        .orientation-option {
            padding: 15px 30px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .orientation-option:hover {
            border-color: #667eea;
        }

        .orientation-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 600px;
        }

        .top-zone, .bottom-zone {
            flex: 1;
            padding: 20px;
            border-radius: 15px;
            position: relative;
        }

        .top-zone {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            gap: 10px;
            position: relative;
        }

        .top-zone .card-wrapper {
            flex-shrink: 0;
            opacity: 0.4;
            transition: transform 0.5s ease, opacity 0.3s;
            cursor: pointer;
        }

        .top-zone .card-wrapper:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .top-zone .card-wrapper:last-child {
            opacity: 1;
            cursor: default;
        }

        .top-zone .card-wrapper:last-child:hover {
            transform: none;
        }

        .top-zone .card-wrapper:last-child .card {
            border: 5px solid #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        @keyframes flyToCenter {
            0% {
                transform: scale(0.5) translateY(200px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .card-wrapper.flying {
            animation: flyToCenter 0.5s ease;
        }

        .bottom-zone-wrapper {
            background: #fff8e1;
            border: 3px solid #ffa726;
            border-radius: 15px;
            padding: 20px;
        }

        .bottom-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 140px;
        }

        .control-btn:hover {
            background: #5568d3;
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .control-btn.end-game {
            background: #ff6b6b;
        }

        .control-btn.end-game:hover {
            background: #ff5252;
        }

        .bottom-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .card-wrapper {
            position: relative;
        }

        .card-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }

        .card {
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            width: 140px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card.horizontal {
            width: 200px;
            height: 140px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .card.horizontal .card-content {
            flex-direction: row;
        }

        .card-info {
            margin-top: 10px;
            font-size: 11px;
            text-align: center;
            color: #666;
            line-height: 1.4;
        }

        .card-info .highlight {
            font-weight: bold;
            color: #667eea;
        }

        .shape {
            transition: all 0.3s;
        }

        .hint {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .wrong-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: red;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .wrong-mark.show {
            opacity: 1;
        }

        @keyframes fly {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        .card.flying {
            animation: fly 0.5s;
        }

        .end-screen {
            text-align: center;
        }

        .train-animation {
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            height: 400px;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            margin: 20px 0;
        }

        .snake-card {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 8px;
            width: 60px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, left 0.1s, top 0.1s;
        }

        .snake-card.head {
            border-color: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            z-index: 100;
        }

        .restart-btn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background: #5568d3;
        }

        .stats {
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            color: #333;
        }

        .symbol-count {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .setup-container {
            display: flex;
            gap: 30px;
        }

        .setup-left {
            flex: 1;
        }

        .setup-right {
            width: 350px;
            padding-left: 30px;
            border-left: 2px solid #eee;
        }
        
        .demo-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .demo-card {
            border: 2px solid #ccc;
            border-radius: 5px;
            width: 100px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <style>
        a.return-to-menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(0,0,0,0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s;
            z-index: 1000;
        }
        a.return-to-menu:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<a class="return-to-menu" href="index.html">🏠</a>
    <div class="container">
        <h1>SET Card Game Trainer</h1>
        
        <div class="setup-screen active">
            <div class="setup-container">
                <div class="setup-left">
                    <div class="setup-group">
                        <label>Choose 3 Colors:</label>
                        <div class="color-inputs">
                            <div class="color-input">
                                <input type="color" id="color1" value="#FF0000">
                                <span>Color 1</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color2" value="#00FF00">
                                <span>Color 2</span>
                            </div>
                            <div class="color-input">
                                <input type="color" id="color3" value="#0000FF">
                                <span>Color 3</span>
                            </div>
                        </div>
                    </div>

                    <div class="setup-group">
                        <label>Card Background Color:</label>
                        <input type="color" id="cardBg" value="#FFFFFF">
                    </div>

                    <div class="setup-group">
                        <label>Choose 3 Symbols:</label>
                        <div class="symbol-select">
                            <div class="symbol-option selected" data-symbol="diamond">
                                <div></div>
                                <span>Diamond</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="circle">
                                <div></div>
                                <span>Circle</span>
                            </div>
                            <div class="symbol-option selected" data-symbol="pill">
                                <div></div>
                                <span>Pill</span>
                            </div>
                            <div class="symbol-option" data-symbol="wave">
                                <div></div>
                                <span>Wave</span>
                            </div>
                            <div class="symbol-option" data-symbol="triangle">
                                <div></div>
                                <span>Triangle</span>
                            </div>
                            <div class="symbol-option" data-symbol="square">
                                <div></div>
                                <span>Square</span>
                            </div>
                            <div class="symbol-option" data-symbol="star">
                                <div></div>
                                <span>Star</span>
                            </div>
                        </div>
                        <div class="symbol-count">Selected: 3 symbols</div>
                    </div>

                    <div class="setup-group">
                        <label>Card Orientation:</label>
                        <div class="orientation-select">
                            <div class="orientation-option selected" data-orientation="vertical">Vertical</div>
                            <div class="orientation-option" data-orientation="horizontal">Horizontal</div>
                        </div>
                    </div>

                    <div class="setup-group">
                        <label>Answer Label Style:</label>
                        <select id="labelStyle" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
                            <option value="numbers" selected>Numbers (1, 2, 3...)</option>
                            <option value="letters">Letters (A, B, C...)</option>
                        </select>
                    </div>

                    <button class="start-btn" onclick="startGame()">Start Training</button>
                </div>
                <div class="setup-right">
                    <label>Live Preview</label>
                    <div class="demo-area" id="demoArea"></div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div class="game-area">
                <div class="top-zone" id="topZone"></div>
                <div class="hint" id="hint">Available cards: 4</div>
                <div class="bottom-zone-wrapper">
                    <div class="bottom-controls">
                        <button class="control-btn" id="removeBtn" onclick="removeCard()">− Remove Card</button>
                        <button class="control-btn" id="addBtn" onclick="addCard()">+ Add Card</button>
                        <button class="control-btn end-game" id="endBtn" onclick="endGame()">End Game</button>
                    </div>
                    <div class="bottom-zone" id="bottomZone"></div>
                </div>
            </div>
        </div>

        <div class="end-screen">
            <h2>Game Over!</h2>
            <div class="stats" id="stats"></div>
            <div class="train-animation" id="trainAnimation"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let settings = {
            colors: ['#FF0000', '#00FF00', '#0000FF'],
            cardBg: '#FFFFFF',
            symbols: ['diamond', 'circle', 'pill'],
            orientation: 'vertical',
            labelStyle: 'numbers'
        };

        let deck = [];
        let train = [];
        let bottomCards = [];
        let usedCards = new Set();
        let bottomCardCount = 4;
        let gameActive = true;

        const symbolNames = {
            'diamond': 'Diamond',
            'circle': 'Circle',
            'pill': 'Pill',
            'wave': 'Wave',
            'triangle': 'Triangle',
            'square': 'Square',
            'star': 'Star'
        };

        // Setup screen handlers
        document.querySelectorAll('.symbol-option').forEach(opt => {
            opt.addEventListener('click', function() {
                this.classList.toggle('selected');
                
                const count = document.querySelectorAll('.symbol-option.selected').length;
                document.querySelector('.symbol-count').textContent = `Selected: ${count} symbols`;
            });
        });

        document.querySelectorAll('.orientation-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.orientation-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                settings.orientation = this.dataset.orientation;
                updateDemo();
            });
        });

        function updateSymbolOptions() {
            document.querySelectorAll('.symbol-option').forEach(opt => {
                const symbol = opt.dataset.symbol;
                const svg = drawShape(symbol, '#333', 'solid', 40);
                opt.querySelector('div').innerHTML = '';
                opt.querySelector('div').appendChild(svg);
            });
        }

        function updateDemo() {
            const demoArea = document.getElementById('demoArea');
            demoArea.innerHTML = '';

            const colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            const cardBg = document.getElementById('cardBg').value;
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);

            if (selectedSymbols.length === 0) return;

            const shadings = ['solid', 'striped', 'outline'];

            for (let i = 0; i < 9; i++) {
                const card = document.createElement('div');
                card.className = 'demo-card';
                card.style.background = cardBg;
                
                const cardContent = document.createElement('div');
                cardContent.className = 'card-content';

                const symbol = selectedSymbols[i % selectedSymbols.length];
                const color = colors[Math.floor(i / 3) % colors.length];
                const shading = shadings[i % shadings.length];
                const count = (i % 3) + 1;

                for (let j = 0; j < count; j++) {
                    const shape = drawShape(symbol, color, shading, 20);
                    cardContent.appendChild(shape);
                }

                card.appendChild(cardContent);
                demoArea.appendChild(card);
            }
        }

        document.querySelectorAll('.color-input input').forEach(input => input.addEventListener('input', updateDemo));
        document.querySelectorAll('.symbol-option').forEach(opt => opt.addEventListener('click', updateDemo));
        document.getElementById('cardBg').addEventListener('input', updateDemo);

        updateSymbolOptions();
        updateDemo();

        function createDeck() {
            deck = [];
            const counts = [1, 2, 3];
            const colors = [0, 1, 2];
            const shadings = ['solid', 'striped', 'outline'];
            const shapes = [0, 1, 2];

            for (let count of counts) {
                for (let color of colors) {
                    for (let shading of shadings) {
                        for (let shape of shapes) {
                            deck.push({ count, color, shading, shape });
                        }
                    }
                }
            }
            
            // Shuffle deck
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawShape(symbol, color, shading, size = 30) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.classList.add('shape');

            let shape;
            const fillColor = shading === 'solid' ? color : 'none';
            const strokeColor = color;
            const strokeWidth = 2;

            switch(symbol) {
                case 'circle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    shape.setAttribute('cx', size/2);
                    shape.setAttribute('cy', size/2);
                    shape.setAttribute('r', size/2 - 2);
                    break;
                case 'square':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', 2);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size - 4);
                    break;
                case 'diamond':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size/2} ${size/2},${size-2} 2,${size/2}`);
                    break;
                case 'triangle':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    shape.setAttribute('points', `${size/2},2 ${size-2},${size-2} 2,${size-2}`);
                    break;
                case 'pill':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    shape.setAttribute('x', 2);
                    shape.setAttribute('y', size/4);
                    shape.setAttribute('width', size - 4);
                    shape.setAttribute('height', size/2);
                    shape.setAttribute('rx', size/4);
                    break;
                case 'star':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    const points = [];
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI) / 5 - Math.PI / 2;
                        const r = i % 2 === 0 ? size/2 - 2 : size/4;
                        points.push(`${size/2 + r * Math.cos(angle)},${size/2 + r * Math.sin(angle)}`);
                    }
                    shape.setAttribute('points', points.join(' '));
                    break;
                case 'wave':
                    shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const waveHeight = size / 4;
                    shape.setAttribute('d', `
                        M 2,${size/2 - waveHeight/2}
                        Q ${size/4},${size/2 - waveHeight*1.5} ${size/2},${size/2 - waveHeight/2}
                        T ${size-2},${size/2 - waveHeight/2}
                        L ${size-2},${size/2 + waveHeight/2}
                        Q ${size*3/4},${size/2 + waveHeight*2} ${size/2},${size/2 + waveHeight/2}
                        T 2,${size/2 + waveHeight/2}
                        Z
                    `);
                    break;
            }

            shape.setAttribute('fill', fillColor);
            shape.setAttribute('stroke', strokeColor);
            shape.setAttribute('stroke-width', strokeWidth);

            if (shading === 'striped') {
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                pattern.setAttribute('id', `stripe-${Math.random()}`);
                pattern.setAttribute('width', '4');
                pattern.setAttribute('height', '4');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '0');
                line.setAttribute('y1', '0');
                line.setAttribute('x2', '0');
                line.setAttribute('y2', '4');
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', '2');
                
                pattern.appendChild(line);
                svg.appendChild(pattern);
                shape.setAttribute('fill', `url(#${pattern.getAttribute('id')})`);
            }

            svg.appendChild(shape);
            return svg;
        }

        function getCardInfoText(cardData, lastCard = null) {
            const countText = `${cardData.count}`;
            const colorText = `Color ${cardData.color + 1}`;
            const shadingText = cardData.shading;
            const shapeText = symbolNames[settings.symbols[cardData.shape]];

            if (!lastCard) {
                return `${countText} ${shapeText}<br>${colorText}, ${shadingText}`;
            }

            const countMatch = cardData.count === lastCard.count;
            const colorMatch = cardData.color === lastCard.color;
            const shadingMatch = cardData.shading === lastCard.shading;
            const shapeMatch = cardData.shape === lastCard.shape;

            const countHTML = countMatch ? `<span class="highlight">${countText}</span>` : countText;
            const colorHTML = colorMatch ? `<span class="highlight">${colorText}</span>` : colorText;
            const shadingHTML = shadingMatch ? `<span class="highlight">${shadingText}</span>` : shadingText;
            const shapeHTML = shapeMatch ? `<span class="highlight">${shapeText}</span>` : shapeText;

            return `${countHTML} ${shapeHTML}<br>${colorHTML}, ${shadingHTML}`;
        }

        function createCardElement(cardData, clickHandler = null, showLabel = false, label = '', showInfo = true, isHistory = false, historyIndex = -1) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';

            if (showLabel) {
                const labelEl = document.createElement('div');
                labelEl.className = 'card-label';
                labelEl.textContent = label;
                wrapper.appendChild(labelEl);
            }

            const card = document.createElement('div');
            card.className = 'card';
            if (settings.orientation === 'horizontal') {
                card.classList.add('horizontal');
            }
            card.style.background = settings.cardBg;

            const content = document.createElement('div');
            content.className = 'card-content';

            const color = settings.colors[cardData.color];
            const symbol = settings.symbols[cardData.shape];
            
            for (let i = 0; i < cardData.count; i++) {
                const shape = drawShape(symbol, color, cardData.shading);
                content.appendChild(shape);
            }

            card.appendChild(content);

            if (showInfo) {
                const info = document.createElement('div');
                info.className = 'card-info';
                const lastCard = train.length > 0 ? train[train.length - 1] : null;
                info.innerHTML = getCardInfoText(cardData, lastCard);
                card.appendChild(info);
            }

            const wrongMark = document.createElement('div');
            wrongMark.className = 'wrong-mark';
            wrongMark.textContent = '✗';
            card.appendChild(wrongMark);

            if (clickHandler) {
                card.addEventListener('click', () => clickHandler(wrapper, card, cardData));
            }

            if (isHistory && historyIndex >= 0) {
                wrapper.addEventListener('click', () => undoToCard(historyIndex));
            }

            wrapper.appendChild(card);
            return wrapper;
        }

        function hasOneDifference(card1, card2) {
            let similarities = 0;
            if (card1.count === card2.count) similarities++;
            if (card1.color === card2.color) similarities++;
            if (card1.shading === card2.shading) similarities++;
            if (card1.shape === card2.shape) similarities++;
            return similarities === 1;
        }

        function getAvailableCards() {
            if (train.length === 0) return deck.length;
            
            const lastCard = train[train.length - 1];
            return deck.filter(card => !usedCards.has(JSON.stringify(card)) && hasOneDifference(card, lastCard)).length;
        }

        function checkGameOver() {
            if (train.length === 0) return false;
            
            const lastCard = train[train.length - 1];
            const available = deck.filter(card => !usedCards.has(JSON.stringify(card)));
            const validCards = available.filter(card => hasOneDifference(card, lastCard));
            
            return validCards.length === 0;
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateBottomZone() {
            const bottomZone = document.getElementById('bottomZone');
            bottomZone.innerHTML = '';
            bottomCards = [];

            const available = deck.filter(card => !usedCards.has(JSON.stringify(card)));
            
            if (train.length === 0) {
                // For the first card, any card is valid
                for (let i = 0; i < Math.min(bottomCardCount, available.length); i++) {
                    bottomCards.push(available[i]);
                }
            } else {
                const lastCard = train[train.length - 1];
                const validCards = available.filter(card => hasOneDifference(card, lastCard));
                const invalidCards = available.filter(card => !hasOneDifference(card, lastCard));
                
                // Check for game over condition
                if (validCards.length === 0) {
                    endGame();
                    return;
                }
                
                // Always include at least one valid card
                if (validCards.length > 0) {
                    const randomValidCard = validCards[Math.floor(Math.random() * validCards.length)];
                    bottomCards.push(randomValidCard);
                }
                
                // Fill the rest with random cards (could be valid or invalid)
                const remainingSlots = bottomCardCount - 1;
                const allCards = [...validCards, ...invalidCards].filter(card => 
                    !bottomCards.some(bc => JSON.stringify(bc) === JSON.stringify(card))
                );
                
                // Shuffle all available cards
                const shuffledCards = shuffleArray(allCards);
                
                for (let i = 0; i < Math.min(remainingSlots, shuffledCards.length); i++) {
                    bottomCards.push(shuffledCards[i]);
                }
                
                // If we still don't have enough cards, add any available
                if (bottomCards.length < bottomCardCount) {
                    const remaining = available.filter(card => 
                        !bottomCards.some(bc => JSON.stringify(bc) === JSON.stringify(card))
                    );
                    const needed = bottomCardCount - bottomCards.length;
                    for (let i = 0; i < Math.min(needed, remaining.length); i++) {
                        bottomCards.push(remaining[i]);
                    }
                }
            }
            
            // Shuffle the final bottomCards array so the valid card isn't always first
            bottomCards = shuffleArray(bottomCards);

            bottomCards.forEach((card, index) => {
                let label;
                if (settings.labelStyle === 'numbers') {
                    label = index + 1;
                } else {
                    label = String.fromCharCode(65 + index);
                }
                const cardEl = createCardElement(card, handleCardClick, true, label);
                bottomZone.appendChild(cardEl);
            });

            updateHint();
            updateControls();
            
            // Check if game should end
            if (train.length > 0 && checkGameOver()) {
                endGame();
            }
        }

        function updateControls() {
            document.getElementById('removeBtn').disabled = bottomCardCount <= 2;
            document.getElementById('addBtn').disabled = bottomCardCount >= 12;
        }

        function addCard() {
            if (bottomCardCount < 12) {
                bottomCardCount++;
                updateBottomZone();
            }
        }

        function removeCard() {
            if (bottomCardCount > 2) {
                bottomCardCount--;
                updateBottomZone();
            }
        }

        function updateHint() {
            const count = getAvailableCards();
            document.getElementById('hint').textContent = `Available cards: ${count}`;
        }

        function handleCardClick(wrapper, cardEl, cardData) {
            if (!gameActive) return;
            
            if (train.length === 0) {
                train.push(cardData);
                usedCards.add(JSON.stringify(cardData));
                cardEl.classList.add('flying');
                
                setTimeout(() => {
                    updateTopZone();
                    updateBottomZone();
                }, 500);
            } else {
                const lastCard = train[train.length - 1];
                
                if (hasOneDifference(cardData, lastCard)) {
                    train.push(cardData);
                    usedCards.add(JSON.stringify(cardData));
                    cardEl.classList.add('flying');
                    
                    setTimeout(() => {
                        updateTopZone();
                        updateBottomZone();
                        
                        // Check for win condition
                        if (train.length === 81) {
                            endGame();
                        }
                    }, 500);
                } else {
                    const wrongMark = cardEl.querySelector('.wrong-mark');
                    wrongMark.classList.add('show');
                    
                    setTimeout(() => {
                        wrongMark.classList.remove('show');
                    }, 1000);
                }
            }
        }

        function undoToCard(index) {
            // Don't allow undo on the current focused card
            if (index === train.length - 1) return;
            
            // Remove cards after the clicked index from usedCards
            for (let i = train.length - 1; i > index; i--) {
                usedCards.delete(JSON.stringify(train[i]));
            }
            
            // Truncate train to the clicked card
            train = train.slice(0, index + 1);
            
            // Update display
            updateTopZone();
            updateBottomZone();
        }

        function updateTopZone() {
            const topZone = document.getElementById('topZone');
            const cardWidth = settings.orientation === 'vertical' ? 140 : 200;
            const gap = 10;
            
            topZone.innerHTML = '';
            
            // Create a container for all cards that will be shifted
            const cardContainer = document.createElement('div');
            cardContainer.style.display = 'flex';
            cardContainer.style.gap = '10px';
            cardContainer.style.transition = 'transform 0.5s ease';
            
            train.forEach((card, index) => {
                const cardEl = createCardElement(card, null, false, '', false, true, index);
                
                // Add flying animation to the newest card
                if (index === train.length - 1) {
                    cardEl.classList.add('flying');
                }
                
                cardContainer.appendChild(cardEl);
            });
            
            // Calculate offset to keep the last card centered
            const totalCards = train.length;
            if (totalCards > 0) {
                const offset = (totalCards - 1) * (cardWidth + gap) / 2;
                cardContainer.style.transform = `translateX(-${offset}px)`;
            }
            
            topZone.appendChild(cardContainer);
        }

        function endGame() {
            if (!gameActive) return;
            
            gameActive = false;
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.end-screen').classList.add('active');
            
            let message;
            if (train.length === 81) {
                message = "🎉 Congratulations! You completed the entire deck of 81 cards!";
            } else if (train.length === 0) {
                message = "Game ended. Your train length: 0";
            } else {
                message = `Game Over! No more valid cards available.<br>Your train length: ${train.length}`;
            }
            
            document.getElementById('stats').innerHTML = message;
            animateSnake();
        }

        function createSnakeCard(cardData, isHead = false) {
            const cardEl = document.createElement('div');
            cardEl.className = 'snake-card';
            if (isHead) {
                cardEl.classList.add('head');
            }
            cardEl.style.background = settings.cardBg;
            
            const color = settings.colors[cardData.color];
            const symbol = settings.symbols[cardData.shape];
            const shape = drawShape(symbol, color, cardData.shading, 20);
            cardEl.appendChild(shape);
            
            return cardEl;
        }

        function animateSnake() {
            const container = document.getElementById('trainAnimation');
            container.innerHTML = '';
            
            if (train.length === 0) return;
            
            // Create snake cards (use all cards in train)
            const snakeCards = [];
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            // Create one snake card for each train card
            for (let i = 0; i < train.length; i++) {
                const cardData = train[i];
                const isHead = (i === 0);
                const cardEl = createSnakeCard(cardData, isHead);
                
                // Position cards in a line initially
                const x = containerWidth / 2;
                const y = containerHeight / 2;
                
                // Random velocity (2-4 pixels per frame)
                const speed = 2 + Math.random() * 2;
                const angle = Math.random() * Math.PI * 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                cardEl.style.left = x + 'px';
                cardEl.style.top = y + 'px';
                
                container.appendChild(cardEl);
                
                snakeCards.push({
                    el: cardEl,
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    trail: []
                });
            }
            
            // Animation function
            function animate() {
                snakeCards.forEach((card, index) => {
                    if (index === 0) {
                        // Head card - move freely
                        card.x += card.vx;
                        card.y += card.vy;
                        
                        // Bounce off walls (DVD screensaver style)
                        if (card.x <= 0) {
                            card.x = 0;
                            card.vx = Math.abs(card.vx);
                        } else if (card.x >= containerWidth - 60) {
                            card.x = containerWidth - 60;
                            card.vx = -Math.abs(card.vx);
                        }
                        
                        if (card.y <= 0) {
                            card.y = 0;
                            card.vy = Math.abs(card.vy);
                        } else if (card.y >= containerHeight - 80) {
                            card.y = containerHeight - 80;
                            card.vy = -Math.abs(card.vy);
                        }
                        
                        // Store position in trail
                        card.trail.unshift({x: card.x, y: card.y});
                        if (card.trail.length > 100) {
                            card.trail.pop();
                        }
                    } else {
                        // Body cards - follow the previous card's trail with delay
                        const prevCard = snakeCards[index - 1];
                        const trailIndex = Math.min(index * 5, prevCard.trail.length - 1);
                        
                        if (prevCard.trail[trailIndex]) {
                            card.x = prevCard.trail[trailIndex].x;
                            card.y = prevCard.trail[trailIndex].y;
                        }
                        
                        // Store position in own trail
                        card.trail.unshift({x: card.x, y: card.y});
                        if (card.trail.length > 50) {
                            card.trail.pop();
                        }
                    }
                    
                    // Update position
                    card.el.style.left = card.x + 'px';
                    card.el.style.top = card.y + 'px';
                    
                    // Scale body cards based on position
                    if (index > 0) {
                        const scale = 1 - (index * 0.02);
                        card.el.style.transform = `scale(${scale})`;
                        card.el.style.zIndex = (100 - index).toString();
                    }
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        function startGame() {
            settings.colors = [
                document.getElementById('color1').value,
                document.getElementById('color2').value,
                document.getElementById('color3').value
            ];
            settings.cardBg = document.getElementById('cardBg').value;
            settings.labelStyle = document.getElementById('labelStyle').value;
            
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected'))
                .map(opt => opt.dataset.symbol);
            
            if (selectedSymbols.length !== 3) {
                alert('Please select exactly 3 symbols');
                return;
            }
            
            settings.symbols = selectedSymbols;
            gameActive = true;

            createDeck();
            
            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            updateBottomZone();
        }
    </script>

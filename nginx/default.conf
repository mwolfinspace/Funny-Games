# =============================================================================
# nginx default.conf for minigames.xedryk.top
# =============================================================================
# Mounted at /etc/nginx/conf.d/default.conf in the minigames-web container.
#
#   /        → static game files from /usr/share/nginx/html
#   /api/mg/* → proxied to the minigames-hub backend on port 8907
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files; try_files falls back to index.html for SPA-like routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Hub API calls to the minigames-hub backend (Docker service name)
    location /api/mg/ {
        proxy_pass http://minigames-hub:8907;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Count & Write — Kids Math Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f7f3e8; --panel:#fffaf0; --ink:#392f29; --muted:#8e8074;
    --accent:#e0a52a; --line:#eadfca; --shadow:0 6px 18px rgba(70,48,20,.10);
    --radius:20px;
    --round:"Fredoka","Arial Rounded MT Bold","Comic Sans MS","Trebuchet MS",Arial,sans-serif;
    --emoji-font:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--round)}
  body{-webkit-user-select:none;user-select:none}
  button,select{font:inherit}
  button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .app{height:100%;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
  .topbar{
    display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:7px 10px;
    background:rgba(255,250,240,.97);border-bottom:2px solid var(--line);box-shadow:0 2px 12px rgba(60,45,25,.06);z-index:5
  }
  .brand{font-size:clamp(16px,1.9vw,23px);font-weight:900;margin-right:3px;white-space:nowrap}
  .control{
    min-height:38px;border:2px solid var(--line);background:white;border-radius:13px;padding:5px 9px;
    color:var(--ink);font-weight:800;display:flex;align-items:center;gap:7px
  }
  .seg{display:flex;background:#f3eadb;border-radius:13px;padding:3px;gap:3px}
  .seg button{min-height:32px;border-radius:10px;padding:0 10px;background:transparent;color:#6d5f53;font-weight:900}
  .seg button.active{background:white;color:var(--ink);box-shadow:0 2px 7px rgba(50,35,15,.10)}
  .toggle{gap:8px}
  .switch{width:42px;height:24px;background:#d9cec0;border-radius:99px;padding:3px;transition:.15s}
  .switch i{display:block;width:18px;height:18px;background:white;border-radius:50%;box-shadow:0 2px 4px #0002;transition:.15s}
  .switch.on{background:#d9a126}
  .switch.on i{transform:translateX(18px)}
  .limit{display:flex;gap:5px;align-items:center}
  .limit button{width:34px;height:34px;border-radius:10px;background:white;border:2px solid var(--line);font-size:21px;font-weight:900}
  .limit-value{min-width:55px;text-align:center;font-weight:900;font-size:13px}
  .spacer{flex:1}
  .reset{background:#fff}
  .game{min-height:0;overflow:hidden;padding:10px}
  .game-inner{width:min(1180px,100%);height:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
  .learn-note{align-self:center;background:#fff3bf;border:2px solid #ead58a;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;flex:0 0 auto}
  .card{
    background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
  }
  .emoji-card{
    width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px;position:relative;overflow:hidden;min-height:0;flex:1 1 auto
  }
  .many-emoji-card{height:100%;max-height:calc(100vh - 178px)}
  .emoji-card .caption{position:absolute;top:8px;left:12px;font-size:12px;color:var(--muted);font-weight:900}
  .emoji-card .emoji-tap-hint{position:absolute;top:8px;right:12px;font-size:11px;color:var(--muted);font-weight:800;opacity:.85}
  .emoji-grid{
    width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:clamp(5px,1vw,14px);max-width:900px;max-height:100%;
    margin:0 auto;overflow:hidden
  }
  .emoji-row{
    display:flex;justify-content:center;align-items:center;flex:0 0 auto;max-width:100%;
    gap:clamp(5px,1vw,12px)
  }
  .emoji{
    width:var(--emojisz,0px);height:var(--emojisz,0px);font-size:var(--emojif,0px);
    line-height:1;text-align:center;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;overflow:hidden;
    font-family:var(--emoji-font);
    font-variant-emoji:emoji; font-synthesis:none;
  }
  .many-layout{display:grid;grid-template-rows:minmax(0,1.618fr) minmax(0,1fr);gap:9px;height:100%;min-height:0}
  .count-card{
    display:flex;gap:16px;justify-content:center;align-items:stretch;
    padding:12px;min-height:0;flex:1 1 0
  }
  .num-btn{
    flex:1 1 0;max-width:240px;min-width:64px;height:100%;min-height:0;
    padding:6px 10px;border-radius:24px;border:3px solid #eadfca;background:#fffaf4;
    font-size:clamp(44px,7.5vw,96px);font-weight:900;line-height:1;color:#4a3b31;
    box-shadow:0 6px 0 #dfd1bc;touch-action:manipulation
  }
  .num-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #dfd1bc}
  .num-btn.good{box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .num-btn.bad{animation:shake .28s;background:#ffe9e6!important;border-color:#e38a81!important}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .write-layout{display:grid;grid-template-rows:minmax(0,44%) minmax(0,56%);gap:9px;height:100%;min-height:0}
  .prompt-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:9px;min-height:0}
  .prompt-row .emoji-card{min-height:0;display:flex;align-items:center;justify-content:center}
  .target-preview{
    display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px;
    background:#fffaf0
  }
  .target-label{font-size:11px;color:var(--muted);font-weight:900;margin-bottom:2px}
  .target-number{font-size:clamp(54px,9vw,130px);line-height:.9;opacity:.16}
  .board-wrap{position:relative;min-height:0;background:#fff8c9;border:3px solid #e8d979;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
  #drawCanvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
  .board-guide{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  .guide-number{font-size:min(45vh,40vw,400px);font-weight:900;color:#665736;opacity:.13;line-height:.9}
  .guide-copy{position:absolute;top:7px;left:10px;font-size:11px;font-weight:900;color:#887b48;background:#fffbe3dd;padding:4px 7px;border-radius:9px}
  .finish{
    position:absolute;right:11px;bottom:11px;min-width:124px;height:56px;border-radius:16px;
    background:#d9a126;color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 #b77e19;z-index:2;touch-action:manipulation
  }
  .finish:active{transform:translateY(3px);box-shadow:0 2px 0 #b77e19}
  .status{
    min-height:51px;padding:7px 10px;background:rgba(255,250,240,.98);border-top:2px solid var(--line);
    display:flex;gap:8px;align-items:center;z-index:5
  }
  .status-pill{background:#f3eadb;border-radius:12px;padding:6px 9px;font-size:12px;font-weight:900;white-space:nowrap}
  button.status-pill{border:2px solid var(--line);background:#fff;min-height:34px}
  button.status-pill:hover{background:#fff3c4}
  .countdown{background:#fff3bf;border:2px solid #ead58a;min-width:86px;text-align:center}
  .countdown.big{font-size:17px;background:#ffe9a3;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .message{flex:1;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stars{font-size:23px;letter-spacing:1px;white-space:nowrap}
  .overlay{position:fixed;inset:0;background:rgba(61,45,26,.48);display:grid;place-items:center;padding:18px;z-index:20}
  .result{width:min(500px,100%);background:#fffaf0;border:3px solid var(--line);border-radius:27px;padding:24px;text-align:center;box-shadow:0 15px 40px #0004}
  .result h2{font-size:34px;margin:0 0 3px}
  .result .bigstars{font-size:54px;letter-spacing:2px;margin:6px 0}
  .score{font-size:19px;font-weight:900;margin-bottom:15px}
  .result button{height:50px;padding:0 22px;border-radius:14px;background:#d9a126;color:white;font-weight:900;font-size:18px}
  .hidden{display:none!important}

  /* 20 classroom / print-friendly colors */
  .color-1{background:#F94144!important;color:#fff!important}
  .color-2{background:#F3722C!important;color:#fff!important}
  .color-3{background:#F8961E!important;color:#fff!important}
  .color-4{background:#F9C74F!important;color:#4b3b00!important}
  .color-5{background:#90BE6D!important;color:#17320c!important}
  .color-6{background:#43AA8B!important;color:#fff!important}
  .color-7{background:#4D908E!important;color:#fff!important}
  .color-8{background:#277DA1!important;color:#fff!important}
  .color-9{background:#4895EF!important;color:#fff!important}
  .color-10{background:#4361EE!important;color:#fff!important}
  .color-11{background:#3A0CA3!important;color:#fff!important}
  .color-12{background:#7209B7!important;color:#fff!important}
  .color-13{background:#B5179E!important;color:#fff!important}
  .color-14{background:#F15BB5!important;color:#fff!important}
  .color-15{background:#FF66B3!important;color:#fff!important}
  .color-16{background:#00B4D8!important;color:#fff!important}
  .color-17{background:#00A896!important;color:#fff!important}
  .color-18{background:#8AC926!important;color:#163400!important}
  .color-19{background:#BC6C25!important;color:#fff!important}
  .color-20{background:#6C584C!important;color:#fff!important}
  .color-on.num-btn{border-color:rgba(255,255,255,.85)}

  @media (max-width:760px){
    .topbar{padding:5px 7px;gap:5px}
    .brand{width:100%;font-size:16px}
    .control{min-height:34px;padding:4px 7px}
    .seg button{min-height:28px;padding:0 8px;font-size:12px}
    .toggle span:first-child{font-size:12px}
    .game{padding:7px}
    .many-layout{gap:6px}
    .count-card{min-height:62px;padding:5px;gap:5px}
    .num-btn{height:55px;border-radius:13px}
    .prompt-row{grid-template-columns:minmax(0,1fr) 88px}
    .write-layout{grid-template-rows:minmax(0,46%) minmax(0,54%)}
    .finish{height:50px;min-width:110px;font-size:18px}
    .status{min-height:45px;padding:5px 7px}
    .status-pill{padding:5px 7px}.message{font-size:11px}.stars{font-size:20px}
  }
  @media (max-height:600px){
    .topbar{padding:4px 7px}.control{min-height:32px}.seg button{min-height:27px}
    .many-layout{gap:5px}.count-card{min-height:58px}.num-btn{height:50px}
    .status{min-height:42px}.emoji-grid{height:84%}.guide-copy{display:none}
  }
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">🌟 Count & Write</div>
    <div class="seg" id="modeSeg">
      <button data-mode="many" class="active">Many</button>
      <button data-mode="write">Write Many</button>
    </div>
    <label class="control">Lesson
      <select id="lesson"></select>
    </label>
    <button class="control toggle" id="sameToggle"><span>Same emoji</span><span class="switch on"><i></i></span></button>
    <button class="control toggle" id="colorToggle"><span>Colorful</span><span class="switch"><i></i></span></button>
    <button class="control toggle" id="autoToggle"><span>Auto</span><span class="switch"><i></i></span></button>
    <div class="control limit"><button id="minus">−</button><div class="limit-value" id="limitVal">4 choices</div><button id="plus">+</button></div>
    <div class="spacer"></div>
    <button class="control reset" id="newGame">↻ New round</button>
  </header>

  <main class="game">
    <div class="game-inner" id="game"></div>
  </main>

  <footer class="status">
    <div class="status-pill" id="roundText">Round 1</div>
    <div class="countdown hidden" id="countdown">5</div>
    <div class="message" id="statusMsg">Count the pictures, then tap the matching number.</div>
    <div class="stars" id="statusStars">☆☆☆</div>
    <button class="status-pill hidden" id="nextRoundShort">Next ➜</button>
  </footer>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="result">
    <h2 id="resultTitle">Great job!</h2>
    <div class="bigstars" id="bigStars">★★★</div>
    <div class="score" id="resultScore"></div>
    <button id="nextRound">Next round →</button>
  </div>
</div>

<script>
(() => {
  const EMOJIS = ["🍎","🍌","🍓","🍊","🍐","🍉","🥕","🌽","🍪","⭐","🐶","🐱","🐸","🐵","🦊","🐼","🦄","🚗","🚲","⚽","🎈","🧸","🌈","☀️"];
  const state = {mode:"many", same:true, colorful:false, auto:false, lesson:2, choices:4, target:2, round:1, correct:0, answered:false, stars:0, points:0, countdownTimer:null};

  const game = document.querySelector("#game"), lesson = document.querySelector("#lesson");
  const statusMsg = document.querySelector("#statusMsg"), statusStars = document.querySelector("#statusStars");
  const roundText = document.querySelector("#roundText"), limitVal = document.querySelector("#limitVal");
  const resultOverlay = document.querySelector("#resultOverlay"), resultScore = document.querySelector("#resultScore");
  const bigStars = document.querySelector("#bigStars");
  const countdownEl = document.querySelector("#countdown"), nextShortEl = document.querySelector("#nextRoundShort");

  function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

  // Friendly kid voice: says the number out loud.
  function speak(text){
    try{
      if(!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang="en-US"; u.rate=0.85; u.pitch=1.1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakNumber(n){
    const words=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
    speak(words[n]||n);
  }

  // Simple fun web-audio SFX (no files needed).
  let actx=null;
  function sfx(freq,when,dur,type="triangle",vol=0.28){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      const t=actx.currentTime+(when||0);
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function sfxCorrect(){
    sfx(523.25,0,0.14,"triangle"); sfx(659.25,0.11,0.14,"triangle");
    sfx(783.99,0.22,0.20,"triangle"); sfx(1046.5,0.34,0.30,"triangle");
  }
  function sfxWrong(){ sfx(196,0,0.22,"sawtooth",0.12); sfx(155.56,0.12,0.30,"sawtooth",0.12); }
  function sfxTick(){ sfx(987.77,0,0.07,"sine",0.18); }

  function clearCountdown(){
    if(state.countdownTimer){ clearInterval(state.countdownTimer); state.countdownTimer=null; }
    countdownEl.classList.add("hidden"); countdownEl.classList.remove("big");
  }

  // Curriculum: each lesson focuses on one number and only ever shows the
  // numbers the kid has already learned plus the very next one. Lesson N uses
  // 0..(N+1) up to 10, then for 11..20 moves on one number at a time up to 20.
  function lessonRange(){
    const n = state.lesson;
    const cap = n <= 10 ? 10 : 20;
    return [0, Math.min(n + 1, cap)];
  }

  function makeTarget(){
    state.target = state.lesson;
  }

  function choiceNumbers(){
    const out = new Set([state.target]);
    const [lo,hi] = lessonRange();
    const need = Math.min(state.choices, hi - lo + 1);
    let guard = 0;
    while(out.size < need && guard++ < 200){
      const x = rand(lo, hi);
      if(x!==state.target) out.add(x);
    }
    return shuffle([...out]);
  }

  function emojiItems(count){
    if(state.same){
      const e = EMOJIS[rand(0,EMOJIS.length-1)];
      return Array(count).fill(e);
    }
    return Array.from({length:count},()=>EMOJIS[rand(0,EMOJIS.length-1)]);
  }

  // Arrange the emojis in a book-like pattern of rows: each row is a "group",
// so 6 looks like 3+3, 8 like 4+4, 10 like two rows of 5 (a ten-frame), 9 like
// three rows of 3, etc. This builds the grouping/arrays intuition (5-group,
// 3-group, 2-group) that kids reuse later.
  function emojiGroups(n){
    const table={
      1:[1],2:[2],3:[3],4:[2,2],5:[5],
      6:[3,3],7:[5,2],8:[4,4],9:[3,3,3],10:[5,5],
      11:[5,3,3],12:[4,4,4],13:[5,4,4],14:[5,5,4],15:[5,5,5],
      16:[4,4,4,4],17:[5,4,4,4],18:[5,5,4,4],19:[5,5,5,4],20:[5,5,5,5]
    };
    if(table[n]) return table[n];
    const rows=[]; let rem=n;
    while(rem>5){ rows.push(5); rem-=5; }
    if(rem) rows.push(rem);
    return rows;
  }

  function emojiGridHtml(){
    const items = emojiItems(state.target);
    const groups = emojiGroups(items.length);
    const gap=`clamp(5px,1vw,14px)`;
    const rows=[];
    let idx=0;
    for(const g of groups){
      const cells = items.slice(idx, idx+g).map(e=>`<div class="emoji">${e}</div>`).join("");
      rows.push(`<div class="emoji-row" data-count="${g}">${cells}</div>`);
      idx += g;
    }
    return `<div class="emoji-grid" data-count="${items.length}" style="gap:${gap}">${rows.join("")}</div>`;
  }

  // Fit the grouped rows: every emoji gets the same size so the whole little
  // "book page" of groups fits the card, as big as possible without overlap.
  function fitEmojiGrid(root){
    if(!root)return;
    const rows=[...root.querySelectorAll(".emoji-row")];
    if(!rows.length)return;
    const cells=root.querySelectorAll(".emoji");
    if(!cells.length)return;

    const rect=root.getBoundingClientRect();
    const gap=parseFloat(getComputedStyle(root).gap)||8;
    const W=Math.max(1,rect.width), H=Math.max(1,rect.height);

    const itemsPerRow=Math.max(...rows.map(r=>r.querySelectorAll(".emoji").length));
    const rowCount=rows.length;

    const cellW=(W-gap*(itemsPerRow-1))/itemsPerRow;
    const cellH=(H-gap*(rowCount-1))/rowCount;
    const size=Math.max(22, Math.min(Math.floor(Math.min(cellW,cellH)*0.82), 260));
    root.style.setProperty("--emojisz", size+"px");
    root.style.setProperty("--emojif", Math.floor(size*0.9)+"px");
  }

  function fitAllEmoji(){
    document.querySelectorAll(".emoji-grid").forEach(fitEmojiGrid);
  }

  function render(){
    clearCountdown();
    state.answered=false; state.stars=0;
    roundText.textContent=`Round ${state.round}`;
    statusStars.textContent="☆☆☆";
    statusMsg.textContent=state.mode==="many" ? `Count the ${state.target === state.lesson ? "pictures" : "pictures"}, then tap ${state.lesson}.` : "Trace the number, then press Finish.";
    if(state.mode==="many") renderMany(); else renderWrite();
  }

  function renderMany(){
    const choices=choiceNumbers();
    game.innerHTML=`
      <div class="many-layout">
        <section class="card emoji-card many-emoji-card" id="manyEmojiCard">
          <div class="caption" id="manyCaption">Count ${state.target}</div>
          <div class="emoji-tap-hint">👆 Tap emoji to hear the number</div>
          ${emojiGridHtml()}
        </section>
        <section class="card count-card">
          ${choices.map((n,i)=>`<button class="num-btn ${state.colorful?'color-on color-'+((state.round+i)%20+1):''}" data-answer="${n}">${n}</button>`).join("")}
        </section>
      </div>
    `;
    const card=game.querySelector("#manyEmojiCard");
    card.addEventListener("click",()=>speakNumber(state.target),{passive:true});
    game.querySelectorAll(".num-btn").forEach(b=>b.addEventListener("click",()=>answerMany(+b.dataset.answer,b)));
    fitAllEmoji();
    setTimeout(fitAllEmoji,0);
  }

  function answerMany(n,btn){
    if(state.answered)return;
    if(n===state.target){
      state.answered=true; state.correct++; state.points+=10;
      playGood(btn);
      startAutoNext();
      speakNumber(state.target);
    }else{
      btn.classList.add("bad"); statusMsg.textContent="Try counting again. Look carefully!";
      statusStars.textContent="★☆☆";
      sfxWrong();
      setTimeout(()=>btn.classList.remove("bad"),320);
    }
  }

  function playGood(btn){
    btn.classList.add("good"); state.stars=3;
    statusMsg.textContent="Correct! 🎉 You counted them!";
    statusStars.textContent="★★★";
    sfxCorrect();
  }

  // After a correct answer: if Auto is off, stay and let the kid study the
  // answer. If Auto is on, run a 5-second countdown in the status bar, then
  // start the next puzzle.
  function startAutoNext(){
    nextShortEl.classList.add("hidden");
    if(!state.auto){
      statusMsg.textContent="Correct! 🎉 Study the answer. Tap Next when ready.";
      nextShortEl.classList.remove("hidden");
      return;
    }
    statusMsg.textContent=`Next puzzle in 5…`;
    let left=5;
    countdownEl.textContent=left;
    countdownEl.classList.remove("hidden");
    countdownEl.classList.add("big");
    sfxTick();
    state.countdownTimer=setInterval(()=>{
      left--;
      if(left<=0){
        clearCountdown();
        nextRound();
      }else{
        countdownEl.textContent=left;
        sfxTick();
      }
    },1000);
  }

  function renderWrite(){
    const emojis=emojiGridHtml();
    game.innerHTML=`
      <div class="write-layout">
        <div class="prompt-row">
          <section class="card emoji-card" id="writeEmojiCard">
            <div class="caption">Count ${state.target}</div>${emojis}
          </section>
          <section class="target-preview card">
            <div class="target-label">Trace this number</div><div class="target-number">${state.target}</div>
          </section>
        </div>
        <section class="board-wrap" id="board">
          <div class="board-guide"><div class="guide-number">${state.target}</div></div>
          <div class="guide-copy">Draw over the light number with a smooth, thick line ✏️</div>
          <canvas id="drawCanvas"></canvas>
          <button class="finish" id="finish">Finish ✓</button>
        </section>
      </div>
    `;
    canvas=document.querySelector("#drawCanvas"); ctx=canvas.getContext("2d");
    strokes=[]; current=null; setupCanvas();
    window.removeEventListener("resize",setupCanvas);
    window.addEventListener("resize",setupCanvas);
    window.removeEventListener("resize",fitAllEmoji);
    window.addEventListener("resize",fitAllEmoji);
    bindDrawing();
    game.querySelector("#writeEmojiCard").addEventListener("click",()=>speakNumber(state.target),{passive:true});
    document.querySelector("#finish").addEventListener("click",scoreDrawing);
    fitAllEmoji();
    setTimeout(fitAllEmoji,0);
  }

  function setupCanvas(){
    if(!canvas || !document.body.contains(canvas))return;
    const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;
    const oldStrokes=strokes.slice();
    canvas.width=Math.max(1,Math.round(r.width*d)); canvas.height=Math.max(1,Math.round(r.height*d));
    ctx.setTransform(d,0,0,d,0,0);
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.lineWidth=Math.max(9,Math.min(21,r.width*.021));
    ctx.strokeStyle="#66563f";
    strokes=oldStrokes;
    redrawAll();
  }

  function getPos(ev){
    const r=canvas.getBoundingClientRect();
    return {x:ev.clientX-r.left,y:ev.clientY-r.top};
  }
  function startDrawAt(x,y,id){
    if(state.answered)return;
    current=[{x,y}]; strokes.push(current);
    ctx.beginPath(); ctx.moveTo(x,y);
    if(canvas.setPointerCapture && id!=null){ try{canvas.setPointerCapture(id)}catch(e){} }
  }
  function moveDrawAt(x,y){
    if(!current)return;
    const last=current[current.length-1];
    if(Math.sqrt((x-last.x)*(x-last.x)+(y-last.y)*(y-last.y))<1.5)return;
    current.push({x,y}); ctx.lineTo(x,y); ctx.stroke();
  }
  function bindDrawing(){
    // Modern Pointer Events
    if(window.PointerEvent){
      canvas.onpointerdown=function(ev){ ev.preventDefault(); const p=getPos(ev); startDrawAt(p.x,p.y,ev.pointerId); };
      canvas.onpointermove=function(ev){ ev.preventDefault(); if(current){ const p=getPos(ev); moveDrawAt(p.x,p.y); } };
      canvas.onpointerup=canvas.onpointercancel=function(ev){ ev.preventDefault(); current=null; };
    } else {
      // Older Chrome: mouse + touch fallback.
      canvas.onmousedown=function(ev){ ev.preventDefault(); const p=getPos(ev); startDrawAt(p.x,p.y,null); };
      canvas.onmousemove=function(ev){ ev.preventDefault(); const p=getPos(ev); moveDrawAt(p.x,p.y); };
      canvas.onmouseup=canvas.onmouseleave=function(){ current=null; };
      canvas.ontouchstart=function(ev){ ev.preventDefault(); const t=ev.touches[0],r=canvas.getBoundingClientRect(); startDrawAt(t.clientX-r.left,t.clientY-r.top,null); };
      canvas.ontouchmove=function(ev){ ev.preventDefault(); const t=ev.touches[0],r=canvas.getBoundingClientRect(); if(t)moveDrawAt(t.clientX-r.left,t.clientY-r.top); };
      canvas.ontouchend=canvas.ontouchcancel=function(ev){ ev.preventDefault(); current=null; };
    }
  }

  function redrawAll(){
    if(!ctx||!canvas)return;
    const d=window.devicePixelRatio||1;
    ctx.clearRect(0,0,canvas.width/d,canvas.height/d);
    for(const s of strokes){
      if(s.length<2)continue;
      ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);
      for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);
      ctx.stroke();
    }
  }

  function analyzeDrawing(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    if(!strokes.length)return [0,0,1,.42];
    let total=0, inGuide=0, outGuide=0;
    const cx=w/2,cy=h/2;
    const guideH=Math.min(h*.72,430),guideW=guideH*.58;
    const x0=cx-guideW/2,x1=cx+guideW/2,y0=cy-guideH/2,y1=cy+guideH/2;
    for(const s of strokes){
      for(let i=1;i<s.length;i++){
        const a=s[i-1],b=s[i],d=Math.sqrt((b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y));
        total+=d; const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        const px=(mx-x0)/guideW,py=(my-y0)/guideH;
        const corridor=Math.abs(px-.5)<.42 && py>-.03 && py<1.03;
        if(corridor)inGuide+=d;else outGuide+=d;
      }
    }
    const coverage=clamp(inGuide/Math.max(total,1)*1.22,0,1);
    const overflow=clamp(outGuide/Math.max(total,1),0,1);
    const pathPenalty=clamp(Math.max(0,strokes.length-2)*.045,0,.28);
    const ink=clamp(total/(guideH*2.4),0,1);
    return [ink,coverage,overflow,pathPenalty];
  }

  function scoreDrawing(){
    if(state.answered)return;
    const [ink,coverage,overflow,pathPenalty]=analyzeDrawing();
    const quality=clamp(.62*coverage+.20*ink+.18*(1-overflow)-pathPenalty,0,1);
    const stars=quality>=.78?3:quality>=.50?2:1;
    state.stars=stars;state.answered=true;statusStars.textContent="★".repeat(stars)+"☆".repeat(3-stars);
    state.points+=stars*10;
    statusMsg.textContent=stars===3?"Beautiful number! 🌟":stars===2?"Nice job! Try staying closer to the guide.":"Good try! Let's practice this number again.";
    showResult(stars,quality);
  }

  function showResult(stars,quality){
    bigStars.textContent="★".repeat(stars)+"☆".repeat(3-stars);
    resultScore.textContent=`Score ${Math.round(quality*100)}% · ${state.target} was the number`;
    resultOverlay.classList.remove("hidden");
    // Write mode: honor the Auto toggle too — count down then auto-advance.
    if(state.auto && !state.countdownTimer){
      let left=5;
      countdownEl.textContent=left;
      countdownEl.classList.remove("hidden");
      state.countdownTimer=setInterval(()=>{
        left--;
        if(left<=0){
          clearCountdown();
          nextRound();
        }else{
          countdownEl.textContent=left;
        }
      },1000);
    }
  }
  function nextRound(){
    clearCountdown();
    nextShortEl.classList.add("hidden");
    resultOverlay.classList.add("hidden");state.round++;makeTarget();render();
  }

  document.querySelector("#modeSeg").addEventListener("click",e=>{
    const b=e.target.closest("button[data-mode]"); if(!b)return;
    state.mode=b.dataset.mode;
    document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("active",x===b));
    state.round=1; makeTarget(); render();
  });
  lesson.addEventListener("change",()=>{state.lesson=+lesson.value;state.round=1;makeTarget();render()});
  document.querySelector("#sameToggle").addEventListener("click",()=>{
    state.same=!state.same;document.querySelector("#sameToggle .switch").classList.toggle("on",state.same);render();
  });
  document.querySelector("#colorToggle").addEventListener("click",()=>{
    state.colorful=!state.colorful;
    document.querySelector("#colorToggle .switch").classList.toggle("on",state.colorful);
    render();
  });
  const autoSwitch=document.querySelector("#autoToggle .switch");
  autoSwitch.classList.toggle("on",state.auto);
  document.querySelector("#autoToggle").addEventListener("click",()=>{
    state.auto=!state.auto;
    autoSwitch.classList.toggle("on",state.auto);
    if(state.auto){ nextShortEl.classList.add("hidden"); }
    statusMsg.textContent = state.auto ? "Auto on: next puzzle starts after the countdown." : "Auto off: stay on the puzzle to study the answer.";
  });
  document.querySelector("#minus").addEventListener("click",()=>{state.choices=clamp(state.choices-1,1,8);limitVal.textContent=`${state.choices} choice${state.choices===1?"":"s"}`;render()});
  document.querySelector("#plus").addEventListener("click",()=>{state.choices=clamp(state.choices+1,1,8);limitVal.textContent=`${state.choices} choices`;render()});
  document.querySelector("#newGame").addEventListener("click",()=>{state.round=1;makeTarget();render()});
  document.querySelector("#nextRound").addEventListener("click",nextRound);
  nextShortEl.addEventListener("click",nextRound);
  window.addEventListener("resize",fitAllEmoji);

  function populateLessons(){
    lesson.innerHTML="";
    for(let i=1;i<=20;i++){
      const o=document.createElement("option");
      o.value=i; o.textContent=i;
      if(i===state.lesson) o.selected=true;
      lesson.appendChild(o);
    }
  }

  populateLessons(); makeTarget(); render();
})();
</script>
</body>
</html>

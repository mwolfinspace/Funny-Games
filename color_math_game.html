<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Màu Sắc & Phép Tính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Sans Symbols';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Restore padding for margins */
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1600px; /* Make it wider */
            width: 100%;
            min-height: 80vh; /* Make it taller */
            display: flex; /* Use flex to better arrange content */
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 3rem;
        }
        h2 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 20px;
        }
        
        /* Bước 1 */
        .step1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 90%;
            flex-grow: 1;
            justify-content: center;
        }
        .expression {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            border: 4px solid #333;
        }
        .circle:hover {
            transform: scale(1.1);
        }
        .operator {
            width: 80px;
            height: 80px;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            background: white;
        }
        .operator:hover {
            transform: scale(1.1);
        }
        .equals {
            font-size: 48px;
            font-weight: bold;
        }
        .result-box {
            width: 110px;
            height: 110px;
            border: 4px solid #333;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: black;
        }
        
        /* Bước 2 */
        .step2 {
            display: none;
            width: 100%;
            flex-grow: 1;
            justify-content: flex-start; /* Aligned to top */
            align-items: center;
            flex-direction: column;
        }
        .game-area {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
            justify-content: space-evenly;
            align-items: flex-start;
        }
        .number-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .number-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0f0f0;
            border: 3px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: black;
            cursor: move;
            user-select: none;
        }
        .triangle-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .triangle {
            position: relative;
            width: 360px;
            height: 312px;
        }
        .triangle-shape {
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 312px solid #e0e0e0;
        }
        .vertex {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: black;
        }
        .vertex-top {
            top: -40px;
            left: 140px;
            background: #f87171;
        }
        .vertex-left {
            bottom: -40px;
            left: -40px;
            background: #60a5fa;
        }
        .vertex-right {
            bottom: -40px;
            right: -40px;
            background: #facc15;
        }
        .center-result {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: white;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: black;
        }
        .history-panel {
            min-width: 350px;
            max-height: 60vh;
            overflow-y: auto;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            background: #f9f9f9;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .history-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: black;
        }
        .history-result {
            font-size: 24px;
        }
        
        button {
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            border: 2px solid #828eeF;
            background: #5568d3;
        }
        .btn-secondary {
            background: #48bb78;
            color: white;
        }
        .btn-secondary:hover {
            border: 2px solid #68c798;
            background: #38a169;
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover {
            border: 2px solid #f78585;
            background: #e53e3e;
        }
        .btn-info {
            background: #0dcaf0;
            color: white;
        }
        .btn-info:hover {
            border: 2px solid #3dd2f2;
            background: #0aa9c4;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .revealed-expression {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border: 3px solid #ffc107;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .vertex.drop-over {
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        .cauldron-container {
            width: 250px;
            margin-top: 20px;
        }
        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.5); 
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto; 
            padding: 30px;
            border: 1px solid #888;
            width: 80%;
            max-width: 700px;
            border-radius: 15px;
            position: relative;
            line-height: 1.6;
        }
        .modal-close {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 25px;
            font-size: 35px;
            font-weight: bold;
        }
        .modal-close:hover,
        .modal-close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        #helpContent h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        #helpContent p, #helpContent ul {
            text-align: left;
            margin-bottom: 10px;
        }
        #helpContent li {
            margin-left: 20px;
        }
        .help-btn {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
            display: inline-block;
        }
        .help-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>

                'help-step2-title': '<h3>Step 2 Guide</h3>',
                'help-step2-p': '<p>The goal of this step is to find the numerical value (from 0-9) for each color to solve the secret expression from Step 1.</p>',
                'help-step2-li1': '<li>Drag numbers from the number panel and drop them onto the 3 vertices of the triangle (🔴, 🟡, 🔵) to assign them values.</li>',
                'help-step2-li2': '<li>Click the "Start ▶️" button to perform the calculation with the values you have assigned.</li>',
                'help-step2-li3': '<li>The result of the calculation will appear in the center of the triangle. A history of your attempts will be recorded in the panel on the right.</li>',
                'help-step2-li4': '<li><strong>Answer Button 💡:</strong> If you get stuck, this button will reveal what the secret expression was.</li>',
                'help-step2-li5': '<li><strong>Replay Button 🔄:</strong> Returns to Step 1 to create a new puzzle.</li>',
            }
        };

        // Trạng thái trò chơi
        const colorHex = { red: '#f87171', gold: '#facc15', blue: '#60a5fa' };
        const colors = ['red', 'gold', 'blue'];
        const operators = ['+', '×', '-'];
        let colorState = {
            circle1: 0, // red
            circle2: 1, // gold
            circle3: 2  // blue
        };
        let opState = {
            op1: 0, // +
            op2: 0  // +
        };
        let vertexValues = {
            red: null,
            blue: null,
            gold: null
        };
        let history = [];
        let draggedNumber = null;

        // Khởi tạo panel số
        function initNumberPanel() {
            const panel = document.getElementById('numberPanel');
            panel.innerHTML = ''; // Clear panel before init
            for (let i = 0; i <= 9; i++) {
                const circle = document.createElement('div');
                circle.className = 'number-circle';
                circle.textContent = i;
                circle.draggable = true;
                circle.addEventListener('dragstart', (e) => {
                    draggedNumber = i;
                });
                circle.addEventListener('dragend', (e) => {
                    draggedNumber = null;
                });
                panel.appendChild(circle);
            }
        }

        // Xử lý click hình tròn màu
        document.getElementById('circle1').addEventListener('click', () => cycleColor('circle1'));
        document.getElementById('circle2').addEventListener('click', () => cycleColor('circle2'));
        document.getElementById('circle3').addEventListener('click', () => cycleColor('circle3'));

        function cycleColor(id) {
            colorState[id] = (colorState[id] + 1) % 3;
            document.getElementById(id).style.background = colorHex[colors[colorState[id]]];
        }

        // Xử lý click phép toán
        document.getElementById('op1').addEventListener('click', () => cycleOperator('op1'));
        document.getElementById('op2').addEventListener('click', () => cycleOperator('op2'));

        function cycleOperator(id) {
            opState[id] = (opState[id] + 1) % 3;
            document.getElementById(id).textContent = operators[opState[id]];
        }

        function randomizeExpression() {
            const advancedMode = document.getElementById('advancedMode').checked;

            // Randomize colors
            if (advancedMode) {
                colorState.circle1 = Math.floor(Math.random() * 3);
                colorState.circle2 = Math.floor(Math.random() * 3);
                colorState.circle3 = Math.floor(Math.random() * 3);
            } else {
                // Shuffle colors [0, 1, 2] to ensure uniqueness
                const shuffledColors = [0, 1, 2].sort(() => Math.random() - 0.5);
                colorState.circle1 = shuffledColors[0];
                colorState.circle2 = shuffledColors[1];
                colorState.circle3 = shuffledColors[2];
            }

            // Randomize operators
            opState.op1 = Math.floor(Math.random() * 3);
            opState.op2 = Math.floor(Math.random() * 3);

            // Update UI
            document.getElementById('circle1').style.background = colorHex[colors[colorState.circle1]];
            document.getElementById('circle2').style.background = colorHex[colors[colorState.circle2]];
            document.getElementById('circle3').style.background = colorHex[colors[colorState.circle3]];
            document.getElementById('op1').textContent = operators[opState.op1];
            document.getElementById('op2').textContent = operators[opState.op2];
        }

        // Kiểm tra và chuyển sang bước 2
        function continueToStep2() {
            const usedColors = [colorState.circle1, colorState.circle2, colorState.circle3];
            const uniqueColors = new Set(usedColors);
            const advancedMode = document.getElementById('advancedMode').checked;
            
            if (!advancedMode && uniqueColors.size !== 3) {
                alert(translations[currentLang]['alert-unique-colors']);
                return;
            }
            
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            if(document.getElementById('numberPanel').childElementCount === 0) {
                initNumberPanel();
                setupDragDrop();
            }
        }

        // Thiết lập drag & drop
        function setupDragDrop() {
            const vertices = [
                document.getElementById('vertexRed'),
                document.getElementById('vertexBlue'),
                document.getElementById('vertexYellow')
            ];

            vertices.forEach(vertex => {
                vertex.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    vertex.classList.add('drop-over');
                });
                
                vertex.addEventListener('dragleave', (e) => {
                    vertex.classList.remove('drop-over');
                });
                
                vertex.addEventListener('drop', (e) => {
                    e.preventDefault();
                    vertex.classList.remove('drop-over');
                    if (draggedNumber !== null) {
                        const color = vertex.dataset.color;
                        vertexValues[color] = draggedNumber;
                        vertex.textContent = draggedNumber;
                    }
                });
            });
        }

        // Tính toán kết quả
        function calculate() {
            if (vertexValues.red === null || vertexValues.blue === null || vertexValues.gold === null) {
                alert(translations[currentLang]['alert-fill-numbers']);
                return;
            }

            // Lấy giá trị theo thứ tự trong biểu thức
            const val1 = vertexValues[colors[colorState.circle1]];
            const val2 = vertexValues[colors[colorState.circle2]];
            const val3 = vertexValues[colors[colorState.circle3]];
            
            const op1 = operators[opState.op1];
            const op2 = operators[opState.op2];

            // Tính toán theo thứ tự ưu tiên
            let result;
            if (op1 === '×' && op2 !== '×') {
                result = performOperation(val1, val2, op1);
                result = performOperation(result, val3, op2);
            } else if (op2 === '×' && op1 !== '×') {
                const temp = performOperation(val2, val3, op2);
                result = performOperation(val1, temp, op1);
            } else {
                result = performOperation(val1, val2, op1);
                result = performOperation(result, val3, op2);
            }

            document.getElementById('centerResult').textContent = result;

            // Thêm vào lịch sử
            addToHistory(vertexValues.red, vertexValues.blue, vertexValues.gold, result);
        }

        function performOperation(a, b, op) {
            switch(op) {
                case '+': return a + b;
                case '-': return a - b;
                case '×': return a * b;
            }
        }

        // Thêm vào lịch sử
        function addToHistory(red, blue, yellow, result) {
            const newEntry = { red, blue, yellow };

            const isDuplicate = history.some(entry => 
                entry.red === newEntry.red && 
                entry.blue === newEntry.blue && 
                entry.yellow === newEntry.yellow
            );

            if (isDuplicate) {
                return; 
            }

            history.push(newEntry);

            const historyPanel = document.getElementById('historyPanel');
            const item = document.createElement('div');
            item.className = 'history-item';
            
            item.innerHTML = `
                <div class="history-circle" style="background: ${colorHex.red};">${red}</div>
                <div class="history-circle" style="background: ${colorHex.blue};">${blue}</div>
                <div class="history-circle" style="background: ${colorHex.gold};">${yellow}</div>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;"><path d="M5 12H19" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 5L19 12L12 19" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <strong class="history-result">${result}</strong>
            `;
            
            historyPanel.appendChild(item);
        }

        // Hiện đáp án
        function showAnswer() {
            const color1 = colors[colorState.circle1];
            const color2 = colors[colorState.circle2];
            const color3 = colors[colorState.circle3];
            const op1 = operators[opState.op1];
            const op2 = operators[opState.op2];
            
            const colorNames = {
                'red': '🔴 ' + (currentLang === 'vie' ? 'Đỏ' : 'Red'),
                'blue': '🔵 ' + (currentLang === 'vie' ? 'Xanh' : 'Blue'),
                'gold': '🟡 ' + (currentLang === 'vie' ? 'Vàng' : 'Yellow')
            };
            
            const expression = `${colorNames[color1]} ${op1} ${colorNames[color2]} ${op2} ${colorNames[color3]}`;
            
            const revealDiv = document.getElementById('revealedExpression');
            revealDiv.className = 'revealed-expression';
            revealDiv.innerHTML = translations[currentLang]['revealed-expression-title'] + expression;
            revealDiv.style.display = 'block';
        }

        // Về trang chủ
        function goHome() {
            // Reset tất cả trạng thái
            colorState = { circle1: 0, circle2: 1, circle3: 2 };
            opState = { op1: 0, op2: 0 };
            vertexValues = { red: null, blue: null, gold: null };
            history = [];
            
            // Reset giao diện bước 1
            document.getElementById('circle1').style.background = colorHex[colors[0]];
            document.getElementById('circle2').style.background = colorHex[colors[1]];
            document.getElementById('circle3').style.background = colorHex[colors[2]];
            document.getElementById('op1').textContent = '+';
            document.getElementById('op2').textContent = '+';
            document.getElementById('advancedMode').checked = false;
            
            // Reset giao diện bước 2
            document.getElementById('vertexRed').textContent = '';
            document.getElementById('vertexBlue').textContent = '';
            document.getElementById('vertexYellow').textContent = '';
            document.getElementById('centerResult').textContent = '?';
            document.getElementById('historyPanel').innerHTML = `<h3 id="history-title">${translations[currentLang]['history-title']}</h3>`;
            document.getElementById('revealedExpression').style.display = 'none';
            
            // Chuyển về bước 1
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'flex';
        }

        function getHelpText(step) {
            const lang = translations[currentLang];
            let content = '';
            if (step === 1) {
                content = `
                    ${lang['help-step1-title']}
                    ${lang['help-step1-p']}
                    <ul>
                        ${lang['help-step1-li1']}
                        ${lang['help-step1-li2']}
                        ${lang['help-step1-li3']}
                        ${lang['help-step1-li4']}
                        ${lang['help-step1-li5']}
                    </ul>
                `;
            } else {
                content = `
                    ${lang['help-step2-title']}
                    ${lang['help-step2-p']}
                    <ul>
                        ${lang['help-step2-li1']}
                        ${lang['help-step2-li2']}
                        ${lang['help-step2-li3']}
                        ${lang['help-step2-li4']}
                        ${lang['help-step2-li5']}
                    </ul>
                `;
            }
            return content;
        }

        function showHelp(step) {
            document.getElementById('helpContent').innerHTML = getHelpText(step);
            document.getElementById('helpModal').style.display = 'block';
        }

        function hideHelp() {
            document.getElementById('helpModal').style.display = 'none';
        }

        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('helpModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function applyTranslations() {
            const lang = translations[currentLang];
            document.title = lang['page-title'];
            // Apply translations to all static elements
            Object.keys(lang).forEach(key => {
                if (key.startsWith('help-') || key.startsWith('alert-')) return;
                const el = document.getElementById(key);
                if (el) {
                    el.innerHTML = lang[key];
                }
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'vie' ? 'eng' : 'vie';
            document.getElementById('lang-toggle').textContent = currentLang === 'vie' ? 'ENG' : 'VIE';
            applyTranslations();
            hideHelp(); // Close help modal on language change to prevent stale text
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
        });
    </script>

    <!-- Help Modal -->
    <div id="helpModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="hideHelp()">&times;</span>
            <div id="helpContent">
                <!-- Help text will be injected here by JavaScript -->
            </div>
        </div>
    </div>
</body>
</html>

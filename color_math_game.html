<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Màu Sắc & Phép Tính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Sans Symbols';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Restore padding for margins */
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1600px; /* Make it wider */
            width: 100%;
            min-height: 80vh; /* Make it taller */
            display: flex; /* Use flex to better arrange content */
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 3rem;
        }
        h2 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 20px;
        }
        
        /* Bước 1 */
        .step1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 90%;
            flex-grow: 1;
            justify-content: center;
        }
        .expression {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            border: 4px solid #333;
        }
        .circle:hover {
            transform: scale(1.1);
        }
        .operator {
            width: 80px;
            height: 80px;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            background: white;
        }
        .operator:hover {
            transform: scale(1.1);
        }
        .equals {
            font-size: 48px;
            font-weight: bold;
        }
        .result-box {
            width: 110px;
            height: 110px;
            border: 4px solid #333;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: black;
        }
        
        /* Bước 2 */
        .step2 {
            display: none;
            width: 100%;
            flex-grow: 1;
            justify-content: flex-start; /* Aligned to top */
            align-items: center;
            flex-direction: column;
        }
        .game-area {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
            justify-content: space-evenly;
            align-items: flex-start;
        }
        .number-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .number-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0f0f0;
            border: 3px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: black;
            cursor: move;
            user-select: none;
        }
        .triangle-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .triangle {
            position: relative;
            width: 360px;
            height: 312px;
        }
        .triangle-shape {
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 312px solid #e0e0e0;
        }
        .vertex {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: black;
        }
        .vertex-top {
            top: -40px;
            left: 140px;
            background: #f87171;
        }
        .vertex-left {
            bottom: -40px;
            left: -40px;
            background: #60a5fa;
        }
        .vertex-right {
            bottom: -40px;
            right: -40px;
            background: #facc15;
        }
        .center-result {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: white;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: black;
        }
        .history-panel {
            min-width: 350px;
            max-height: 60vh;
            overflow-y: auto;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            background: #f9f9f9;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .history-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: black;
        }
        
        button {
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            border: 2px solid #828eeF;
            background: #5568d3;
        }
        .btn-secondary {
            background: #48bb78;
            color: white;
        }
        .btn-secondary:hover {
            border: 2px solid #68c798;
            background: #38a169;
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover {
            border: 2px solid #f78585;
            background: #e53e3e;
        }
        .btn-info {
            background: #0dcaf0;
            color: white;
        }
        .btn-info:hover {
            border: 2px solid #3dd2f2;
            background: #0aa9c4;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .revealed-expression {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border: 3px solid #ffc107;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .vertex.drop-over {
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        .cauldron-container {
            width: 250px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Trò Chơi Màu Sắc & Phép Tính</h1>
        
        <!-- Bước 1 -->
        <div class="step1" id="step1">
            <h2>Bước 1: Thiết Lập Biểu Thức Bí Ẩn</h2>
            <div class="expression">
                <div class="circle" id="circle1" style="background: #f87171;"></div>
                <div class="operator" id="op1">+</div>
                <div class="circle" id="circle2" style="background: #facc15;"></div>
                <div class="operator" id="op2">+</div>
                <div class="circle" id="circle3" style="background: #60a5fa;"></div>
                <div class="equals">=</div>
                <div class="result-box">?</div>
            </div>
            <div style="margin: 20px 0;">
                <label style="font-size: 16px; cursor: pointer;">
                    <input type="checkbox" id="advancedMode" style="width: 18px; height: 18px; cursor: pointer; vertical-align: middle;">
                    <strong> Chế độ nâng cao</strong> (Cho phép trùng màu)
                </label>
            </div>
            <div class="buttons">
                <button class="btn-primary" onclick="continueToStep2()">Tiếp Tục ⏩</button>
                <button class="btn-info" onclick="window.location.href='index.html'">Về Menu ⏪</button>
            </div>
        </div>
        
        <!-- Bước 2 -->
        <div class="step2" id="step2">
            <h2>Bước 2: Giải Đố</h2>
            <div class="game-area">
                <div class="number-panel" id="numberPanel"></div>
                
                <div class="triangle-area">
                    <div class="triangle">
                        <div class="triangle-shape"></div>
                        <div class="vertex vertex-top" id="vertexRed" data-color="red"></div>
                        <div class="vertex vertex-left" id="vertexBlue" data-color="blue"></div>
                        <div class="vertex vertex-right" id="vertexYellow" data-color="gold"></div>
                        <div class="center-result" id="centerResult">?</div>
                    </div>
                    <div class="cauldron-container">
                        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="#000000" stroke="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#1c1717" stroke-width="34.816"><path fill="#da8610" d="M410.478 374.033c50.192-40.902 82.002-101.322 82.002-168.791 0-39.775-11.145-77.055-30.493-109.388a207.118 207.118 0 0 0 5.876-1.474c12.638-3.438 20.085-16.457 16.66-29.095-3.425-12.638-16.424-20.108-29.093-16.702-.733.199-74.898 19.832-193.895 19.832-110.53 0-202.801-19.902-203.718-20.103-12.818-2.797-25.447 5.308-28.254 18.101-2.804 12.798 5.292 25.445 18.091 28.253.315.07 1.27.276 2.707.574-19.575 32.472-30.84 69.98-30.84 110.002 0 68.303 32.587 129.4 83.864 170.31l-24.663 55.324c-5.338 11.965.042 25.993 12.007 31.327 12.296 5.259 26.798-2.42 31.332-12.012l21.674-48.613c33.399 17.026 71.63 26.698 112.263 26.698 41.476 0 80.435-10.097 114.325-27.786l22.157 49.702c7.795 11.978 19.23 17.286 31.331 12.011 11.966-5.334 17.346-19.361 12.007-31.326zm-90.163-242.518c-7.512 24.69-2.9 36.895 3.11 54.952 5.987 17.983-6.469 29.056-14.63 29.056-8.156 0-21.41-11.499-14.918-29.056 13.532-36.59-8.026-54.037-8.615-53.989-.033.003-8.379 11.894-7.907 26.89 1.118 35.315 13.779 94.118-1.723 94.118-15.826 0 .463-81.382-31.972-116.972-26.704 1.119-26.015-1.388-47.65-2.632-23.353 16.934-8.423 44.864-21.866 44.864-15.428 0-1.586-21.75-8.458-31.726-17.374-25.214-37.565-7.444-38.913 3.145.222 18.93 4.249 27.993 5.204 33.82 1.826 11.155-6.168 20.464-13.773 20.464-7.609 0-13.777-9.16-13.777-20.464 0-5.677 5.037-18.096 6.905-33.982-5.262-21.376-13.898-38.007-33.576-45.124 83.853 9.403 240.356 19.834 344.19 3.476-31.871 12.565-71.261 20.029-101.69 23.006.013.054.078.098.06.154z"></path></g><g id="SVGRepo_iconCarrier"><path fill="#da8610" d="M410.478 374.033c50.192-40.902 82.002-101.322 82.002-168.791 0-39.775-11.145-77.055-30.493-109.388a207.118 207.118 0 0 0 5.876-1.474c12.638-3.438 20.085-16.                     </div>
                    <div class="buttons">
                        <button class="btn-secondary" onclick="calculate()">Bắt đầu ▶️</button>
                        <button class="btn-primary" onclick="showAnswer()">Đáp án 💡</button>
                        <button class="btn-primary" onclick="goHome()">Chơi lại 🔄</button>
                        <button class="btn-info" onclick="window.location.href='index.html'">Về Menu ⏪</button>
                    </div>
                    <div id="revealedExpression" style="display: none;"></div>
                </div>
                
                <div class="history-panel" id="historyPanel">
                    <h3>Lịch sử</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Trạng thái trò chơi
        const colorHex = { red: '#f87171', gold: '#facc15', blue: '#60a5fa' };
        const colors = ['red', 'gold', 'blue'];
        const operators = ['+', '×', '-'];
        let colorState = {
            circle1: 0, // red
            circle2: 1, // gold
            circle3: 2  // blue
        };
        let opState = {
            op1: 0, // +
            op2: 0  // +
        };
        let vertexValues = {
            red: null,
            blue: null,
            gold: null
        };
        let history = [];
        let draggedNumber = null;

        // Khởi tạo panel số
        function initNumberPanel() {
            const panel = document.getElementById('numberPanel');
            for (let i = 0; i <= 9; i++) {
                const circle = document.createElement('div');
                circle.className = 'number-circle';
                circle.textContent = i;
                circle.draggable = true;
                circle.addEventListener('dragstart', (e) => {
                    draggedNumber = i;
                });
                circle.addEventListener('dragend', (e) => {
                    draggedNumber = null;
                });
                panel.appendChild(circle);
            }
        }

        // Xử lý click hình tròn màu
        document.getElementById('circle1').addEventListener('click', () => cycleColor('circle1'));
        document.getElementById('circle2').addEventListener('click', () => cycleColor('circle2'));
        document.getElementById('circle3').addEventListener('click', () => cycleColor('circle3'));

        function cycleColor(id) {
            colorState[id] = (colorState[id] + 1) % 3;
            document.getElementById(id).style.background = colorHex[colors[colorState[id]]];
        }

        // Xử lý click phép toán
        document.getElementById('op1').addEventListener('click', () => cycleOperator('op1'));
        document.getElementById('op2').addEventListener('click', () => cycleOperator('op2'));

        function cycleOperator(id) {
            opState[id] = (opState[id] + 1) % 3;
            document.getElementById(id).textContent = operators[opState[id]];
        }

        // Kiểm tra và chuyển sang bước 2
        function continueToStep2() {
            const usedColors = [colorState.circle1, colorState.circle2, colorState.circle3];
            const uniqueColors = new Set(usedColors);
            const advancedMode = document.getElementById('advancedMode').checked;
            
            if (!advancedMode && uniqueColors.size !== 3) {
                alert('Vui lòng chọn 3 màu khác nhau cho biểu thức!\n(Hoặc bật chế độ nâng cao để cho phép trùng màu)');
                return;
            }
            
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            initNumberPanel();
            setupDragDrop();
        }

        // Thiết lập drag & drop
        function setupDragDrop() {
            const vertices = [
                document.getElementById('vertexRed'),
                document.getElementById('vertexBlue'),
                document.getElementById('vertexYellow')
            ];

            vertices.forEach(vertex => {
                vertex.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    vertex.classList.add('drop-over');
                });
                
                vertex.addEventListener('dragleave', (e) => {
                    vertex.classList.remove('drop-over');
                });
                
                vertex.addEventListener('drop', (e) => {
                    e.preventDefault();
                    vertex.classList.remove('drop-over');
                    if (draggedNumber !== null) {
                        const color = vertex.dataset.color;
                        vertexValues[color] = draggedNumber;
                        vertex.textContent = draggedNumber;
                    }
                });
            });
        }

        // Tính toán kết quả
        function calculate() {
            if (vertexValues.red === null || vertexValues.blue === null || vertexValues.gold === null) {
                alert('Vui lòng điền đủ 3 số vào các hình tròn màu!');
                return;
            }

            // Lấy giá trị theo thứ tự trong biểu thức
            const val1 = vertexValues[colors[colorState.circle1]];
            const val2 = vertexValues[colors[colorState.circle2]];
            const val3 = vertexValues[colors[colorState.circle3]];
            
            const op1 = operators[opState.op1];
            const op2 = operators[opState.op2];

            // Tính toán theo thứ tự ưu tiên
            let result;
            if (op1 === '×' && op2 !== '×') {
                result = performOperation(val1, val2, op1);
                result = performOperation(result, val3, op2);
            } else if (op2 === '×' && op1 !== '×') {
                const temp = performOperation(val2, val3, op2);
                result = performOperation(val1, temp, op1);
            } else {
                result = performOperation(val1, val2, op1);
                result = performOperation(result, val3, op2);
            }

            document.getElementById('centerResult').textContent = result;

            // Thêm vào lịch sử
            addToHistory(vertexValues.red, vertexValues.blue, vertexValues.gold, result);
        }

        function performOperation(a, b, op) {
            switch(op) {
                case '+': return a + b;
                case '-': return a - b;
                case '×': return a * b;
            }
        }

        // Thêm vào lịch sử
        function addToHistory(red, blue, yellow, result) {
            const newEntry = { red, blue, yellow };

            const isDuplicate = history.some(entry => 
                entry.red === newEntry.red && 
                entry.blue === newEntry.blue && 
                entry.yellow === newEntry.yellow
            );

            if (isDuplicate) {
                return; 
            }

            history.push(newEntry);

            const historyPanel = document.getElementById('historyPanel');
            const item = document.createElement('div');
            item.className = 'history-item';
            
            item.innerHTML = `
                <div class="history-circle" style="background: ${colorHex.red};">${red}</div>
                <div class="history-circle" style="background: ${colorHex.blue};">${blue}</div>
                <div class="history-circle" style="background: ${colorHex.gold};">${yellow}</div>
                <span>➡</span>
                <strong>${result}</strong>
            `;
            
            historyPanel.appendChild(item);
        }

        // Hiện đáp án
        function showAnswer() {
            const color1 = colors[colorState.circle1];
            const color2 = colors[colorState.circle2];
            const color3 = colors[colorState.circle3];
            const op1 = operators[opState.op1];
            const op2 = operators[opState.op2];
            
            const colorNames = {
                'red': '🔴 Đỏ',
                'blue': '🔵 Xanh',
                'gold': '🟡 Vàng'
            };
            
            const expression = `${colorNames[color1]} ${op1} ${colorNames[color2]} ${op2} ${colorNames[color3]}`;
            
            const revealDiv = document.getElementById('revealedExpression');
            revealDiv.className = 'revealed-expression';
            revealDiv.innerHTML = `<strong>Biểu thức bí ẩn:</strong><br>${expression}`;
            revealDiv.style.display = 'block';
        }

        // Về trang chủ
        function goHome() {
            // Reset tất cả trạng thái
            colorState = {
                circle1: 0,
                circle2: 1,
                circle3: 2
            };
            opState = {
                op1: 0,
                op2: 0
            };
            vertexValues = {
                red: null,
                blue: null,
                gold: null
            };
            history = [];
            
            // Reset giao diện bước 1
            document.getElementById('circle1').style.background = colorHex[colors[0]];
            document.getElementById('circle2').style.background = colorHex[colors[1]];
            document.getElementById('circle3').style.background = colorHex[colors[2]];
            document.getElementById('op1').textContent = '+';
            document.getElementById('op2').textContent = '+';
            document.getElementById('advancedMode').checked = false;
            
            // Reset giao diện bước 2
            document.getElementById('vertexRed').textContent = '';
            document.getElementById('vertexBlue').textContent = '';
            document.getElementById('vertexYellow').textContent = '';
            document.getElementById('centerResult').textContent = '?';
            document.getElementById('historyPanel').innerHTML = '<h3>Lịch sử</h3>';
            document.getElementById('revealedExpression').style.display = 'none';
            
            // Chuyển về bước 1
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'flex';
        }
    </script>
</body>
</html>

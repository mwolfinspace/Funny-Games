<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Adventure — Cambridge YLE Vocabulary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div id="app">
  <header id="topbar" class="topbar"></header>
  <main id="screen" class="screen"></main>
</div>

<div id="modal-root"></div>
<noscript><div class="noscript">Please enable JavaScript to play. / Vui lòng bật JavaScript.</div></noscript>

<!-- ═══ Virtual keyboard (keyboard.html, glass skin) ═══
     Keys that type into the game carry data-k (the character) or data-act
     (back / enter / space / prev / next). Everything else is decorative. -->
<template id="kb-tpl">
<div class="vkb">
  <div class="row">
    <button type="button" style="flex:1.4" class="text left">tab</button>
    <button type="button" data-k="q">Q</button>
    <button type="button" data-k="w">W</button>
    <button type="button" data-k="e">E</button>
    <button type="button" data-k="r">R</button>
    <button type="button" data-k="t">T</button>
    <button type="button" data-k="y">Y</button>
    <button type="button" data-k="u">U</button>
    <button type="button" data-k="i">I</button>
    <button type="button" data-k="o">O</button>
    <button type="button" data-k="p">P</button>
    <button type="button" data-k="-">-</button>
    <button type="button" style="flex:1.4" class="text" data-act="back">⌫</button>
  </div>
  <div class="row">
    <button type="button" style="flex:1.8" class="text left">caps lock</button>
    <button type="button" data-k="a">A</button>
    <button type="button" data-k="s">S</button>
    <button type="button" data-k="d">D</button>
    <button type="button" data-k="f">F</button>
    <button type="button" data-k="g">G</button>
    <button type="button" data-k="h">H</button>
    <button type="button" data-k="j">J</button>
    <button type="button" data-k="k">K</button>
    <button type="button" data-k="l">L</button>
    <button type="button">:<br>;</button>
    <button type="button" data-k="'">"<br>'</button>
    <button type="button" style="flex:1.8" class="text right" data-act="enter">enter</button>
  </div>
  <div class="row">
    <button type="button" style="flex:1.2" class="text left">shift</button>
    <button type="button" data-k="z">Z</button>
    <button type="button" data-k="x">X</button>
    <button type="button" data-k="c">C</button>
    <button type="button" data-k="v">V</button>
    <button type="button" data-k="b">B</button>
    <button type="button" data-k="n">N</button>
    <button type="button" data-k="m">M</button>
    <button type="button">&lt;<br>,</button>
    <button type="button">&gt;<br>.</button>
    <button type="button">?<br>/</button>
    <button type="button" style="flex:1.2" class="text right">shift</button>
  </div>
  <div class="row bottom">
    <button type="button" class="text">ctrl</button>
    <button type="button" class="text">fn</button>
    <button type="button" class="text">start</button>
    <button type="button" class="text">alt</button>
    <button type="button" style="flex:4" data-act="space" aria-label="space"></button>
    <button type="button" class="text">alt</button>
    <button type="button" class="text">ctrl</button>
    <div class="arrows">
      <div class="row">
        <button type="button"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7,15L12,10L17,15H7Z"/></svg></button>
      </div>
      <div class="row">
        <button type="button" data-act="prev" aria-label="previous word"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M14,7L9,12L14,17V7Z"/></svg></button>
        <button type="button"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7,10L12,15L17,10H7Z"/></svg></button>
        <button type="button" data-act="next" aria-label="next word"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10,17L15,12L10,7V17Z"/></svg></button>
      </div>
    </div>
  </div>
</div>
</template>

<!-- ═══ Config (editable) ═══ -->
<script src="js/config.js"></script>

<!-- ═══ Word data (editable, one part per file) ═══ -->
<script src="js/data/words-prea1-1.js"></script>
<script src="js/data/words-prea1-2.js"></script>
<script src="js/data/words-prea1-3.js"></script>
<script src="js/data/words-prea1-4.js"></script>
<script src="js/data/words-a1-1.js"></script>
<script src="js/data/words-a1-2.js"></script>
<script src="js/data/words-a1-3.js"></script>
<script src="js/data/words-a2-1.js"></script>
<script src="js/data/words-a2-2.js"></script>
<script src="js/data/words-a2-3.js"></script>
<script src="js/data/words-a2-4.js"></script>

<!-- ═══ Core ═══ -->
<script src="js/core/util.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/seed.js"></script>
<script src="js/core/sfx.js"></script>
<script src="js/core/tts.js"></script>
<script src="js/core/images.js"></script>
<script src="js/core/keyboard.js"></script>
<script src="js/core/engine.js"></script>

<!-- ═══ UI + boot ═══ -->
<script src="js/ui/screens.js"></script>
<script src="js/ui/picker.js"></script>
<script src="js/app.js"></script>
</body>
</html>

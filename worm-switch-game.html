<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Worm Switch Game</title>
    <script src="confetti.min.js"></script>
    <style>
        :root {
            --ink: #111;
            --muted: #6b6b6b;
            --line: #e6e6e6;
            --soft: #f5f5f5;
            --arrow: #e6005c;
            --worm-gap: clamp(2px, 0.45vw, 10px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", Arial, sans-serif;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #fff;
            color: var(--ink);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        button,
        input {
            font: inherit;
        }

        /* ===== Top bar ===== */
        .topbar {
            position: relative;
            z-index: 20;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1vw;
            padding: 1vh 1.2vw;
            background: #fff;
            border-bottom: 2px solid var(--ink);
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.9vw;
            min-width: 0;
        }

        .brand h1 {
            font-size: clamp(1rem, 2.5vh, 1.65rem);
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        .home-btn {
            align-self: center;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: clamp(2rem, 4.8vh, 2.6rem);
            height: clamp(2rem, 4.8vh, 2.6rem);
            border: 2px solid var(--ink);
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font-size: clamp(1rem, 2.3vh, 1.35rem);
            line-height: 1;
            text-decoration: none;
            transition: background 0.15s, transform 0.12s;
        }

        .home-btn:hover {
            background: var(--soft);
        }

        .home-btn:active {
            transform: scale(0.94);
        }

        .home-btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        .min-moves {
            font-size: clamp(0.7rem, 1.7vh, 0.95rem);
            font-weight: 800;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 999px;
            padding: 0.35vh 0.8vw;
            white-space: nowrap;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.6vw;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .mode-group {
            display: flex;
            border: 2px solid var(--ink);
            border-radius: 10px;
            overflow: hidden;
        }

        .mode-btn {
            border: 0;
            background: #fff;
            color: var(--ink);
            font-weight: 800;
            padding: 0.55vh 1vw;
            font-size: clamp(0.75rem, 1.8vh, 1rem);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .mode-btn + .mode-btn {
            border-left: 2px solid var(--ink);
        }

        .mode-btn:hover {
            background: var(--soft);
        }

        .mode-btn.active {
            background: var(--ink);
            color: #fff;
        }

        .tool-btn {
            border: 2px solid var(--ink);
            background: #fff;
            color: var(--ink);
            font-weight: 800;
            padding: 0.55vh 1vw;
            border-radius: 10px;
            font-size: clamp(0.75rem, 1.8vh, 1rem);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, transform 0.12s;
        }

        .tool-btn:hover {
            background: var(--soft);
        }

        .tool-btn:active {
            transform: scale(0.96);
        }

        .tool-btn:disabled {
            opacity: 0.38;
            cursor: default;
            transform: none;
        }

        .custom-label {
            display: flex;
            align-items: center;
            gap: 0.4vw;
            font-size: clamp(0.7rem, 1.6vh, 0.9rem);
            font-weight: 800;
            color: var(--muted);
            white-space: nowrap;
        }

        .custom-input {
            width: 6.2em;
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 0.4vh 0.4vw;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            font-size: clamp(0.8rem, 1.8vh, 1rem);
            color: var(--ink);
            background: #fff;
            user-select: text;
            -webkit-user-select: text;
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--arrow);
            box-shadow: 0 0 0 3px #ffd7e7;
        }

        /* ===== Board / lanes ===== */
        .board {
            flex: 1 1 auto;
            display: flex;
            min-height: 0;
            background: #fff;
            position: relative;
        }

        .loading {
            margin: auto;
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            font-weight: 800;
            color: var(--muted);
        }

        .lane {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-right: 2px solid var(--line);
        }

        .lane:last-child {
            border-right: 0;
        }

        .lane-head {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6vw;
            padding: 0.55vh 1vw;
            border-bottom: 1px solid var(--line);
            min-height: 0;
        }

        .lane-title {
            flex: 0 0 auto;
            font-size: clamp(0.8rem, 2vh, 1.15rem);
            font-weight: 900;
            white-space: nowrap;
        }

        .lane-status {
            flex: 1 1 auto;
            min-width: 0;
            font-size: clamp(0.62rem, 1.45vh, 0.82rem);
            font-weight: 800;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        .lane-status.solved {
            color: var(--arrow);
        }

        .lane-rows {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0.3vh 0.6vw;
            gap: 0.2vh;
        }

        /* ===== Rows ===== */
        .row {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            align-items: center;
            gap: 0.4vw;
            position: relative;
            border-bottom: 1px dashed #ededed;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .row.goal-row {
            box-shadow: inset 0 2px 0 var(--ink);
        }

        .row-label {
            flex: 0 0 auto;
            width: clamp(2.1rem, 4vw, 3.4rem);
            text-align: center;
            font-size: clamp(1.1rem, 3.3vh, 2.4rem);
            font-weight: 900;
            line-height: 1;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .row.active-row .row-label {
            color: var(--arrow);
        }

        .row.goal-row .row-label {
            font-size: clamp(0.7rem, 1.7vh, 1.05rem);
            letter-spacing: 0.04em;
        }

        .row-reset {
            flex: 0 0 auto;
            width: clamp(2.9rem, 5.6vh, 3.6rem);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-btn {
            width: clamp(2.2rem, 5.6vh, 3.1rem);
            height: clamp(2.2rem, 5.6vh, 3.1rem);
            padding: 0;
            border: 2px solid var(--ink);
            border-radius: 50%;
            background: #fff;
            color: var(--ink);
            font-size: clamp(0.9rem, 2.2vh, 1.35rem);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.14s, background 0.14s, opacity 0.14s;
        }

        .reset-btn:hover:not(:disabled) {
            background: var(--soft);
            transform: scale(1.07);
        }

        .reset-btn:active:not(:disabled) {
            transform: scale(0.93);
        }

        .reset-btn:disabled {
            opacity: 0.18;
            cursor: default;
        }

        .row-worms {
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: var(--worm-gap);
            position: relative;
        }

        /* ===== Worm slots ===== */
        .worm-slot {
            position: relative;
            width: var(--worm-w, auto);
            height: var(--worm-h, 84%);
            aspect-ratio: 147 / 295;
            flex: 0 0 auto;
            z-index: 1;
            transition: transform 0.16s ease, filter 0.16s ease;
        }

        .worm-slot.clickable {
            cursor: pointer;
        }

        .worm-slot.clickable:hover {
            transform: translateY(-4px);
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.18));
            z-index: 2;
        }

        .worm-slot.clickable:active {
            transform: translateY(-1px) scale(0.98);
        }

        .worm-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        .blank-layer {
            opacity: 1;
            transition: opacity 0.45s ease;
        }

        .color-layer {
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        .worm-slot.revealed .color-layer {
            opacity: 1;
        }

        .worm-slot.revealed .blank-layer {
            opacity: 0;
        }

        .worm-slot::after {
            content: "";
            position: absolute;
            inset: -4px;
            border: 3px solid transparent;
            border-radius: 14px;
            pointer-events: none;
            transition: border-color 0.12s ease;
        }

        .worm-slot.selected,
        .worm-slot.pair-one,
        .worm-slot.pair-two {
            z-index: 3;
        }

        .worm-slot.selected::after,
        .worm-slot.pair-one::after {
            border-color: var(--arrow);
        }

        .worm-slot.pair-two::after {
            border-color: var(--arrow);
            border-style: dashed;
        }

        .worm-slot.goal-slot {
            cursor: default;
        }

        /* ===== Move arrows (drawn by JS) ===== */
        .row-arrow {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 6;
        }

        /* ===== Solved celebration ===== */
        @keyframes solvedPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes rowWin {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
            100% { filter: brightness(1); }
        }

        .lane.solved .lane-head {
            animation: solvedPop 0.5s ease;
        }

        .row.win-row {
            animation: rowWin 0.75s ease;
        }

        /* ===== Footer help ===== */
        .help {
            flex: 0 0 auto;
            padding: 0.5vh 1vw;
            border-top: 1px solid var(--line);
            font-size: clamp(0.62rem, 1.4vh, 0.85rem);
            font-weight: 700;
            color: var(--muted);
            text-align: center;
            background: #fff;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 2vh;
            transform: translateX(-50%) translateY(20px);
            background: #fff;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 10px;
            padding: 1vh 1.4vw;
            font-weight: 800;
            font-size: clamp(0.8rem, 1.8vh, 1rem);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 100;
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-height: 720px) {
            .help {
                display: none;
            }
        }

        @media (max-width: 900px) {
            .custom-label {
                display: none;
            }
        }

        /* On very narrow screens, keep three full lanes and let the board scroll. */
        @media (max-width: 700px) {
            .board {
                overflow-x: auto;
                overflow-y: hidden;
            }

            .lane {
                min-width: 210px;
            }

            .row-label {
                width: 1.9rem;
                font-size: clamp(1.1rem, 2.8vh, 1.6rem);
            }

            .row-reset {
                width: 2.5rem;
            }

            .reset-btn {
                width: 2.3rem;
                height: 2.3rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <a class="home-btn" href="index.html" title="Back to all games"
               aria-label="Back to all games">🏠</a>
            <h1>Worm Switch</h1>
            <span class="min-moves" id="min-moves">Min moves: —</span>
        </div>
        <div class="toolbar">
            <div class="mode-group" role="group" aria-label="Game mode">
                <button type="button" class="mode-btn active" id="mode-swap">Swap</button>
                <button type="button" class="mode-btn" id="mode-pair">Pair</button>
            </div>
            <button type="button" class="tool-btn" id="new-puzzle">🎲 New Puzzle</button>
            <button type="button" class="tool-btn" id="solve-btn" disabled
                    title="Show the solution step by step in an unused column">💡 Solve</button>
            <button type="button" class="tool-btn" id="reset-all">♻️ Reset All</button>
            <label class="custom-label" for="custom-start">Start
                <input type="text" id="custom-start" class="custom-input" maxlength="5"
                       value="ROYGB" autocomplete="off" spellcheck="false"
                       aria-label="Custom start code"
                       title="Type a 5-letter start code (R O Y G B) and press Enter" />
            </label>
        </div>
    </header>

    <main class="board" id="board">
        <div class="loading">Loading…</div>
    </main>

    <footer class="help">
        Use the highlighted row to make a move • 🔄 undoes that row and everything below • 💡 Solve shows the solution in a fresh column • Solve any column to win
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            'use strict';

            // ===== Worm configuration =====
            const WORMS = [
                { code: 'R', name: 'red',    label: 'Red'    },
                { code: 'O', name: 'orange', label: 'Orange' },
                { code: 'Y', name: 'yellow', label: 'Yellow' },
                { code: 'G', name: 'green',  label: 'Green'  },
                { code: 'B', name: 'blue',   label: 'Blue'   }
            ];

            const TARGET = ['R', 'O', 'Y', 'G', 'B'];
            const TARGET_STR = TARGET.join('');
            const ARROW_COLOR = '#e6005c';
            const SVG_NS = 'http://www.w3.org/2000/svg';
            const LANE_COUNT = 3;

            // ===== Game state =====
            let gameMode = 'swap';        // 'swap' | 'pair'
            let initialPuzzle = [];       // shared by all three columns
            let minSteps = 3;             // minimum moves for the current puzzle/mode
            let totalRows = 5;            // start row + solving rows + goal row
            let lanes = [];
            let distanceMaps = null;
            let solving = false;          // true while the solution demo is running
            let solveRun = 0;             // token used to cancel an in-flight demo

            // ===== DOM =====
            const boardEl = document.getElementById('board');
            const minMovesEl = document.getElementById('min-moves');
            const customInput = document.getElementById('custom-start');
            const toastEl = document.getElementById('toast');
            const solveBtn = document.getElementById('solve-btn');
            let toastTimer = null;

            // ===== Small utilities =====
            function arraysEqual(a, b) {
                return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
            }

            function wormByCode(code) {
                return WORMS.find(function (w) { return w.code === code; });
            }

            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, 2200);
            }

            // ===== Sound =====
            // A tiny synthesized blip, so the game needs no audio files.
            let audioCtx = null;

            function playMoveSound() {
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return;

                    if (!audioCtx) audioCtx = new Ctx();
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.07);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.exponentialRampToValueAtTime(0.14, now + 0.012);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {
                    // Sound is optional; never let audio break the game.
                }
            }

            // ===== Move graph =====
            // Every state is a string like "ROYGB". There are only 120 states,
            // so a breadth-first search gives us the exact minimum move count.
            function neighbors(code, mode) {
                const arr = code.split('');
                const out = [];

                if (mode === 'swap') {
                    for (let i = 0; i < arr.length; i++) {
                        for (let j = i + 1; j < arr.length; j++) {
                            const a = arr.slice();
                            const temp = a[i];
                            a[i] = a[j];
                            a[j] = temp;
                            out.push(a.join(''));
                        }
                    }
                } else {
                    // Pair move: swap two non-overlapping adjacent pairs.
                    for (let i = 0; i < arr.length - 1; i++) {
                        for (let j = i + 2; j < arr.length - 1; j++) {
                            const a = arr.slice();
                            const i2 = i + 1;
                            const j2 = j + 1;
                            const v1 = a[i];
                            const v2 = a[i2];
                            a[i] = a[j];
                            a[i2] = a[j2];
                            a[j] = v1;
                            a[j2] = v2;
                            out.push(a.join(''));
                        }
                    }
                }
                return out;
            }

            // Enumerate moves as objects, so the solver can replay them exactly.
            function legalMoves(state, mode) {
                const moves = [];

                if (mode === 'swap') {
                    for (let i = 0; i < state.length; i++) {
                        for (let j = i + 1; j < state.length; j++) {
                            moves.push({ type: 'swap', indices: [i, j] });
                        }
                    }
                } else {
                    for (let i = 0; i < state.length - 1; i++) {
                        for (let j = i + 2; j < state.length - 1; j++) {
                            moves.push({ type: 'pair', pairs: [[i, i + 1], [j, j + 1]] });
                        }
                    }
                }

                return moves;
            }

            // Walk downhill on the exact distance map to produce one shortest solution.
            function solutionPath(state, mode) {
                if (!distanceMaps) return null;

                const dist = distanceMaps[mode];
                let current = state.slice();
                let currentCode = current.join('');
                const path = [];
                let guard = 0;

                while (currentCode !== TARGET_STR && guard++ < 20) {
                    const d = dist.get(currentCode);
                    if (d === undefined) return null;

                    const moves = legalMoves(current, mode);
                    let chosen = null;

                    for (let i = 0; i < moves.length; i++) {
                        const next = applyMove(current, moves[i]);
                        if (dist.get(next.join('')) === d - 1) {
                            chosen = moves[i];
                            current = next;
                            currentCode = next.join('');
                            break;
                        }
                    }

                    if (!chosen) return null;
                    path.push(chosen);
                }

                return currentCode === TARGET_STR ? path : null;
            }

            function buildDistanceMaps() {
                const maps = { swap: new Map(), pair: new Map() };

                ['swap', 'pair'].forEach(function (mode) {
                    const dist = maps[mode];
                    dist.set(TARGET_STR, 0);
                    const queue = [TARGET_STR];

                    for (let qi = 0; qi < queue.length; qi++) {
                        const state = queue[qi];
                        const d = dist.get(state);
                        const nextStates = neighbors(state, mode);

                        for (let ni = 0; ni < nextStates.length; ni++) {
                            const next = nextStates[ni];
                            if (!dist.has(next)) {
                                dist.set(next, d + 1);
                                queue.push(next);
                            }
                        }
                    }
                });

                return maps;
            }

            function applyMove(state, move) {
                const a = state.slice();

                if (move.type === 'swap') {
                    const i = move.indices[0];
                    const j = move.indices[1];
                    const temp = a[i];
                    a[i] = a[j];
                    a[j] = temp;
                } else {
                    const i = move.pairs[0][0];
                    const j = move.pairs[0][1];
                    const k = move.pairs[1][0];
                    const l = move.pairs[1][1];
                    const v1 = a[i];
                    const v2 = a[j];
                    a[i] = a[k];
                    a[j] = a[l];
                    a[k] = v1;
                    a[l] = v2;
                }

                return a;
            }

            function randomPuzzle(mode) {
                if (!distanceMaps) return null;
                const dist = distanceMaps[mode];
                let wanted = (mode === 'swap')
                    ? (Math.random() < 0.5 ? 3 : 4)
                    : (Math.random() < 0.55 ? 3 : 4);

                let maxDistance = 0;
                dist.forEach(function (d) {
                    if (d > maxDistance) maxDistance = d;
                });
                if (wanted > maxDistance) wanted = maxDistance;

                let candidates = [];
                dist.forEach(function (d, state) {
                    if (d === wanted) candidates.push(state);
                });

                if (candidates.length === 0) {
                    dist.forEach(function (d, state) {
                        if (d > 0) candidates.push(state);
                    });
                }

                const current = initialPuzzle.join('');
                if (candidates.length > 1) {
                    candidates = candidates.filter(function (s) { return s !== current; });
                }

                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                return pick ? pick.split('') : null;
            }

            // ===== Puzzle lifecycle =====
            function startNewPuzzle(state) {
                if (!distanceMaps) return false;
                if (!state || state.length !== TARGET.length) return false;

                const code = state.join('');
                const d = distanceMaps[gameMode].get(code);

                if (d === undefined) {
                    toast(gameMode === 'pair'
                        ? 'That start cannot be solved with pair swaps.'
                        : 'That start is not valid.');
                    return false;
                }
                if (d === 0) {
                    toast('That start is already solved. Try another.');
                    return false;
                }

                initialPuzzle = state.slice();
                minSteps = Math.max(1, d);
                totalRows = minSteps + 2; // start + solving rows + goal

                buildBoard();
                updateTopBar();
                customInput.value = initialPuzzle.join('');
                return true;
            }

            function generateRandomPuzzle() {
                const next = randomPuzzle(gameMode);
                if (next) {
                    startNewPuzzle(next);
                }
            }

            function updateTopBar() {
                minMovesEl.textContent = 'Min moves: ' + minSteps;
                document.getElementById('mode-swap').classList.toggle('active', gameMode === 'swap');
                document.getElementById('mode-pair').classList.toggle('active', gameMode === 'pair');
            }

            // ===== Lane state =====
            function createLane(index) {
                return {
                    index: index,
                    history: [initialPuzzle.slice()], // reached states, row 0 = start
                    moves: [],                        // moves[row] produced row + 1
                    selection: [],                    // clicked worm indices
                    solved: false,
                    demo: false,                      // true while the solver is playing this lane
                    activeRow: 0,
                    el: null,
                    statusEl: null,
                    rowEls: [],
                    slotEls: [],
                    resetBtns: [],
                    arrowSvgs: []
                };
            }

            // ===== Build the board =====
            function buildBoard() {
                cancelSolutionDemo();
                boardEl.innerHTML = '';
                lanes = [];

                for (let i = 0; i < LANE_COUNT; i++) {
                    const laneEl = document.createElement('section');
                    laneEl.className = 'lane';
                    laneEl.dataset.lane = String(i);

                    const head = document.createElement('div');
                    head.className = 'lane-head';

                    const title = document.createElement('span');
                    title.className = 'lane-title';
                    title.textContent = 'Try ' + (i + 1);

                    const status = document.createElement('span');
                    status.className = 'lane-status';

                    head.append(title, status);

                    const rowsEl = document.createElement('div');
                    rowsEl.className = 'lane-rows';

                    laneEl.append(head, rowsEl);
                    boardEl.appendChild(laneEl);

                    const lane = createLane(i);
                    lane.el = laneEl;
                    lane.statusEl = status;
                    lanes.push(lane);

                    buildLaneRows(lane, rowsEl);
                }

                lanes.forEach(syncLane);

                requestAnimationFrame(function () {
                    layoutWorms();
                    lanes.forEach(refreshArrows);
                });

                updateSolveButton();
            }

            function buildLaneRows(lane, rowsEl) {
                for (let r = 0; r < totalRows; r++) {
                    const isGoal = (r === totalRows - 1);

                    const rowEl = document.createElement('div');
                    rowEl.className = 'row' + (isGoal ? ' goal-row' : '');
                    rowEl.dataset.row = String(r);

                    const label = document.createElement('div');
                    label.className = 'row-label';
                    label.textContent = isGoal ? 'Goal' : String(r + 1);

                    const resetCell = document.createElement('div');
                    resetCell.className = 'row-reset';

                    let btn = null;
                    if (!isGoal) {
                        btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'reset-btn';
                        btn.textContent = '🔄';
                        btn.title = 'Undo this row and clear everything below';
                        btn.setAttribute('aria-label', 'Undo row ' + (r + 1) + ' and clear everything below');
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            resetLaneTo(lane, r);
                        });
                        resetCell.appendChild(btn);
                    }

                    const wormsEl = document.createElement('div');
                    wormsEl.className = 'row-worms';

                    const svg = document.createElementNS(SVG_NS, 'svg');
                    svg.classList.add('row-arrow');
                    svg.setAttribute('preserveAspectRatio', 'none');
                    svg.setAttribute('aria-hidden', 'true');
                    wormsEl.appendChild(svg);

                    const slotEls = [];

                    for (let c = 0; c < TARGET.length; c++) {
                        const slot = document.createElement('div');
                        slot.className = 'worm-slot';
                        slot.dataset.col = String(c);
                        slot.dataset.row = String(r);

                        const blank = document.createElement('img');
                        blank.className = 'worm-layer blank-layer';
                        blank.src = 'worm/blank.png';
                        blank.alt = '';
                        blank.draggable = false;

                        const color = document.createElement('img');
                        color.className = 'worm-layer color-layer';
                        color.alt = '';
                        color.draggable = false;

                        slot.append(blank, color);
                        wormsEl.appendChild(slot);
                        slotEls.push(slot);
                    }

                    wormsEl.addEventListener('click', function (e) {
                        const target = e.target;
                        const slot = target && target.closest ? target.closest('.worm-slot') : null;
                        if (!slot || !wormsEl.contains(slot)) return;
                        handleWormClick(lane, r, Number(slot.dataset.col));
                    });

                    rowEl.append(label, resetCell, wormsEl);
                    rowsEl.appendChild(rowEl);

                    lane.rowEls.push(rowEl);
                    lane.slotEls.push(slotEls);
                    lane.resetBtns.push(btn);
                    lane.arrowSvgs.push(svg);
                }
            }

            // ===== Rendering state =====
            function setColorSrc(img, code) {
                const worm = wormByCode(code);
                if (!worm) return;
                const src = 'worm/' + worm.name + '.png';
                if (img.getAttribute('src') !== src) {
                    img.src = src;
                }
            }

            function syncLane(lane, options) {
                const lastSolvingRow = totalRows - 2;
                const hideRevealRow = (options && options.hideRevealRow !== undefined)
                    ? options.hideRevealRow
                    : -1;

                lane.rowEls.forEach(function (rowEl, r) {
                    const isGoal = (r === totalRows - 1);
                    const reached = (r < lane.history.length);
                    const state = reached ? lane.history[r] : null;
                    const isCurrent = !lane.solved && r === lane.activeRow && r < lastSolvingRow;
                    const isActive = isCurrent && !lane.demo;
                    const isWin = lane.solved && r === lastSolvingRow;

                    rowEl.classList.toggle('active-row', isCurrent);
                    rowEl.classList.toggle('win-row', isWin);

                    const btn = lane.resetBtns[r];
                    if (btn) {
                        btn.disabled = lane.solved || !reached || lane.demo;
                    }

                    const slots = lane.slotEls[r];

                    slots.forEach(function (slot, c) {
                        const color = slot.querySelector('.color-layer');

                        if (isGoal) {
                            setColorSrc(color, TARGET[c]);
                            slot.classList.add('revealed', 'goal-slot');
                        } else if (reached) {
                            setColorSrc(color, state[c]);
                            if (r === hideRevealRow) {
                                slot.classList.remove('revealed');
                            } else {
                                slot.classList.add('revealed');
                            }
                            slot.classList.remove('goal-slot');
                        } else {
                            slot.classList.remove('revealed', 'goal-slot');
                        }

                        slot.classList.toggle('clickable', isActive);

                        let selected = false;
                        let pairOne = false;
                        let pairTwo = false;

                        if (isActive) {
                            if (gameMode === 'swap') {
                                selected = lane.selection.indexOf(c) !== -1;
                            } else {
                                const sel = lane.selection;
                                if (sel.length === 1) {
                                    selected = (sel[0] === c);
                                } else if (sel.length === 2) {
                                    pairOne = sel.indexOf(c) !== -1;
                                } else if (sel.length === 3) {
                                    pairOne = sel.slice(0, 2).indexOf(c) !== -1;
                                    pairTwo = (sel[2] === c);
                                }
                            }
                        }

                        slot.classList.toggle('selected', selected);
                        slot.classList.toggle('pair-one', pairOne);
                        slot.classList.toggle('pair-two', pairTwo);
                    });
                });

                lane.el.classList.toggle('solved', lane.solved);
                updateLaneStatus(lane);
                updateSolveButton();
            }

            function updateLaneStatus(lane) {
                const el = lane.statusEl;
                el.classList.toggle('solved', lane.solved);

                if (lane.solved) {
                    el.textContent = '🎉 Solved!';
                    return;
                }

                if (lane.demo) {
                    el.textContent = '💡 Showing solution…';
                    return;
                }

                if (lane.history.length >= totalRows - 1) {
                    el.textContent = 'Not solved — press 🔄 to undo';
                    return;
                }

                if (gameMode === 'swap') {
                    if (lane.selection.length === 1) {
                        el.textContent = 'Now click the 2nd worm';
                    } else {
                        el.textContent = 'Move ' + lane.moves.length + ' of ' + minSteps + ' · click 2 worms';
                    }
                } else {
                    const sel = lane.selection;
                    if (sel.length === 0) {
                        el.textContent = 'Move ' + lane.moves.length + ' of ' + minSteps + ' · pick 2 adjacent pairs';
                    } else if (sel.length === 1) {
                        el.textContent = 'Pick an adjacent worm (pair 1)';
                    } else if (sel.length === 2) {
                        el.textContent = 'Pick the 1st worm of pair 2';
                    } else {
                        el.textContent = 'Pick an adjacent worm (pair 2)';
                    }
                }
            }

            // ===== Click handling =====
            function handleWormClick(lane, rowIndex, colIndex) {
                if (lane.demo) return;
                if (lane.solved) return;
                if (rowIndex !== lane.activeRow) return;
                if (rowIndex >= totalRows - 2) return; // last solving row has no next row

                const moved = (gameMode === 'swap')
                    ? handleSwap(lane, colIndex)
                    : handlePair(lane, colIndex);

                if (!moved) syncLane(lane);
            }

            function handleSwap(lane, colIndex) {
                const sel = lane.selection;

                if (sel.length === 0) {
                    lane.selection = [colIndex];
                    return false;
                }

                if (sel.length === 1) {
                    if (sel[0] === colIndex) {
                        lane.selection = [];
                        return false;
                    }

                    const move = { type: 'swap', indices: [sel[0], colIndex] };
                    lane.selection = [];
                    performMove(lane, move);
                    return true;
                }

                lane.selection = [colIndex];
                return false;
            }

            function handlePair(lane, colIndex) {
                const sel = lane.selection;

                if (sel.length === 0) {
                    lane.selection = [colIndex];
                    return false;
                }

                if (sel.length === 1) {
                    if (sel[0] === colIndex) {
                        lane.selection = [];
                        return false;
                    }

                    if (Math.abs(sel[0] - colIndex) === 1) {
                        lane.selection = [
                            Math.min(sel[0], colIndex),
                            Math.max(sel[0], colIndex)
                        ];
                    } else {
                        lane.selection = [colIndex];
                        toast('Pair 1 worms must be next to each other.');
                    }
                    return false;
                }

                const pair1 = sel.slice(0, 2);

                if (sel.length === 2) {
                    if (pair1.indexOf(colIndex) !== -1) {
                        lane.selection = [colIndex];
                        return false;
                    }
                    lane.selection = pair1.concat([colIndex]);
                    return false;
                }

                if (sel.length !== 3) {
                    lane.selection = [colIndex];
                    return false;
                }

                // sel.length === 3
                const anchor = sel[2];

                if (pair1.indexOf(colIndex) !== -1) {
                    lane.selection = [colIndex];
                    return false;
                }

                if (colIndex === anchor) {
                    lane.selection = pair1;
                    return false;
                }

                if (Math.abs(anchor - colIndex) !== 1) {
                    lane.selection = pair1.concat([colIndex]);
                    toast('Pair 2 worms must be next to each other.');
                    return false;
                }

                const pair2 = [
                    Math.min(anchor, colIndex),
                    Math.max(anchor, colIndex)
                ];

                lane.selection = [];
                performMove(lane, { type: 'pair', pairs: [pair1, pair2] });
                return true;
            }

            function performMove(lane, move) {
                const current = lane.history[lane.history.length - 1];
                const next = applyMove(current, move);

                lane.history.push(next);
                lane.moves.push(move);
                lane.selection = [];
                lane.activeRow = lane.history.length - 1;
                lane.solved = arraysEqual(next, TARGET);

                playMoveSound();
                syncLane(lane);
                requestAnimationFrame(function () { refreshArrows(lane); });

                if (lane.solved) {
                    celebrateLane(lane);
                }
            }

            function resetLaneTo(lane, rowIndex) {
                if (lane.demo) return;
                if (lane.solved) return;
                if (rowIndex >= lane.history.length) return;

                if (rowIndex === 0) {
                    lane.history = [initialPuzzle.slice()];
                    lane.moves = [];
                    lane.activeRow = 0;
                } else {
                    lane.history = lane.history.slice(0, rowIndex);
                    lane.moves = lane.moves.slice(0, rowIndex - 1);
                    lane.activeRow = rowIndex - 1;
                }

                lane.selection = [];
                lane.solved = false;

                syncLane(lane);
                requestAnimationFrame(function () { refreshArrows(lane); });
            }

            function resetAllLanes() {
                cancelSolutionDemo();

                lanes.forEach(function (lane) {
                    lane.history = [initialPuzzle.slice()];
                    lane.moves = [];
                    lane.selection = [];
                    lane.solved = false;
                    lane.activeRow = 0;
                    syncLane(lane);
                });

                requestAnimationFrame(function () {
                    lanes.forEach(refreshArrows);
                });
            }

            // ===== Solve demo =====
            function delay(ms) {
                return new Promise(function (resolve) {
                    setTimeout(resolve, ms);
                });
            }

            // A lane is "fresh" when nobody has played in it yet.
            function findFreshLane() {
                for (let i = 0; i < lanes.length; i++) {
                    const lane = lanes[i];
                    if (!lane.demo && !lane.solved &&
                        lane.history.length === 1 && lane.moves.length === 0) {
                        return lane;
                    }
                }
                return null;
            }

            function updateSolveButton() {
                if (!solveBtn) return;
                solveBtn.disabled = solving || !distanceMaps;
            }

            function cancelSolutionDemo() {
                solveRun += 1;
                solving = false;

                lanes.forEach(function (lane) {
                    lane.demo = false;
                });
            }

            // Fade one worm in at a time, so the row can be followed by eye.
            function revealRowOneByOne(lane, rowIndex, run) {
                const slots = lane.slotEls[rowIndex] || [];
                const stagger = 200;

                slots.forEach(function (slot) {
                    slot.classList.remove('revealed');
                });

                return new Promise(function (resolve) {
                    let i = 0;

                    function next() {
                        if (run !== solveRun || i >= slots.length) {
                            resolve();
                            return;
                        }

                        slots[i].classList.add('revealed');
                        i += 1;

                        if (i < slots.length) {
                            setTimeout(next, stagger);
                        } else {
                            setTimeout(resolve, 480);
                        }
                    }

                    requestAnimationFrame(next);
                });
            }

            async function showSolution() {
                if (solving || !distanceMaps) return;

                const lane = findFreshLane();

                if (!lane) {
                    toast('All columns are in use — press ♻️ Reset All first.');
                    return;
                }

                const path = solutionPath(lane.history[0], gameMode);

                if (!path || path.length === 0) {
                    toast('No solution found for this start.');
                    return;
                }

                solving = true;
                const run = ++solveRun;
                lane.demo = true;
                lane.selection = [];
                syncLane(lane);
                requestAnimationFrame(function () { refreshArrows(lane); });
                toast('💡 Showing a ' + path.length + '-move solution…');

                try {
                    for (let step = 0; step < path.length; step++) {
                        if (run !== solveRun) return;

                        const move = path[step];
                        const current = lane.history[lane.history.length - 1];
                        const next = applyMove(current, move);

                        lane.history.push(next);
                        lane.moves.push(move);
                        lane.activeRow = lane.history.length - 1;
                        lane.solved = arraysEqual(next, TARGET);

                        syncLane(lane, { hideRevealRow: lane.activeRow });
                        refreshArrows(lane);

                        await delay(180);
                        if (run !== solveRun) return;

                        playMoveSound();
                        await revealRowOneByOne(lane, lane.activeRow, run);
                        if (run !== solveRun) return;

                        await delay(lane.solved ? 260 : 700);
                    }
                } finally {
                    if (run === solveRun) {
                        lane.demo = false;
                        solving = false;
                        syncLane(lane);
                        requestAnimationFrame(function () { refreshArrows(lane); });
                        updateSolveButton();

                        if (lane.solved) {
                            celebrateLane(lane);
                        }
                    }
                }
            }

            // ===== Celebration (no overlay, no blur) =====
            function celebrateLane(lane) {
                toast('🎉 You solved it!');

                const rect = lane.el.getBoundingClientRect();
                const x = Math.min(0.95, Math.max(0.05, (rect.left + rect.width / 2) / window.innerWidth));
                const y = Math.min(0.9, Math.max(0.1, (rect.top + rect.height / 2) / window.innerHeight));

                if (typeof confetti !== 'function') return;

                confetti({
                    particleCount: 90,
                    spread: 75,
                    origin: { x: x, y: y },
                    startVelocity: 38,
                    ticks: 180,
                    scalar: 0.9
                });

                setTimeout(function () {
                    confetti({
                        particleCount: 70,
                        spread: 110,
                        origin: { x: x, y: Math.max(0.1, y - 0.08) },
                        startVelocity: 30,
                        ticks: 160,
                        scalar: 0.85
                    });
                }, 220);

                setTimeout(function () {
                    confetti({
                        particleCount: 60,
                        spread: 140,
                        origin: { x: x, y: y },
                        startVelocity: 26,
                        ticks: 140,
                        scalar: 0.8
                    });
                }, 440);
            }

            // ===== Arrow drawing =====
            function layoutWorms() {
                lanes.forEach(function (lane) {
                    const firstRow = lane.rowEls[0];
                    if (!firstRow) return;

                    const wormsEl = firstRow.querySelector('.row-worms');
                    if (!wormsEl) return;

                    const cs = getComputedStyle(wormsEl);
                    const gap = parseFloat(cs.columnGap) || 4;
                    const padLeft = parseFloat(cs.paddingLeft) || 0;
                    const padRight = parseFloat(cs.paddingRight) || 0;
                    const padTop = parseFloat(cs.paddingTop) || 0;
                    const padBottom = parseFloat(cs.paddingBottom) || 0;

                    const availableW = wormsEl.clientWidth - padLeft - padRight;
                    const availableH = wormsEl.clientHeight - padTop - padBottom;
                    if (availableW <= 0 || availableH <= 0) return;

                    const maxWByWidth = (availableW - gap * (TARGET.length - 1)) / TARGET.length;
                    const maxWByHeight = availableH * 0.8 * (147 / 295);
                    const w = Math.max(12, Math.min(maxWByWidth, maxWByHeight));
                    const h = w * (295 / 147);

                    lane.el.style.setProperty('--worm-w', w.toFixed(2) + 'px');
                    lane.el.style.setProperty('--worm-h', h.toFixed(2) + 'px');
                });
            }

            function makeMarker(id, orient) {
                const marker = document.createElementNS(SVG_NS, 'marker');
                marker.setAttribute('id', id);
                marker.setAttribute('viewBox', '0 0 10 10');
                marker.setAttribute('refX', '9');
                marker.setAttribute('refY', '5');
                marker.setAttribute('markerWidth', '3.4');
                marker.setAttribute('markerHeight', '3.4');
                marker.setAttribute('markerUnits', 'strokeWidth');
                marker.setAttribute('orient', orient);

                const path = document.createElementNS(SVG_NS, 'path');
                path.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
                path.setAttribute('fill', ARROW_COLOR);
                marker.appendChild(path);

                return marker;
            }

            function drawArrowBetween(svg, x1, y1, x2, y2, stroke, startId, endId) {
                const baseY = Math.min(y1, y2);
                const distance = Math.abs(x2 - x1);
                const maxArc = Math.max(4, baseY - 4);
                const arcHeight = Math.min(maxArc, 12 + distance * 0.6);

                const c1x = x1 + (x2 - x1) * 0.14;
                const c2x = x2 + (x1 - x2) * 0.14;
                const c1y = baseY - arcHeight;
                const c2y = baseY - arcHeight;

                const path = document.createElementNS(SVG_NS, 'path');
                path.setAttribute('d',
                    'M ' + x1 + ' ' + y1 +
                    ' C ' + c1x + ' ' + c1y +
                    ', ' + c2x + ' ' + c2y +
                    ', ' + x2 + ' ' + y2);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', ARROW_COLOR);
                path.setAttribute('stroke-width', String(stroke));
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('marker-start', 'url(#' + startId + ')');
                path.setAttribute('marker-end', 'url(#' + endId + ')');
                svg.appendChild(path);
            }

            function drawPairRect(svg, r1, r2, stroke) {
                const pad = Math.max(3, stroke * 0.8);
                const x = Math.min(r1.x, r2.x) - pad;
                const y = Math.min(r1.y, r2.y) - pad;
                const right = Math.max(r1.x + r1.w, r2.x + r2.w) + pad;
                const bottom = Math.max(r1.y + r1.h, r2.y + r2.h) + pad;
                const radius = Math.min(16, (right - x) * 0.18);

                const rect = document.createElementNS(SVG_NS, 'rect');
                rect.setAttribute('x', String(x));
                rect.setAttribute('y', String(y));
                rect.setAttribute('width', String(right - x));
                rect.setAttribute('height', String(bottom - y));
                rect.setAttribute('rx', String(radius));
                rect.setAttribute('ry', String(radius));
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', ARROW_COLOR);
                rect.setAttribute('stroke-width', String(Math.max(2.5, Math.min(4.5, stroke * 0.62))));
                svg.appendChild(rect);
            }

            function refreshArrows(lane) {
                lane.rowEls.forEach(function (rowEl, r) {
                    const svg = lane.arrowSvgs[r];
                    if (!svg) return;

                    while (svg.firstChild) {
                        svg.removeChild(svg.firstChild);
                    }

                    const move = lane.moves[r];
                    if (!move) return;

                    const wormsEl = rowEl.querySelector('.row-worms');
                    if (!wormsEl) return;

                    const width = wormsEl.clientWidth;
                    const height = wormsEl.clientHeight;
                    if (width < 2 || height < 2) return;

                    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);

                    const wormsRect = wormsEl.getBoundingClientRect();
                    const rel = lane.slotEls[r].map(function (slot) {
                        const rect = slot.getBoundingClientRect();
                        return {
                            x: rect.left - wormsRect.left,
                            y: rect.top - wormsRect.top,
                            w: rect.width,
                            h: rect.height,
                            cx: rect.left - wormsRect.left + rect.width / 2
                        };
                    });

                    const stroke = Math.max(5, Math.min(8, height * 0.05));
                    const startId = 'arrow-start-' + lane.index + '-' + r;
                    const endId = 'arrow-end-' + lane.index + '-' + r;

                    const defs = document.createElementNS(SVG_NS, 'defs');
                    defs.appendChild(makeMarker(startId, 'auto-start-reverse'));
                    defs.appendChild(makeMarker(endId, 'auto'));
                    svg.appendChild(defs);

                    if (move.type === 'swap') {
                        const i = move.indices[0];
                        const j = move.indices[1];
                        const y1 = rel[i].y + rel[i].h * 0.18;
                        const y2 = rel[j].y + rel[j].h * 0.18;
                        drawArrowBetween(svg, rel[i].cx, y1, rel[j].cx, y2, stroke, startId, endId);
                    } else {
                        const a = move.pairs[0][0];
                        const b = move.pairs[0][1];
                        const c = move.pairs[1][0];
                        const d = move.pairs[1][1];

                        const p1x = (rel[a].cx + rel[b].cx) / 2;
                        const p2x = (rel[c].cx + rel[d].cx) / 2;
                        const p1y = Math.min(rel[a].y, rel[b].y);
                        const p2y = Math.min(rel[c].y, rel[d].y);

                        drawPairRect(svg, rel[a], rel[b], stroke);
                        drawPairRect(svg, rel[c], rel[d], stroke);
                        drawArrowBetween(svg, p1x, p1y, p2x, p2y, stroke, startId, endId);
                    }
                });
            }

            // ===== Top bar actions =====
            function setMode(mode) {
                if (!distanceMaps) return;
                if (mode !== 'swap' && mode !== 'pair') return;
                if (gameMode === mode) return;

                gameMode = mode;
                updateTopBar();
                generateRandomPuzzle();
                toast(mode === 'swap'
                    ? 'Swap mode: click any two worms.'
                    : 'Pair mode: swap two adjacent pairs.');
            }

            document.getElementById('mode-swap').addEventListener('click', function () {
                setMode('swap');
            });

            document.getElementById('mode-pair').addEventListener('click', function () {
                setMode('pair');
            });

            document.getElementById('new-puzzle').addEventListener('click', function () {
                if (!distanceMaps) return;
                generateRandomPuzzle();
                toast('New puzzle!');
            });

            document.getElementById('solve-btn').addEventListener('click', function () {
                showSolution();
            });

            document.getElementById('reset-all').addEventListener('click', function () {
                resetAllLanes();
                toast('All columns reset.');
            });

            customInput.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter') return;
                e.preventDefault();
                if (!distanceMaps) return;

                const code = customInput.value.toUpperCase().replace(/\s+/g, '');

                if (code.length !== 5) {
                    toast('Enter exactly 5 letters: R O Y G B.');
                    return;
                }

                for (let i = 0; i < code.length; i++) {
                    if (TARGET.indexOf(code[i]) === -1) {
                        toast('Invalid letter "' + code[i] + '". Use R O Y G B.');
                        return;
                    }
                }

                if (new Set(code).size !== 5) {
                    toast('Each letter must appear exactly once.');
                    return;
                }

                const d = distanceMaps[gameMode].get(code);
                if (d === undefined) {
                    toast(gameMode === 'pair'
                        ? 'That start cannot be solved with pair swaps.'
                        : 'That start is not valid.');
                    return;
                }

                if (d === 0) {
                    toast('That start is already solved. Try another.');
                    return;
                }

                if (startNewPuzzle(code.split(''))) {
                    customInput.blur();
                    toast('Custom start loaded!');
                }
            });

            customInput.addEventListener('focus', function () {
                customInput.select();
            });

            customInput.addEventListener('blur', function () {
                customInput.value = initialPuzzle.join('') || 'ROYGB';
            });

            // ===== Resize =====
            let resizeRaf = null;

            window.addEventListener('resize', function () {
                if (resizeRaf) cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(function () {
                    layoutWorms();
                    lanes.forEach(refreshArrows);
                });
            });

            // ===== Image preload + start =====
            function preloadImages() {
                const names = ['blank'].concat(WORMS.map(function (w) { return w.name; }));

                return Promise.all(names.map(function (name) {
                    return new Promise(function (resolve) {
                        const img = new Image();
                        img.onload = function () { resolve(); };
                        img.onerror = function () { resolve(); };
                        img.src = 'worm/' + name + '.png';
                    });
                }));
            }

            preloadImages().then(function () {
                distanceMaps = buildDistanceMaps();
                gameMode = 'swap';
                updateTopBar();
                generateRandomPuzzle();
            });
        })();
    </script>
</body>
</html>

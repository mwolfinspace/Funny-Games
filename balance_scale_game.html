<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Scale Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rainbow {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 400% 400%;
            animation: rainbow 3s ease infinite;
        }

        .disk-bg {
            background: rgba(251, 191, 36, 0.2);
        }

        .chain {
            background: repeating-linear-gradient(0deg, #888 0px, #888 5px, #666 5px, #666 10px);
        }
        a.return-to-menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(0,0,0,0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s;
            z-index: 1000;
        }
        a.return-to-menu:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 min-h-screen flex flex-col items-center p-5 sm:p-8">
<a class="return-to-menu" href="index.html">🏠</a>
    <h1 class="text-5xl sm:text-6xl font-extrabold text-white mb-6 sm:mb-8">🎯 Balance Scale 🎯</h1>
    
    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-full">
        <!-- Scale Container -->
        <div class="relative h-[350px] mb-8">
            <!-- Stand -->
            <div class="absolute left-1/2 -translate-x-1/2 w-1.5 h-48 bg-gradient-to-b from-amber-700 to-amber-900 top-12 rounded"></div>
            
            <!-- Base -->
            <div class="absolute left-1/2 -translate-x-1/2 w-24 h-5 bg-gradient-to-b from-amber-900 to-amber-950 top-60 rounded-lg"></div>
            
            <!-- Pivot -->
            <div class="absolute left-1/2 top-14 w-5 h-5 bg-yellow-400 rounded-full -translate-x-1/2 border-3 border-orange-500 z-10"></div>
            
            <!-- Arrow -->
            <div id="arrow" class="absolute left-1/2 top-20 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[25px] border-t-red-500 -translate-x-1/2 transition-all duration-500 origin-top z-[5]"></div>
            
            <!-- Difference Label -->
            <div id="diffLabel" class="absolute left-1/2 top-28 -translate-x-1/2 bg-white px-4 py-2 rounded-xl font-bold text-lg border-2 border-gray-800">
                Difference: 0
            </div>
            
            <!-- Beam -->
            <div id="beam" class="absolute left-1/2 top-16 w-[600px] h-2 bg-gradient-to-b from-gray-300 to-gray-500 origin-center -ml-[300px] rounded transition-transform duration-500"></div>
            
            <!-- Chains (hidden) -->
            <div id="chainA" class="chain absolute left-[140px] w-0.5 transition-all duration-500 hidden"></div>
            <div id="chainB" class="chain absolute right-[140px] w-0.5 transition-all duration-500 hidden"></div>
            
            <!-- Disks -->
            <div id="diskA" class="disk-bg absolute left-12 w-48 min-h-32 border-4 border-orange-500 rounded-2xl transition-all duration-500 flex flex-wrap p-2.5 gap-1 content-start z-[1]"></div>
            <div id="diskB" class="disk-bg absolute right-12 w-48 min-h-32 border-4 border-orange-500 rounded-2xl transition-all duration-500 flex flex-wrap p-2.5 gap-1 content-start z-[1]"></div>
        </div>

        <!-- Equation Display -->
        <div id="equationDisplay" class="hidden bg-gradient-to-r from-blue-50 to-purple-50 px-10 py-5 rounded-2xl text-5xl font-extrabold border-3 border-indigo-600 text-center my-8 text-indigo-900"></div>

        <!-- Weights Container -->
        <div id="weightsContainer" class="flex flex-wrap gap-4 justify-center mb-6 min-h-20 p-5 bg-gradient-to-br from-gray-100 to-gray-200 rounded-2xl"></div>

        <!-- Buttons -->
        <div class="flex flex-wrap gap-3 justify-center">
            <button id="resetBtn" class="px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl">
                🔄 Reset
            </button>
            <button id="randomBtn" class="px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl">
                🎲 Random Mystery
            </button>
            <button id="guessBtn" class="px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl">
                🤔 Guess
            </button>
            <button id="toggleDiffBtn" class="px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-purple-400 to-pink-300 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl">
                🙈 Hide Difference
            </button>
            <button id="showEquationBtn" class="px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-violet-500 to-purple-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl">
                📊 Show Equation
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="guessModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[1000] animate-fadeIn">
        <div class="bg-white mx-auto mt-[15%] p-8 rounded-3xl w-11/12 max-w-md text-center animate-slideDown">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-6">🎯 Guess the Mystery Weight!</h2>
            <input type="number" id="guessInput" min="1" placeholder="Enter your guess" 
                class="w-full p-4 text-xl border-2 border-gray-300 rounded-xl mb-6 text-center focus:border-indigo-500 focus:outline-none">
            <div class="flex gap-3 justify-center">
                <button id="submitGuess" class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold rounded-xl hover:-translate-y-1 transition-transform shadow-lg">
                    Guess!
                </button>
                <button id="closeModal" class="px-8 py-3 bg-gray-400 text-white font-extrabold rounded-xl hover:-translate-y-1 transition-transform shadow-lg">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const weights = [];
        let mysteryWeight = 0;
        let mysterySet = false;
        let diskAWeights = [];
        let diskBWeights = [];
        let showDifference = false;
        let showEquation = false;

        const colors = [
            'bg-red-500', 'bg-teal-500', 'bg-sky-500', 'bg-orange-400', 'bg-emerald-400',
            'bg-yellow-400', 'bg-purple-400', 'bg-blue-400', 'bg-amber-400', 'bg-green-400',
            'bg-rose-400', 'bg-slate-500', 'bg-orange-500', 'bg-teal-600', 'bg-violet-600', 'bg-red-600'
        ];

        function initWeights() {
            const container = document.getElementById('weightsContainer');
            container.innerHTML = '';
            weights.length = 0;

            for (let i = 1; i <= 16; i++) {
                const weight = document.createElement('div');
                weight.className = `weight w-16 h-16 rounded-full flex items-center justify-center font-extrabold text-2xl text-black cursor-grab border-3 border-black border-opacity-30 transition-transform hover:scale-110 select-none relative z-[100] ${colors[i - 1]}`;
                weight.style.opacity = '1';
                weight.draggable = true;
                weight.textContent = i;
                weight.dataset.value = i;
                weight.dataset.id = 'w' + i;
                
                weight.addEventListener('dragstart', handleDragStart);
                weight.addEventListener('dragend', handleDragEnd);
                container.appendChild(weight);
                weights.push(weight);
            }

            const mysteryDiv = document.createElement('div');
            mysteryDiv.className = 'weight w-16 h-16 rounded-full flex items-center justify-center font-extrabold text-2xl text-white cursor-grab border-3 border-black border-opacity-30 transition-transform hover:scale-110 select-none relative z-[100] bg-black';
            mysteryDiv.style.opacity = '1';
            mysteryDiv.draggable = true;
            mysteryDiv.textContent = '?';
            mysteryDiv.dataset.value = '0';
            mysteryDiv.dataset.id = 'mystery';
            mysteryDiv.dataset.mystery = 'true';
            mysteryDiv.addEventListener('dragstart', handleDragStart);
            mysteryDiv.addEventListener('dragend', handleDragEnd);
            mysteryDiv.addEventListener('click', handleMysteryClick);
            container.appendChild(mysteryDiv);
            weights.push(mysteryDiv);
        }

        let draggedElement = null;

        function handleDragStart(e) {
            draggedElement = e.target;
            if (e.target.classList && e.target.classList.contains) {
                e.target.style.opacity = '0.5';
            }
        }

        function handleDragEnd(e) {
            if (e.target.classList && e.target.classList.contains) {
                e.target.style.opacity = '1';
            }
        }

        function setupDropZones() {
            const diskA = document.getElementById('diskA');
            const diskB = document.getElementById('diskB');
            const weightsContainer = document.getElementById('weightsContainer');

            [diskA, diskB].forEach(disk => {
                disk.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    disk.classList.add('border-yellow-400');
                    disk.classList.remove('border-orange-500');
                    disk.style.borderWidth = '5px';
                });

                disk.addEventListener('dragleave', (e) => {
                    disk.classList.remove('border-yellow-400');
                    disk.classList.add('border-orange-500');
                    disk.style.borderWidth = '4px';
                });

                disk.addEventListener('drop', (e) => {
                    e.preventDefault();
                    disk.classList.remove('border-yellow-400');
                    disk.classList.add('border-orange-500');
                    disk.style.borderWidth = '4px';
                    
                    if (draggedElement) {
                        if (draggedElement.classList.contains('on-disk')) {
                            return;
                        }
                        
                        const clone = draggedElement.cloneNode(true);
                        clone.className = draggedElement.className.replace('w-16 h-16 text-2xl', 'w-12 h-12 text-lg');
                        clone.classList.add('on-disk');
                        clone.style.opacity = '1';
                        clone.draggable = true;
                        clone.addEventListener('dragstart', handleDragStart);
                        clone.addEventListener('dragend', handleDragEnd);
                        
                        disk.appendChild(clone);
                        
                        const weightValue = parseInt(clone.dataset.value) || mysteryWeight;
                        if (disk.id === 'diskA') {
                            diskAWeights.push(weightValue);
                        } else {
                            diskBWeights.push(weightValue);
                        }
                        
                        expandDisk(disk);
                        updateScale();
                    }
                });
            });

            weightsContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            weightsContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                
                if (draggedElement && draggedElement.classList.contains('on-disk')) {
                    const parentDisk = draggedElement.parentElement;
                    const weightValue = parseInt(draggedElement.dataset.value) || mysteryWeight;
                    
                    if (parentDisk.id === 'diskA') {
                        const index = diskAWeights.indexOf(weightValue);
                        if (index > -1) {
                            diskAWeights.splice(index, 1);
                        }
                    } else if (parentDisk.id === 'diskB') {
                        const index = diskBWeights.indexOf(weightValue);
                        if (index > -1) {
                            diskBWeights.splice(index, 1);
                        }
                    }
                    
                    draggedElement.remove();
                    expandDisk(document.getElementById('diskA'));
                    expandDisk(document.getElementById('diskB'));
                    updateScale();
                }
            });
        }

        function updateScale() {
            const sumA = diskAWeights.reduce((a, b) => a + b, 0);
            const sumB = diskBWeights.reduce((a, b) => a + b, 0);
            const diff = sumA - sumB;
            
            const beam = document.getElementById('beam');
            const diskA = document.getElementById('diskA');
            const diskB = document.getElementById('diskB');
            const arrow = document.getElementById('arrow');
            const diffLabel = document.getElementById('diffLabel');
            
            const maxRotation = 15;
            const rotation = Math.max(-maxRotation, Math.min(maxRotation, -diff * 2));
            beam.style.transform = `rotate(${rotation}deg)`;
            
            arrow.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            
            const baseTop = 50;
            const maxMove = 80;
            const moveAmount = Math.min(maxMove, Math.abs(diff) * 3);
            
            let moveA, moveB;
            if (diff > 0) {
                moveA = moveAmount;
                moveB = -moveAmount;
            } else if (diff < 0) {
                moveA = -moveAmount;
                moveB = moveAmount;
            } else {
                moveA = 0;
                moveB = 0;
            }
            
            diskA.style.top = (baseTop + moveA) + 'px';
            diskB.style.top = (baseTop + moveB) + 'px';
            
            if (!showDifference) {
                diffLabel.textContent = 'Difference: ???';
                diffLabel.className = 'absolute left-1/2 top-28 -translate-x-1/2 bg-white px-4 py-2 rounded-xl font-bold text-lg border-2 border-purple-600 text-purple-600';
            } else {
                diffLabel.textContent = `Difference: ${Math.abs(diff)}`;
                diffLabel.className = 'absolute left-1/2 top-28 -translate-x-1/2 bg-white px-4 py-2 rounded-xl font-bold text-lg border-2 border-gray-800 text-gray-800';
            }
            
            if (diff === 0 && (sumA > 0 || sumB > 0)) {
                arrow.className = arrow.className.replace('border-t-red-500', 'border-t-green-500');
                if (showDifference) {
                    diffLabel.className = 'absolute left-1/2 top-28 -translate-x-1/2 bg-white px-4 py-2 rounded-xl font-bold text-lg border-2 border-green-500 text-green-500';
                }
            } else {
                arrow.className = arrow.className.replace('border-t-green-500', 'border-t-red-500');
            }
            
            updateEquation();
        }
        
        function updateEquation() {
            if (!showEquation) {
                document.getElementById('equationDisplay').classList.add('hidden');
                return;
            }
            
            const equationDisplay = document.getElementById('equationDisplay');
            const diskA = document.getElementById('diskA');
            const diskB = document.getElementById('diskB');
            
            const weightsA = Array.from(diskA.querySelectorAll('.weight'));
            const weightsB = Array.from(diskB.querySelectorAll('.weight'));
            
            let leftSide = weightsA.map(w => {
                if (w.dataset.mystery === 'true') return '?';
                return w.dataset.value;
            }).join(' + ') || '0';
            
            let rightSide = weightsB.map(w => {
                if (w.dataset.mystery === 'true') return '?';
                return w.dataset.value;
            }).join(' + ') || '0';
            
            const sumA = diskAWeights.reduce((a, b) => a + b, 0);
            const sumB = diskBWeights.reduce((a, b) => a + b, 0);
            
            let operator = '=';
            if (sumA > sumB) {
                operator = '>';
            } else if (sumA < sumB) {
                operator = '<';
            }
            
            equationDisplay.textContent = `${leftSide} ${operator} ${rightSide}`;
            equationDisplay.classList.remove('hidden');
        }

        function expandDisk(disk) {
            const weightCount = disk.querySelectorAll('.weight').length;
            const weightsPerRow = 5;
            const weightSize = 49;
            const padding = 20;
            
            let newWidth;
            if (weightCount === 0) {
                newWidth = 180;
            } else if (weightCount <= weightsPerRow) {
                newWidth = Math.max(180, (weightCount * weightSize) + padding);
            } else {
                newWidth = (weightsPerRow * weightSize) + padding;
            }
            
            newWidth = Math.min(newWidth, 400);
            disk.style.width = newWidth + 'px';
        }

        function checkMysteryOnDisk() {
            const diskA = document.getElementById('diskA');
            const diskB = document.getElementById('diskB');
            
            const weightsOnA = diskA.querySelectorAll('.weight');
            const weightsOnB = diskB.querySelectorAll('.weight');
            
            for (let weight of weightsOnA) {
                if (weight.dataset.mystery === 'true') return true;
            }
            
            for (let weight of weightsOnB) {
                if (weight.dataset.mystery === 'true') return true;
            }
            
            return false;
        }

        function reset() {
            document.getElementById('diskA').innerHTML = '';
            document.getElementById('diskB').innerHTML = '';
            document.getElementById('diskA').style.width = '180px';
            document.getElementById('diskB').style.width = '180px';
            diskAWeights = [];
            diskBWeights = [];
            mysteryWeight = 0;
            mysterySet = false;
            
            const mysteryDiv = document.querySelector('[data-mystery="true"]');
            if (mysteryDiv) {
                mysteryDiv.classList.remove('rainbow');
                mysteryDiv.classList.add('bg-black');
                mysteryDiv.dataset.value = '0';
            }
            
            updateScale();
        }

        function randomMystery() {
            mysteryWeight = Math.floor(Math.random() * 16) + 1;
            mysterySet = true;
            
            const mysteryDiv = document.querySelector('[data-mystery="true"]');
            if (mysteryDiv) {
                mysteryDiv.classList.add('rainbow');
                mysteryDiv.classList.remove('bg-black');
                mysteryDiv.dataset.value = mysteryWeight;
            }
            
            alert('🎉 Mystery weight has been set! Try to guess it by balancing the scale!');
        }

        function handleMysteryClick(e) {
            const mysteryDiv = e.target;
            const input = prompt('Enter the weight for ? (any number):');
            
            if (input === null) return;
            
            const value = parseInt(input);
            
            if (!value || value < 1) {
                alert('⚠️ Please enter a positive number!');
                return;
            }
            
            mysteryWeight = value;
            mysterySet = true;
            mysteryDiv.classList.add('rainbow');
            mysteryDiv.classList.remove('bg-black');
            mysteryDiv.dataset.value = mysteryWeight;
            
            alert(`✅ Mystery weight set to ${mysteryWeight}!`);
        }

        function toggleDifference() {
            showDifference = !showDifference;
            const btn = document.getElementById('toggleDiffBtn');
            
            if (showDifference) {
                btn.textContent = '👁️ Show Difference';
                btn.className = 'px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-pink-400 to-yellow-300 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl';
            } else {
                btn.textContent = '🙈 Hide Difference';
                btn.className = 'px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-purple-400 to-pink-300 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl';
            }
            
            updateScale();
        }

        function toggleEquation() {
            showEquation = !showEquation;
            const btn = document.getElementById('showEquationBtn');
            
            if (showEquation) {
                btn.textContent = '📊 Hide Equation';
                btn.className = 'px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-purple-600 to-pink-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl';
            } else {
                btn.textContent = '📊 Show Equation';
                btn.className = 'px-6 py-3 text-xl font-extrabold rounded-xl bg-gradient-to-r from-violet-500 to-purple-500 text-white hover:-translate-y-1 transition-transform shadow-lg hover:shadow-xl';
            }
            
            updateEquation();
        }

        function showGuessModal() {
            if (!mysterySet) {
                alert('⚠️ Please set a mystery weight first by clicking "Random Mystery" or clicking on the ? weight!');
                return;
            }
            document.getElementById('guessModal').classList.remove('hidden');
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();
        }

        function checkGuess() {
            const guess = parseInt(document.getElementById('guessInput').value);
            
            if (!guess || guess < 1) {
                alert('⚠️ Please enter a positive number!');
                return;
            }
            
            if (guess === mysteryWeight) {
                alert(`🎉 Congratulations! You guessed it right! The mystery weight is ${mysteryWeight}! 🎊`);
            } else {
                const hint = guess < mysteryWeight ? 'higher' : 'lower';
                alert(`❌ Sorry, that's not correct. The mystery weight is ${hint} than ${guess}. Try again!`);
            }
            
            document.getElementById('guessModal').classList.add('hidden');
        }

        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('randomBtn').addEventListener('click', randomMystery);
        document.getElementById('guessBtn').addEventListener('click', showGuessModal);
        document.getElementById('toggleDiffBtn').addEventListener('click', toggleDifference);
        document.getElementById('showEquationBtn').addEventListener('click', toggleEquation);
        document.getElementById('submitGuess').addEventListener('click', checkGuess);
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('guessModal').classList.add('hidden');
        });

        document.getElementById('guessInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('guessModal');
            if (e.target === modal) {
                modal.classList.add('hidden');
            }
        });

        initWeights();
        setupDropZones();
        updateScale();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentomino Puzzle</title>
    <link rel="stylesheet" href="Pentomino.css">
    <style>
        a.return-to-menu {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(0,0,0,0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s;
            z-index: 1000;
        }
        a.return-to-menu:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<a class="return-to-menu" href="index.html">🏠</a>
    <h1>Pentomino Puzzle</h1>

    <div id="setup-screen">
        <h2>Choose Board Size</h2>
        <div id="size-options">
            <button class="size-btn" data-rows="3" data-cols="20">3 x 20</button>
            <button class="size-btn" data-rows="4" data-cols="15">4 x 15</button>
            <button class="size-btn" data-rows="5" data-cols="12">5 x 12</button>
            <button class="size-btn" data-rows="6" data-cols="10">6 x 10</button>
        </div>
        <div>
            <label for="custom-rows">Custom:</label>
            <input type="number" id="custom-rows" min="1" placeholder="Rows">
            <span>x</span>
            <input type="number" id="custom-cols" min="1" placeholder="Cols">
            <button id="custom-size-btn">Set Custom Size</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div id="game-controls">
            <div id="target-status">Targets placed: <span id="target-count">0</span></div>
            <button id="fill-board-btn">Fill the board</button>
            <button id="undo-btn">Undo</button>
            <button id="redo-btn">Redo</button>
            <button id="end-game-btn">End Game</button>
        </div>
        <div id="board-container">
            <div id="game-board"></div>
            <div id="pieces-container"></div>
        </div>
        <div id="target-list"></div>
        <div id="win-message" class="hidden">
            <h2>Congratulations!</h2>
            <p>You have found all the targets.</p>
        </div>
    </div>

    <script src="Pentomino.js"></script>
</body>
</html>

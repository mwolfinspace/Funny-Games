<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Chú Chó Của Molly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            width: 95vw;
            height: 95vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            overflow: hidden;
        }
        
        .hint-panel {
            flex: 1;
            padding: 40px;
            background: linear-gradient(to bottom, #f8f9fa 0%, #e9ecef 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .hint-cards {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }
        
        .hint-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1.4em;
            line-height: 1.8;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hint-card.faded {
            filter: blur(8px);
            opacity: 0.4;
            transform: scale(0.98);
        }
        
        .hint-card.faded:hover {
            filter: blur(0px);
            opacity: 1;
            transform: scale(1);
        }
        
        .hint-card.current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .hint-card.clickable {
            cursor: pointer;
        }
        
        .hint-card.clickable:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .control-panel {
            width: 400px;
            padding: 40px;
            background: white;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-left: 3px solid #e9ecef;
        }
        
        .game-title {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 20px 30px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .history-item {
            font-size: 1.5em;
            line-height: 2;
            padding: 20px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }
        
        .close-modal {
            background: #dc3545;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            float: right;
        }
        
        .answer-list {
            font-size: 1.4em;
            line-height: 2.2;
        }
        
        .answer-item {
            padding: 15px;
            margin: 10px 0;
            background: #e3f2fd;
            border-radius: 10px;
            border-left: 5px solid #2196f3;
        }
        
        .start-screen {
            text-align: center;
            padding: 60px;
        }
        
        .start-screen h1 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .start-screen p {
            font-size: 1.6em;
            line-height: 1.8;
            color: #666;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hint-panel">
            <div id="startScreen" class="start-screen">
                <h1>🐕 Tìm Chú Chó Của Molly</h1>
                <p>Chú chó cưng của Molly đã lạc mất! Hãy theo dõi các gợi ý để tìm ra vị trí của chú chó nhé.</p>
            </div>
            <div id="hintCards" class="hint-cards" style="display: none;"></div>
        </div>
        
        <div class="control-panel">
            <div class="game-title">🎮 Điều Khiển</div>
            <button id="btnStart" class="btn btn-primary">Bắt Đầu Trò Chơi</button>
            <button id="btnNext" class="btn btn-primary" style="display: none;" disabled>Gợi Ý Tiếp Theo</button>
            <button id="btnNight" class="btn btn-secondary" style="display: none;" disabled>🌙 Trời Tối</button>
            <button id="btnHistory" class="btn btn-success" style="display: none;" disabled>📜 Lịch Sử Gợi Ý</button>
            <button id="btnAnswer" class="btn btn-warning" style="display: none;" disabled>📍 Xác Định Vị Trí</button>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle"></h2>
            <div id="modalBody"></div>
            <button class="close-modal" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        const locations = {
            'Nhà Molly': [3, 11],
            'Sân chơi': [8, 11],
            'Siêu thị': [10, 11],
            'Nhà Tom': [2, 9],
            'Nhà Hans': [5, 8],
            'Sân bóng': [11, 7],
            'Thư viện': [6, 6],
            'Nhà Alex': [3, 4],
            'Trạm cứu hoả': [9, 4],
            'Đồn cảnh sát': [1, 3],
            'Nhà Sally': [7, 3],
            'Công viên': [4, 1],
            'Trường học': [10, 1]
        };

        const directions = ['bắc', 'nam', 'đông', 'tây'];
        const directionVectors = {
            'bắc': [0, 1],
            'nam': [0, -1],
            'đông': [1, 0],
            'tây': [-1, 0]
        };

        const flavorTexts = [
            { type: 'direction-first', text: 'Chú chó nghe thấy tiếng động thú vị nên chạy về hướng', emoji: '👂🎵' },
            { type: 'direction-first', text: 'Chú chó thấy khát nước nên tìm đường về', emoji: '💧😓' },
            { type: 'direction-first', text: 'Chú chó đuổi theo một con bướm bay về phía', emoji: '🦋✨' },
            { type: 'direction-first', text: 'Chú chó ngửi thấy mùi thức ăn ngon từ phía', emoji: '👃🍖' },
            { type: 'direction-first', text: 'Chú chó tò mò chạy về hướng', emoji: '🤔💭' },
            { type: 'direction-first', text: 'Chú chó thấy một người bạn mới ở phía', emoji: '👋😊' },
            { type: 'direction-first', text: 'Chú chó muốn khám phá nên đi về', emoji: '🔍🗺️' },
            { type: 'direction-first', text: 'Chú chó chạy vui vẻ về phía', emoji: '🎉😄' },
            { type: 'distance-first', text: 'Chú chó chạy thật nhanh được', emoji: '💨⚡' },
            { type: 'distance-first', text: 'Chú chó lao đi một đoạn', emoji: '🏃‍♂️💫' },
            { type: 'distance-first', text: 'Chú chó chạy mệt nghỉ được khoảng', emoji: '😮‍💨🐾' },
            { type: 'distance-first', text: 'Chú chó di chuyển được', emoji: '🚶‍♂️🐕' },
            { type: 'distance-first', text: 'Chú chó rảo bước đi được', emoji: '🎵🐾' },
            { type: 'distance-first', text: 'Chú chó nhảy nhót đi được quãng', emoji: '🕺✨' },
            { type: 'direction-first', text: 'Bác Tom thấy chú chó đang chạy về phía', emoji: '👨‍🌾👀' },
            { type: 'direction-first', text: 'Cô Kim nhìn thấy chú chó lao về hướng', emoji: '👩‍🦰👋' },
            { type: 'direction-first', text: 'Anh Minh kể rằng chú chó chạy qua về', emoji: '👨‍💼📢' },
            { type: 'distance-first', text: 'Bà Lan trông thấy chú chó đi được', emoji: '👵👓' },
            { type: 'distance-first', text: 'Chú Hùng nói chú chó chạy được', emoji: '👨‍🔧🗣️' },
            { type: 'direction-first', text: 'Em bé Lisa thấy chú chó vui vẻ nhảy về', emoji: '👧🏻🎀' },
            { type: 'distance-first', text: 'Ông già bán bánh nói chú chó vừa đi', emoji: '👴🥖' },
            { type: 'direction-first', text: 'Chị Mai kể chú chó chạy rất nhanh về', emoji: '👩‍⚕️💬' },
            { type: 'distance-first', text: 'Anh shipper thấy chú chó đi được', emoji: '🛵📦' },
            { type: 'direction-first', text: 'Chú chó nghe tiếng mèo kêu nên chạy về', emoji: '😺🔔' },
            { type: 'direction-first', text: 'Chú chó thấy bóng bay màu đỏ bay về', emoji: '🎈❤️' },
            { type: 'distance-first', text: 'Chú chó đuổi theo chiếc lá bay được', emoji: '🍃🌬️' },
            { type: 'direction-first', text: 'Chú chó nghe thấy tiếng chuông xe kem về phía', emoji: '🍦🔔' },
            { type: 'distance-first', text: 'Chú chó thấy có chim bay nên chạy theo được', emoji: '🐦🌤️' }
        ];

        let dogPosition = [0, 0];
        let hints = [];
        let currentHintIndex = -1;
        let isNight = false;
        let gameStarted = false;

        function getRandomLocation() {
            const keys = Object.keys(locations);
            return keys[Math.floor(Math.random() * keys.length)];
        }

        function getRandomDirection() {
            return directions[Math.floor(Math.random() * directions.length)];
        }

        function getRandomDistance() {
            return (Math.floor(Math.random() * 10) + 1) * 10;
        }

        function getRandomFlavorText() {
            return flavorTexts[Math.floor(Math.random() * flavorTexts.length)];
        }

        function isValidPosition(x, y) {
            return x >= 0 && x <= 12 && y >= 0 && y <= 12;
        }

        function generateNextHint() {
            let validMove = false;
            let direction, distance, newX, newY;
            let attempts = 0;

            while (!validMove && attempts < 100) {
                direction = getRandomDirection();
                distance = getRandomDistance();
                const distanceInUnits = distance / 10;
                const vector = directionVectors[direction];
                newX = dogPosition[0] + vector[0] * distanceInUnits;
                newY = dogPosition[1] + vector[1] * distanceInUnits;

                if (isValidPosition(newX, newY)) {
                    validMove = true;
                }
                attempts++;
            }

            if (!validMove) {
                distance = 10;
                direction = getRandomDirection();
                const vector = directionVectors[direction];
                newX = dogPosition[0] + vector[0];
                newY = dogPosition[1] + vector[1];
            }

            dogPosition = [newX, newY];
            const flavorObj = getRandomFlavorText();
            
            if (flavorObj.type === 'direction-first') {
                return `${flavorObj.emoji} ${flavorObj.text} ${direction} một đoạn ${distance}m.`;
            } else {
                return `${flavorObj.emoji} ${flavorObj.text} ${distance}m về hướng ${direction}.`;
            }
        }

        function startGame() {
            const startLocation = getRandomLocation();
            dogPosition = [...locations[startLocation]];
            hints = [`📍 Chú chó lần cuối được nhìn thấy ở ${startLocation}.`];
            currentHintIndex = 0;
            isNight = false;
            gameStarted = true;

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('hintCards').style.display = 'flex';
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnNext').style.display = 'block';
            document.getElementById('btnNext').disabled = false;
            document.getElementById('btnNight').style.display = 'block';
            document.getElementById('btnNight').disabled = false;
            document.getElementById('btnHistory').style.display = 'block';
            document.getElementById('btnHistory').disabled = false;

            renderHints();
        }

        function renderHints() {
            const container = document.getElementById('hintCards');
            container.innerHTML = '';

            hints.forEach((hint, index) => {
                const card = document.createElement('div');
                card.className = 'hint-card';
                
                if (index === currentHintIndex) {
                    card.classList.add('current');
                } else if (index < currentHintIndex) {
                    card.classList.add('faded');
                }

                if (index < currentHintIndex) {
                    card.classList.add('clickable');
                    card.onclick = () => goBackToHint(index);
                }

                card.textContent = `${index + 1}. ${hint}`;
                container.appendChild(card);
            });

            // Scroll to the latest card (at the bottom)
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function goBackToHint(index) {
            hints = hints.slice(0, index + 1);
            currentHintIndex = index;

            const locationMatch = hints[0].match(/ở (.+)\./);
            if (locationMatch) {
                dogPosition = [...locations[locationMatch[1]]];
            }

            for (let i = 1; i <= index; i++) {
                const match = hints[i].match(/(bắc|nam|đông|tây) một đoạn (\d+)m/);
                if (match) {
                    const dir = match[1];
                    const dist = parseInt(match[2]) / 10;
                    const vector = directionVectors[dir];
                    dogPosition[0] += vector[0] * dist;
                    dogPosition[1] += vector[1] * dist;
                }
            }

            isNight = false;
            document.getElementById('btnNext').disabled = false;
            document.getElementById('btnNight').disabled = false;
            document.getElementById('btnAnswer').style.display = 'none';
            renderHints();
        }

        function nextHint() {
            if (isNight) return;

            const hint = generateNextHint();
            hints.push(hint);
            currentHintIndex++;
            renderHints();
        }

        function nightFall() {
            if (isNight) return;

            const hint = generateNextHint();
            hints.push(hint + ' 😴💤 Chú chó đã mệt và nằm nghỉ tại đó.');
            currentHintIndex++;
            isNight = true;

            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnNight').disabled = true;
            document.getElementById('btnAnswer').style.display = 'block';
            document.getElementById('btnAnswer').disabled = false;

            renderHints();

            setTimeout(() => {
                const card = document.createElement('div');
                card.className = 'hint-card current';
                card.style.marginTop = '30px';
                card.textContent = '❓🤔 Chú chó đang ở đâu?';
                document.getElementById('hintCards').appendChild(card);
            }, 500);
        }

        function showHistory() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '';

            hints.forEach((hint, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = `${index + 1}. ${hint}`;
                modalBody.appendChild(item);
            });

            document.getElementById('modalTitle').textContent = '📜 Lịch Sử Gợi Ý';
            document.getElementById('modal').classList.add('active');
        }

        function showAnswer() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<div class="answer-list"></div>';
            const answerList = modalBody.querySelector('.answer-list');

            const nearbyLocations = [];
            for (const [name, pos] of Object.entries(locations)) {
                const dx = (dogPosition[0] - pos[0]) * 10;
                const dy = (dogPosition[1] - pos[1]) * 10;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= 50) {
                    nearbyLocations.push({ name, pos, distance, dx, dy });
                }
            }

            nearbyLocations.sort((a, b) => a.distance - b.distance);

            if (nearbyLocations.length === 0) {
                answerList.innerHTML = '<div class="answer-item">Không có địa điểm nào trong bán kính 50m.</div>';
            } else {
                nearbyLocations.forEach(loc => {
                    const item = document.createElement('div');
                    item.className = 'answer-item';

                    let instruction = `📍 Từ ${loc.name}`;
                    const absDx = Math.abs(loc.dx);
                    const absDy = Math.abs(loc.dy);

                    if (absDx === 0 && absDy === 0) {
                        instruction += ', chú chó đang ở ngay đây!';
                    } else {
                        const steps = [];
                        if (absDx > 0) {
                            const dirX = loc.dx > 0 ? 'đông' : 'tây';
                            steps.push(`đi về phía ${dirX} ${Math.round(absDx)}m`);
                        }
                        if (absDy > 0) {
                            const dirY = loc.dy > 0 ? 'bắc' : 'nam';
                            steps.push(`đi về phía ${dirY} ${Math.round(absDy)}m`);
                        }
                        instruction += ', ' + steps.join(' rồi ') + '.';
                    }

                    item.textContent = instruction;
                    answerList.appendChild(item);
                });
            }

            document.getElementById('modalTitle').textContent = '📍 Vị Trí Chú Chó';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('btnStart').onclick = startGame;
        document.getElementById('btnNext').onclick = nextHint;
        document.getElementById('btnNight').onclick = nightFall;
        document.getElementById('btnHistory').onclick = showHistory;
        document.getElementById('btnAnswer').onclick = showAnswer;
    </script>
</body>
</html>

            function clearEftSlot(dir) {
                state.eftImages[dir] = null;
                state.eftMerged[dir] = false;
                renderEftOuter(dir);
                renderEftCenter();
                showToast(`Cleared ${dir} slot`);
            }

            /** 2. Drag and Drop Logic */
            function handleEftDragStart(e, dir) {
                if (!state.eftImages[dir]) {
                    e.preventDefault();
                    return;
                }
                draggedFrom = dir;
                e.dataTransfer.setData("text/plain", dir);
                e.currentTarget.style.opacity = "0.5";
            }

            function handleEftDragEnd(e) {
                e.currentTarget.style.opacity = "1";
                document
                    .querySelectorAll(".eft-cell")
                    .forEach((c) => c.classList.remove("drag-hover"));
            }

            function handleEftDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add("drag-hover");
            }

            function handleEftDragLeave(e) {
                e.currentTarget.classList.remove("drag-hover");
            }

            function handleEftDrop(e, targetDir) {
                e.preventDefault();
                const sourceDir = e.dataTransfer.getData("text/plain");
                if (sourceDir === targetDir) return;

                // Swap images
                const temp = state.eftImages[targetDir];
                state.eftImages[targetDir] = state.eftImages[sourceDir];
                state.eftImages[sourceDir] = temp;

                // Reset merged status on swap
                state.eftMerged[targetDir] = false;
                state.eftMerged[sourceDir] = false;

                renderEftOuter(sourceDir);
                renderEftOuter(targetDir);
                renderEftCenter();
                selectEftCell(targetDir);
            }

            /** 3. Rendering */
            function setEftImage(shapeId) {
                if (!state.eftActiveCell) {
                    showToast("Please select a canvas slot first!");
                    return;
                }
                const dir = state.eftActiveCell;
                state.eftImages[dir] = shapeId;
                state.eftMerged[dir] = false;
                renderEftOuter(dir);
                renderEftCenter();
            }

            function renderEftOuter(dir) {
                if (dir === "center") return;
                const cell = document.getElementById(`eft-${dir}`);
                if (!cell) return;
                cell.innerHTML = "";
                if (state.eftImages[dir]) {
                    const img = document.createElement("img");
                    img.src = shapeCache[state.eftImages[dir]];
                    img.style.width = "100%";
                    img.style.height = "100%";
                    img.style.objectFit = "contain";
                    img.style.opacity = state.eftMerged[dir] ? "0.2" : "1";
                    cell.appendChild(img);
                }
            }

            function renderEftCenter() {
                const centerCell = document.getElementById("eft-center");
                centerCell.innerHTML = "";

                // Draw Base (Center Slot)
                if (state.eftImages.center) {
                    const img = document.createElement("img");
                    img.src = shapeCache[state.eftImages.center];
                    img.style.width = "100%";
                    img.style.height = "100%";
                    img.style.objectFit = "contain";
                    centerCell.appendChild(img);
                }

                // Draw Merged Layers with Correct Mirroring
                ["top", "bottom", "left", "right"].forEach((dir) => {
                    if (state.eftMerged[dir] && state.eftImages[dir]) {
                        const img = document.createElement("img");
                        img.src = shapeCache[state.eftImages[dir]];
                        img.style.position = "absolute";
                        img.style.top = "0";
                        img.style.left = "0";
                        img.style.width = "100%";
                        img.style.height = "100%";
                        img.style.objectFit = "contain";

                        // Mirroring logic to match the 180-degree fold
                        if (dir === "top" || dir === "bottom") {
                            img.style.transform = "scaleY(-1)";
                        } else {
                            img.style.transform = "scaleX(-1)";
                        }

                        centerCell.appendChild(img);
                    }
                });
            }

            function doEftFlip(dir) {
                const shapeId = state.eftImages[dir];
                if (!shapeId || state.eftMerged[dir]) return;

                const sourceCell = document.getElementById(`eft-${dir}`);
                const container = document.getElementById("eftContainer");
                const imgToFlip = sourceCell.querySelector("img");
                if (!imgToFlip) return;

                // 1. Create the animation clone
                const clone = imgToFlip.cloneNode();
                clone.style.position = "absolute";
                clone.style.width = "220px";
                clone.style.height = "220px";
                clone.style.zIndex = "1000";
                clone.style.transition =
                    "transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s";
                clone.style.pointerEvents = "none";

                // 2. Position clone exactly over source using offset position
                clone.style.left = sourceCell.offsetLeft + "px";
                clone.style.top = sourceCell.offsetTop + "px";

                /** * 3. THE AXIS MATH
                 * The gap is 40px. The "hinge" is at 20px into that gap.
                 * Half-width of shape is 110px.
                 * Total distance from shape start to hinge = 110 + 20 = 130px.
                 */
                if (dir === "top") clone.style.transformOrigin = "50% 240px"; // 220 (height) + 20 (half gap)
                if (dir === "bottom") clone.style.transformOrigin = "50% -20px";
                if (dir === "left") clone.style.transformOrigin = "240px 50%"; // 220 (width) + 20 (half gap)
                if (dir === "right") clone.style.transformOrigin = "-20px 50%";

                container.appendChild(clone);
                imgToFlip.style.opacity = "0.2"; // Ghost the source

                // 4. Trigger Animation
                requestAnimationFrame(() => {
                    // We use translateZ to ensure it flips "Frontward" towards the camera
                    if (dir === "top")
                        clone.style.transform =
                            "translateZ(50px) rotateX(-180deg)";
                    if (dir === "bottom")
                        clone.style.transform =
                            "translateZ(50px) rotateX(180deg)";
                    if (dir === "left")
                        clone.style.transform =
                            "translateZ(50px) rotateY(180deg)";
                    if (dir === "right")
                        clone.style.transform =
                            "translateZ(50px) rotateY(-180deg)";
                });

                // 5. Finalize Merge
                setTimeout(() => {
                    clone.style.transform += " translateZ(-50px)"; // "Lowering" effect
                    clone.style.opacity = "0";
                    setTimeout(() => {
                        clone.remove();
                        state.eftMerged[dir] = true;
                        renderEftCenter();
                    }, 200);
                }, 1100);
            }

            function doEftReset(dir) {
                if (!state.eftMerged[dir]) return;
                state.eftMerged[dir] = false;
                renderEftOuter(dir);
                renderEftCenter();
            }
            // ------------------------------------------

            /** SEED SYSTEM (BASE-81) */
            function encodeSeed(layers) {
                let seed = "";
                layers.forEach((l) => {
                    if (l.shapeId > SHAPES_COUNT) return;

                    const normRot = ((l.rotation % 360) + 360) % 360;
                    const rot = normRot / 90;
                    const fH = l.flipH ? 1 : 0;
                    const fV = l.flipV ? 1 : 0;
                    const vis = l.visible === false ? 1 : 0;
                    const tCode = rot + fH * 4 + fV * 8 + vis * 16;
                    const sCode = l.shapeId - 1;
                    const val = sCode * 32 + tCode;
                    const c1 = BASE81_CHARS[Math.floor(val / 81)];
                    const c2 = BASE81_CHARS[val % 81];
                    seed += c1 + c2;
                });
                return seed;
            }

            function decodeSeed(seed) {
                const layers = [];
                for (let i = 0; i < seed.length; i += 2) {
                    if (i + 1 >= seed.length) break;
                    const c1 = BASE81_CHARS.indexOf(seed[i]);
                    const c2 = BASE81_CHARS.indexOf(seed[i + 1]);
                    if (c1 < 0 || c2 < 0) continue;
                    const val = c1 * 81 + c2;
                    const sCode = Math.floor(val / 32);
                    const tCode = val % 32;

                    const shapeId = sCode + 1;
                    const rot = (tCode % 4) * 90;
                    const flipH = Math.floor((tCode % 8) / 4) === 1;
                    const flipV = Math.floor((tCode % 16) / 8) === 1;
                    const visible = Math.floor(tCode / 16) === 0;

                    layers.push({
                        id: state.nextLayerId++,
                        shapeId,
                        rotation: rot,
                        flipH,
                        flipV,
                        locked: false,
                        visible,
                    });
                }
                return layers;
            }

            /** PAN & ZOOM */
            function getAutoZoomScale() {
                if (state.extraFlipMode) {
                    const vpWidth = UI.efWorkspace.clientWidth;
                    const vpHeight = UI.efWorkspace.clientHeight;
                    return Math.min(1, (vpWidth - 40) / 740, (vpHeight - 40) / 740);
                } else if (state.eftMode) {
                    const vpWidth = UI.eftWorkspace.clientWidth;
                    const vpHeight = UI.eftWorkspace.clientHeight;
                    return Math.min(1, (vpWidth - 40) / 740, (vpHeight - 40) / 740);
                } else {
                    return 1;
                }
            }

            function setAutoZoom(val) {
                state.autoZoom = val;
                const btn = document.getElementById("btnAutoZoom");
                if (btn) {
                    btn.style.background = val ? "var(--layer-active)" : "var(--btn-bg)";
                }
                if (val) {
                    state.zoom = getAutoZoomScale();
                    state.panX = 0;
                    state.panY = 0;
                }
                applyTransform();
            }

            function applyTransform() {
                if (state.extraFlipMode) {
                    const container = UI.efContainer;
                    if (!container) return;
                    if (state.autoZoom) {
                        const autoScale = getAutoZoomScale();
                        container.style.transform = `translate(0px, 0px) scale(${autoScale})`;
                    } else {
                        container.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
                    }
                } else if (state.eftMode) {
                    const container = UI.eftContainer;
                    if (!container) return;
                    if (state.autoZoom) {
                        const autoScale = getAutoZoomScale();
                        container.style.transform = `translate(0px, 0px) scale(${autoScale})`;
                    } else {
                        container.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
                    }
                } else {
                    if (state.autoZoom)
                        UI.canvas.style.transform = `translate(0px, 0px) scale(1)`;
                    else
                        UI.canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
                }
            }

            let isPanning = false,
                startMouseX,
                startMouseY,
                startPanX,
                startPanY;

            function setupPanZoom(element) {
                element.addEventListener("contextmenu", (e) => e.preventDefault());
                element.addEventListener("mousedown", (e) => {
                    if (e.button === 2 || (e.button === 0 && e.ctrlKey)) {
                        isPanning = true;
                        if (state.autoZoom) {
                            state.zoom = getAutoZoomScale();
                            state.panX = 0;
                            state.panY = 0;
                            state.autoZoom = false;
                            const btn = document.getElementById("btnAutoZoom");
                            if (btn) btn.style.background = "var(--btn-bg)";
                        }
                        startMouseX = e.clientX;
                        startMouseY = e.clientY;
                        startPanX = state.panX;
                        startPanY = state.panY;
                    }
                });
                element.addEventListener(
                    "wheel",
                    (e) => {
                        if (state.autoZoom) {
                            state.zoom = getAutoZoomScale();
                            state.panX = 0;
                            state.panY = 0;
                            state.autoZoom = false;
                            const btn = document.getElementById("btnAutoZoom");
                            if (btn) btn.style.background = "var(--btn-bg)";
                        }
                        e.preventDefault();
                        const z = e.deltaY > 0 ? 0.9 : 1.1;
                        state.zoom = Math.max(0.1, Math.min(state.zoom * z, 10));
                        applyTransform();
                    },
                    { passive: false },
                );
                element.addEventListener(
                    "touchstart",
                    (e) => {
                        if (e.touches.length > 1) e.preventDefault();
                    },
                    { passive: false },
                );
            }

            setupPanZoom(UI.workspace);
            setupPanZoom(UI.efWorkspace);
            setupPanZoom(UI.eftWorkspace);

            window.addEventListener("mousemove", (e) => {
                if (!isPanning) return;
                state.panX = startPanX + (e.clientX - startMouseX);
                state.panY = startPanY + (e.clientY - startMouseY);
                applyTransform();
            });
            window.addEventListener("mouseup", () => (isPanning = false));
            window.addEventListener("resize", () => {

            async function renderToCanvasContext(
                canvas,
                layers,
                size,
                transparent = true,
            ) {
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d", {
                    willReadFrequently: true,
                });
                ctx.clearRect(0, 0, size, size);
                if (!transparent) {
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, size, size);
                }

                for (const l of layers) {
                    if (l.visible === false) continue;
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            ctx.save();
                            ctx.translate(size / 2, size / 2);
                            ctx.scale(l.flipH ? -1 : 1, l.flipV ? -1 : 1);
                            ctx.rotate((l.rotation * Math.PI) / 180);
                            const aspect =
                                img.naturalWidth && img.naturalHeight
                                    ? img.naturalWidth / img.naturalHeight
                                    : 1;
                            let drawWidth = size;
                            let drawHeight = size;
                            if (aspect > 1) drawHeight = size / aspect;
                            else if (aspect > 0) drawWidth = size * aspect;
                            ctx.drawImage(
                                img,
                                -drawWidth / 2,
                                -drawHeight / 2,
                                drawWidth,
                                drawHeight,
                            );
                            ctx.restore();
                            resolve();
                        };
                        img.src =
                            l.shapeId === 12 && shapeCacheNoOutline[12]
                                ? shapeCacheNoOutline[12]
                                : shapeCache[l.shapeId];
                    });
                }
                return ctx;
            }

            async function doExport() {
                const tempCanvas = document.createElement("canvas");
                await renderToCanvasContext(

                    2400,
                    document.getElementById("chkTransparentBg").checked,
                );
                const link = document.createElement("a");
                link.download = `ShapeStack_${encodeSeed(state.layers) || "empty"}.png`;
                link.href = tempCanvas.toDataURL("image/png", 1.0);
                link.click();
            }

            /** PUZZLE MATCHING */
            async function generateRandomPuzzle() {
                let min = 2,
                    max = 3;
                if (state.difficulty === "easy") {
                    min = 2;
                    max = 3;
                } else if (state.difficulty === "medium") {
                    min = 4;
                    max = 5;
                } else if (state.difficulty === "hard") {
                    min = 6;
                    max = 8;
                }

                const targetCount =
                    Math.floor(Math.random() * (max - min + 1)) + min;
                state.puzzleLayers = [];

                const SIZE = 200;
                const canvas = document.createElement("canvas");
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext("2d", {
                    willReadFrequently: true,
                });

                for (let i = 0; i < targetCount; i++) {
                    let attempts = 0,
                        success = false;
                    while (attempts < 30 && !success) {
                        attempts++;
                        const candidate = {
                            id: state.nextLayerId++,
                            shapeId:
                                Math.floor(Math.random() * SHAPES_COUNT) + 1,
                            rotation: Math.floor(Math.random() * 4) * 90,
                            flipH: Math.random() > 0.5,
                            flipV: Math.random() > 0.5,
                            locked: false,
                        };

                        const testLayers = [...state.puzzleLayers, candidate];
                        ctx.clearRect(0, 0, SIZE, SIZE);
                        await renderToCanvasContext(canvas, testLayers, SIZE);
                        const fullData = ctx.getImageData(
                            0,
                            0,
                            SIZE,
                            SIZE,
                        ).data;

                        let allLayersValid = true;
                        for (let t = 0; t < testLayers.length; t++) {
                            const subsetLayers = testLayers.filter(
                                (_, idx) => idx !== t,
                            );
                            ctx.clearRect(0, 0, SIZE, SIZE);
                            await renderToCanvasContext(
                                canvas,
                                subsetLayers,
                                SIZE,
                            );
                            const subsetData = ctx.getImageData(
                                0,
                                0,
                                SIZE,
                                SIZE,
                            ).data;

                            let changedPixels = 0;
                            for (let j = 0; j < fullData.length; j += 4) {
                                if (
                                    Math.abs(fullData[j] - subsetData[j]) > 5 ||
                                    Math.abs(
                                        fullData[j + 1] - subsetData[j + 1],
                                    ) > 5 ||
                                    Math.abs(
                                        fullData[j + 2] - subsetData[j + 2],
                                    ) > 5 ||
                                    Math.abs(
                                        fullData[j + 3] - subsetData[j + 3],
                                    ) > 5
                                ) {
                                    changedPixels++;
                                }
                            }
                            if (changedPixels / (SIZE * SIZE) < 0.03) {
                                allLayersValid = false;
                                break;
                            }
                        }
                        if (allLayersValid) {
                            state.puzzleLayers.push(candidate);
                            success = true;
                        }
                    }
                }

                const tempCanvas1 = document.createElement("canvas");
                tempCanvas1.width = SIZE;
                tempCanvas1.height = SIZE;
                const tCtx1 = tempCanvas1.getContext("2d", {
                    willReadFrequently: true,
                });

                const tempCanvas2 = document.createElement("canvas");
                tempCanvas2.width = SIZE;
                tempCanvas2.height = SIZE;
                const tCtx2 = tempCanvas2.getContext("2d", {
                    willReadFrequently: true,
                });

                let optimizedLayers = [...state.puzzleLayers];
                let hasChanges = true;

                while (hasChanges) {
                    hasChanges = false;
                    await renderToCanvasContext(
                        tempCanvas1,
                        optimizedLayers,
                        SIZE,
                    );
                    const fullData = tCtx1.getImageData(0, 0, SIZE, SIZE).data;

                    for (let i = 0; i < optimizedLayers.length; i++) {
                        const testStack = optimizedLayers.filter(
                            (_, idx) => idx !== i,
                        );
                        tCtx2.clearRect(0, 0, SIZE, SIZE);
                        await renderToCanvasContext(
                            tempCanvas2,
                            testStack,
                            SIZE,
                        );
                        const subsetData = tCtx2.getImageData(
                            0,
                            0,
                            SIZE,
                            SIZE,
                        ).data;

                        let changedPixels = 0;
                        for (let j = 0; j < fullData.length; j += 4) {
                            if (
                                Math.abs(fullData[j] - subsetData[j]) > 5 ||
                                Math.abs(fullData[j + 1] - subsetData[j + 1]) >
                                    5 ||
                                Math.abs(fullData[j + 2] - subsetData[j + 2]) >
                                    5 ||
                                Math.abs(fullData[j + 3] - subsetData[j + 3]) >
                                    5
                            ) {
                                changedPixels++;
                            }
                        }

                        if (changedPixels / (SIZE * SIZE) < 0.01) {
                            optimizedLayers.splice(i, 1);
                            hasChanges = true;
                            break;
                        }
                    }
                }
                state.puzzleLayers = optimizedLayers;
            }

            function renderPuzzleCanvas() {
                UI.puzzleCanvas.innerHTML = "";
                state.puzzleLayers.forEach((l, index) => {
                    const img = document.createElement("img");
                    img.src =
                        l.shapeId === 12 && shapeCacheNoOutline[12]
                            ? shapeCacheNoOutline[12]
                            : shapeCache[l.shapeId];
                    img.className = "render-layer";
                    img.style.zIndex = index + 1;
                    const scaleX = l.flipH ? -1 : 1;
                    const scaleY = l.flipV ? -1 : 1;
                    img.style.transform = `scale(${scaleX}, ${scaleY}) rotate(${l.rotation}deg)`;
                    UI.puzzleCanvas.appendChild(img);
                });
                checkWinCondition();
            }

            let lastWinState = false;
            let isCheckingWin = false;
            async function checkWinCondition() {
                if (!state.puzzleMode || isCheckingWin) return;
                isCheckingWin = true;

                try {
                    const SIZE = 400;
                    const c1 = document.createElement("canvas"),
                        c2 = document.createElement("canvas");
                    const ctx1 = await renderToCanvasContext(
                        c1,
                        state.layers,
                        SIZE,
                    );
                    const ctx2 = await renderToCanvasContext(
                        c2,
                        state.puzzleLayers,
                        SIZE,
                    );

                    const d1 = ctx1.getImageData(0, 0, SIZE, SIZE).data,
                        d2 = ctx2.getImageData(0, 0, SIZE, SIZE).data;
                    let mismatchCount = 0;
                    for (let i = 0; i < d1.length; i += 4) {
                        const adiff = Math.abs(d1[i + 3] - d2[i + 3]);
                        const cdiff =
                            Math.abs(d1[i] - d2[i]) +
                            Math.abs(d1[i + 1] - d2[i + 1]) +
                            Math.abs(d1[i + 2] - d2[i + 2]);

                        // Slightly more lenient color/alpha thresholds
                        if (d1[i + 3] > 180 || d2[i + 3] > 180) {
                            if (adiff > 25 || cdiff > 40) mismatchCount++;
                        } else if (adiff > 60 || cdiff > 120) mismatchCount++;
                    }

                    // Threshold increased from 0.003 to 0.01 (1% of pixels can differ)
                    if (
                        mismatchCount / (SIZE * SIZE) < 0.01 &&
                        state.layers.length > 0
                    ) {
                        UI.winBanner.classList.add("show");
                        if (!lastWinState) {
                            SFX.win();
                            confetti({
                                particleCount: 150,
                                spread: 70,
                                origin: { y: 0.6 },
                            });
                            setTimeout(() => {
                                showModal("Puzzle Solved!", "win");
                            }, 1500);
                        }
                        lastWinState = true;
                    } else {
                        UI.winBanner.classList.remove("show");
                        lastWinState = false;
                    }
                } finally {
                    isCheckingWin = false;
                }
            }

            UI.seedInput.onclick = () => {
                UI.seedInput.select();
                navigator.clipboard

            };
            UI.seedInput.onkeydown = (e) => {

            function saveState() {
                try {
                    localStorage.setItem(
                        "shapesStackState",
                        JSON.stringify({
                            layers: state.layers.filter(
                                (l) => !isTempUploadedShape(l.shapeId),
                            ),

                            nextLayerId: state.nextLayerId,

                } catch (e) {}

            function loadState() {
                try {
                    const saved = localStorage.getItem("shapesStackState");
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.layers && Array.isArray(data.layers)) {
                            state.layers = data.layers.filter(
                                (l) => !isTempUploadedShape(l.shapeId),
                            );
                            state.bgIndex = data.bgIndex ?? 0;
                            state.nextLayerId = data.nextLayerId ?? 1;
                            state.activeLayerId = state.layers.length
                                ? state.layers[state.layers.length - 1].id
                                : null;
                            return true;
                        }
                    }
                } catch (e) {}
                return false;
            }

            const hadState = loadState();
            const applyBg = () => {
                const cls = bgs[state.bgIndex];
                const updateElementBg = (el) => {
                    bgs.forEach((b) => el.classList.remove(b));
                    if (cls) el.classList.add(cls);
                };
                updateElementBg(UI.canvas);
                updateElementBg(UI.puzzleView);
                document
                    .querySelectorAll(
                        ".shape-thumb, .layer-thumb, .modal-preview",
                    )
                    .forEach(updateElementBg);
            };
            applyBg();
            initShapes();
            document.addEventListener("click", SFX.initOnClick, { once: true });
        </script>
    </body>
</html>

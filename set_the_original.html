<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Original SET Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 1600px;
            width: 100%;
            min-height: 95vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .setup-screen, .game-screen, .end-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active, .end-screen.active {
            display: block;
        }
        
        .game-screen.active {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .setup-group { margin-bottom: 25px; }
        .setup-group label { display: block; font-weight: bold; margin-bottom: 10px; color: #555; }
        .color-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 10px; }
        .color-input { display: flex; align-items: center; gap: 10px; }
        .color-input input[type="color"] { width: 50px; height: 50px; border: none; border-radius: 8px; cursor: pointer; }
        .symbol-select { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        .symbol-option { padding: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .symbol-option:hover { border-color: #667eea; }
        .symbol-option.selected { border-color: #667eea; background: #667eea; color: white; }
        .orientation-select { display: flex; gap: 20px; }
        .orientation-option { padding: 15px 30px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .orientation-option:hover { border-color: #667eea; }
        .orientation-option.selected { border-color: #667eea; background: #667eea; color: white; }
        .start-btn { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .start-btn:hover { background: #5568d3; transform: translateY(-2px); }
        .setup-container { display: flex; gap: 30px; }
        .setup-left { flex: 1; }
        .setup-right { width: 350px; padding-left: 30px; border-left: 2px solid #eee; }
        .demo-area { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .demo-card { border: 2px solid #ccc; border-radius: 5px; width: 100px; height: 140px; display: flex; justify-content: center; align-items: center; }
        .symbol-count { font-size: 12px; color: #999; margin-top: 5px; }

        #gameControls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        #gameControls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #gameControls button:hover { background: #5568d3; }
        #gameControls button:disabled { background: #ccc; cursor: not-allowed; }
        #gameControls #hintBtn.active {
            background: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        #statusBar {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #e3f2fd;
            color: #1e88e5;
            border-radius: 8px;
        }

        .game-container {
            display: flex;
            flex-grow: 1;
            gap: 20px;
            min-height: 0; /* Important for flex-grow in a flex column */
        }

        #cardGrid {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 15px;
            padding: 15px;
            background: #f0f4f8;
            border-radius: 15px;
            overflow-y: auto;
        }

        .card {
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 140px;
            height: 210px;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .card.selected {
            border-color: #667eea;
            box-shadow: 0 0 15px #667eea;
            transform: scale(1.03);
        }
        @keyframes hint-glow-anim {
            0% {
                box-shadow: 0 0 0px 0px rgba(0, 255, 0, 0.1);
            }
            50% {
                box-shadow: 0 0 20px 5px rgba(0, 255, 0, 0.8);
            }
            100% {
                box-shadow: 0 0 0px 0px rgba(0, 255, 0, 0.1);
            }
        }
        .card.hint-glowing {
            animation: hint-glow-anim 1s ease-in-out;
        }
        .card.horizontal {
            width: 210px;
            height: 140px;
        }
        .card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }
        .card.horizontal .card-content {
            flex-direction: row;
        }
        .shape {
            transition: all 0.3s;
        }

        /* Card label styles */
        .card-label {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 25px;
            height: 25px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 2;
            pointer-events: none;
        }
        .card.horizontal .card-label {
            top: 5px;
            left: 5px;
        }

        .result-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }
        .result-mark.correct { color: rgba(34, 139, 34, 0.7); }
        .result-mark.incorrect { color: rgba(255, 0, 0, 0.7); }
        .result-mark.show {
            animation: result-fade 1.5s ease-out forwards;
        }
        @keyframes result-fade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }

        .history-panel {
            width: 280px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        #historySets {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-panel h2 { text-align: center; margin-bottom: 15px; color: #555;}
        .history-set {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            padding: 8px;
            background: #eee;
            border-radius: 5px;
            transition: opacity 0.5s ease;
            position: relative;
        }
        .history-card {
            width: 80px;
            height: 110px;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 4px;
        }
        .history-set.horizontal .history-card { width: 110px; height: 80px; flex-direction: row;}

        /* Fading effects for older sets */
        .history-set.recent-0 {
            opacity: 1;
            transform: scale(1);
            background: #e8f5e8;
            border-left: 4px solid #4CAF50;
        }
        .history-set.recent-1 {
            opacity: 0.7;
            transform: scale(0.95);
            background: #f0f0f0;
            border-left: 4px solid #2196F3;
        }
        .history-set.recent-2 {
            opacity: 0.4;
            transform: scale(0.9);
            background: #f8f8f8;
            border-left: 4px solid #9E9E9E;
        }
        .history-set.older {
            opacity: 0.2;
            transform: scale(0.85);
            background: #fafafa;
            border-left: 4px solid #BDBDBD;
        }

        .end-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            gap: 20px;
            flex-grow: 1;
        }
        .end-screen.active {
            display: flex;
        }
        .end-screen-icon {
            font-size: 100px;
            animation: icon-pop 0.5s ease-out;
        }
        #end-compliment {
            font-size: 48px;
            color: #667eea;
            font-weight: bold;
        }
        .stats {
            text-align: center;
            font-size: 22px;
            color: #555;
            line-height: 1.6;
            margin: 0;
        }
        .percentage {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        @keyframes icon-pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.7;
        }
        .restart-btn { padding: 15px 30px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .restart-btn:hover { background: #5568d3; }

        a.return-to-menu {
            position: fixed; top: 10px; left: 10px; font-size: 24px; background-color: rgba(0,0,0,0.2);
            color: white; padding: 10px; border-radius: 5px; text-decoration: none; opacity: 0.5;
            transition: opacity 0.3s, background-color 0.3s; z-index: 1000;
        }
        a.return-to-menu:hover { opacity: 1; background-color: rgba(0,0,0,0.5); }
        
        /* Game instructions with label reference */
        .game-instructions {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
        .label-guide {
            display: inline-block;
            background-color: rgba(0,0,0,0.7);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            line-height: 20px;
            margin: 0 2px;
        }
        
        /* History counter */
        .history-counter {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }
        
        /* Hint counter */
        .hint-counter {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 10px;
            color: #ff9800;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            padding: 1px 3px;
        }
    </style>
</head>
<body>
    <a class="return-to-menu" href="index.html">🏠</a>
    <div class="container">
        <h1>The Original SET Game</h1>
        
        <div class="setup-screen active">
            <div class="setup-container">
                <div class="setup-left">
                    <div class="setup-group">
                        <label>Choose 3 Colors:</label>
                        <div class="color-inputs">
                            <div class="color-input"><input type="color" id="color1" value="#FF0000"><span>Color 1</span></div>
                            <div class="color-input"><input type="color" id="color2" value="#00FF00"><span>Color 2</span></div>
                            <div class="color-input"><input type="color" id="color3" value="#0000FF"><span>Color 3</span></div>
                        </div>
                    </div>
                    <div class="setup-group"><label>Card Background Color:</label><input type="color" id="cardBg" value="#FFFFFF"></div>
                    <div class="setup-group">
                        <label>Choose 3 Symbols:</label>
                        <div class="symbol-select">
                            <div class="symbol-option selected" data-symbol="diamond"><div></div><span>Diamond</span></div>
                            <div class="symbol-option selected" data-symbol="circle"><div></div><span>Circle</span></div>
                            <div class="symbol-option selected" data-symbol="pill"><div></div><span>Pill</span></div>
                            <div class="symbol-option" data-symbol="wave"><div></div><span>Wave</span></div>
                            <div class="symbol-option" data-symbol="triangle"><div></div><span>Triangle</span></div>
                            <div class="symbol-option" data-symbol="square"><div></div><span>Square</span></div>
                            <div class="symbol-option" data-symbol="star"><div></div><span>Star</span></div>
                        </div>
                        <div class="symbol-count">Selected: 3 symbols</div>
                    </div>
                    <div class="setup-group">
                        <label>Card Orientation:</label>
                        <div class="orientation-select">
                            <div class="orientation-option selected" data-orientation="vertical">Vertical</div>
                            <div class="orientation-option" data-orientation="horizontal">Horizontal</div>
                        </div>
                    </div>
                    <div class="setup-group">
                        <label>Answer Label Style:</label>
                        <select id="labelStyle" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
                            <option value="numbers" selected>Numbers (1, 2, 3...)</option>
                            <option value="letters">Letters (A, B, C...)</option>
                        </select>
                    </div>
                    
                    <button class="start-btn" onclick="startGame()">Start Game</button>
                </div>
                <div class="setup-right">
                    <label>Live Preview</label>
                    <div class="demo-area" id="demoArea"></div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div id="gameControls">
                <button id="addCardBtn">+ Add Card</button>
                <button id="removeCardBtn">- Remove Card</button>
                <button id="shuffleBtn">Shuffle</button>
                <button id="hintBtn">Hint</button>
                <button id="endGameBtn">End Game</button>
            </div>
            <div id="statusBar">
                <span>We have <b id="setsCount">0</b> of SET in below cards</span> |
                <span>Correct picked: <b id="correctCount">0</b></span> |
                <span>Wrong picked: <b id="wrongCount">0</b></span>
            </div>
            <div class="game-container">
                <div id="cardGrid"></div>
                <div class="history-panel" id="historyPanel">
                    <h2>History</h2>
                    <div class="history-counter" id="historyCounter">Recent sets: 0/3</div>
                    <div id="historySets"></div>
                </div>
            </div>
        </div>

        <div class="end-screen">
            <div class="end-screen-icon"></div>
            <h2 id="end-compliment"></h2>
            <div class="stats" id="stats"></div>
            <div class="percentage" id="percentage"></div>
            <button class="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>
    
    <audio id="correctSound" src="kid_yeah.wav" preload="auto"></audio>
    <audio id="wrongSound" src="Ohh.wav" preload="auto"></audio>

    <script>
        let settings = {
            colors: ['#FF0000', '#00FF00', '#0000FF'],
            cardBg: '#FFFFFF',
            symbols: ['diamond', 'circle', 'pill'],
            orientation: 'vertical',
            labelStyle: 'numbers'
        };
        let deck = [];
        let boardCards = [];
        let selectedCards = [];
        let numberOfSlots = 4; // Start with 4 cards as requested
        let score = 0;
        let mistakes = 0;
        let completedSets = [];
        let isChecking = false;
        let hintTimeout = null;
        let cardLabels = []; // Array to store current card labels
        const MAX_HISTORY_SETS = 3; // Maximum number of sets to show in history
        
        // Hint system variables
        let hintSets = []; // All available sets on the board
        let currentHintIndex = 0; // Current hint index to cycle through
        let isHintActive = false; // Whether hint is currently showing

        const correctSound = document.getElementById('correctSound');
        const wrongSound = document.getElementById('wrongSound');

        // Function to get label for card index (1, 2, 3... or A, B, C...)
        function getCardLabel(index) {
            if (settings.labelStyle === 'numbers') {
                return (index + 1).toString();
            } else if (settings.labelStyle === 'letters') {
                return String.fromCharCode(65 + index); // A, B, C...
            }
            return ''; // Default or error case
        }

        // Update card labels when board changes
        function updateCardLabels() {
            cardLabels = [];
            boardCards.forEach((card, index) => {
                card.label = getCardLabel(index);
                cardLabels.push(card.label);
            });
        }

        // --- SETUP SCREEN ---
        document.querySelectorAll('.symbol-option').forEach(opt => {
            opt.addEventListener('click', function() {
                const selectedCount = document.querySelectorAll('.symbol-option.selected').length;
                if (selectedCount >= 3 && !this.classList.contains('selected')) {
                    return; // Don't allow more than 3 symbols
                }
                this.classList.toggle('selected');
                const newSelectedCount = document.querySelectorAll('.symbol-option.selected').length;
                document.querySelector('.symbol-count').textContent = `Selected: ${newSelectedCount} symbols`;
                updateDemo();
            });
        });
        document.querySelectorAll('.orientation-option').forEach(opt => {
            opt.addEventListener('click', function() {
                document.querySelectorAll('.orientation-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                updateDemo();
            });
        });
        document.querySelectorAll('.color-input input, #cardBg').forEach(input => input.addEventListener('input', updateDemo));
        
        function updateSymbolOptions() {
            document.querySelectorAll('.symbol-option').forEach(opt => {
                const symbol = opt.dataset.symbol;
                const svgContainer = opt.querySelector('div');
                svgContainer.innerHTML = '';
                svgContainer.appendChild(drawShape(symbol, '#333', 'solid', 40));
            });
        }

        function updateDemo() {
            const demoArea = document.getElementById('demoArea');
            demoArea.innerHTML = '';
            const colors = [document.getElementById('color1').value, document.getElementById('color2').value, document.getElementById('color3').value];
            const cardBg = document.getElementById('cardBg').value;
            const selectedSymbols = Array.from(document.querySelectorAll('.symbol-option.selected')).map(o => o.dataset.symbol);
            if (selectedSymbols.length === 0) return;
            
            const shadings = ['solid', 'striped', 'outline'];
            const orientation = document.querySelector('.orientation-option.selected').dataset.orientation;

            for (let i = 0; i < 9; i++) {
                const cardEl = document.createElement('div');
                cardEl.className = 'demo-card';
                cardEl.style.background = cardBg;
                if (orientation === 'horizontal') {
                    cardEl.style.height = '100px';
                    cardEl.style.width = '140px';
                }
                const cardContent = document.createElement('div');
                cardContent.className = 'card-content';
                const symbol = selectedSymbols[i % selectedSymbols.length];
                const color = colors[Math.floor(i / 3) % colors.length];
                const shading = shadings[i % shadings.length];
                const count = (i % 3) + 1;
                for (let j = 0; j < count; j++) {
                    cardContent.appendChild(drawShape(symbol, color, shading, 20));
                }
                cardEl.appendChild(cardContent);
                demoArea.appendChild(cardEl);
            }
        }
        updateSymbolOptions();
        updateDemo();

        // --- GAME LOGIC ---
        function createDeck() {
            deck = [];
            const counts = [1, 2, 3];
            const colors = [0, 1, 2];
            const shadings = ['solid', 'striped', 'outline'];
            const shapes = [0, 1, 2];
            for (let count of counts) for (let color of colors) for (let shading of shadings) for (let shape of shapes) {
                deck.push({ id: `${count}-${color}-${shading}-${shape}`, count, color, shading, shape });
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function isSet(cards) {
            if (cards.length !== 3) return false;
            const [c1, c2, c3] = cards;
            const check = (prop) => (c1[prop] === c2[prop] && c2[prop] === c3[prop]) || (c1[prop] !== c2[prop] && c1[prop] !== c3[prop] && c2[prop] !== c3[prop]);
            return check('count') && check('color') && check('shading') && check('shape');
        }

        function getThirdCard(card1, card2) {
            const card3 = {};
            const props = {
                count: [1, 2, 3],
                color: [0, 1, 2],
                shading: ['solid', 'striped', 'outline'],
                shape: [0, 1, 2]
            };
            for (const p of Object.keys(props)) {
                if (card1[p] === card2[p]) {
                    card3[p] = card1[p];
                } else {
                    card3[p] = props[p].find(v => v !== card1[p] && v !== card2[p]);
                }
            }
            return card3;
        }

        // New function to find a card that's NOT part of any set
        function findNonSetCard() {
            if (boardCards.length < 3) return -1;
            
            // For each card, check if it's part of any set
            for (let i = 0; i < boardCards.length; i++) {
                let isPartOfSet = false;
                
                // Check all possible trios including this card
                for (let j = 0; j < boardCards.length && !isPartOfSet; j++) {
                    if (j === i) continue;
                    for (let k = j + 1; k < boardCards.length && !isPartOfSet; k++) {
                        if (k === i) continue;
                        const trio = [boardCards[i], boardCards[j], boardCards[k]];
                        if (isSet(trio)) {
                            isPartOfSet = true;
                        }
                    }
                }
                
                // If this card is NOT part of any set, return its index
                if (!isPartOfSet) {
                    return i;
                }
            }
            
            // If all cards are part of at least one set, return a random card
            return Math.floor(Math.random() * boardCards.length);
        }

        // New function to find 3 cards from deck that maximize the number of possible sets
        function findBestCardsToAdd() {
            if (deck.length === 0) return [];
            if (deck.length <= 3) return [...deck];
            
            let bestCards = [];
            let bestSetCount = -1;
            
            // If we have too many cards in deck, we need to sample to avoid performance issues
            const maxSampleSize = 20;
            const sampleDeck = deck.length > maxSampleSize ? 
                deck.slice(0, maxSampleSize) : [...deck];
            
            // Try all combinations of 3 cards from the sample
            for (let i = 0; i < sampleDeck.length; i++) {
                for (let j = i + 1; j < sampleDeck.length; j++) {
                    for (let k = j + 1; k < sampleDeck.length; k++) {
                        const candidateCards = [sampleDeck[i], sampleDeck[j], sampleDeck[k]];
                        
                        // Create temporary board with these cards added
                        const tempBoard = [...boardCards, ...candidateCards];
                        
                        // Count how many sets are possible with this combination
                        const setCount = countSetsOnBoard(tempBoard);
                        
                        if (setCount > bestSetCount) {
                            bestSetCount = setCount;
                            bestCards = candidateCards;
                        }
                    }
                }
            }
            
            return bestCards;
        }

        // Helper function to count sets on a board
        function countSetsOnBoard(cards) {
            let count = 0;
            if (cards.length < 3) return 0;
            for (let i = 0; i < cards.length; i++) {
                for (let j = i + 1; j < cards.length; j++) {
                    for (let k = j + 1; k < cards.length; k++) {
                        if (isSet([cards[i], cards[j], cards[k]])) {
                            count++;
                        }
                    }
                }
            }
            return count;
        }

        function createInitialBoard(cardCount) {
            if (cardCount < 3) cardCount = 3;
            
            // Start with an empty board
            let board = [];
            
            // Create a guaranteed set
            let attempts = 0;
            let setCards = [];
            
            while (attempts < 100 && setCards.length < 3) {
                attempts++;
                
                // Pick two random cards from deck
                const i1 = Math.floor(Math.random() * deck.length);
                let i2 = Math.floor(Math.random() * deck.length);
                while (i2 === i1 && deck.length > 1) {
                    i2 = Math.floor(Math.random() * deck.length);
                }
                
                const c1 = deck[i1];
                const c2 = deck[i2];
                const c3_template = getThirdCard(c1, c2);
                
                // Find the third card in the deck
                const i3 = deck.findIndex(card => 
                    card.id !== c1.id && card.id !== c2.id &&
                    card.count === c3_template.count &&
                    card.color === c3_template.color &&
                    card.shading === c3_template.shading &&
                    card.shape === c3_template.shape
                );
                
                if (i3 !== -1) {
                    const c3 = deck[i3];
                    setCards = [c1, c2, c3];
                    
                    // Remove these cards from deck
                    const ids = setCards.map(c => c.id);
                    deck = deck.filter(c => !ids.includes(c.id));
                    board = [...setCards];
                    break;
                }
            }
            
            // If we couldn't create a set (shouldn't happen with full deck), use random cards
            if (board.length === 0) {
                board = deck.splice(0, Math.min(3, deck.length));
            }
            
            // Add more cards to reach the desired count
            const cardsNeeded = cardCount - board.length;
            if (cardsNeeded > 0) {
                // Add cards that don't create too many sets (to keep it easy)
                for (let i = 0; i < cardsNeeded && deck.length > 0; i++) {
                    board.push(deck.pop());
                }
            }
            
            // Shuffle the board
            for (let i = board.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [board[i], board[j]] = [board[j], board[i]];
            }
            
            return board;
        }

        function findAllSetsOnBoard() {
            const sets = [];
            if (boardCards.length < 3) return sets;
            for (let i = 0; i < boardCards.length; i++) {
                for (let j = i + 1; j < boardCards.length; j++) {
                    for (let k = j + 1; k < boardCards.length; k++) {
                        const trio = [boardCards[i], boardCards[j], boardCards[k]];
                        if (isSet(trio)) {
                            sets.push(trio);
                        }
                    }
                }
            }
            return sets;
        }

        function checkAndDealUntilSetExists() {
            let sets = findAllSetsOnBoard();
            
            // Keep adding cards until we have at least one set OR reach max cards OR deck is empty
            while (sets.length === 0 && boardCards.length < 15 && deck.length > 0) {
                const newCard = deck.pop();
                boardCards.push(newCard);
                sets = findAllSetsOnBoard();
            }
            
            // If we still don't have a set and deck is empty, game is over
            if (sets.length === 0 && deck.length === 0) {
                endGame();
            }
            
            return sets.length > 0;
        }

        function startGame() {
            settings = {
                colors: [document.getElementById('color1').value, document.getElementById('color2').value, document.getElementById('color3').value],
                cardBg: document.getElementById('cardBg').value,
                symbols: Array.from(document.querySelectorAll('.symbol-option.selected')).map(opt => opt.dataset.symbol),
                orientation: document.querySelector('.orientation-option.selected').dataset.orientation,
                labelStyle: document.getElementById('labelStyle').value // Add this line
            };
            if (settings.symbols.length !== 3) { 
                alert('Please select exactly 3 symbols'); 
                return; 
            }

            document.querySelector('.setup-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            createDeck();
            boardCards = [];
            selectedCards = [];
            completedSets = [];
            numberOfSlots = 4; // Start with 4 cards
            score = 0;
            mistakes = 0;
            isChecking = false;
            cardLabels = [];
            
            // Reset hint system
            hintSets = [];
            currentHintIndex = 0;
            isHintActive = false;

            // Create initial board with guaranteed set
            boardCards = createInitialBoard(numberOfSlots);
            
            // Ensure we have at least one set
            if (findAllSetsOnBoard().length === 0) {
                // This shouldn't happen, but just in case
                checkAndDealUntilSetExists();
            }
            
            // Update card labels
            updateCardLabels();
            
            updateCardGrid();
            updateStatus();
            bindControlEvents();
        }
        
        function handleCardClick(cardEl, cardData) {
            if (isChecking || cardEl.classList.contains('processing')) return;

            const cardIndex = selectedCards.findIndex(c => c.id === cardData.id);
            if (cardIndex > -1) {
                selectedCards.splice(cardIndex, 1);
                cardEl.classList.remove('selected');
            } else {
                if (selectedCards.length < 3) {
                    selectedCards.push(cardData);
                    cardEl.classList.add('selected');
                }
            }

            if (selectedCards.length === 3) {
                isChecking = true;
                checkSelectedCards();
            }
        }

        function checkSelectedCards() {
            const selectedElements = selectedCards.map(cardData => 
                document.querySelector(`[data-card-id="${cardData.id}"]`)
            );
            selectedElements.forEach(el => el.classList.add('processing'));

            if (isSet(selectedCards)) {
                score++;
                correctSound.play();
                completedSets.push([...selectedCards]);
                selectedElements.forEach(el => showResultMark(el, true));

                setTimeout(() => {
                    // Remove the set from board
                    boardCards = boardCards.filter(bc => 
                        !selectedCards.find(sc => sc.id === bc.id)
                    );
                    
                    // Add exactly 3 new cards from deck (if available) that maximize possible sets
                    if (deck.length > 0) {
                        const cardsToAdd = findBestCardsToAdd();
                        
                        // Remove these cards from deck
                        cardsToAdd.forEach(card => {
                            const index = deck.findIndex(c => c.id === card.id);
                            if (index !== -1) {
                                deck.splice(index, 1);
                                boardCards.push(card);
                            }
                        });
                        
                        // If we couldn't get 3 optimal cards, add random ones to make 3
                        while (cardsToAdd.length < 3 && deck.length > 0) {
                            const randomCard = deck.pop();
                            boardCards.push(randomCard);
                        }
                    }
                    
                    // Ensure we still have at least one set
                    checkAndDealUntilSetExists();
                    
                    // Update card labels
                    updateCardLabels();
                    
                    // Reset hint system since board changed
                    clearHint();
                    hintSets = findAllSetsOnBoard();
                    currentHintIndex = 0;
                    
                    selectedCards = [];
                    updateCardGrid();
                    updateHistory();
                    updateStatus();
                    isChecking = false;
                }, 1500);

            } else {
                mistakes++;
                wrongSound.play();
                selectedElements.forEach(el => showResultMark(el, false));

                setTimeout(() => {
                    selectedCards = [];
                    selectedElements.forEach(el => el.classList.remove('selected', 'processing'));
                    updateStatus();
                    isChecking = false;
                }, 1500);
            }
        }
        
        function bindControlEvents() {
            document.getElementById('addCardBtn').onclick = addCard;
            document.getElementById('removeCardBtn').onclick = removeCard;
            document.getElementById('shuffleBtn').onclick = shuffleBoard;
            document.getElementById('hintBtn').onclick = showHint;
            document.getElementById('endGameBtn').onclick = endGame;
        }

        function addCard() {
            if (boardCards.length >= 15 || deck.length === 0) return;
            
            // Find a good card to add (one that creates more sets)
            // For single card addition, we'll use a simpler approach
            let bestCard = null;
            let bestSetCount = -1;
            
            // Sample some cards from deck to find one that increases set count
            const sampleSize = Math.min(10, deck.length);
            for (let i = 0; i < sampleSize; i++) {
                const card = deck[i];
                const tempBoard = [...boardCards, card];
                const setCount = countSetsOnBoard(tempBoard);
                
                if (setCount > bestSetCount) {
                    bestSetCount = setCount;
                    bestCard = card;
                }
            }
            
            if (bestCard) {
                // Remove from deck
                const cardIndex = deck.findIndex(c => c.id === bestCard.id);
                if (cardIndex !== -1) {
                    deck.splice(cardIndex, 1);
                    boardCards.push(bestCard);
                    numberOfSlots = boardCards.length;
                    
                    // Update card labels
                    updateCardLabels();
                    
                    // Reset hint system since board changed
                    clearHint();
                    hintSets = findAllSetsOnBoard();
                    currentHintIndex = 0;
                    
                    updateCardGrid();
                    updateStatus();
                }
            }
        }

        function removeCard() {
            if (boardCards.length <= 4) return;
            
            // Find a card that's NOT part of any set (or least useful)
            const cardIndex = findNonSetCard();
            
            if (cardIndex !== -1) {
                // Put the card back in the deck (at a random position)
                const removedCard = boardCards.splice(cardIndex, 1)[0];
                deck.splice(Math.floor(Math.random() * deck.length), 0, removedCard);
                numberOfSlots = boardCards.length;
                
                // If we removed too many cards and now have no sets, add one back
                if (findAllSetsOnBoard().length === 0 && deck.length > 0) {
                    const newCard = deck.pop();
                    boardCards.push(newCard);
                    numberOfSlots = boardCards.length;
                }
                
                // Update card labels
                updateCardLabels();
                
                // Reset hint system since board changed
                clearHint();
                hintSets = findAllSetsOnBoard();
                currentHintIndex = 0;
                
                updateCardGrid();
                updateStatus();
            }
        }

        function shuffleBoard() {
            // Simple shuffle - just randomize positions
            for (let i = boardCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boardCards[i], boardCards[j]] = [boardCards[j], boardCards[i]];
            }
            
            // Update card labels after shuffle
            updateCardLabels();
            
            // Reset hint system since board changed
            clearHint();
            hintSets = findAllSetsOnBoard();
            currentHintIndex = 0;
            
            updateCardGrid();
        }

        function clearHint() {
            // Clear any existing hint timeout
            if (hintTimeout) {
                clearTimeout(hintTimeout);
                hintTimeout = null;
            }
            
            // Clear any previous hints
            document.querySelectorAll('.card.hint-glowing').forEach(card => {
                card.classList.remove('hint-glowing');
            });
            
            // Reset hint button state
            document.getElementById('hintBtn').classList.remove('active');
            isHintActive = false;
        }

        function showHint() {
            // If hint is already active, clear it first
            if (isHintActive) {
                clearHint();
                return;
            }
            
            // Find all available sets on the board
            hintSets = findAllSetsOnBoard();
            
            if (hintSets.length === 0) {
                alert("No sets available on the board!");
                return;
            }
            
            // Make sure currentHintIndex is within bounds
            if (currentHintIndex >= hintSets.length) {
                currentHintIndex = 0;
            }
            
            // Get the current hint set
            const hintSet = hintSets[currentHintIndex];
            
            // Show the hint
            hintSet.forEach(cardToHint => {
                const cardEl = document.querySelector(`[data-card-id="${cardToHint.id}"]`);
                if (cardEl) {
                    cardEl.classList.add('hint-glowing');
                }
            });
            
            // Mark hint button as active
            document.getElementById('hintBtn').classList.add('active');
            isHintActive = true;
            
            // Show hint counter
            const hintCounter = document.createElement('div');
            hintCounter.className = 'hint-counter';
            hintCounter.textContent = `${currentHintIndex + 1}/${hintSets.length}`;
            document.getElementById('hintBtn').appendChild(hintCounter);
            
            // Auto-remove hint after 3 seconds
            hintTimeout = setTimeout(() => {
                clearHint();
                
                // Remove hint counter
                const existingCounter = document.getElementById('hintBtn').querySelector('.hint-counter');
                if (existingCounter) {
                    existingCounter.remove();
                }
                
                // Move to next hint for next click
                currentHintIndex = (currentHintIndex + 1) % hintSets.length;
            }, 3000);
        }

        function endGame() {
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.end-screen').classList.add('active');
            
            createConfetti();

            const total = score + mistakes;
            const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;
            
            let compliment = '';
            let icon = '🤔';

            if (accuracy === 100) { compliment = "You're a SET Master! Perfect Score!"; icon = '🏆'; } 
            else if (accuracy >= 90) { compliment = 'Outstanding!'; icon = '🎉'; } 
            else if (accuracy >= 75) { compliment = 'Great Job!'; icon = '👍'; } 
            else if (accuracy >= 50) { compliment = 'Good Effort!'; icon = '😊'; } 
            else { compliment = 'Keep Practicing!'; icon = '💪'; }

            document.querySelector('.end-screen-icon').textContent = icon;
            document.getElementById('end-compliment').textContent = compliment;
            document.getElementById('stats').innerHTML = `Correct SETs: ${score} | Mistakes: ${mistakes}`;
            document.getElementById('percentage').textContent = `Accuracy: ${accuracy}%`;
        }

        // --- UI UPDATE & DRAWING ---
        function updateCardGrid() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            boardCards.forEach((cardData, index) => {
                const cardEl = createCardElement(cardData, index);
                grid.appendChild(cardEl);
            });
        }

        function createCardElement(cardData, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.cardId = cardData.id;
            if (settings.orientation === 'horizontal') card.classList.add('horizontal');
            card.style.background = settings.cardBg;

            // Add label to card
            const label = document.createElement('div');
            label.className = 'card-label';
            label.textContent = cardData.label || getCardLabel(index);
            card.appendChild(label);

            const content = document.createElement('div');
            content.className = 'card-content';
            const color = settings.colors[cardData.color];
            const symbol = settings.symbols[cardData.shape];
            const size = (settings.orientation === 'vertical') ? 40 : 35;
            for (let i = 0; i < cardData.count; i++) {
                content.appendChild(drawShape(symbol, color, cardData.shading, size));
            }
            card.appendChild(content);
            card.addEventListener('click', () => handleCardClick(card, cardData));
            return card;
        }

        function showResultMark(cardEl, isCorrect) {
            const mark = document.createElement('div');
            mark.className = `result-mark ${isCorrect ? 'correct' : 'incorrect'}`;
            mark.textContent = isCorrect ? '✓' : '✗';
            cardEl.appendChild(mark);
            mark.classList.add('show');
            setTimeout(() => mark.remove(), 1500);
        }
        
        function drawShape(symbol, color, shading, size = 30) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.classList.add('shape');
            let shape;
            const fillColor = shading === 'solid' ? color : 'none';
            const strokeColor = color;
            const strokeWidth = size/20;
            const patternId = `stripe-${Math.random().toString(36).substr(2, 9)}`;

            if (shading === 'striped') {
                const pattern = document.createElementNS(svgNS, 'pattern');
                pattern.setAttribute('id', patternId);
                pattern.setAttribute('width', strokeWidth * 2);
                pattern.setAttribute('height', strokeWidth * 2);
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                const line = document.createElementNS(svgNS, 'line');
                line.setAttribute('x1', '0'); line.setAttribute('y1', '0'); line.setAttribute('x2', '0'); line.setAttribute('y2', strokeWidth * 2);
                line.setAttribute('stroke', color); line.setAttribute('stroke-width', strokeWidth * 2);
                pattern.appendChild(line);
                const defs = document.createElementNS(svgNS, 'defs');
                defs.appendChild(pattern);
                svg.appendChild(defs);
            }
            
            const s = size - strokeWidth * 2; // shape size
            const p = strokeWidth; // padding
            switch (symbol) {
                case 'circle': shape = document.createElementNS(svgNS, 'circle'); shape.setAttribute('cx', size / 2); shape.setAttribute('cy', size / 2); shape.setAttribute('r', s / 2); break;
                case 'square': shape = document.createElementNS(svgNS, 'rect'); shape.setAttribute('x', p); shape.setAttribute('y', p); shape.setAttribute('width', s); shape.setAttribute('height', s); break;
                case 'diamond': shape = document.createElementNS(svgNS, 'polygon'); shape.setAttribute('points', `${size/2},${p} ${size-p},${size/2} ${size/2},${size-p} ${p},${size/2}`); break;
                case 'triangle': shape = document.createElementNS(svgNS, 'polygon'); shape.setAttribute('points', `${size/2},${p} ${size-p},${size-p} ${p},${size-p}`); break;
                case 'pill': shape = document.createElementNS(svgNS, 'rect'); shape.setAttribute('x', p); shape.setAttribute('y', size / 4); shape.setAttribute('width', s); shape.setAttribute('height', size / 2); shape.setAttribute('rx', size / 4); break;
                case 'star': shape = document.createElementNS(svgNS, 'polygon'); const points = []; for (let i = 0; i < 10; i++) { const angle = (i * Math.PI) / 5 - Math.PI / 2; const r = i % 2 === 0 ? s / 2 : s / 4; points.push(`${size/2 + r*Math.cos(angle)},${size/2 + r*Math.sin(angle)}`); } shape.setAttribute('points', points.join(' ')); break;
                case 'wave': shape = document.createElementNS(svgNS, 'path'); const h = s / 4; shape.setAttribute('d', `M ${p},${size/2 - h/2} Q ${size/4},${size/2 - h*1.5} ${size/2},${size/2 - h/2} T ${size-p},${size/2 - h/2} V ${size/2+h/2} Q ${size*3/4},${size/2+h*1.5} ${size/2},${size/2+h/2} T ${p},${size/2+h/2} Z`); break;
            }
            shape.setAttribute('fill', shading === 'striped' ? `url(#${patternId})` : fillColor);
            shape.setAttribute('stroke', strokeColor);
            shape.setAttribute('stroke-width', strokeWidth);
            svg.appendChild(shape);
            return svg;
        }

        function updateStatus() {
            const setsCount = findAllSetsOnBoard().length;
            document.getElementById('setsCount').textContent = setsCount;
            document.getElementById('correctCount').textContent = score;
            document.getElementById('wrongCount').textContent = mistakes;
            
            // Update button states
            document.getElementById('addCardBtn').disabled = boardCards.length >= 15 || deck.length === 0;
            document.getElementById('removeCardBtn').disabled = boardCards.length <= 4;
            
            // Update hint button text based on available sets
            const hintBtn = document.getElementById('hintBtn');
            if (setsCount > 0) {
                hintBtn.textContent = `Hint (${setsCount} sets)`;
            } else {
                hintBtn.textContent = 'Hint (0 sets)';
            }
            
            // If no sets and we can't add more cards, end the game
            if (setsCount === 0 && deck.length === 0) {
                setTimeout(endGame, 1000);
            }
        }

        function updateHistory() {
            const historySetsEl = document.getElementById('historySets');
            historySetsEl.innerHTML = '';
            
            // Get only the most recent sets (up to MAX_HISTORY_SETS)
            const recentSets = completedSets.slice(-MAX_HISTORY_SETS);
            
            // Update the history counter
            const historyCounter = document.getElementById('historyCounter');
            historyCounter.textContent = `Recent sets: ${recentSets.length}/${MAX_HISTORY_SETS}`;
            
            // If no sets yet, show a message
            if (recentSets.length === 0) {
                const emptyMessage = document.createElement('div');
                emptyMessage.className = 'history-set';
                emptyMessage.innerHTML = '<div style="text-align: center; width: 100%; padding: 20px; color: #999;">No sets found yet</div>';
                historySetsEl.appendChild(emptyMessage);
                return;
            }
            
            // Display each set with appropriate fading class
            recentSets.forEach((set, index) => {
                const setEl = document.createElement('div');
                setEl.className = 'history-set';
                
                // Add fading class based on age (most recent = recent-0, oldest = recent-2 or older)
                if (index === recentSets.length - 1) {
                    setEl.classList.add('recent-0'); // Most recent
                } else if (index === recentSets.length - 2) {
                    setEl.classList.add('recent-1'); // Middle
                } else {
                    setEl.classList.add('recent-2'); // Oldest
                }
                
                if (settings.orientation === 'horizontal') setEl.classList.add('horizontal');
                
                set.forEach(cardData => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'history-card';
                    const color = settings.colors[cardData.color];
                    const symbol = settings.symbols[cardData.shape];
                    for (let i = 0; i < cardData.count; i++) {
                        cardEl.appendChild(drawShape(symbol, color, cardData.shading, 15));
                    }
                    setEl.appendChild(cardEl);
                });
                historySetsEl.appendChild(setEl);
            });
        }
        
        function createConfetti() {
            const confettiContainer = document.querySelector('.container');
            const colors = settings.colors;
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = `${-20 + Math.random() * 20}px`;
                confetti.style.backgroundColor = colors[i % colors.length];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confettiContainer.appendChild(confetti);
                animateConfetti(confetti);
            }
        }

        function animateConfetti(confetti) {
            const duration = 3000 + Math.random() * 2000;
            const x = Math.random() * 200 - 100;
            confetti.animate([
                { transform: `translate(0, 0) rotate(${Math.random() * 360}deg)`, opacity: 1 },
                { transform: `translate(${x}px, ${window.innerHeight}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'ease-out',
                fill: 'forwards'
            }).onfinish = () => confetti.remove();
        }

    </script>
</body>

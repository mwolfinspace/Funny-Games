<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pattern Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
    :root {
        --blue: #3498db;
        --red: #e74c3c;
        --yellow: #f1c40f;
        --green: #2ecc71;
        --purple: #9b59b6;
        --grey: #bdc3c7;
        --dark: #34495e;
        --orange: #f39c12;
        --hud-bg: rgba(255,255,255,0.95);
    }

    body {
        font-family: 'Fredoka One', cursive;
        background: linear-gradient(135deg, #f0f9ff, #cbebff);
        margin: 0;
        padding: 0;
        color: var(--dark);
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
    }

    /* --- HUD --- */
    #hud {
        height: 60px;
        display: flex; 
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        background: var(--hud-bg);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        z-index: 100;
        flex-shrink: 0;
    }

    .hud-left { display: flex; align-items: center; gap: 8px; }
    .hud-controls { display: flex; align-items: center; gap: 8px; }

    .hud-cluster {
        display: flex; 
        align-items: center; 
        gap: 4px;
        background: rgba(127, 140, 141, 0.1);
        padding: 4px;
        border-radius: 8px;
        height: 40px;
    }

    button {
        background-color: var(--blue); 
        border: none; 
        color: white;
        padding: 0 12px; 
        height: 32px;
        border-radius: 6px; 
        cursor: pointer;
        font-size: 1rem; 
        font-weight: bold;
        display: flex; 
        align-items: center; 
        justify-content: center;
        gap: 4px;
    }
    button:active { transform: translateY(2px); }
    
    .btn-new { background-color: var(--green); }
    .btn-cover { background-color: var(--purple); }
    .btn-reveal { background-color: var(--orange); }
    .btn-dice { background-color: var(--red); font-size: 1.4rem; }
    .btn-mute { background-color: #95a5a6; font-size: 1.2rem; width: 36px; }

    .return-to-menu {
        text-decoration: none;
        font-size: 1.5rem;
        filter: grayscale(1);
    }
    
    .info-tag {
        font-size: 0.9rem;
        background: #eee;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-family: monospace;
    }

    /* --- Game Zone --- */
    .game-wrapper {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden; 
        padding: 10px 0;
    }

    .board {
        width: 98vw;
        max-width: 100%;
        height: 100%;
        
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        
        gap: 1.2%; 
        padding: 0 1%; 
        box-sizing: border-box;
    }

    .card-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%; 
        min-width: 0;
    }

    /* Top Label (1-8) */
    .top-label {
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 900;
        color: var(--dark);
        margin-bottom: 2%;
        text-shadow: 2px 2px 0 rgba(255,255,255,1);
        line-height: 1;
    }

    .card {
        width: 100%;
        aspect-ratio: 1/1; 
        container-type: size; 
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 3%;
        background: #fff;
        border: 2px solid var(--grey);
        border-radius: 8%;
        position: relative;
        padding: 3%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        cursor: pointer;
    }

    .card.starCard {
        border-color: gold;
        box-shadow: 0 0 20px gold;
        z-index: 5;
    }

    .cell {
        border-radius: 15%;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }
    
    .cell-blue { background: linear-gradient(135deg, #85d7ff, #1ea7e9); }
    .cell-red { background: linear-gradient(135deg, #ff8a80, #ef4b3c); }
    .cell-yellow { background: linear-gradient(135deg, #ffee9b, #ffd54a); }
    .cell-white { background: #ecf0f1; }

    /* Scalable Internals */
    .magnet {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #fff, #ddd);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--purple);
        font-size: 35cqw; 
        font-weight: bold;
        z-index: 10;
        box-shadow: inset 0 0 2px rgba(0,0,0,0.1);
        border-radius: 15%;
    }

    /* Card Cover Number (z-index 20) */
    .card-number {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60cqw;
        color: white;
        background-color: rgba(52, 73, 94, 0.98);
        border-radius: 8%;
        z-index: 20;
    }

    /* Star (z-index 30 - Shows ON TOP of cover) */
    .star {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 80cqw;
        color: gold;
        text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 30; 
        line-height: 0;
    }
    /* Star Number REMOVED as requested */

    /* 3D Dice */
    #dice-scene {
        position: fixed;
        width: 100px; height: 100px;
        perspective: 600px;
        pointer-events: none;
        z-index: 2000;
        opacity: 0; 
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        transition: opacity 0.2s;
    }
    #dice-scene.active {
        opacity: 1;
        animation: diceBounce 1.5s ease-out forwards;
    }

    #cube {
        width: 100%; height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform: translateZ(-50px);
        transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .face {
        position: absolute;
        width: 100px; height: 100px;
        background: white;
        border: 4px solid #ddd;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #333;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        backface-visibility: hidden;
        font-family: monospace; font-weight: bold;
    }
    
    .front  { transform: rotateY(0deg) translateZ(50px); }
    .right  { transform: rotateY(90deg) translateZ(50px); }
    .back   { transform: rotateY(180deg) translateZ(50px); }
    .left   { transform: rotateY(-90deg) translateZ(50px); }
    .top    { transform: rotateX(90deg) translateZ(50px); }
    .bottom { transform: rotateX(-90deg) translateZ(50px); }

    @keyframes diceBounce {
        0% { transform: translate(-50%, -50%) scale(0.1); }
        20% { transform: translate(-50%, -150%) scale(1.2); }
        40% { transform: translate(-50%, -40%) scale(1.0); }
        60% { transform: translate(-50%, -80%) scale(1.05); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    @media (max-width: 600px) {
        #hud { padding: 0 5px; }
        .hud-cluster span { display: none; }
        .hud-left { gap: 4px; }
        .top-label { margin-bottom: 2px; }
    }
</style>
</head>
<body>

    <div id="hud">
        <div class="hud-left">
            <a class="return-to-menu" href="index.html">🏠</a>
            <span class="info-tag" id="timerDisplay">00:00</span>
            <span class="info-tag" id="seedDisplay" onclick="promptSeed()">#123</span>
        </div>

        <div class="hud-controls">
             <div class="hud-cluster">
                <button class="btn-dice" onclick="rollDice3D()">🎲</button>
            </div>
            
            <div class="hud-cluster">
                <button class="btn-cover" onclick="coverAll()">🔒 <span>Cover</span></button>
                <button class="btn-reveal" onclick="revealAll()">👁️ <span>Reveal</span></button>
                <button class="btn-new" onclick="startNewGame()">↻ <span>New</span></button>
                <button class="btn-mute" id="mute-btn" onclick="SoundManager.toggleMute()">🔊</button>
            </div>
        </div>
    </div>

    <main class="game-wrapper">
        <div class="board" id="board"></div>
    </main>

    <div id="dice-scene">
        <div id="cube">
            <div class="face front">1</div>
            <div class="face back">2</div>
            <div class="face right">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">6</div>
        </div>
    </div>

<script>
    // --- Configuration ---
    const TOTAL_CARDS = 8;
    const colors = ["blue", "red", "yellow"];

    // --- State ---
    let cards = [];
    let covers = [];
    let starIndex = null;
    let currentSeed = 1;
    let timerInterval = null;
    let startTime = 0;

    // --- RNG ---
    class Seeder {
        constructor(seed) { this.seed = seed; }
        random() { this.seed = (this.seed * 9301 + 49297) % 233280; return this.seed / 233280; }
        range(max) { return Math.floor(this.random() * max); }
    }
    let rng = new Seeder(1);

    // --- Game Logic ---
    function genPositionPattern(type){
        let base=[];
        if(type===0){ let pattern=[[0,1],[2,3]]; for(let i=0;i<8;i++) base.push(pattern[i%2]); } 
        else if(type===1){ let pattern=[[0,1],[0,2],[1,3]]; for(let i=0;i<8;i++) base.push(pattern[i%3]); } 
        else { let pattern=[[0,1],[2,3],[0,2],[1,3]]; for(let i=0;i<8;i++) base.push(pattern[i%4]); }
        return base;
    }

    function genColorPattern(type){
        let seq=[];
        if(type===0){for(let i=0;i<8;i++) seq.push(i%3);}
        else if(type===1){for(let i=0;i<8;i++) seq.push(i%2);}
        else if(type===2){let base=[0,1,2,2];for(let i=0;i<8;i++) seq.push(base[i%4]);}
        else if(type===3){let base=[0,2,1];for(let i=0;i<8;i++) seq.push(base[i%3]);}
        else if(type===4){let base=[2,1,0];for(let i=0;i<8;i++) seq.push(base[i%3]);}
        else {let base=[0,1,2,0,0,1,2,0];for(let i=0;i<8;i++) seq.push(base[i]);}
        return seq;
    }

    function startNewGame(customSeed = null) {
        SoundManager.init(); // Ensure Audio Context starts on interaction
        if (customSeed !== null) {
            currentSeed = parseInt(customSeed);
        } else {
            currentSeed = Math.floor(Math.random() * 9999) + 1;
        }
        document.getElementById('seedDisplay').innerText = `#${currentSeed}`;
        rng = new Seeder(currentSeed);
        
        stopTimer();
        startTimer();
        buildBoard();
    }

    function buildBoard() {
        const board = document.getElementById("board");
        board.innerHTML = "";
        cards = [];
        covers = [];
        starIndex = null;

        let posType = rng.range(3);
        let colType = rng.range(6);
        let posPattern = genPositionPattern(posType);
        let colPattern = genColorPattern(colType);

        for (let i = 0; i < TOTAL_CARDS; i++) {
            
            // Column
            let col = document.createElement("div");
            col.className = "card-column";
            
            // Label
            let label = document.createElement("div");
            label.className = "top-label";
            label.textContent = (i + 1);
            col.appendChild(label);

            // Card
            let card = document.createElement("div");
            card.className = "card";
            card.onclick = () => revealCard(i); 

            let cellColors = ["white", "white", "white", "white"];
            let chosenColor = colors[colPattern[i]];
            posPattern[i].forEach(p => cellColors[p] = chosenColor);

            cellColors.forEach(c => {
                let cell = document.createElement("div");
                cell.className = `cell cell-${c}`;
                
                let magnet = document.createElement("div");
                magnet.className = "magnet";
                magnet.textContent = "?";
                magnet.onclick = (e) => {
                    e.stopPropagation();
                    magnet.style.opacity = '0';
                    setTimeout(() => magnet.remove(), 200);
                };
                cell.appendChild(magnet);
                covers.push(magnet);
                
                card.appendChild(cell);
            });

            let numOverlay = document.createElement("div");
            numOverlay.className = "card-number";
            numOverlay.textContent = i + 1;
            numOverlay.onclick = (e) => {
                e.stopPropagation();
                revealCard(i);
            };
            
            card.appendChild(numOverlay);
            cards.push(card);
            col.appendChild(card);
            board.appendChild(col);
        }
    }

    function revealCard(index) {
        let card = cards[index];
        SoundManager.play('flip'); // Play Sound
        
        let num = card.querySelector('.card-number');
        if (num) {
            num.style.opacity = '0';
            setTimeout(() => num.remove(), 200);
        }
        let magnets = card.querySelectorAll('.magnet');
        magnets.forEach(m => {
            m.style.opacity = '0';
            setTimeout(() => m.remove(), 200);
        });
    }

    function coverAll() {
        buildBoard(); 
    }

    function revealAll() {
        document.querySelectorAll('.card-number, .magnet').forEach(el => {
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 200);
        });
    }

    function promptSeed() {
        let val = prompt("Enter seed:", currentSeed);
        if (val && !isNaN(val)) {
            startNewGame(parseInt(val));
        }
    }

    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            let delta = Math.floor((Date.now() - startTime) / 1000);
            let m = Math.floor(delta / 60).toString().padStart(2, '0');
            let s = (delta % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        if(timerInterval) clearInterval(timerInterval);
    }

    function rollDice3D() {
        SoundManager.play('dice'); // Play Rolling Sound
        
        // RESET GAME (Clear stars, clear reveals, new pattern)
        startNewGame(); 
        
        const scene = document.getElementById('dice-scene');
        const cube = document.getElementById('cube');
        
        scene.classList.remove('active');
        void scene.offsetWidth; 
        scene.classList.add('active');

        const result = Math.floor(Math.random() * 8) + 1; 

        const xRand = Math.floor(Math.random() * 4) * 360 + 720; 
        const yRand = Math.floor(Math.random() * 4) * 360 + 720;
        
        cube.style.transform = `translateZ(-50px) rotateX(${xRand}deg) rotateY(${yRand}deg)`;
        
        document.querySelector('.face.front').textContent = result;
        document.querySelectorAll('.face:not(.front)').forEach(f => f.textContent = "?");

        setTimeout(() => {
            placeStar(result - 1);
            scene.classList.remove('active');
        }, 1500);
    }

    function placeStar(index) {
        if (index >= TOTAL_CARDS) return;
        
        SoundManager.play('win'); // Play Star/Win Sound

        if (starIndex !== null && cards[starIndex]) {
            let oldStar = cards[starIndex].querySelector(".star");
            if (oldStar) oldStar.remove();
            cards[starIndex].classList.remove("starCard");
        }
        
        starIndex = index;
        let card = cards[index];

        let star = document.createElement("div");
        star.className = "star";
        // REMOVED THE STAR NUMBER HERE
        star.innerHTML = "★"; 
        card.appendChild(star);
        card.classList.add("starCard");

        // Note: The card is NOT revealed automatically. User must guess.
    }

    // --- Sound Manager (Ported from Lion Game) ---
    const SoundManager = {
        ctx: null, 
        muted: false,
        init: function() { 
            window.AudioContext=window.AudioContext||window.webkitAudioContext; 
            if(!this.ctx) this.ctx=new AudioContext(); 
            if(this.ctx.state === 'suspended') this.ctx.resume();
        },
        toggleMute: function() { 
            this.muted=!this.muted; 
            document.getElementById('mute-btn').innerText=this.muted?'🔇':'🔊'; 
        },
        play: function(t) { 
            if(this.muted || !this.ctx) return; 
            if(this.ctx.state==='suspended') this.ctx.resume(); 
            this.synth(t); 
        },
        synth: function(t) {
            const g=this.ctx.createGain(), o=this.ctx.createOscillator(), n=this.ctx.currentTime; 
            g.connect(this.ctx.destination);

            if(t==='flip'){ 
                // Simple high blip for flipping
                o.type='sine'; o.frequency.setValueAtTime(800,n); o.frequency.exponentialRampToValueAtTime(300,n+0.1); 
                g.gain.setValueAtTime(0.1,n); g.gain.exponentialRampToValueAtTime(0.01,n+0.1); 
                o.connect(g); o.start(n); o.stop(n+0.1); 
            }
            else if(t==='dice'){
                // Rolling noise (approximated with low rumbling waves)
                o.type='triangle'; 
                o.frequency.setValueAtTime(100,n); 
                o.frequency.linearRampToValueAtTime(300,n+0.5); 
                o.frequency.linearRampToValueAtTime(50,n+1.0);
                g.gain.setValueAtTime(0.2,n); 
                g.gain.linearRampToValueAtTime(0,n+1.0); 
                o.connect(g); o.start(n); o.stop(n+1.0);
            }
            else if(t==='win'){ 
                // Victory Chord (C Major)
                [523,659,783,1046].forEach((f,i)=> { 
                    const o2=this.ctx.createOscillator(), g2=this.ctx.createGain(); 
                    o2.type='square'; o2.frequency.value=f; 
                    g2.connect(this.ctx.destination); 
                    g2.gain.setValueAtTime(0.05,n+i*0.1); 
                    g2.gain.linearRampToValueAtTime(0,n+i*0.1+0.4); 
                    o2.connect(g2); o2.start(n+i*0.1); o2.stop(n+i*0.1+0.4); 
                }); 
            }
        }
    };

    startNewGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram</title>
    <style>
        :root {
            --cell-size: 40px;
            --font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
            --background-color: #f3f3f3;
            --control-background-color: #ffffff;
            --control-border-color: #d1d1d1;
            --control-border-radius: 8px;
            --accent-color: #0078d4;
            --text-color: #1a1a1a;
            --input-padding: 12px;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body { 
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            text-align: center; 
        }
        .screen { 
            display: none; 
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active { 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        #game-screen, #editor-screen {
            /* justify-content: center; */ /* Removed to allow title and buttons to be at top/bottom */
            /* align-items: center; */ /* This can cause issues with scrolling on small screens */
        }

        .game-area-wrapper {
            flex-grow: 1;
            display: flex;
            min-height: 0; /* Prevents flexbox overflow issues */
            position: relative; /* Anchor for the absolute positioned child */
        }

        #game-container, #editor-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Center the container */
            transform-origin: center center;
            transition: transform 0.3s ease-in-out; /* Smooth transition for scaling */

            /* The rest of the grid styles are still valid */
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            border: 2px solid black;
            margin: 0; /* No margin needed with absolute positioning */
        }

        .corner {
            grid-column: 1;
            grid-row: 1;
        }

        #game-board, #editor-board { 
            grid-column: 2;
            grid-row: 2;
            display: grid; 
        }

        .cell { 
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #ccc; 
            box-sizing: border-box; 
        }
        .cell.filled { background-color: black; }
        .cell.crossed::after { 
            content: 'X'; 
            color: red; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            font-weight: bold;
        }

        .row-clues, .row-clues-editor {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-right: 2px solid black;
        }

        .row-clues > div, .row-clues-editor > div {
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 10px;
            border-top: 1px solid #ccc;
            font-size: 20px; /* Revert to fixed font-size, as scaling is now uniform */
            font-weight: bold;
        }
        .row-clues > div:first-child, .row-clues-editor > div:first-child {
             border-top: none;
        }


        .col-clues, .col-clues-editor {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid black;
        }

        .clue-group {
            width: var(--cell-size);
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            box-sizing: border-box;
            padding: 5px;
            border-left: 1px solid #ccc;
            font-size: 20px; /* Revert to fixed font-size, as scaling is now uniform */
            font-weight: bold;
        }
        .clue-group:first-child {
            border-left: none;
        }
        .clue-group > div {
             line-height: 1.2;
        }
        
        div[contenteditable="true"] {
            background-color: #f0f0f0;
            padding: 2px;
        }

        /* New UI Styles */
        h1, h2, h3 {
            color: var(--text-color);
        }

        hr {
            border: none;
            border-top: 1px solid var(--control-border-color);
            margin: 20px 0;
        }

        label {
            margin: 0 10px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--control-border-radius);
            padding: 12px 18px; /* less horizontal padding */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #005a9e;
        }

        input[type="number"] {
            border: 1px solid var(--control-border-color);
            border-radius: var(--control-border-radius);
            padding: var(--input-padding);
            font-size: 16px;
            margin: 5px;
            width: 80px;
        }

        .no-transition {
            transition: none !important;
        }

        /* --- Solver Styles --- */
        #solver-input-area {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 5px;
            margin: 20px auto;
            justify-content: center;
        }
        .solver-col-clues-wrapper, .solver-row-clues-wrapper, .solver-dummy-grid {
            display: grid;
            gap: 2px;
        }
        .solver-clue-input {
            border: 1px solid var(--control-border-color);
            background-color: var(--control-background-color);
            padding: 5px;
            width: 30px;
            height: 30px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <h1>Nonogram</h1>
        <div id="new-game-options">
            <h3>New Game</h3>
            <label for="puzzle-width-input">Width:</label>
            <input type="number" id="puzzle-width-input" min="4" max="20" value="5">
            <label for="puzzle-height-input">Height:</label>
            <input type="number" id="puzzle-height-input" min="4" max="20" value="5">
            <button id="start-new-game-btn">Start New Game</button>
        </div>
        <hr>
        <h3>Create, Load, or Solve</h3>
        <button id="create-puzzle-btn">Create Puzzle</button>
        <button id="solver-btn">Solver</button>
        <label for="load-puzzle-input">Load Puzzle:</label>
        <input type="file" id="load-puzzle-input" accept=".nonogram">
    </div>

    <div id="game-screen" class="screen">
        <h2>Nonogram Puzzle</h2>
        <div class="game-area-wrapper">
            <div id="game-container">
                <div class="corner"></div>
                <div class="col-clues"></div>
                <div class="row-clues"></div>
                <div id="game-board"></div>
            </div>
        </div>
        <button id="back-to-start-btn-game">Back to Start</button>
    </div>

    <div id="editor-screen" class="screen">
        <h2>Puzzle Editor</h2>
        <div>
            <label for="board-width">Width (4-20):</label>
            <input type="number" id="board-width" min="4" max="20" value="5">
            <label for="board-height">Height (4-20):</label>
            <input type="number" id="board-height" min="4" max="20" value="5">
            <button id="create-grid-btn">Create Grid</button>
        </div>
        <div class="game-area-wrapper">
            <div id="editor-container">
                <div class="corner"></div>
                <div class="col-clues-editor"></div>
                <div class="row-clues-editor"></div>
                <div id="editor-board"></div>
            </div>
        </div>
        <div class="button-group">
            <button id="save-puzzle-btn">Save Puzzle</button>
            <button id="test-puzzle-btn">Test Puzzle</button>
            <button id="validate-puzzle-btn">Validate Puzzle</button>
            <button id="back-to-start-btn-editor">Back to Start</button>
        </div>
    </div>

    <div id="solver-screen" class="screen">
        <h2>Nonogram Solver</h2>
        <div class="solver-controls">
            <label for="solver-width">Width:</label>
            <input type="number" id="solver-width" min="1" max="30" value="5">
            <label for="solver-height">Height:</label>
            <input type="number" id="solver-height" min="1" max="30" value="5">
            <br>
            <label for="solver-max-row-clues">Max Row Clues:</label>
            <input type="number" id="solver-max-row-clues" min="1" max="30" value="3">
            <label for="solver-max-col-clues">Max Col Clues:</label>
            <input type="number" id="solver-max-col-clues" min="1" max="30" value="3">
            <button id="create-solver-inputs-btn">Set Grid</button>
        </div>
        <div id="solver-input-area">
            <!-- clue inputs will be generated here -->
        </div>
        <div class="button-group">
            <button id="solve-puzzle-btn">Solve</button>
            <button id="back-to-start-btn-solver">Back to Start</button>
        </div>
        <div class="game-area-wrapper">
            <div id="solver-board-container" class="game-container" style="visibility: hidden;">
                <div class="corner"></div>
                <div class="col-clues"></div>
                <div class="row-clues"></div>
                <div id="solver-board"></div>
            </div>
        </div>
    </div>

            <script>
                const startScreen = document.getElementById('start-screen');
                const gameScreen = document.getElementById('game-screen');
                const editorScreen = document.getElementById('editor-screen');
        
                const createPuzzleBtn = document.getElementById('create-puzzle-btn');
                const loadPuzzleInput = document.getElementById('load-puzzle-input');
                
                const startNewGameBtn = document.getElementById('start-new-game-btn');
                const puzzleWidthInput = document.getElementById('puzzle-width-input');
                const puzzleHeightInput = document.getElementById('puzzle-height-input');
        
                const backToStartBtnGame = document.getElementById('back-to-start-btn-game');
                const backToStartBtnEditor = document.getElementById('back-to-start-btn-editor');
        
                const createGridBtn = document.getElementById('create-grid-btn');
                const boardWidthInput = document.getElementById('board-width');
                const boardHeightInput = document.getElementById('board-height');
                const editorBoard = document.getElementById('editor-board');
                const rowCluesEditor = document.querySelector('.row-clues-editor');
                const colCluesEditor = document.querySelector('.col-clues-editor');
                const savePuzzleBtn = document.getElementById('save-puzzle-btn');
                const testPuzzleBtn = document.getElementById('test-puzzle-btn');
                const validatePuzzleBtn = document.getElementById('validate-puzzle-btn');
        
                const gameBoard = document.getElementById('game-board');
                const rowCluesGame = document.querySelector('.row-clues');
                const colCluesGame = document.querySelector('.col-clues');

                // --- Solver Elements ---
                const solverScreen = document.getElementById('solver-screen');
                const solverBtn = document.getElementById('solver-btn');
                const backToStartBtnSolver = document.getElementById('back-to-start-btn-solver');
                const solverWidthInput = document.getElementById('solver-width');
                const solverHeightInput = document.getElementById('solver-height');
                const createSolverInputsBtn = document.getElementById('create-solver-inputs-btn');
                const solverInputArea = document.getElementById('solver-input-area');
                const solvePuzzleBtn = document.getElementById('solve-puzzle-btn');
                const solverResultsContainer = document.getElementById('solver-results-container');
                const solverMaxRowCluesInput = document.getElementById('solver-max-row-clues');
                const solverMaxColCluesInput = document.getElementById('solver-max-col-clues');

                function createSolverInputs() {
                    const width = parseInt(solverWidthInput.value);
                    const height = parseInt(solverHeightInput.value);
                    const maxRow = parseInt(solverMaxRowCluesInput.value);
                    const maxCol = parseInt(solverMaxColCluesInput.value);

                    if (width < 1 || height < 1 || maxRow < 1 || maxCol < 1 ) {
                        alert('Dimensions and max clues must be at least 1.');
                        return;
                    }

                    solverInputArea.innerHTML = `
                        <div class="solver-corner" style="grid-area: 1 / 1;"></div>
                        <div class="solver-col-clues-wrapper" style="grid-area: 1 / 2;"></div>
                        <div class="solver-row-clues-wrapper" style="grid-area: 2 / 1;"></div>
                        <div class="solver-dummy-grid" style="grid-area: 2 / 2;"></div>
                    `;
                    
                    const colWrapper = solverInputArea.querySelector('.solver-col-clues-wrapper');
                    const rowWrapper = solverInputArea.querySelector('.solver-row-clues-wrapper');
                    const dummyGrid = solverInputArea.querySelector('.solver-dummy-grid');

                    // Style the wrappers
                    colWrapper.style.gridTemplateColumns = `repeat(${width}, 30px)`;
                    rowWrapper.style.gridTemplateRows = `repeat(${height}, 30px)`;
                    
                    // Generate column clue inputs
                    for (let c = 0; c < width; c++) {
                        const group = document.createElement('div');
                        group.className = 'solver-col-clue-group';
                        for (let r = 0; r < maxCol; r++) {
                             const clueInput = document.createElement('input');
                            clueInput.type = 'number';
                            clueInput.className = 'solver-clue-input';
                            clueInput.dataset.type = 'col';
                            clueInput.dataset.col = c;
                            group.appendChild(clueInput);
                        }
                        colWrapper.appendChild(group);
                    }

                    // Generate row clue inputs
                     for (let r = 0; r < height; r++) {
                        const group = document.createElement('div');
                        group.className = 'solver-row-clue-group';
                        for (let c = 0; c < maxRow; c++) {
                            const clueInput = document.createElement('input');
                            clueInput.type = 'number';
                            clueInput.className = 'solver-clue-input';
                            clueInput.dataset.type = 'row';
                            clueInput.dataset.row = r;
                            group.appendChild(clueInput);
                        }
                        rowWrapper.appendChild(group);
                    }

                    // Style and fill the dummy grid for visual alignment
                    dummyGrid.style.display = 'grid';
                    dummyGrid.style.gridTemplateColumns = `repeat(${width}, 30px)`;
                    dummyGrid.style.gridTemplateRows = `repeat(${height}, 30px)`;
                    dummyGrid.style.gap = '2px';
                     for (let i = 0; i < width * height; i++) {
                        const emptyCell = document.createElement('div');
                        emptyCell.style.background = '#f0f0f0';
                        dummyGrid.appendChild(emptyCell);
                    }
                }
                createSolverInputsBtn.addEventListener('click', createSolverInputs);

                // --- Solver Logic ---

                function parseClues() {
                    const width = parseInt(solverWidthInput.value);
                    const height = parseInt(solverHeightInput.value);
                    let rowClues = Array.from({ length: height }, () => []);
                    let colClues = Array.from({ length: width }, () => []);

                    const rowGroups = solverInputArea.querySelectorAll('.solver-row-clue-group');
                    rowGroups.forEach((group, r) => {
                        const inputs = group.querySelectorAll('input');
                        inputs.forEach(input => {
                             const value = parseInt(input.value);
                            if (!isNaN(value) && value > 0) {
                                rowClues[r].push(value);
                            }
                        });
                    });

                    const colGroups = solverInputArea.querySelectorAll('.solver-col-clue-group');
                    colGroups.forEach((group, c) => {
                        const inputs = group.querySelectorAll('input');
                        inputs.forEach(input => {
                            const value = parseInt(input.value);
                            if (!isNaN(value) && value > 0) {
                                colClues[c].push(value);
                            }
                        });
                    });

                    // If a row/col has no clues, it should be [0]
                    rowClues = rowClues.map(clueSet => clueSet.length > 0 ? clueSet : [0]);
                    colClues = colClues.map(clueSet => clueSet.length > 0 ? clueSet : [0]);

                    return { rowClues, colClues, width, height };
                }

                function displaySolvedGrid(grid, clues, width, height) {
                    const container = document.getElementById('solver-board-container');
                    const board = document.getElementById('solver-board');
                    const rowCluesEl = container.querySelector('.row-clues');
                    const colCluesEl = container.querySelector('.col-clues');
                    
                    board.innerHTML = '';
                    
                    container.dataset.puzzleWidth = width;
                    container.dataset.puzzleHeight = height;
                    board.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;

                    // Display the clues
                    displayClues(clues.rowClues, clues.colClues, rowCluesEl, colCluesEl, width, height, false);

                    // Display the solution grid
                    for (let r = 0; r < height; r++) {
                        for (let c = 0; c < width; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'cell';
                            if (grid[r][c] === 1) {
                                cell.classList.add('filled');
                            }
                            board.appendChild(cell);
                        }
                    }
                    
                    container.style.visibility = 'visible';
                    scaleBoard('solver-board-container');
                }

                function solveNonogram(rowClues, colClues, width, height) {
                    // Grid states: 1 for filled, 0 for empty, -1 for unknown
                    let grid = Array.from({ length: height }, () => Array(width).fill(-1));
                    let changedInLoop = true;

                    // Simple deterministic line solver (based on overlap)
                    function solveLine(line, clues) {
                        const n = line.length;
                        const k = clues.length;
                        if (k === 1 && clues[0] === 0) return line.map(() => 0); // Line is all empty

                        let newLine = [...line];
                        const totalClueSum = clues.reduce((sum, val) => sum + val, 0);
                        const minLength = totalClueSum + k - 1;
                        const slack = n - minLength;

                        // This is a simplified logic and won't solve all puzzles
                        // It only fills cells that are certain based on overlap from one side
                        let currentPos = 0;
                        for(let i=0; i<k; i++) {
                            const clue = clues[i];
                            if (clue > slack) {
                                for (let j = slack; j < clue; j++) {
                                    newLine[currentPos + j] = 1;
                                }
                            }
                            currentPos += clue + 1;
                        }
                        return newLine;
                    }
                    
                    let iterations = 0;
                    while(changedInLoop && iterations < 50) { // Add iteration limit to prevent infinite loops
                        changedInLoop = false;

                        // Process rows
                        for (let r = 0; r < height; r++) {
                            const originalLine = grid[r];
                            const solvedLine = solveLine(originalLine, rowClues[r]);
                            for (let c = 0; c < width; c++) {
                                if (grid[r][c] === -1 && solvedLine[c] !== -1) {
                                    grid[r][c] = solvedLine[c];
                                    changedInLoop = true;
                                }
                            }
                        }

                        // Process columns
                        for (let c = 0; c < width; c++) {
                            const originalLine = grid.map(row => row[c]);
                            const solvedLine = solveLine(originalLine, colClues[c]);
                             for (let r = 0; r < height; r++) {
                                if (grid[r][c] === -1 && solvedLine[r] !== -1) {
                                    grid[r][c] = solvedLine[r];
                                    changedInLoop = true;
                                }
                            }
                        }
                        iterations++;
                    }

                    // For now, treat any remaining unknown cells as empty
                    grid = grid.map(row => row.map(cell => cell === 1 ? 1 : 0));
                    return grid;
                }


                solvePuzzleBtn.addEventListener('click', () => {
                    const { rowClues, colClues, width, height } = parseClues();
                    
                    if (!rowClues || !colClues || rowClues.length !== height || colClues.length !== width) {
                        alert('Please fill in all clues for the specified grid dimensions.');
                        return;
                    }

                    const solution = solveNonogram(rowClues, colClues, width, height);
                    displaySolvedGrid(solution, width, height);
                });
        
                let editorSolution = [];
                let editorManualClues = { rowClues: [], colClues: [] };
                let gameSolution = [];
                let currentPuzzle = {};
                let isDragging = false;
                let dragAction = null; // 'toggleFill', 'toggleCross'
                let isEditorDragging = false;
                let editorDragMode = null; // 'fill', 'erase'
        
                // --- Global Mouse Up Listener ---
                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        dragAction = null;
                        checkWin(); // Check for win only when drag is complete
                    }
                    if (isEditorDragging) {
                        isEditorDragging = false;
                        editorDragMode = null;
                        // Update clues when drag is complete
                        if(editorSolution.length > 0) {
                            const width = editorSolution[0].length;
                            const height = editorSolution.length;
                            updateEditorClues(width, height);
                        }
                    }
                });

                // --- Navigation ---
                function showScreen(screen) {
                    startScreen.classList.remove('active');
                    gameScreen.classList.remove('active');
                    editorScreen.classList.remove('active');
                    solverScreen.classList.remove('active');
                    screen.classList.add('active');
                }
        
                solverBtn.addEventListener('click', () => showScreen(solverScreen));
                backToStartBtnSolver.addEventListener('click', () => showScreen(startScreen));
        
                startNewGameBtn.addEventListener('click', () => {
                    const width = parseInt(puzzleWidthInput.value);
                    const height = parseInt(puzzleHeightInput.value);
                    
                    if (width >= 4 && width <= 20 && height >= 4 && height <= 20) {
                        const solution = Array.from({ length: height }, () => 
                            Array.from({ length: width }, () => Math.round(Math.random()))
                        );
                        const clues = calculateClues(solution, width, height);
                        const puzzle = {
                            name: "Random Puzzle",
                            width: width,
                            height: height,
                            solution: solution,
                            clues: clues
                        };
                        startGame(puzzle);
                    } else {
                        alert('Board width and height must be between 4 and 20.');
                    }
                });
        
                createPuzzleBtn.addEventListener('click', () => showScreen(editorScreen));
                loadPuzzleInput.addEventListener('change', loadPuzzle);
                backToStartBtnGame.addEventListener('click', () => showScreen(startScreen));
                backToStartBtnEditor.addEventListener('click', () => showScreen(startScreen));
        
        
                // --- Editor ---
                createGridBtn.addEventListener('click', () => {
                    const width = parseInt(boardWidthInput.value);
                    const height = parseInt(boardHeightInput.value);
                    if (width >= 4 && width <= 20 && height >= 4 && height <= 20) {
                        createEditorGrid(width, height);
                    } else {
                        alert('Board width and height must be between 4 and 20.');
                    }
                });
        
                function applyEditorAction(cell, mode) {
                    if (!cell.classList.contains('cell')) return;
                    const r = parseInt(cell.dataset.row);
                    const c = parseInt(cell.dataset.col);
                    if (isNaN(r) || isNaN(c)) return;

                    const isFilled = editorSolution[r][c] === 1;

                    if (mode === 'fill' && !isFilled) {
                        editorSolution[r][c] = 1;
                        cell.classList.add('filled');
                        cell.classList.remove('crossed');
                    } else if (mode === 'erase' && isFilled) {
                        editorSolution[r][c] = 0;
                        cell.classList.remove('filled');
                    } else if (mode === 'cross') {
                        if (isFilled) return;
                        cell.classList.toggle('crossed');
                    }
                }

                function createEditorGrid(width, height) {
                    const editorContainer = document.getElementById('editor-container');
                    
                    // 1. Pre-emptively scale down without animation
                    editorContainer.classList.add('no-transition');
                    editorContainer.style.transform = 'translate(-50%, -50%) scale(0)';

                    // Use a timeout to allow the browser to apply the above style before rebuilding the DOM
                    setTimeout(() => {
                        // 2. Rebuild the DOM while it's scaled down
                        editorSolution = Array.from({ length: height }, () => Array(width).fill(0));
                        editorBoard.innerHTML = '';
                        editorBoard.addEventListener('contextmenu', e => e.preventDefault());
                        editorContainer.dataset.puzzleWidth = width;
                        editorContainer.dataset.puzzleHeight = height;
                        editorBoard.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;
            
                        for (let r = 0; r < height; r++) {
                            for (let c = 0; c < width; c++) {
                                const cell = document.createElement('div');
                                cell.classList.add('cell');
                                cell.dataset.row = r;
                                cell.dataset.col = c;
                                cell.addEventListener('mousedown', (e) => {
                                    e.preventDefault();
                                    isEditorDragging = true;
                                    if (e.button === 0) { // Left click
                                        editorDragMode = cell.classList.contains('filled') ? 'erase' : 'fill';
                                    } else if (e.button === 2) { // Right click
                                        editorDragMode = 'cross';
                                    }
                                    applyEditorAction(cell, editorDragMode);
                                });
                                cell.addEventListener('mouseover', () => {
                                    if (isEditorDragging) {
                                        applyEditorAction(cell, editorDragMode);
                                    }
                                });
                                editorBoard.appendChild(cell);
                            }
                        }
                        updateEditorClues(width, height);

                        // 3. Force reflow to apply styles, then re-enable transitions
                        editorContainer.offsetHeight; 
                        editorContainer.classList.remove('no-transition');

                        // 4. Trigger the final scaling, which will now animate
                        scaleBoard('editor-container');
                    }, 100); // A small delay is safer for the pre-emptive scale
                }
        
                function updateEditorClues(width, height) {
                    const clues = calculateClues(editorSolution, width, height);
                    editorManualClues = clues; // Keep manual clues in sync initially
                    displayClues(clues.rowClues, clues.colClues, rowCluesEditor, colCluesEditor, width, height, true);
                }
                
                savePuzzleBtn.addEventListener('click', savePuzzle);
                testPuzzleBtn.addEventListener('click', () => {
                    const height = editorSolution.length;
                    if (height > 0) {
                        const width = editorSolution[0].length;
                         const puzzle = {
                            name: "Custom Puzzle",
                            width: width,
                            height: height,
                            solution: editorSolution, // The drawn grid is the solution
                            clues: editorManualClues // The manually entered clues are for the game
                        };
                        startGame(puzzle);
                    }
                });
                
                validatePuzzleBtn.addEventListener('click', validatePuzzle);
        
                function validatePuzzle() {
                    if (editorSolution.length === 0) {
                        alert("Create a grid first!");
                        return;
                    }
                    const height = editorSolution.length;
                    const width = editorSolution[0].length;

                    const calculatedClues = calculateClues(editorSolution, width, height);
                    
                    const isValid = JSON.stringify(calculatedClues.rowClues) === JSON.stringify(editorManualClues.rowClues) &&
                                    JSON.stringify(calculatedClues.colClues) === JSON.stringify(editorManualClues.colClues);
                    
                    if (isValid) {
                        alert('Validation Successful: The drawing matches the clues.');
                    } else {
                        alert('Validation Failed: The drawing does not match the clues.');
                    }
                }
        
        
                // --- Game ---
                function applyToggleAction(cell, action) {
                    if (!cell.classList.contains('cell')) return;
                    const r = parseInt(cell.dataset.row);
                    const c = parseInt(cell.dataset.col);
                    if (isNaN(r) || isNaN(c)) return;

                    if (action === 'toggleFill') {
                        if (cell.classList.contains('crossed')) return; // Ignore crossed cells
                        const isFilled = cell.classList.toggle('filled');
                        gameSolution[r][c] = isFilled ? 1 : 0;
                    } else if (action === 'toggleCross') {
                        if (cell.classList.contains('filled')) return; // Ignore filled cells
                        cell.classList.toggle('crossed');
                        gameSolution[r][c] = 0; // Toggling a cross always results in a non-filled solution cell
                    }
                }

                function startGame(puzzle) {
                    currentPuzzle = puzzle;
                    const width = puzzle.width || puzzle.size;
                    const height = puzzle.height || puzzle.size;
                    const gameContainer = document.getElementById('game-container');

                    // 1. Pre-emptively scale down without animation
                    gameContainer.classList.add('no-transition');
                    gameContainer.style.transform = 'translate(-50%, -50%) scale(0)';
                    
                    // Use a timeout to allow the browser to apply the above style before rebuilding the DOM
                    setTimeout(() => {
                        gameSolution = Array.from({ length: height }, () => Array(width).fill(0));
                        
                        gameBoard.innerHTML = '';
                        gameBoard.addEventListener('contextmenu', e => e.preventDefault()); // Prevent context menu on the whole board
                        gameContainer.dataset.puzzleWidth = width;
                        gameContainer.dataset.puzzleHeight = height;

                        gameBoard.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;
            
                        for (let r = 0; r < height; r++) {
                            for (let c = 0; c < width; c++) {
                                const cell = document.createElement('div');
                                cell.classList.add('cell');
                                cell.dataset.row = r;
                                cell.dataset.col = c;
            
                                cell.addEventListener('mousedown', (e) => {
                                    e.preventDefault();
                                    isDragging = true;
                                    if (e.button === 0) { // Left click
                                        dragAction = 'toggleFill';
                                    } else if (e.button === 2) { // Right click
                                        dragAction = 'toggleCross';
                                    }
                                    applyToggleAction(cell, dragAction);
                                });

                                cell.addEventListener('mouseover', () => {
                                    if (isDragging) {
                                        applyToggleAction(cell, dragAction);
                                    }
                                });
                                gameBoard.appendChild(cell);
                            }
                        }
                        
                        displayClues(puzzle.clues.rowClues, puzzle.clues.colClues, rowCluesGame, colCluesGame, width, height, false);
                        showScreen(gameScreen);

                        // Force reflow and re-enable transitions
                        gameContainer.offsetHeight;
                        gameContainer.classList.remove('no-transition');
                        
                        // Trigger the final scaling
                        scaleBoard('game-container');
                    }, 100);
                }
                
                function checkWin() {
                    const solution = currentPuzzle.solution;
                    if (!solution) return;
                    let isWin = true;
                    const height = solution.length;
                    const width = solution[0].length;
                    for (let r = 0; r < height; r++) {
                        for (let c = 0; c < width; c++) {
                            if (solution[r][c] !== gameSolution[r][c]) {
                                isWin = false;
                                break;
                            }
                        }
                        if (!isWin) break;
                    }
        
                    if (isWin) {
                        setTimeout(() => {
                            alert('You Win!');
                            showScreen(startScreen);
                        }, 100);
                    }
                }
        
        
                // --- Common Logic ---
                function calculateClues(grid, width, height) {
                    const rowClues = [];
                    const colClues = [];
        
                    for (let r = 0; r < height; r++) {
                        rowClues.push(getCluesForLine(grid[r]));
                    }
        
                    for (let c = 0; c < width; c++) {
                        const col = grid.map(row => row[c]);
                        colClues.push(getCluesForLine(col));
                    }
                    return { rowClues, colClues };
                }
        
                function getCluesForLine(line) {
                    const clues = [];
                    let count = 0;
                    for (const cell of line) {
                        if (cell === 1) {
                            count++;
                        } else if (count > 0) {
                            clues.push(count);
                            count = 0;
                        }
                    }
                    if (count > 0) {
                        clues.push(count);
                    }
                    return clues.length > 0 ? clues : [0];
                }
        
                function displayClues(rowClues, colClues, rowEl, colEl, width, height, isEditable) {
                    rowEl.innerHTML = '';
                    colEl.innerHTML = '';
        
                    for (let i = 0; i < height; i++) {
                        const rClue = document.createElement('div');
                        rClue.textContent = rowClues[i].join(' ') || '0';
                        if (isEditable) {
                            rClue.contentEditable = true;
                            rClue.addEventListener('blur', (e) => {
                                 editorManualClues.rowClues[i] = e.target.textContent.split(' ').map(s => parseInt(s, 10) || 0);
                            });
                        }
                        rowEl.appendChild(rClue);
                    }
        
                    for (let i = 0; i < width; i++) {
                        const cClue = document.createElement('div');
                        cClue.classList.add('clue-group');
                        if (isEditable) {
                            const cClueInner = document.createElement('div');
                            cClueInner.textContent = colClues[i].join('\n') || '0';
                            cClueInner.contentEditable = true;
                            cClueInner.style.whiteSpace = "pre";
                            cClueInner.addEventListener('blur', (e) => {
                                editorManualClues.colClues[i] = e.target.textContent.split('\n').map(s => parseInt(s, 10) || 0);
                            });
                            cClue.appendChild(cClueInner);
                        } else {
                             cClue.innerHTML = colClues[i].map(c => `<div>${c}</div>`).join('');
                             if(colClues[i].length === 0 || colClues[i][0] === 0) cClue.innerHTML = '<div>0</div>';
                        }
                        colEl.appendChild(cClue);
                    }
                }
                
                function savePuzzle() {
                    const height = editorSolution.length;
                    if (height === 0) {
                        alert("Create a grid first!");
                        return;
                    }
                    const width = editorSolution[0].length;
                    const puzzle = {
                        name: "Custom Puzzle",
                        width: width,
                        height: height,
                        solution: editorSolution,
                        clues: editorManualClues
                    };
                    
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(puzzle));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href",     dataStr);
                    downloadAnchorNode.setAttribute("download", "puzzle.nonogram");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }
        
                function loadPuzzle(event) {
                    const file = event.target.files[0];
                    if (!file) return;
        
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const puzzle = JSON.parse(e.target.result);
                            if ((puzzle.size || (puzzle.width && puzzle.height)) && puzzle.solution && puzzle.clues) {
                                startGame(puzzle);
                            } else {
                                alert('Invalid puzzle file format.');
                            }
                        } catch (error) {
                            alert('Error reading puzzle file.');
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = ''; // Reset file input
                }
        

        



                function scaleBoard(containerId) {
                    const container = document.getElementById(containerId);
                    if (!container || !container.parentElement) return;

                    const wrapper = container.parentElement;
                    
                    // Reset transform to measure the container's natural size
                    container.style.transform = 'translate(-50%, -50%) scale(1)';

                    const availableWidth = wrapper.clientWidth;
                    const availableHeight = wrapper.clientHeight;

                    const currentWidth = container.offsetWidth;
                    const currentHeight = container.offsetHeight;

                    if (currentHeight === 0 || currentWidth === 0) return;

                    // Calculate scale factor, with a small margin
                    const scale = Math.min(
                        (availableWidth * 0.95) / currentWidth, 
                        (availableHeight * 0.95) / currentHeight
                    );

                    // Apply the new scale
                    container.style.transform = `translate(-50%, -50%) scale(${scale})`;
                }

                // --- Observer Logic for Automatic Resizing ---
                function debouncedAdjust(containerId) {
                    window.adjustTimers = window.adjustTimers || {};
                    if (window.adjustTimers[containerId]) {
                        clearTimeout(window.adjustTimers[containerId]);
                    }
                    window.adjustTimers[containerId] = setTimeout(() => {
                        scaleBoard(containerId);
                    }, 50); // debounce by 50ms
                }

                const observerCallback = (mutationsList, observer) => {
                    const containerId = observer.target.id;
                    debouncedAdjust(containerId);
                };

                const observerConfig = { childList: true, subtree: true, characterData: true };

                const gameContainer = document.getElementById('game-container');
                const editorContainer = document.getElementById('editor-container');
                const gameObserver = new MutationObserver(observerCallback);
                const editorObserver = new MutationObserver(observerCallback);

                if (gameContainer) {
                    gameObserver.target = gameContainer; 
                    gameObserver.observe(gameContainer, observerConfig);
                }
                if (editorContainer) {
                    editorObserver.target = editorContainer;
                    editorObserver.observe(editorContainer, observerConfig);
                }

                 window.addEventListener('resize', () => {
                    if (gameScreen.classList.contains('active')) {
                        scaleBoard('game-container');
                    }
                    if (editorScreen.classList.contains('active')) {
                        scaleBoard('editor-container');
                    }
                });
        
            </script>
        </body>

                        return false;
                    });
                    
                    // Disable double tap at browser level
                    document.body.style.touchAction = 'manipulation';
                    
                    // Disable viewport scaling completely
                    const metaViewport = document.querySelector('meta[name="viewport"]');
                    if (metaViewport) {
                        metaViewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover';
                    }

                    window.addEventListener("resize", () => this.autoFit());
                }

                applyTransform() {
                    document.getElementById("gameContent").style.transform =
                        `translate(${this.pan.x}px, ${this.pan.y}px) scale(${this.zoom})`;
                }

                autoFit() {
                    const vp = document.getElementById("gameWrap");
                    const content = document.getElementById("gameContent");
                    const margin = 40;
                    const scaleW =
                        (vp.clientWidth - margin) / content.offsetWidth;
                    const scaleH =
                        (vp.clientHeight - margin) / content.offsetHeight;
                    this.zoom = Math.min(scaleW, scaleH);
                    this.pan.x =
                        (vp.clientWidth - content.offsetWidth * this.zoom) / 2;
                    this.pan.y =
                        (vp.clientHeight - content.offsetHeight * this.zoom) /
                        2;
                    this.applyTransform();
                }

                scheduleAutoFit(delay = 0) {
                    const run = () => {
                        this.autoFit();
                        requestAnimationFrame(() => this.autoFit());
                        setTimeout(() => this.autoFit(), 80);
                    };

                    if (delay > 0) {
                        setTimeout(run, delay);
                    } else {
                        run();
                    }
                }

                initEvents() {
                    // Drag State
                    document.addEventListener("pointerdown", (e) => {
                        if (e.target.closest(".board")) this.isDragging = true;
                        if (!e.target.closest(".board"))
                            this.setActiveAnchor(null);

                    document.addEventListener(

                    // Size Selector
                    document

                                this.difficulty = btn.dataset.diff;
                                this.initGame(true);
                            });
                        });

                    // Play Tools
                    document
                        .getElementById("btn-new")
                        .addEventListener("click", () => {
                            this.initGame(true);
                            setTimeout(() => this.autoFit(), 10);
                        });
                    document
                        .getElementById("btn-reset")
                        .addEventListener("click", () => this.initGame(false));
                    document
                        .getElementById("btn-load")
                        .addEventListener("click", () => {
                            const s =
                                document.getElementById("seed-input").value;
                            if (s) {
                                this.initGame(true, s);
                                setTimeout(() => this.autoFit(), 10);
                            }
                        });

                    // Custom Tools
                    document
                        .getElementById("btn-clear-custom")
                        .addEventListener("click", () => {
                            if (confirm("Clear custom board?"))
                                this.initGame(true);
                        });
                    document
                        .getElementById("btn-validate")
                        .addEventListener("click", () => {
                            let res = this.validateBoard(
                                this.customAnchors,
                                this.boardSize,
                            );
                            this.showToast(res.msg);
                        });
                    document
                        .getElementById("btn-play-custom")
                        .addEventListener("click", () => {
                            let res = this.validateBoard(
                                this.customAnchors,
                                this.boardSize,
                            );
                            if (res.valid) {
                                let seedStr = this.encodeCustomSeed(
                                    this.boardSize,
                                    this.customAnchors,
                                );
                                document.getElementById("seed-input").value =
                                    seedStr;
                                // Switch to Play Mode natively
                                document
                                    .querySelector(
                                        '#mode-group .cb[data-mode="play"]',
                                    )
                                    .click();
                                this.initGame(true, seedStr);
                            } else {
                                this.showToast("Cannot Play: " + res.msg);
                            }
                        });

                    // Theme & Layout Tools
                    document
                        .getElementById("btn-theme")
                        .addEventListener("click", () => {
                            const isDark =
                                document.body.classList.contains("dark");
                            document.body.classList.toggle("dark", !isDark);
                            document.body.classList.toggle("light", isDark);
                            // Trigger re-render of colors for play mode
                            if (this.mode === "play") {
                                Object.values(this.anchorStats).forEach(
                                    (stat) => {
                                        stat.colorObj = this.getColorObj(
                                            stat.id,
                                        );
                                        stat.el.style.color =
                                            stat.colorObj.text;
                                    },
                                );
                                this.updateValidation();
                            }
                        });

                    document.addEventListener("change", (e) => {
                        if (e.target.id !== "mochi-toggle") return;

                        this.isMochikoroMode = e.target.checked;
                        this.persistMochikoroPreference();
                        this.syncMochikoroUI();

                        if (this.mode === "play") {
                            localStorage.removeItem(SHIKAKU_SAVE_KEY);
                            this.initGame(true);
                            this.saveProgress();
                            setTimeout(() => this.autoFit(), 10);
                        }
                    });

                    // Title click to show welcome modal
                    document
                        .querySelector(".ttag")
                        .addEventListener("click", () => this.showWelcomeModal(false));

                    document
                        .getElementById("btn-fit")
                        .addEventListener("click", () => this.autoFit());

                    // Dialog Tools
                    document
                        .getElementById("btn-replay")
                        .addEventListener("click", () => this.initGame(false));
                    document
                        .getElementById("btn-next")
                        .addEventListener("click", () => {
                            document.getElementById("seed-input").value = ""; // Force new
                            this.initGame(true);
                            setTimeout(() => this.autoFit(), 10);
                        });
                    document
                        .getElementById("btn-close-win")
                        .addEventListener("click", () => {
                            document
                                .getElementById("win-dialog")
                                .classList.remove("show");
                        });

                    // Disable context menu on board, allow right-click to clear cell color
                    document.querySelector(".board").addEventListener("contextmenu", (e) => {
                        e.preventDefault();
                        const cell = e.target.closest(".cell");
                        if (!cell || !this.userBoard) return;
                        const r = parseInt(cell.dataset.r);
                        const c = parseInt(cell.dataset.c);
                        const isAnchor = cell.dataset.isAnchor === "true";
                        if (!isAnchor && this.userBoard[r][c]) {
                            this.userBoard[r][c] = null;
                            this.updateValidation();
                            this.saveProgress();
                        }
                    });
                }
            }

            const game = new ShikakuUltimate();
            document.addEventListener("DOMContentLoaded", () => {
                game.syncMochikoroUI();
            });

            // Load saved game if exists
            const savedData = localStorage.getItem(SHIKAKU_SAVE_KEY);
            if (savedData) {
                try {
                    const saveObj = JSON.parse(savedData);
                    const seedInput = document.getElementById("seed-input");
                    if (seedInput && saveObj.seed) {
                        seedInput.value = saveObj.seed;
                        game.isMochikoroMode = !!saveObj.isMochi;
                        game.persistMochikoroPreference();
                        game.syncMochikoroUI();
                        game.initGame(false, saveObj.seed);
                        const canRestoreBoard =
                            !saveObj.isMochi ||
                            saveObj.rulesVersion ===
                                SHIKAKU_MOCHI_RULES_VERSION;
                        if (canRestoreBoard && saveObj.userBoard) {
                            game.loadProgress(saveObj);
                        }
                        game.scheduleAutoFit(30);
                    }
                } catch (e) {
                    console.log("Failed to load saved game:", e);
                }
            }

            /*═══════════════════════ SVG EXPORT PATCH (FIXED FOR WORD) ═══*/
            const exportBtn = document.createElement("button");
            exportBtn.className = "sb";
            exportBtn.id = "btn-export";
            exportBtn.title = "Export as SVG";
            exportBtn.innerHTML = "🖼️ SVG";
            document.getElementById("topBar").appendChild(exportBtn);

            const exportDialogHTML = `
    <div class="dialog export-dialog" id="export-dialog">
        <button class="close-dialog" id="btn-close-export">&times;</button>
        <h2>Export Puzzle</h2>
        <div class="export-toolbar">
            <label class="export-toggle">
                <span>Seed ID</span>
                <span class="ios-switch">
                    <input type="checkbox" id="export-seed-toggle" checked>
                    <span class="ios-slider"></span>
                </span>
            </label>
            <label class="export-toggle" title="Fixes black background in Word">
                <span>Solid BG</span>
                <span class="ios-switch">
                    <input type="checkbox" id="export-bg-toggle" checked>
                    <span class="ios-slider"></span>
                </span>
            </label>
            <label class="export-toggle">
                <span>Current Board</span>
                <span class="ios-switch">
                    <input type="checkbox" id="export-current-toggle">
                    <span class="ios-slider"></span>
                </span>
            </label>
            <button class="sb primary" id="btn-download-svg">Download SVG</button>
            <button class="sb" id="btn-rotate-seed" style="grid-column: span 2; height: 32px; font-size: 12px;">🔄 Rotate Seed Position</button>
        </div>

        <div id="export-preview-container" class="export-preview-container">
            <img id="export-preview-img" />
        </div>
    </div>
    `;
            document.body.insertAdjacentHTML("beforeend", exportDialogHTML);

            let exportIncludeSeed = true;
            let exportSolidBG = true;
            let exportCurrentBoard = false;
            let exportSeedPos = 2; // 0: Top, 1: Right, 2: Bottom, 3: Left

            function updateExportPreview() {
                const cellSize = 100;
                const size = game.boardSize;
                const boardPx = size * cellSize;
                const lineWidth = Math.max(3, cellSize * 0.04);
                const baseSize = size * cellSize + lineWidth;
                const offset = lineWidth / 2;
                const seedMargin = 60;
                const isDark = document.body.classList.contains("dark");
                const isMochi = game.isMochikoroMode;
                const mochiFilledBg = "#b4e5a2";
                const mochiFilledBorder = "#4ea72e";
                const frameInset = isMochi ? Math.max(2, lineWidth * 1.5) : 0;
                const frameStroke = isMochi
                    ? Math.max(3, lineWidth * 2.5)
                    : 0;
                const framePad = isMochi
                    ? Math.ceil(frameInset + frameStroke / 2 + 2)
                    : 0;

                let svgWidth = baseSize + framePad * 2;
                let svgHeight = baseSize + framePad * 2;
                let boardX = offset + framePad;
                let boardY = offset + framePad;

                if (exportIncludeSeed) {
                    if (exportSeedPos === 0 || exportSeedPos === 2) {
                        svgHeight += seedMargin;
                        if (exportSeedPos === 0) boardY += seedMargin;
                    } else {
                        svgWidth += seedMargin;
                        if (exportSeedPos === 3) boardX += seedMargin;
                    }
                }

                const bgColor = exportSolidBG 
                    ? (isMochi ? "#ffffff" : (isDark ? "#1a1a2e" : "#ffffff")) 
                    : "transparent";
                const strokeColor = isDark ? "#4a5568" : "#94a3b8";
                const textColor = isMochi ? "#000000" : (isDark ? "#e2e8f0" : "#1a1a2e");
                const dashLen = cellSize * 0.15;
                const boardOuterLeft = boardX - offset;
                const boardOuterTop = boardY - offset;
                const boardOuterCenterX = boardOuterLeft + baseSize / 2;
                const boardOuterCenterY = boardOuterTop + baseSize / 2;

                let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="${svgWidth}" height="${svgHeight}">`;
                
                // Solid Background Rect (Crucial for Word compatibility)
                svg += `<rect width="100%" height="100%" fill="${bgColor}" />`;

                if (isMochi) {
                    const frameRadius = cellSize * 0.18;
                    svg += `<rect x="${boardX - frameInset}" y="${boardY - frameInset}" width="${boardPx + frameInset * 2}" height="${boardPx + frameInset * 2}" rx="${frameRadius}" ry="${frameRadius}" fill="none" stroke="${mochiFilledBorder}" stroke-width="${frameStroke}" />`;
                }

                svg += `<g transform="translate(${boardX}, ${boardY})">`;

                const anchors = game.mode === "play" ? game.puzzleData : game.customAnchors;
                const anchorLookup = Array(size)
                    .fill(null)
                    .map(() => Array(size).fill(null));
                anchors.forEach((a) => {
                    anchorLookup[a.r][a.c] = a;
                });

                const exportLiveBoard =
                    exportCurrentBoard &&
                    game.mode === "play" &&
                    Array.isArray(game.userBoard) &&
                    game.userBoard.length === size;

                if (exportLiveBoard) {
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            const anchor = anchorLookup[r][c];
                            let fill = null;

                            if (isMochi) {
                                if (
                                    (game.userBoard[r] &&
                                        game.userBoard[r][c]) ||
                                    anchor
                                ) {
                                    fill = mochiFilledBg;
                                }
                            } else {
                                const zoneId =
                                    (game.userBoard[r] &&
                                        game.userBoard[r][c]) ||
                                    (anchor ? anchor.id : null);
                                if (zoneId) {
                                    fill = game.getColorObj(zoneId).bg;
                                }
                            }

                            if (!fill) continue;

                            svg += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize}" height="${cellSize}" fill="${fill}" />`;
                        }
                    }
                } else {
                    anchors.forEach((a) => {
                        const colorObj = game.getColorObj(a.id);
                        const fill = isMochi ? mochiFilledBg : colorObj.bg;
                        svg += `<rect x="${a.c * cellSize}" y="${a.r * cellSize}" width="${cellSize}" height="${cellSize}" fill="${fill}" />`;
                    });
                }

                let pathD = "";
                for (let i = 0; i <= size; i++) {
                    pathD += `M ${i * cellSize} 0 L ${i * cellSize} ${size * cellSize} `;
                    pathD += `M 0 ${i * cellSize} L ${size * cellSize} ${i * cellSize} `;
                }
                svg += `<path d="${pathD}" stroke="${strokeColor}" stroke-width="${lineWidth}" stroke-dasharray="${dashLen},${dashLen}" fill="none" />`;

                anchors.forEach((a) => {
                    const colorObj = game.getColorObj(a.id);
                    const x = a.c * cellSize + cellSize / 2;
                    const y = a.r * cellSize + cellSize / 2;
                    const clueColor = isMochi ? "#000000" : colorObj.text;
                    svg += `<text x="${x}" y="${y}" dy="0.35em" fill="${clueColor}" font-family="'DM Mono', monospace" font-size="${cellSize * 0.45}px" font-weight="bold" text-anchor="middle">${a.v}</text>`;
                });
                svg += `</g>`;

                if (exportIncludeSeed) {
                    const seedVal = document.getElementById("seed-input").value || "Custom";
                    const seedText = `💾: ${seedVal}`;
                    let tx, ty, transformStr = "";

                    if (exportSeedPos === 0) { tx = boardOuterCenterX; ty = seedMargin / 2; }
                    else if (exportSeedPos === 1) { 
                        tx = boardOuterLeft + baseSize + seedMargin / 2; ty = boardOuterCenterY; 
                        transformStr = `transform="rotate(90, ${tx}, ${ty})"`;
                    }
                    else if (exportSeedPos === 2) { tx = boardOuterCenterX; ty = boardOuterTop + baseSize + seedMargin / 2; }
                    else if (exportSeedPos === 3) { 
                        tx = seedMargin / 2; ty = boardOuterCenterY; 
                        transformStr = `transform="rotate(-90, ${tx}, ${ty})"`;
                    }
                    svg += `<text x="${tx}" y="${ty}" dy="0.35em" ${transformStr} fill="${textColor}" font-family="'DM Mono', monospace" font-size="${cellSize * 0.25}px" font-weight="bold" text-anchor="middle">${seedText}</text>`;
                }

                svg += `</svg>`;

                const dataUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
                document.getElementById("export-preview-img").src = dataUrl;
            }

            exportBtn.addEventListener("click", () => {
                updateExportPreview();
                document.getElementById("export-dialog").classList.add("show");
            });

            document.getElementById("export-seed-toggle").addEventListener("change", (e) => {
                exportIncludeSeed = e.target.checked;
                updateExportPreview();
            });

            document.getElementById("export-bg-toggle").addEventListener("change", (e) => {
                exportSolidBG = e.target.checked;
                updateExportPreview();
            });

            document.getElementById("export-current-toggle").addEventListener("change", (e) => {
                exportCurrentBoard = e.target.checked;
                updateExportPreview();
            });

            document.getElementById("btn-rotate-seed").addEventListener("click", () => {
                exportSeedPos = (exportSeedPos + 1) % 4;
                updateExportPreview();
            });

            document.getElementById("btn-close-export").addEventListener("click", () => {
                document.getElementById("export-dialog").classList.remove("show");
            });

            document.getElementById("btn-download-svg").addEventListener("click", () => {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, "0");
                const mm = String(now.getMonth() + 1).padStart(2, "0");
                const yy = String(now.getFullYear()).slice(-2);
                const hh = String(now.getHours()).padStart(2, "0");
                const min = String(now.getMinutes()).padStart(2, "0");
                const a = document.createElement("a");
                a.href = document.getElementById("export-preview-img").src;
                a.download = `shikaku-${game.boardSize}x${game.boardSize}_${dd}-${mm}-${yy}_${hh}-${min}.svg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        </script>
        <div id="mochi-panel">
            <label class="ios-switch">
                <input type="checkbox" id="mochi-toggle">
                <span class="ios-slider"></span>
            </label>
            <label for="mochi-toggle">Mochikoro Mode</label>
        </div>
    </body>
</html>

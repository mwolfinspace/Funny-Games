                                valid = false;
                                break;
                            }

                            for (
                                let r = rect.r;
                                r < rect.r + rect.h;
                                r++
                            ) {
                                for (
                                    let c = rect.c;
                                    c < rect.c + rect.w;
                                    c++
                                ) {
                                    grid[r][c] = id;
                                }
                            }
                        }

                        if (!valid || this.hasEmpty2x2(grid)) continue;

                        const score = this.scoreMochikoroRects(
                            rects,
                            size,
                            rng,
                        );

                        if (score > bestScore) {
                            bestScore = score;
                            bestRects = rects.map((rect) => ({
                                ...rect,
                            }));
                        }

                        const areaSignature = rects
                            .map((rect) => rect.area)
                            .sort((a, b) => a - b)
                            .join("+");
                        const shapeSignature = rects
                            .map(
                                (rect) =>
                                    `${rect.w}x${rect.h}${
                                        rect.touchesBorder ? "b" : ""
                                    }`,
                            )
                            .sort()
                            .join(",");
                        const signature =
                            `${areaSignature}|${shapeSignature}`;
                        const existing = validLayouts.get(signature);

                        if (!existing || score > existing.score) {
                            validLayouts.set(signature, {
                                rects: rects.map((rect) => ({
                                    ...rect,
                                })),
                                score,
                            });
                        }
                    }

                    if (validLayouts.size > 0) {
                        const layoutChoices = [...validLayouts.values()].sort(
                            (a, b) => b.score - a.score,
                        );
                        const pickPool = layoutChoices.slice(
                            0,
                            Math.min(config.pickPool, layoutChoices.length),
                        );
                        const chosen =
                            pickPool[
                                Math.floor(rng.next() * pickPool.length)
                            ];

                        return this.createMochikoroAnchorsFromRects(
                            chosen.rects,
                            rng,
                        );
                    }

                    if (bestRects) {
                        return this.createMochikoroAnchorsFromRects(
                            bestRects,
                            rng,
                        );
                    }

                    const fallbackRects = [];
                    const parity = rng.next() > 0.5 ? 0 : 1;
                    for (let r = 0; r < size; r++) {
                        for (let c = 0; c < size; c++) {
                            if ((r + c) % 2 !== parity) continue;
                            fallbackRects.push({
                                r,
                                c,
                                w: 1,
                                h: 1,
                                area: 1,
                                compactness: 1,
                                touchesBorder:
                                    r === 0 ||
                                    c === 0 ||
                                    r === size - 1 ||
                                    c === size - 1,
                            });
                        }
                    }

                    return this.createMochikoroAnchorsFromRects(
                        fallbackRects,
                        rng,
                    );
                }

                generatePuzzle(seed) {
                    if (this.isMochikoroMode) {
                        return this.generateMochikoroPuzzle(seed);
                    }

                    const rng = new SeededRandom(seed);
                    let rects = [
                        { r: 0, c: 0, w: this.boardSize, h: this.boardSize },
                    ];

                    let targetRects;
                    let maxIter = 200;
                    
                    if (this.difficulty === "easy") {
                        targetRects = Math.max(3, Math.floor(this.boardSize * 1.0));
                    } else if (this.difficulty === "medium") {
                        targetRects = Math.max(5, Math.floor(this.boardSize * 1.5));
                    } else { // hard
                        targetRects = Math.max(8, Math.floor(this.boardSize * 2.2));
                        maxIter = 400;
                    }

                    let iterations = 0;
                    while (rects.length < targetRects && iterations < maxIter) {
                        iterations++;

                        let rIdx = 0;
                        if (this.difficulty === "hard" && rng.next() > 0.3) {
                            rIdx = Math.floor(rng.next() * rects.length);
                        } else {
                            rects.sort((a, b) => (b.w * b.h) - (a.w * a.h));
                        }

                        let rect = rects.splice(rIdx, 1)[0];
                        if (rect.w <= 1 && rect.h <= 1) {
                            rects.push(rect);
                            continue;
                        }

                        let splitH = rect.h > rect.w ? true : rect.w > rect.h ? false : rng.next() > 0.5;

                        if (splitH && rect.h > 1) {
                            let splitAt = 1 + Math.floor(rng.next() * (rect.h - 1));
                            
                            if (this.difficulty === "easy") {
                                splitAt = Math.floor(rect.h / 2) || 1;
                            } else if (this.difficulty === "hard") {
                                if (rect.h > 2 && rng.next() > 0.4) splitAt = (rng.next() > 0.5) ? 1 : rect.h - 1;
                            }

                            rects.push({ r: rect.r, c: rect.c, w: rect.w, h: splitAt });
                            rects.push({ r: rect.r + splitAt, c: rect.c, w: rect.w, h: rect.h - splitAt });
                        } else if (!splitH && rect.w > 1) {
                            let splitAt = 1 + Math.floor(rng.next() * (rect.w - 1));
                            
                            if (this.difficulty === "easy") {
                                splitAt = Math.floor(rect.w / 2) || 1;
                            } else if (this.difficulty === "hard") {
                                if (rect.w > 2 && rng.next() > 0.4) splitAt = (rng.next() > 0.5) ? 1 : rect.w - 1;
                            }

                            rects.push({ r: rect.r, c: rect.c, w: splitAt, h: rect.h });
                            rects.push({ r: rect.r, c: rect.c + splitAt, w: rect.w - splitAt, h: rect.h });
                        } else {
                            rects.push(rect);
                        }
                    }

                    return rects.map((rect, i) => {
                        let pr = 0;
                        let pc = 0;

                        if (this.difficulty === "easy") {
                            pr = rng.next() > 0.5 ? 0 : rect.h - 1;
                            pc = rng.next() > 0.5 ? 0 : rect.w - 1;
                        } 
                        else if (this.difficulty === "hard") {
                            if (rect.h > 2) {
                                pr = 1 + Math.floor(rng.next() * (rect.h - 2));
                            } else {
                                pr = Math.floor(rng.next() * rect.h);
                            }
                            
                            if (rect.w > 2) {
                                pc = 1 + Math.floor(rng.next() * (rect.w - 2));
                            } else {
                                pc = Math.floor(rng.next() * rect.w);
                            }
                        } 
                        else {
                            pr = Math.floor(rng.next() * rect.h);
                            pc = Math.floor(rng.next() * rect.w);
                        }

                        return {
                            id: i + 1,
                            r: rect.r + pr,
                            c: rect.c + pc,
                            v: rect.w * rect.h,
                            rectR: rect.r,
                            rectC: rect.c,
                            w: rect.w,
                            h: rect.h
                        };
                    });
                }

                /*═══════════════════════════════ GRAPH COLORING ═══*/
                generateColors(anchors) {
                    this.colorMap = {};
                    if (!anchors || anchors.length === 0) return;

                    let adj = {};
                    anchors.forEach(a => adj[a.id] = new Set());

                    let hasBounds = anchors.every(a => a.w !== undefined);

                    if (hasBounds) {
                        for (let i = 0; i < anchors.length; i++) {
                            for (let j = i + 1; j < anchors.length; j++) {
                                let A = anchors[i], B = anchors[j];
                                let overlapX = A.rectC < B.rectC + B.w && B.rectC < A.rectC + A.w;
                                let overlapY = A.rectR < B.rectR + B.h && B.rectR < A.rectR + A.h;
                                let touchX = (A.rectC + A.w === B.rectC) || (B.rectC + B.w === A.rectC);
                                let touchY = (A.rectR + A.h === B.rectR) || (B.rectR + B.h === A.rectR);
                                
                                if ((overlapX && touchY) || (overlapY && touchX)) {
                                    adj[A.id].add(B.id);
                                    adj[B.id].add(A.id);
                                }
                            }
                        }
                    }

                    // For small puzzles, use round-robin for more color variety
                    let useRoundRobin = anchors.length <= 10;
                    let colorIndex = 0;
                    let colors = Array.from({length: 32}, (_, i) => i);
                    let sortedAnchors = useRoundRobin 
                        ? anchors 
                        : [...anchors].sort((a, b) => adj[b.id].size - adj[a.id].size);

                    for (let a of sortedAnchors) {
                        if (useRoundRobin) {
                            this.colorMap[a.id] = colorIndex % 32;
                            colorIndex++;
                            continue;
                        }

                        let used = new Set();
                        for (let neighbor of adj[a.id]) {
                            if (this.colorMap[neighbor] !== undefined) {
                                used.add(this.colorMap[neighbor]);
                            }
                        }

                        for (let c of colors) {
                            if (!used.has(c)) {
                                this.colorMap[a.id] = c;
                                break;
                            }
                        }
                    }
                }

                // Exact Cover Backtracking Solver to validate custom boards
                validateBoard(anchors, size) {
                    const isMochi = this.isMochikoroMode;
                    const sumV = anchors.reduce((acc, a) => acc + a.v, 0);

                    if (!isMochi && sumV !== size * size) {
                        return {
                            valid: false,
                            msg: "Total sum of numbers must equal total grid cells.",
                        };
                    }

                    if (isMochi && sumV > size * size) {
                        return {
                            valid: false,
                            msg: "Total sum of numbers cannot exceed total grid cells.",
                        };
                    }

                    const candidates = {};
                    for (const a of anchors) {
                        candidates[a.id] = [];

                        for (let h = 1; h <= a.v; h++) {
                            if (a.v % h !== 0) continue;
                            const w = a.v / h;
                            if (w > size || h > size) continue;

                            for (
                                let tr = Math.max(0, a.r - h + 1);
                                tr <= Math.min(size - h, a.r);
                                tr++
                            ) {
                                for (
                                    let tc = Math.max(0, a.c - w + 1);
                                    tc <= Math.min(size - w, a.c);
                                    tc++
                                ) {
                                    let valid = true;
                                    for (const other of anchors) {
                                        if (other.id === a.id) continue;
                                        if (
                                            other.r >= tr &&
                                            other.r < tr + h &&
                                            other.c >= tc &&
                                            other.c < tc + w
                                        ) {
                                            valid = false;
                                            break;
                                        }
                                    }

                                    if (valid) {
                                        candidates[a.id].push({
                                            r: tr,
                                            c: tc,
                                            w,
                                            h,
                                        });
                                    }
                                }
                            }
                        }

                        if (candidates[a.id].length === 0) {
                            return {
                                valid: false,
                                msg: "Unsolvable: Some numbers have no valid placement.",
                            };
                        }
                    }

                    const grid = Array(size)
                        .fill(0)
                        .map(() => Array(size).fill(0));
                    const order = [...anchors].sort(
                        (a, b) =>
                            candidates[a.id].length -
                                candidates[b.id].length ||
                            a.v - b.v,
                    );
                    const maxIterations = isMochi ? 40000 : 15000;
                    let iters = 0;

                    const canPlaceRect = (rect, id) => {
                        if (isMochi) {
                            return this.canPlaceMochikoroRect(grid, rect, id);
                        }

                        for (let r = rect.r; r < rect.r + rect.h; r++) {
                            for (let c = rect.c; c < rect.c + rect.w; c++) {
                                if (grid[r][c] !== 0) return false;
                            }
                        }
                        return true;
                    };

                    const finalizeBoard = () => {
                        if (!isMochi) {
                            for (let r = 0; r < size; r++) {
                                for (let c = 0; c < size; c++) {
                                    if (grid[r][c] === 0) return false;
                                }
                            }
                            return true;
                        }

                        return !this.hasEmpty2x2(grid);
                    };

                    const backtrack = (anchorIndex) => {
                        if (iters++ > maxIterations) return null;
                        if (anchorIndex === order.length) {
                            return finalizeBoard();
                        }

                        const anchor = order[anchorIndex];
                        for (const rect of candidates[anchor.id]) {
                            if (!canPlaceRect(rect, anchor.id)) continue;

                            for (let r = rect.r; r < rect.r + rect.h; r++) {
                                for (let c = rect.c; c < rect.c + rect.w; c++) {
                                    grid[r][c] = anchor.id;
                                }
                            }

                            anchor.rectR = rect.r;
                            anchor.rectC = rect.c;
                            anchor.w = rect.w;
                            anchor.h = rect.h;

                            const res = backtrack(anchorIndex + 1);
                            if (res) return true;
                            if (res === null) return null;

                            delete anchor.rectR;
                            delete anchor.rectC;
                            delete anchor.w;
                            delete anchor.h;

                            for (let r = rect.r; r < rect.r + rect.h; r++) {
                                for (let c = rect.c; c < rect.c + rect.w; c++) {
                                    grid[r][c] = 0;
                                }
                            }
                        }

                        return false;
                    };

                    const result = backtrack(0);
                    if (result === null) {
                        return {
                            valid: false,
                            msg: "Validation timed out (Too complex to Auto-Solve).",
                        };
                    }

                    if (result === true) {
                        return { valid: true, msg: "Valid and Solvable!" };
                    }

                    return {
                        valid: false,
                        msg: isMochi
                            ? "Unsolvable: Rectangles must stay separated and leave no 2x2 shaded block."
                            : "Unsolvable: Pieces cannot fit without overlap.",
                    };
                }

                // High-Density Custom Seed Encoding (BigInt + Base88)
                encodeCustomSeed(size, anchors) {
                    const ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-._~!$'()*+,;=@:/?[]{}^|%#";
                    const BASE = BigInt(ALPHABET.length);
                    let sorted = [...anchors].sort((a,b) => (a.r*size+a.c) - (b.r*size+b.c));
                    
                    let bigVal = 0n;
                    let mult = 1n;
                    let lastIdx = -1;
                    
                    for (let a of sorted) {
                        let idx = a.r * size + a.c;
                        let delta = idx - lastIdx - 1;
                        bigVal += BigInt(delta) * mult;
                        mult *= BigInt(size * size);
                        bigVal += BigInt(a.v - 1) * mult;
                        mult *= BigInt(size * size);
                        lastIdx = idx;
                    }
                    
                    let str = "";
                    if (bigVal === 0n) str = ALPHABET[0];
                    while (bigVal > 0n) {
                        str += ALPHABET[Number(bigVal % BASE)];
                        bigVal /= BASE;
                    }
                    // A-H = Shikaku (3x3 to 10x10), I-P = Mochikoro (3x3 to 10x10)
                    const prefix = this.isMochikoroMode 
                        ? String.fromCharCode(73 + size - 3)  // I-P
                        : String.fromCharCode(65 + size - 3); // A-H
                    return prefix + str; 
                }

                decodeCustomSeed(seedStr) {
                    const ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-._~!$'()*+,;=@:/?[]{}^|%#";
                    const BASE = BigInt(ALPHABET.length);
                    
                    if (!seedStr) return null;
                    
                    let isMochi = seedStr.match(/^[I-P]/);
                    let charCode = seedStr.charCodeAt(0);
                    let size = isMochi ? (charCode - 73 + 3) : (charCode - 65 + 3);
                    if (size < 3 || size > 10) return null;
                    
                    let str = seedStr.substring(1);
                    let bigVal = 0n;
                    let mult = 1n;
                    
                    for (let i = 0; i < str.length; i++) {
                        let val = ALPHABET.indexOf(str[i]);
                        if (val === -1) return null;
                        bigVal += BigInt(val) * mult;
                        mult *= BASE;
                    }
                    
                    let anchors = [];
                    let lastIdx = -1;
                    let id = 1;
                    let ss = BigInt(size * size);
                    
                    while (bigVal > 0n) {
                        let delta = Number(bigVal % ss);
                        bigVal /= ss;
                        let v_minus_1 = Number(bigVal % ss);
                        bigVal /= ss;
                        
                        let idx = lastIdx + 1 + delta;
                        anchors.push({ 
                            id: id++, 
                            r: Math.floor(idx / size), 
                            c: idx % size, 
                            v: v_minus_1 + 1 
                        });
                        lastIdx = idx;
                    }
                    return { size, anchors, isMochi };
                }

                /*═══════════════════════════════ INITIALIZATION ═══*/
                initGame(isNew = false, customSeed = null) {
                    this.selectedCustomNumber = null;
                    this.remainingCells = this.boardSize * this.boardSize;

                    let seed = customSeed;
                    let seedInput = document.getElementById("seed-input");

                    if (this.mode === "play") {
                        if (isNew && !seed) {
                            const prefix = this.isMochikoroMode 
                                ? String.fromCharCode(105 + this.boardSize - 3)  // i-p
                                : String.fromCharCode(97 + this.boardSize - 3); // a-h
                            seed = prefix + Math.floor(Math.random() * 999999).toString();
                        } else if (!seed) {
                            seed = seedInput.value;
                        }

                        seedInput.value = seed;

                        if (isNew || seed) {
                            if (seed.toString().match(/^[A-P]/)) {
                                let decoded = this.decodeCustomSeed(seed);
                                if (decoded) {
                                    this.boardSize = decoded.size;
                                    this.puzzleData = decoded.anchors;
                                    this.isMochikoroMode = decoded.isMochi;
                                    const mochiToggle = document.getElementById("mochi-toggle");
                                    if (mochiToggle) mochiToggle.checked = this.isMochikoroMode;
                                    this.validateBoard(this.puzzleData, this.boardSize);
                                    document.querySelectorAll("#size-group .cb").forEach((b) => {
                                        b.classList.toggle("active", parseInt(b.dataset.size) === this.boardSize);
                                    });
                                }
                            } else {
                                let match = seed.toString().match(/^([a-p])(\d+)$/);
                                let numSeed = parseInt(seed) || 12345;
                                if (match) {
                                    let firstChar = match[1].charCodeAt(0);
                                    if (firstChar >= 105 && firstChar <= 112) { // i-p
                                        this.isMochikoroMode = true;
                                        this.boardSize = firstChar - 105 + 3;
                                    } else if (firstChar >= 97 && firstChar <= 104) { // a-h
                                        this.isMochikoroMode = false;
                                        this.boardSize = firstChar - 97 + 3;
                                    }
                                    const toggle = document.getElementById("mochi-toggle");
                                    if (toggle) toggle.checked = this.isMochikoroMode;
                                    numSeed = parseInt(match[2]);
                                    document.querySelectorAll("#size-group .cb").forEach((b) => {
                                        b.classList.toggle("active", parseInt(b.dataset.size) === this.boardSize);
                                    });
                                }
                                this.puzzleData = this.generatePuzzle(numSeed);
                            }
                        }
                    } else {
                        // Custom mode init
                        if (isNew) this.customAnchors = [];
                        document
                            .getElementById("board")
                            .parentElement.classList.add("mode-custom");
                    }

                    this.activeAnchorId = null;
                    this.gameWon = false;
                    document
                        .getElementById("win-dialog")
                        .classList.remove("show");

                    this.generateColors(this.mode === "play" ? this.puzzleData : this.customAnchors);
                    this.persistMochikoroPreference();
                    this.syncMochikoroUI();

                    this.resetTimer();
                    this.buildBoard();
                    this.autoFillOneByOnes();

                    // Full-width seed display corner widget
                    let cornerSeed = document.getElementById("corner-seed");
                    if (!cornerSeed) {
                        cornerSeed = document.createElement("div");
                        cornerSeed.id = "corner-seed";
                        cornerSeed.style.cursor = "pointer";
                        cornerSeed.title = "Click to copy seed";
                        cornerSeed.addEventListener("click", (e) => {
                            e.stopPropagation();
                            navigator.clipboard.writeText(seedInput.value).then(() => {
                                this.showToast("Seed copied to clipboard!");
                            }).catch(() => {
                                this.showToast("Failed to copy seed");
                            });
                        });
                        document.getElementById("gameWrap").appendChild(cornerSeed);
                    }
                    if (this.mode === "play") {
                        cornerSeed.style.display = "block";
                        cornerSeed.innerText = "Seed: " + seedInput.value;
                    } else {
                        cornerSeed.style.display = "none";
                    }
                }

                showToast(msg) {
                    const toast = document.getElementById("toast");
                    toast.innerText = msg;
                    toast.classList.add("show");
                    setTimeout(() => toast.classList.remove("show"), 2200);
                }

                autoFillOneByOnes() {
                    if (this.mode !== "play") return;
                    let filled = false;
                    for (const id of Object.keys(this.anchorStats)) {
                        if (this.anchorStats[id].target === 1) {
                            const {r, c} = this.anchorStats[id];
                            if (!this.userBoard[r][c]) {
                                this.userBoard[r][c] = this.isMochikoroMode
                                    ? 1
                                    : parseInt(id);
                                filled = true;
                            }
                        }
                    }
                    if (filled) this.updateValidation();
                }

                saveProgress() {
                    this.persistMochikoroPreference();
                    if (this.gameWon || this.mode === "custom") {
                        localStorage.removeItem(SHIKAKU_SAVE_KEY);
                        return;
                    }
                    const seedInput = document.getElementById("seed-input");
                    if (!seedInput || !seedInput.value) return;
                    const saveState = {
                        seed: seedInput.value,
                        isMochi: this.isMochikoroMode,
                        rulesVersion: this.isMochikoroMode
                            ? SHIKAKU_MOCHI_RULES_VERSION
                            : 1,
                        userBoard: this.userBoard
                    };
                    localStorage.setItem(
                        SHIKAKU_SAVE_KEY,
                        JSON.stringify(saveState),
                    );
                }

                loadProgress(savedState) {
                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            this.userBoard[r][c] = savedState.userBoard[r][c];
                        }
                    }
                    this.ensureMochikoroAnchorsFilled();
                    this.updateValidation();
                }

                ensureMochikoroAnchorsFilled() {
                    if (!this.isMochikoroMode || this.mode !== "play") return;

                    const anchors = this.puzzleData || [];
                    for (const anchor of anchors) {
                        if (
                            this.userBoard[anchor.r] &&
                            !this.userBoard[anchor.r][anchor.c]
                        ) {
                            this.userBoard[anchor.r][anchor.c] = 1;
                        }
                    }
                }

                getAssignedColor(zoneId, colorPairsLength) {
                    const contrastStep = 7;
                    const index = (zoneId * contrastStep) % colorPairsLength;
                    return index;
                }

                getColorObj(id) {
                    const colorPairs = [
                        { text: "#ef4444", bg: "#fee2e2" }, // Red
                        { text: "#06b6d4", bg: "#cffafe" }, // Cyan
                        { text: "#a855f7", bg: "#f3e8ff" }, // Purple
                        { text: "#22c55e", bg: "#dcfce7" }, // Green
                        { text: "#f97316", bg: "#ffedd5" }, // Orange
                        { text: "#6366f1", bg: "#e0e7ff" }, // Indigo
                        { text: "#ec4899", bg: "#fce7f3" }, // Pink
                        { text: "#f59e0b", bg: "#fef3c7" }, // Amber
                        { text: "#3b82f6", bg: "#dbeafe" }, // Blue
                        { text: "#f43f5e", bg: "#ffe4e6" }, // Rose
                        { text: "#14b8a6", bg: "#ccfbf1" }, // Teal
                        { text: "#84cc16", bg: "#ecfccb" }, // Lime
                        { text: "#4b5563", bg: "#f3f4f6" }, // Slate/Gray
                        { text: "#c026d3", bg: "#fae8ff" }, // Fuchsia
                    ];

                    let index;
                    if (this.colorMap && this.colorMap[id] !== undefined) {
                        index = this.colorMap[id];
                    } else {
                        index = this.getAssignedColor(id, colorPairs.length);
                    }
                    const pair = colorPairs[index % colorPairs.length];
                    return { text: pair.text, bg: pair.bg };
                }

                buildBoard() {
                    const boardEl = document.getElementById("board");
                    const panel = document.getElementById("boardPanel");

                    if (this.customPalettes.left)
                        this.customPalettes.left.remove();
                    if (this.customPalettes.right)
                        this.customPalettes.right.remove();
                    panel.classList.remove("custom-active");

                    boardEl.style.gridTemplateColumns = `repeat(${this.boardSize}, 50px)`;
                    boardEl.style.gridTemplateRows = `repeat(${this.boardSize}, 50px)`;
                    boardEl.innerHTML = "";

                    this.anchorStats = {};
                    this.userBoard = Array(this.boardSize)
                        .fill(null)
                        .map(() => Array(this.boardSize).fill(null));

                    const activeAnchors =
                        this.mode === "play"
                            ? this.puzzleData
                            : this.customAnchors;

                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            const cell = document.createElement("div");
                            cell.className = "cell";
                            cell.dataset.r = r;
                            cell.dataset.c = c;

                            const anchor = activeAnchors.find(
                                (a) => a.r === r && a.c === c,
                            );
                            if (anchor) {
                                const colorObj = this.getColorObj(anchor.id);

                                cell.dataset.isAnchor = "true";
                                cell.dataset.anchorId = anchor.id;

                                if (this.mode === "play") {
                                    if (this.isMochikoroMode) {
                                        this.userBoard[r][c] = 1;
                                    }
                                    this.anchorStats[anchor.id] = {
                                        target: anchor.v,
                                        r: anchor.r,
                                        c: anchor.c,
                                        colorObj,
                                        el: cell,
                                    };
                                    if (this.isMochikoroMode) {
                                        cell.style.color = "#000000";
                                        cell.style.backgroundColor =
                                            "#b4e5a2";
                                        cell.style.boxShadow =
                                            "inset 0 0 0 1px #4ea72e";
                                    } else {
                                        cell.style.color = colorObj.text;
                                        cell.style.backgroundColor =
                                            colorObj.bg;
                                    }
                                    cell.style.fontWeight = "800";
                                    cell.style.fontSize = "22px";

                                    if (!this.isMochikoroMode) {
                                        cell.addEventListener(
                                            "contextmenu",
                                            (e) => {
                                                e.preventDefault();
                                                if (
                                                    this.activeAnchorId ===
                                                    anchor.id
                                                ) {
                                                    this.setActiveAnchor(null);
                                                }
                                            },
                                        );
                                    }
                                } else {
                                    cell.style.color = colorObj.text;
                                    cell.style.backgroundColor = colorObj.bg;
                                    cell.style.boxShadow = `inset 0 0 0 2px ${colorObj.text}40`;
                                    cell.style.fontWeight = "800";
                                    cell.style.fontSize = "22px";
                                }
                                cell.innerText = anchor.v;
                            }

                            cell.addEventListener("pointerdown", (e) =>
                                this.handleCellDown(r, c, anchor),
                            );
                            cell.addEventListener("pointerenter", (e) => {
                                if (this.mode === "play" && this.isDragging)
                                    this.handleCellDrag(r, c, anchor);
                            });

                            boardEl.appendChild(cell);
                        }
                    }

                    if (this.mode === "custom") {
                        this.setupCustomPalettes(panel, boardEl);
                    }

                    if (this.mode === "play") this.updateValidation();
                }

                setupCustomPalettes(panel, boardEl) {
                    panel.classList.add("custom-active");
                    panel.style.setProperty("--board-size", this.boardSize);

                    const totalNumbers = this.boardSize * this.boardSize;
                    const half = Math.ceil(totalNumbers / 2);
                    
                    // Calculate responsive size based on board size
                    let numBtnSize, cols;
                    if (this.boardSize <= 4) {
                        numBtnSize = 52;
                        cols = Math.ceil(half / this.boardSize);
                    } else if (this.boardSize <= 6) {
                        numBtnSize = 44;
                        cols = Math.ceil(half / this.boardSize);
                    } else {
                        numBtnSize = 38;
                        cols = Math.min(6, Math.ceil(half / this.boardSize));
                    }

                    this.customPalettes.left = document.createElement("div");
                    this.customPalettes.left.className = "custom-palette custom-palette-left";
                    this.customPalettes.left.style.gridTemplateColumns = `repeat(${cols}, ${numBtnSize}px)`;
                    this.customPalettes.left.style.gap = "6px";

                    this.customPalettes.right = document.createElement("div");
                    this.customPalettes.right.className = "custom-palette custom-palette-right";
                    this.customPalettes.right.style.gridTemplateColumns = `repeat(${cols}, ${numBtnSize}px)`;
                    this.customPalettes.right.style.gap = "6px";

                    this.paletteButtons = {};

                    for (let i = 1; i <= half; i++) {
                        const btn = this.createNumButton(i, numBtnSize);
                        this.paletteButtons[i] = btn;
                        this.customPalettes.left.appendChild(btn);
                    }

                    for (let i = half + 1; i <= totalNumbers; i++) {
                        const btn = this.createNumButton(i, numBtnSize);
                        this.paletteButtons[i] = btn;
                        this.customPalettes.right.appendChild(btn);
                    }

                    panel.insertBefore(
                        this.customPalettes.left,
                        boardEl.parentElement,
                    );
                    panel.appendChild(this.customPalettes.right);

                    this.updateCustomNumberAvailability();
                }

                createNumButton(num, size = 48) {
                    const btn = document.createElement("div");
                    btn.className = "num-btn";
                    btn.textContent = num;
                    btn.dataset.num = num;
                    btn.style.width = size + "px";
                    btn.style.height = size + "px";
                    btn.style.fontSize = (size * 0.4) + "px";

                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        if (!btn.classList.contains("disabled")) {
                            this.selectCustomNumber(num);
                        }
                    });

                    btn.addEventListener("contextmenu", (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.selectCustomNumber(null);
                    });

                    return btn;
                }

                updateCustomNumberAvailability() {
                    if (this.mode !== "custom") return;

                    const totalCells = this.boardSize * this.boardSize;
                    const usedCells = this.customAnchors.reduce(
                        (sum, a) => sum + a.v,
                        0,
                    );
                    this.remainingCells = totalCells - usedCells;

                    const totalNumbers = this.boardSize * this.boardSize;

                    for (let i = 1; i <= totalNumbers; i++) {
                        const btn = this.paletteButtons[i];
                        if (btn) {
                            const isTooBig = i > this.remainingCells;
                            const wasDisabled =
                                btn.classList.contains("disabled");
                            btn.classList.toggle("disabled", isTooBig);

                            if (isTooBig && this.selectedCustomNumber === i) {
                                this.selectCustomNumber(null);
                            }
                        }
                    }
                }

                selectCustomNumber(num) {
                    this.selectedCustomNumber = num;
                    Object.values(this.paletteButtons).forEach((btn) => {
                        btn.classList.toggle(
                            "selected",
                            parseInt(btn.dataset.num) === num,
                        );
                    });
                }

                /*═══════════════════════════════ INTERACTION ═══*/
                handleCellDown(r, c, anchorDef) {
                    if (this.mode === "custom") {
                        if (anchorDef) {
                            this.customAnchors = this.customAnchors.filter(
                                (a) => !(a.r === r && a.c === c),
                            );
                            this.updateCustomNumberAvailability();
                            this.buildBoard();
                            return;
                        }

                        if (
                            this.selectedCustomNumber !== null &&
                            this.selectedCustomNumber <= this.remainingCells
                        ) {
                            this.customAnchors = this.customAnchors.filter(
                                (a) => !(a.r === r && a.c === c),
                            );

                            const newId =
                                this.customAnchors.length > 0
                                    ? Math.max(
                                          ...this.customAnchors.map(
                                              (a) => a.id,
                                          ),
                                      ) + 1
                                    : 1;
                            this.customAnchors.push({
                                id: newId,
                                r,
                                c,
                                v: this.selectedCustomNumber,
                            });

                            this.updateCustomNumberAvailability();

                            if (
                                this.remainingCells === 0 ||
                                this.selectedCustomNumber > this.remainingCells
                            ) {
                                this.selectCustomNumber(null);
                            }

                            this.buildBoard();
                        }
                        return;
                    }

                    if (this.gameWon) return;

                    if (this.isMochikoroMode) {
                        this.setActiveAnchor(null);
                        if (anchorDef) {
                            this.mochiDragValue = true;
                            this.userBoard[r][c] = 1;
                        } else {
                            this.mochiDragValue = !this.userBoard[r][c];
                            this.userBoard[r][c] = this.mochiDragValue ? 1 : null;
                        }
                        this.updateValidation();
                        this.saveProgress();
                        return;
                    }

                    if (anchorDef) {
                        if (this.activeAnchorId === anchorDef.id) {
                            this.setActiveAnchor(null);
                            return;
                        }

                        this.setActiveAnchor(anchorDef.id);
                        if (this.userBoard[r][c] !== anchorDef.id) {
                            this.userBoard[r][c] = anchorDef.id;
                            this.updateValidation();
                        }
                    } else if (this.activeAnchorId) {
                        this.handleCellDrag(r, c, anchorDef, false);
                    }
                }

                handleCellDrag(r, c, anchorDef, isDrag = true) {
                    if (this.isMochikoroMode) {
                        if (!this.isDragging || this.gameWon) return;
                        const nextValue = anchorDef
                            ? 1
                            : this.mochiDragValue
                              ? 1
                              : null;
                        if (this.userBoard[r][c] === nextValue) return;
                        this.userBoard[r][c] = nextValue;
                        this.updateValidation();
                        this.saveProgress();
                        return;
                    }

                    if (!this.activeAnchorId || this.gameWon) return;

                    const cellAnchor = this.puzzleData.find(
                        (a) => a.r === r && a.c === c,
                    );
                    if (cellAnchor && cellAnchor.id !== this.activeAnchorId)
                        return; // Protect others

                    if (this.userBoard[r][c] === this.activeAnchorId) {
                        if (!isDrag && !cellAnchor) this.userBoard[r][c] = null; // Toggle off if clicked again
                    } else {
                        this.userBoard[r][c] = this.activeAnchorId;
                    }
                    this.updateValidation();
                    this.saveProgress();
                }

                setActiveAnchor(id) {
                    this.activeAnchorId = id;
                    document
                        .querySelectorAll(".cell")
                        .forEach((el) => el.classList.remove("active-anchor"));
                    if (id && this.anchorStats[id])
                        this.anchorStats[id].el.classList.add("active-anchor");
                }

                analyzeMochikoroBoard() {
                    const componentGrid = Array(this.boardSize)
                        .fill(null)
                        .map(() => Array(this.boardSize).fill(0));
                    const visited = Array(this.boardSize)
                        .fill(null)
                        .map(() => Array(this.boardSize).fill(false));
                    const anchorLookup = Array(this.boardSize)
                        .fill(null)
                        .map(() => Array(this.boardSize).fill(null));
                    const componentsById = {};
                    const dirs = [
                        [1, 0],
                        [-1, 0],
                        [0, 1],
                        [0, -1],
                    ];

                    for (const [id, stats] of Object.entries(this.anchorStats)) {
                        anchorLookup[stats.r][stats.c] = parseInt(id);
                    }

                    let nextComponentId = 1;
                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            if (!this.userBoard[r][c] || visited[r][c]) {
                                continue;
                            }

                            const queue = [{ r, c }];
                            const cells = [];
                            const anchorIds = new Set();
                            let head = 0;
                            let minR = r;
                            let maxR = r;
                            let minC = c;
                            let maxC = c;

                            visited[r][c] = true;

                            while (head < queue.length) {
                                const cell = queue[head++];
                                cells.push(cell);
                                componentGrid[cell.r][cell.c] =
                                    nextComponentId;

                                if (cell.r < minR) minR = cell.r;
                                if (cell.r > maxR) maxR = cell.r;
                                if (cell.c < minC) minC = cell.c;
                                if (cell.c > maxC) maxC = cell.c;

                                const anchorId =
                                    anchorLookup[cell.r][cell.c];
                                if (anchorId !== null) {
                                    anchorIds.add(anchorId);
                                }

                                for (const [dr, dc] of dirs) {
                                    const nr = cell.r + dr;
                                    const nc = cell.c + dc;
                                    if (
                                        nr < 0 ||
                                        nr >= this.boardSize ||
                                        nc < 0 ||
                                        nc >= this.boardSize ||
                                        visited[nr][nc] ||
                                        !this.userBoard[nr][nc]
                                    ) {
                                        continue;
                                    }

                                    visited[nr][nc] = true;
                                    queue.push({ r: nr, c: nc });
                                }
                            }

                            const uniqueAnchorIds = [...anchorIds];
                            const anchorId =
                                uniqueAnchorIds.length === 1
                                    ? uniqueAnchorIds[0]
                                    : null;
                            const count = cells.length;
                            const expectedArea =
                                (maxR - minR + 1) * (maxC - minC + 1);
                            const target =
                                anchorId !== null
                                    ? this.anchorStats[anchorId].target
                                    : null;
                            const isValidRect =
                                anchorId !== null &&
                                count === expectedArea &&
                                count === target;

                            componentsById[nextComponentId] = {
                                id: nextComponentId,
                                anchorId,
                                anchorIds: uniqueAnchorIds,
                                cells,
                                count,
                                expectedArea,
                                minR,
                                maxR,
                                minC,
                                maxC,
                                target,
                                isValidRect,
                            };
                            nextComponentId++;
                        }
                    }

                    const anchorState = {};
                    let allComplete = true;
                    let hasInvalidComponent = false;

                    for (const id of Object.keys(this.anchorStats)) {
                        anchorState[id] = {
                            isValidRect: false,
                            componentId: null,
                        };
                    }

                    for (const component of Object.values(componentsById)) {
                        if (component.isValidRect) {
                            anchorState[component.anchorId] = {
                                isValidRect: true,
                                componentId: component.id,
                            };
                        } else {
                            hasInvalidComponent = true;
                        }
                    }

                    for (const id of Object.keys(this.anchorStats)) {
                        if (!anchorState[id].isValidRect) {
                            allComplete = false;
                            break;
                        }
                    }

                    return {
                        componentGrid,
                        componentsById,
                        anchorState,
                        allComplete,
                        hasInvalidComponent,
                    };
                }

                updateValidation() {
                    const boardEl = document.getElementById("board");
                    if (this.isMochikoroMode) {
                        const mochiEmptyBg = "#ffffff";
                        const mochiFilledBg = "#b4e5a2";
                        const mochiFilledBorder = "#4ea72e";
                        const analysis = this.analyzeMochikoroBoard();

                        for (let r = 0; r < this.boardSize; r++) {
                            for (let c = 0; c < this.boardSize; c++) {
                                const cellEl =
                                    boardEl.children[
                                        r * this.boardSize + c
                                    ];
                                const isFilled = !!this.userBoard[r][c];
                                const componentId =
                                    analysis.componentGrid[r][c];
                                const component = componentId
                                    ? analysis.componentsById[componentId]
                                    : null;
                                const isAnchor =
                                    cellEl.dataset.isAnchor === "true";

                                cellEl.classList.remove("completed");
                                cellEl.style.removeProperty("--z-shadow");

                                if (isFilled) {
                                    cellEl.style.backgroundColor =
                                        mochiFilledBg;
                                    cellEl.style.color = isAnchor
                                        ? "#000000"
                                        : "";

                                    if (component && component.isValidRect) {
                                        const shadow = [];
                                        const bSize = "3px";

                                        if (
                                            r === 0 ||
                                            analysis.componentGrid[r - 1][c] !==
                                                componentId
                                        ) {
                                            shadow.push(
                                                `inset 0 ${bSize} 0 ${mochiFilledBorder}`,
                                            );
                                        }
                                        if (
                                            r === this.boardSize - 1 ||
                                            analysis.componentGrid[r + 1][c] !==
                                                componentId
                                        ) {
                                            shadow.push(
                                                `inset 0 -${bSize} 0 ${mochiFilledBorder}`,
                                            );
                                        }
                                        if (
                                            c === 0 ||
                                            analysis.componentGrid[r][c - 1] !==
                                                componentId
                                        ) {
                                            shadow.push(
                                                `inset ${bSize} 0 0 ${mochiFilledBorder}`,
                                            );
                                        }
                                        if (
                                            c === this.boardSize - 1 ||
                                            analysis.componentGrid[r][c + 1] !==
                                                componentId
                                        ) {
                                            shadow.push(
                                                `inset -${bSize} 0 0 ${mochiFilledBorder}`,
                                            );
                                        }

                                        cellEl.classList.add("completed");
                                        cellEl.style.boxShadow = shadow.join(
                                            ", ",
                                        );
                                    } else {
                                        cellEl.style.boxShadow = `inset 0 0 0 1px ${mochiFilledBorder}`;
                                    }
                                } else if (isAnchor) {
                                    cellEl.style.backgroundColor = mochiEmptyBg;
                                    cellEl.style.color = "#000000";
                                    cellEl.style.boxShadow =
                                        "inset 0 0 0 1px rgba(148, 163, 184, 0.45)";
                                } else {
                                    cellEl.style.backgroundColor = mochiEmptyBg;
                                    cellEl.style.color = "";
                                    cellEl.style.boxShadow = "";
                                }
                            }
                        }

                        if (
                            analysis.allComplete &&
                            !analysis.hasInvalidComponent &&
                            !this.hasEmpty2x2(this.userBoard)
                        ) {
                            this.checkWinCondition();
                        }
                        return;
                    }

                    let filledCells = 0;
                    
                    const zones = {};
                    for (const id of Object.keys(this.anchorStats)) {
                        zones[id] = {
                            count: 0,
                            minR: this.boardSize,
                            maxR: -1,
                            minC: this.boardSize,
                            maxC: -1,
                            target: this.anchorStats[id].target,
                            colorObj: this.anchorStats[id].colorObj
                        };
                    }

                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            const paintedId = this.userBoard[r][c];
                            if (paintedId && zones[paintedId]) {
                                zones[paintedId].count++;
                                filledCells++;
                                if (r < zones[paintedId].minR) zones[paintedId].minR = r;
                                if (r > zones[paintedId].maxR) zones[paintedId].maxR = r;
                                if (c < zones[paintedId].minC) zones[paintedId].minC = c;
                                if (c > zones[paintedId].maxC) zones[paintedId].maxC = c;
                            }
                        }
                    }

                    let allComplete = true;
                    for (const [id, zone] of Object.entries(zones)) {
                        const expectedArea = (zone.maxR - zone.minR + 1) * (zone.maxC - zone.minC + 1);
                        zone.isValidRect = (zone.count === zone.target) && (expectedArea === zone.target);
                        if (!zone.isValidRect) {
                            allComplete = false;
                        }
                    }

                    const isMochi = this.isMochikoroMode;
                    const mochiEmptyBg = "#ffffff";
                    const mochiFilledBg = "#b4e5a2";
                    const mochiFilledBorder = "#4ea72e";

                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            const cellEl = boardEl.children[r * this.boardSize + c];
                            const paintedId = this.userBoard[r][c];
                            
                            cellEl.classList.remove("completed");
                            cellEl.style.removeProperty('--z-shadow'); 

                            if (paintedId && zones[paintedId]) {
                                const zone = zones[paintedId];
                                if (isMochi) {
                                    cellEl.style.backgroundColor = mochiFilledBg;
                                    cellEl.style.color = "#000000";
                                    cellEl.style.boxShadow = `inset 0 0 0 1px ${mochiFilledBorder}`;
                                } else {
                                    cellEl.style.backgroundColor = zone.colorObj.bg;
                                }
                                
                                if (zone.isValidRect) {
                                    cellEl.classList.add("completed");
                                    
                                    let shadow = [];
                                    const bSize = "3px";
                                    const bColor = isMochi ? mochiFilledBorder : zone.colorObj.text;

                                    if (r === 0 || this.userBoard[r-1][c] !== paintedId) shadow.push(`inset 0 ${bSize} 0 ${bColor}`);
                                    if (r === this.boardSize - 1 || this.userBoard[r+1][c] !== paintedId) shadow.push(`inset 0 -${bSize} 0 ${bColor}`);
                                    if (c === 0 || this.userBoard[r][c-1] !== paintedId) shadow.push(`inset ${bSize} 0 0 ${bColor}`);
                                    if (c === this.boardSize - 1 || this.userBoard[r][c+1] !== paintedId) shadow.push(`inset -${bSize} 0 0 ${bColor}`);

                                    if (shadow.length > 0) {
                                        cellEl.style.setProperty('--z-shadow', shadow.join(", "));
                                    }
                                }
                            } else {
                                if (cellEl.dataset.isAnchor === "true") {
                                    const aid = cellEl.dataset.anchorId;
                                    if (isMochi) {
                                        cellEl.style.backgroundColor = mochiFilledBg;
                                        cellEl.style.color = "#000000";
                                        cellEl.style.boxShadow = `inset 0 0 0 1px ${mochiFilledBorder}`;
                                    } else {
                                        cellEl.style.backgroundColor = this.anchorStats[aid].colorObj.bg;
                                    }
                                } else {
                                    if (isMochi) {
                                        cellEl.style.backgroundColor = mochiEmptyBg;
                                        cellEl.style.color = "";
                                        cellEl.style.boxShadow = "";
                                    } else {
                                        cellEl.style.backgroundColor = "";
                                    }
                                }
                            }
                        }
                    }

                    if (isMochi) {
                        if (allComplete) {
                            this.checkWinCondition();
                        }
                        return;
                    }

                    let incompleteZones = [];
                    let zoneCounts = {};
                    let emptyCells = [];

                    for (const id of Object.keys(this.anchorStats)) {
                        zoneCounts[id] = 0;
                    }

                    for (let r = 0; r < this.boardSize; r++) {
                        for (let c = 0; c < this.boardSize; c++) {
                            const val = this.userBoard[r][c];
                            if (val && zoneCounts[val] !== undefined) {
                                zoneCounts[val]++;
                            } else if (!val) {
                                emptyCells.push({r, c});
                            }
                        }
                    }

                    for (const [id, count] of Object.entries(zoneCounts)) {
                        if (count < this.anchorStats[id].target) {
                            incompleteZones.push({id: parseInt(id), count, target: this.anchorStats[id].target});
                        }
                    }

                    if (incompleteZones.length === 1 && emptyCells.length > 0) {
                        const lastZone = incompleteZones[0];
                        const needed = lastZone.target - lastZone.count;

                        if (emptyCells.length === needed) {
                            const autoId = lastZone.id;
                            const colorObj = this.anchorStats[autoId].colorObj;

                            emptyCells.forEach(cell => {
                                this.userBoard[cell.r][cell.c] = autoId;
                                if (zones[autoId]) {
                                    zones[autoId].count++;
                                    zones[autoId].minR = Math.min(zones[autoId].minR, cell.r);
                                    zones[autoId].maxR = Math.max(zones[autoId].maxR, cell.r);
                                    zones[autoId].minC = Math.min(zones[autoId].minC, cell.c);
                                    zones[autoId].maxC = Math.max(zones[autoId].maxC, cell.c);
                                }
                            });

                            if (zones[autoId]) {
                                const expectedArea = (zones[autoId].maxR - zones[autoId].minR + 1) * (zones[autoId].maxC - zones[autoId].minC + 1);
                                zones[autoId].isValidRect = (zones[autoId].count === zones[autoId].target) && (expectedArea === zones[autoId].target);
                            }

                            const boardEl = document.getElementById("board");
                            emptyCells.forEach(cell => {
                                const idx = cell.r * this.boardSize + cell.c;
                                const cellEl = boardEl.children[idx];
                                if (cellEl) {
                                    cellEl.style.backgroundColor = colorObj.bg;
                                    cellEl.classList.add("completed");
                                    
                                    let shadow = [];
                                    const bSize = "3px";
                                    const bColor = colorObj.text;
                                    const r = cell.r;
                                    const c = cell.c;

                                    if (r === 0 || this.userBoard[r-1][c] !== autoId) shadow.push(`inset 0 ${bSize} 0 ${bColor}`);
                                    if (r === this.boardSize - 1 || this.userBoard[r+1][c] !== autoId) shadow.push(`inset 0 -${bSize} 0 ${bColor}`);
                                    if (c === 0 || this.userBoard[r][c-1] !== autoId) shadow.push(`inset ${bSize} 0 0 ${bColor}`);
                                    if (c === this.boardSize - 1 || this.userBoard[r][c+1] !== autoId) shadow.push(`inset -${bSize} 0 0 ${bColor}`);

                                    if (shadow.length > 0) {
                                        cellEl.style.setProperty('--z-shadow', shadow.join(", "));
                                    }
                                }
                            });

                            filledCells = this.boardSize * this.boardSize;

                            allComplete = true;
                            for (const [id, zone] of Object.entries(zones)) {
                                if (!zone.isValidRect) {
                                    allComplete = false;
                                    break;
                                }
                            }

                            if (allComplete) {
                                setTimeout(() => this.checkWinCondition(), 10);
                                return;
                            }
                        }
                    }

                    if (allComplete && filledCells === this.boardSize * this.boardSize) {
                        this.checkWinCondition();
                    }
                }

                checkWinCondition() {
                    if (this.gameWon) return;

                    let isValid = true;
                    if (this.isMochikoroMode) {
                        const analysis = this.analyzeMochikoroBoard();
                        isValid =
                            analysis.allComplete &&
                            !analysis.hasInvalidComponent &&
                            !this.hasEmpty2x2(this.userBoard);
                    } else {
                        for (const id of Object.keys(this.anchorStats)) {
                            let minR = this.boardSize,
                                maxR = -1,
                                minC = this.boardSize,
                                maxC = -1,
                                actual = 0;

                            for (let r = 0; r < this.boardSize; r++) {
                                for (let c = 0; c < this.boardSize; c++) {
                                    if (this.userBoard[r][c] == id) {
                                        if (r < minR) minR = r;
                                        if (r > maxR) maxR = r;
                                        if (c < minC) minC = c;
                                        if (c > maxC) maxC = c;
                                        actual++;
                                    }
                                }
                            }

                            const expectedArea =
                                (maxR - minR + 1) * (maxC - minC + 1);
                            if (
                                expectedArea !==
                                    this.anchorStats[id].target ||
                                actual !== expectedArea
                            ) {
                                isValid = false;
                                break;
                            }
                        }
                    }

                    if (isValid) {
                        this.gameWon = true;
                        clearInterval(this.timerInt);
                        this.setActiveAnchor(null);
                        document
                            .querySelectorAll(".cell.completed")
                            .forEach((el) => el.classList.remove("completed"));

                        confetti({
                            particleCount: 150,
                            spread: 80,
                            origin: { y: 1 },
                            zIndex: 1000,
                        });
                        setTimeout(
                            () =>
                                document
                                    .getElementById("win-dialog")
                                    .classList.add("show"),
                            500,
                        );
                        this.saveProgress();
                    }
                }

                /*═══════════════════════════════ UI & CONTROLS ═══*/
                resetTimer() {
                    clearInterval(this.timerInt);
                    this.secondsElapsed = 0;
                    if (this.mode === "play") {
                        this.updateTimerUI();
                        this.timerInt = setInterval(() => {
                            this.secondsElapsed++;
                            this.updateTimerUI();
                        }, 1000);
                    } else {
                        document.getElementById("timer").innerText = "Edit";
                    }
                }

                updateTimerUI() {
                    const m = Math.floor(this.secondsElapsed / 60)
                        .toString()
                        .padStart(2, "0");
                    const s = (this.secondsElapsed % 60)
                        .toString()
                        .padStart(2, "0");
                    document.getElementById("timer").innerText = `${m}:${s}`;
                }

                initViewport() {
                    const vp = document.getElementById("gameWrap");
                    const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
                    vp.addEventListener("pointerdown", (e) => {
                        if (
                            e.target.closest(".board") ||
                            e.target.closest(".dialog")
                        )
                            return;
                        const sX = e.clientX - this.pan.x,
                            sY = e.clientY - this.pan.y;
                        vp.classList.add("grab");

                        const move = (m) => {
                            this.pan.x = m.clientX - sX;
                            this.pan.y = m.clientY - sY;
                            this.applyTransform();
                        };
                        const up = () => {
                            window.removeEventListener("pointermove", move);
                            window.removeEventListener("pointerup", up);
                            vp.classList.remove("grab");
                        };
                        window.addEventListener("pointermove", move);
                        window.addEventListener("pointerup", up);
                    });

                    // Disable pitch zoom on touch devices
                    if (!isTouchDevice) {
                        vp.addEventListener(
                            "wheel",
                            (e) => {
                                e.preventDefault();
                                const oldZoom = this.zoom;
                                this.zoom *= e.deltaY < 0 ? 1.1 : 0.9;

                                const rect = vp.getBoundingClientRect();
                                const mouseX = e.clientX - rect.left;
                                const mouseY = e.clientY - rect.top;

                                this.pan.x =
                                    mouseX -
                                    (mouseX - this.pan.x) * (this.zoom / oldZoom);
                                this.pan.y =
                                    mouseY -
                                    (mouseY - this.pan.y) * (this.zoom / oldZoom);

                                this.applyTransform();
                            },
                            { passive: false },
                        );
                    }
                    
                    // Prevent pinch zoom and double tap zoom on all touch devices
                    document.addEventListener('touchstart', function(e) {
                        if (e.touches.length > 1) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                        }
                    }, { passive: false, capture: true });
                    
                    let lastTouchEnd = 0;
                    document.addEventListener('touchend', function(e) {
                        const now = Date.now();
                        if (now - lastTouchEnd <= 500) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                        }
                        lastTouchEnd = now;
                    }, { passive: false, capture: true });
                    
                    document.addEventListener('touchmove', function(e) {
                        if (e.touches.length > 1) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                        }
                    }, { passive: false, capture: true });
                    
                    document.addEventListener('gesturestart', function(e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        return false;
                    });
                    
                    document.addEventListener('gesturechange', function(e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        return false;
                    });
                    
                    document.addEventListener('gestureend', function(e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();

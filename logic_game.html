<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Logic Pattern Game</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* ===== TOP BAR (matches other games) ===== */
        #hud {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #b3e5fc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
            flex-shrink: 0;
        }

        .hud-left, .hud-controls { display: flex; align-items: center; gap: 10px; }

        a.return-to-menu {
            text-decoration: none;
            font-size: 1.6rem;
            filter: grayscale(1);
            transition: filter 0.2s, transform 0.2s;
        }
        a.return-to-menu:hover { filter: grayscale(0); transform: scale(1.1); }

        .hud-btn {
            border: none;
            background-color: #0288d1;
            color: white;
            padding: 0 14px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 0 #01579b;
            transition: transform 0.1s;
        }
        .hud-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #01579b; }
        .hud-btn.new { background-color: #43a047; box-shadow: 0 3px 0 #2e7d32; }
        .hud-btn.mute { background-color: #757575; box-shadow: 0 3px 0 #424242; }

        .level-cluster {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(127, 140, 141, 0.15);
            padding: 3px;
            border-radius: 10px;
            height: 42px;
        }
        .level-cluster .hud-btn.level {
            background-color: #8e24aa;
            box-shadow: 0 3px 0 #4a148c;
            width: 36px;
            padding: 0;
            font-size: 1.2rem;
        }
        .level-cluster .hud-btn.hole {
            background-color: #ef6c00;
            box-shadow: 0 3px 0 #e65100;
            width: 36px;
            padding: 0;
            font-size: 1.2rem;
        }
        .level-num {
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.15rem;
            color: #4a148c;
        }
        .level-cluster[aria-label="Holes"] .level-num { color: #e65100; }
        .level-label-tag {
            font-size: 0.9rem;
            font-weight: bold;
            color: #4a148c;
            margin-left: 6px;
        }
        .hole-tag { color: #e65100; margin-left: 8px; }

        /* ===== MAIN LAYOUT: board + choices use full space ===== */
        main {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 16px;
            overflow: hidden;
        }

        .title-wrap { text-align: center; }
        .title-wrap h1 {
            color: #0288d1;
            margin: 0;
            font-size: clamp(20px, 4vw, 30px);
        }
        .title-wrap p { margin: 4px 0 0; font-size: clamp(13px, 2.4vw, 18px); color: #555; }

        /* The Pattern Display Box */
        .pattern-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 0.8vw, 8px);
            background-color: #f1f8e9;
            padding: clamp(10px, 1.8vw, 16px);
            border-radius: 18px;
            border: 3px dashed #8bc34a;
            width: min(100%, 900px);
            flex-wrap: nowrap;
            max-height: 50%;
            min-height: 0;
            flex-shrink: 1;
            overflow: hidden;
        }

        .item {
            font-size: clamp(26px, 5vw, 44px);
            width: clamp(40px, 6.5vw, 58px);
            height: clamp(40px, 6.5vw, 58px);
            min-width: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-shrink: 1;
        }

        .missing {
            background-color: #fffde7;
            border: 3px dashed #fbc02d;
            font-weight: bold;
            color: #fbc02d;
            animation: pulse 1.5s infinite;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .missing.filled {
            animation: none;
            background-color: #e8f5e9;
            border: 3px solid #4caf50;
            color: #2e7d32;
        }
        .missing.active {
            background-color: #fff3e0;
            border: 4px solid #ff9800;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Choice Buttons Box */
        .choices-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 1.6vw, 14px);
            flex-wrap: wrap;
            max-width: 100%;
            flex-shrink: 0;
        }

        .choice-btn {
            font-size: clamp(30px, 6vw, 48px);
            width: clamp(52px, 8.5vw, 76px);
            height: clamp(52px, 8.5vw, 76px);
            border: none;
            background-color: #fff;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s, background-color 0.2s;
            border: 3px solid #ffb74d;
        }
        .choice-btn:hover { transform: scale(1.08); background-color: #fff3e0; }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

        /* Score & Celebration */
        .score-panel {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: bold;
            color: #e91e63;
            text-align: center;
        }

        .message {
            height: 30px;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: bold;
            text-align: center;
        }
        .success { color: #4caf50; }
        .wrong { color: #f44336; }
    </style>
</head>
<body>

    <!-- Top bar: home + controls -->
    <div id="hud">
        <div class="hud-left">
            <a class="return-to-menu" href="index.html">🏠</a>
            <span class="hud-btn mute" id="mute-btn" onclick="toggleMute()">🔊</span>
        </div>
        <div class="hud-controls">
            <div class="level-cluster" aria-label="Level">
                <button class="hud-btn level" onclick="changeLevel(-1)">−</button>
                <span class="level-num" id="levelNum">1</span>
                <button class="hud-btn level" onclick="changeLevel(1)">+</button>
                <span class="level-label-tag">Lv</span>
            </div>
            <div class="level-cluster" aria-label="Holes">
                <button class="hud-btn hole" onclick="changeHole(-1)">−</button>
                <span class="level-num" id="holeNum">1</span>
                <button class="hud-btn hole" onclick="changeHole(1)">+</button>
                <span class="level-label-tag hole-tag">#</span>
            </div>
            <button class="hud-btn new" onclick="newGame()">↻ <span>New</span></button>
        </div>
    </div>

    <main>
        <div class="title-wrap">
            <h1>What Comes Next? 🤔</h1>
            <p>Look at the pattern and find the missing item!</p>
        </div>

        <!-- The Pattern Layout -->
        <div class="pattern-box" id="patternDisplay">
            <!-- Dynamically generated by JS -->
        </div>

        <!-- The User Choices -->
        <div class="choices-box" id="choicesDisplay">
            <!-- Dynamically generated by JS -->
        </div>

        <div class="message" id="messageText"></div>
        <div class="score-panel">Stars: <span id="scoreCount">0</span> ⭐</div>
    </main>

    <script>
        // ===== Common emojis kids can easily name =====
        const EMOJI_FRUIT = ['🍎', '🍌', '🍇', '🍊', '🍓', '🍉', '🍒', '🍍', '🍑', '🍋', '🥝', '🍈'];
        const EMOJI_ANIMAL = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵'];
        const EMOJI_VEHICLE = ['🚗', '🚌', '🚒', '🚑', '🚓', '🚕', '🚙', '🚜', '✈️', '🚀', '🚢', '🚂', '🚲'];
        const EMOJI_PLACE = ['☀️', '🌙', '⭐', '☁️', '🌈', '❄️', '🌧️', '🌵', '🌼', '🌳', '🍄', '🏠', '⛵'];
        const EMOJI_TOY = ['⚽', '🏀', '🎈', '🎁', '🧸', '🎠', '🎲', '🎪', '⛸️', '🏓'];
        const EMOJI_COLOR = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣', '⚫', '⚪', '🔺', '🔷', '🟥', '🟩'];
        const EMOJI_FOOD = ['🍦', '🍩', '🍪', '🍰', '🍕', '🍔', '🍟', '🍿', '🧁', '🍬', '🍭', '🥕'];

        const ALL_CATEGORIES = [EMOJI_FRUIT, EMOJI_ANIMAL, EMOJI_VEHICLE, EMOJI_PLACE, EMOJI_TOY, EMOJI_COLOR, EMOJI_FOOD];
        const ALL_EMOJI = [...new Set(ALL_CATEGORIES.flat())];

        // ===== Level definitions (bigger loop = harder) =====
        // Each level defines: how many distinct symbols in the loop,
        // and the looping shapes used.
        const LEVELS = {
            1: { label: "Two-Step", loopLength: 2, shapes: ['AB'] },
            2: { label: "Fancy Pair", loopLength: 2, shapes: ['ABB', 'AAB'] },
            3: { label: "Three-Step", loopLength: 3, shapes: ['ABC', 'ABB', 'AAB'] },
            4: { label: "Four-Step", loopLength: 4, shapes: ['ABCD', 'AABB', 'ABAB'] },
            5: { label: "Five-Step", loopLength: 5, shapes: ['ABCDE', 'AABBC'] }
        };

        let level = 1;
        let holeCount = 1;
        let score = 0;
        let locked = false;
        let roundPattern = null;
        let activeHole = 0;

        const patternDisplay = document.getElementById('patternDisplay');
        const choicesDisplay = document.getElementById('choicesDisplay');
        const messageText = document.getElementById('messageText');
        const scoreCount = document.getElementById('scoreCount');
        const muteBtn = document.getElementById('mute-btn');
        const levelNum = document.getElementById('levelNum');
        const holeNum = document.getElementById('holeNum');

        let muted = false;

        // ==== Random helpers ====
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Generate a random unique set of length n from a category pool
        function pickDistinct(pool, n) {
            const s = shuffle(pool);
            return s.slice(0, n);
        }

        // ===== Pattern generation =====
        function generateRound() {
            const def = LEVELS[level];
            const shape = pick(def.shapes);          // e.g. 'ABCD'
            const n = shape.length;                  // distinct symbols
            // Choose a themed category so the pattern looks cohesive
            const category = pick(ALL_CATEGORIES);
            const symbols = pickDistinct(category, n);
            const loop = shape.split('').map((_, i) => symbols[i]);

            // Base sequence = exactly 2 full loops (so it always loops at
            // least twice). Level 5 -> 10 cells wide, matching the layout.
            const baseLen = n * 2;
            const baseSeq = [];
            for (let i = 0; i < baseLen; i++) baseSeq.push(loop[i % n]);

            // Choose holes.
            //   count 0 -> default: hide only the LAST cell
            //   count 1 -> one hole at any position
            //   count 2-4 -> that many holes anywhere (unique positions)
            let positions;
            if (holeCount === 0) {
                positions = [baseLen - 1];
            } else {
                const howMany = Math.min(holeCount, baseLen);
                positions = pickDistinct(
                    Array.from({ length: baseLen }, (_, i) => i),
                    howMany
                ).sort((a, b) => a - b);
            }
            const holes = positions.map(pos => ({ pos, answer: baseSeq[pos], filled: false, value: null }));

            // Option count grows with the question length (loop size).
            const optionCount = Math.min(8, n + 3);
            // Priority: all the loop emojis first, then extra emojis from the
            // SAME category (never mixed with another subject, so a cheater
            // can't guess by category alone).
            const extras = shuffle(category.filter(e => !loop.includes(e)));
            const extraCount = Math.max(0, optionCount - loop.length);
            const pool = shuffle([...loop, ...extras.slice(0, extraCount)]);

            return { loop, category, baseSeq, holes, pool };
        }

        // Simple WebAudio success sound
        function playSuccess() {
            if (muted) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                let ctx = window.__soundCtx;
                if (!ctx) ctx = window.__soundCtx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                const n = ctx.currentTime;
                [523, 659, 784, 1046].forEach((f, i) => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'square';
                    o.frequency.value = f;
                    g.connect(ctx.destination);
                    g.gain.setValueAtTime(0.05, n + i * 0.08);
                    g.gain.linearRampToValueAtTime(0, n + i * 0.08 + 0.35);
                    o.connect(g);
                    o.start(n + i * 0.08);
                    o.stop(n + i * 0.08 + 0.35);
                });
            } catch (e) {}
        }

        function playWrong() {
            if (muted) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                let ctx = window.__soundCtx;
                if (!ctx) ctx = window.__soundCtx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                const n = ctx.currentTime;
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(220, n);
                o.frequency.exponentialRampToValueAtTime(140, n + 0.25);
                g.gain.setValueAtTime(0.1, n);
                g.gain.exponentialRampToValueAtTime(0.01, n + 0.25);
                g.connect(ctx.destination);
                o.connect(g);
                o.start(n);
                o.stop(n + 0.25);
            } catch (e) {}
        }

        function toggleMute() {
            muted = !muted;
            muteBtn.innerText = muted ? '🔇' : '🔊';
        }

        function setLevel(newLevel) {
            level = Math.max(1, Math.min(5, newLevel));
            levelNum.innerText = level;
            loadRound();
        }

        function changeLevel(delta) {
            setLevel(level + delta);
        }

        function setHole(newCount) {
            holeCount = Math.max(0, Math.min(4, newCount));
            holeNum.innerText = holeCount;
            loadRound();
        }

        function changeHole(delta) {
            setHole(holeCount + delta);
        }

        function newGame() {
            score = 0;
            scoreCount.innerText = '0';
            loadRound();
        }

        function loadRound() {
            messageText.innerText = "";
            messageText.className = "message";
            patternDisplay.innerHTML = "";
            choicesDisplay.innerHTML = "";
            locked = false;

            roundPattern = generateRound();
            activeHole = 0;

            // Render the full base sequence; holes render as "?" cells.
            const holeMap = {};
            roundPattern.holes.forEach(h => { holeMap[h.pos] = h; });

            const itemNodes = [];
            for (let i = 0; i < roundPattern.baseSeq.length; i++) {
                let div = document.createElement('div');
                if (holeMap[i]) {
                    div.className = 'item missing';
                    div.innerText = '?';
                    holeMap[i].node = div;
                } else {
                    div.className = 'item';
                    div.innerText = roundPattern.baseSeq[i];
                }
                patternDisplay.appendChild(div);
                itemNodes.push(div);
            }

            roundPattern.itemNodes = itemNodes;

            // Render choice buttons (all loop emojis + same-category extras)
            roundPattern.pool.forEach(emoji => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = emoji;
                btn.onclick = () => chooseOption(emoji, btn);
                choicesDisplay.appendChild(btn);
            });

            highlightActiveHole();
        }

        function highlightActiveHole() {
            roundPattern.holes.forEach((h, idx) => {
                if (h.node) h.node.classList.remove('active');
            });
            if (activeHole < roundPattern.holes.length) {
                const cur = roundPattern.holes[activeHole];
                if (cur.node) cur.node.classList.add('active');
            }
        }

        function chooseOption(emoji, chosenBtn) {
            if (locked) return;
            if (activeHole >= roundPattern.holes.length) return;
            const cur = roundPattern.holes[activeHole];

            if (emoji === cur.answer) {
                // fill this hole correctly
                cur.filled = true;
                cur.value = emoji;
                cur.node.innerText = emoji;
                cur.node.classList.remove('active', 'missing');
                cur.node.classList.add('item', 'filled');
                playSuccess();
                activeHole++;

                if (activeHole >= roundPattern.holes.length) {
                    // all holes done -> round complete
                    locked = true;
                    score++;
                    scoreCount.innerText = score;
                    [...choicesDisplay.children].forEach(b => b.disabled = true);
                    messageText.className = "message success";
                    messageText.innerText = "Great Job! 🎉";
                    setTimeout(() => loadRound(), 1600);
                } else {
                    highlightActiveHole();
                }
            } else {
                // wrong: red flash, allow retry on same hole
                playWrong();
                messageText.className = "message wrong";
                messageText.innerText = "Try again! You can do it! 💪";
                chosenBtn.style.backgroundColor = '#ffcdd2';
                chosenBtn.style.borderColor = '#f44336';
                setTimeout(() => {
                    chosenBtn.style.backgroundColor = '#fff';
                    chosenBtn.style.borderColor = '#ffb74d';
                }, 400);
            }
        }

        // Initialize the first level of the game
        loadRound();
    </script>
</body>
</html>

            score += aiSpan * (level >= 5 ? 4 : 3);
          }
          if (level >= 4) {
            const oppSpan = maxLinePotential(item.x, item.y, oppIndex);
            score += oppSpan * (level >= 5 ? 4 : 3);
          }

          if (level === 5) {
            // Level 5: Advanced evaluation
            const aiScore = evaluatePosition(item.x, item.y, aiIndex);
            const oppScore = evaluatePosition(item.x, item.y, oppIndex);
            score += aiScore * 3 + oppScore * 4; // Block opponent more aggressively
          }

          scored.push({ ...item, score });
        }

        scored.sort((a, b) => b.score - a.score);
        const bestScore = scored.length ? scored[0].score : 0;
        const top = scored.filter((s) => s.score === bestScore);
        if (top.length) {
          return top[Math.floor(Math.random() * top.length)];
        }

        return {
          x: history[history.length - 1].x,
          y: history[history.length - 1].y,
        };
      }

      function maybeTriggerAI() {
        if (net.enabled) return;
        if (!state.aiEnabled) return;
        if (state.gameOver) return;
        if (state.current !== state.aiIndex) return;
        if (!menuOverlay.classList.contains("hidden")) return;
        if (!resultOverlay.classList.contains("hidden")) return;
        if (aiPending) return;
        aiPending = true;
        setTimeout(() => {
          aiPending = false;
          const move = getAIMove();
          placeMove(move);
        }, 320);
      }

      function spawnConfetti() {
        const colors = ["#2b7fff", "#ff6b6b", "#2ec4b6", "#ffb703", "#8f6bff"];
        confetti = [];
        const originX = viewW / 2;
        const originY = viewH / 2;
        for (let i = 0; i < 140; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 120 + Math.random() * 240;
          confetti.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 220,
            life: 1.4 + Math.random() * 1.2,
            maxLife: 2.6,
            size: 4 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
          });
        }
        requestRender();
      }

      function fitToStones(animate = false) {
        if (state.moves.length === 0) {
          camera.x = 0;
          camera.y = 0;
          camera.zoom = clampZoom(viewH / (CELL * 10));
          requestRender();
          return;
        }

        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const move of state.moves.slice(0, state.historyIndex + 1)) {
          minX = Math.min(minX, move.x * CELL);
          maxX = Math.max(maxX, move.x * CELL);
          minY = Math.min(minY, move.y * CELL);
          maxY = Math.max(maxY, move.y * CELL);
        }

        const paddingX = CELL * 1.9;
        const paddingY = CELL * 2.4;
        minX -= paddingX;
        maxX += paddingX;
        minY -= paddingY;
        maxY += paddingY;

        const targetZoom = clampZoom(
          Math.min(viewW / (maxX - minX), viewH / (maxY - minY)) * 0.9,
        );
        const target = {
          x: (minX + maxX) / 2,
          y: (minY + maxY) / 2,
          zoom: targetZoom,
        };

        const deltaPos = Math.hypot(target.x - camera.x, target.y - camera.y);
        const deltaZoom = Math.abs(target.zoom - camera.zoom);
        const shouldTween = animate && (deltaPos > 0.5 || deltaZoom > 0.004);

        if (shouldTween) {
          cameraTween = {
            start: performance.now(),
            duration: 520,
            from: { x: camera.x, y: camera.y, zoom: camera.zoom },
            to: target,
          };
          requestRender();
        } else {
          camera.x = target.x;
          camera.y = target.y;
          camera.zoom = target.zoom;
          requestRender();
        }
      }

      function handlePointerDown(e) {
        canvas.setPointerCapture(e.pointerId);
        const pt = getCanvasPoint(e.clientX, e.clientY);
        pointers.set(e.pointerId, { x: pt.x, y: pt.y });

        if (pointers.size === 1) {
          tapCandidate = { x: pt.x, y: pt.y, time: performance.now() };
          if (ALLOW_PAN) {
            isDragging = true;
            lastPan = { x: pt.x, y: pt.y };
          }
        } else if (pointers.size === 2 && ALLOW_ZOOM) {
          const pts = Array.from(pointers.values());
          const dx = pts[0].x - pts[1].x;
          const dy = pts[0].y - pts[1].y;
          pinchStart = {
            dist: Math.hypot(dx, dy),
            zoom: camera.zoom,
            center: {
              x: (pts[0].x + pts[1].x) / 2,
              y: (pts[0].y + pts[1].y) / 2,
            },
          };
          tapCandidate = null;
        }
      }

      function handlePointerMove(e) {
        if (!pointers.has(e.pointerId)) return;
        const pt = getCanvasPoint(e.clientX, e.clientY);
        pointers.set(e.pointerId, { x: pt.x, y: pt.y });

        if (ALLOW_ZOOM && pointers.size === 2 && pinchStart) {
          const pts = Array.from(pointers.values());
          const dx = pts[0].x - pts[1].x;
          const dy = pts[0].y - pts[1].y;
          const newDist = Math.hypot(dx, dy);
          const scale = newDist / pinchStart.dist;
          const nextZoom = clampZoom(pinchStart.zoom * scale);

          const before = screenToWorld(
            pinchStart.center.x,
            pinchStart.center.y,
          );
          camera.zoom = nextZoom;
          userAdjustedCamera = true;
          const after = screenToWorld(pinchStart.center.x, pinchStart.center.y);
          camera.x += before.x - after.x;
          camera.y += before.y - after.y;
          requestRender();
          return;
        }

        if (ALLOW_PAN && isDragging && pointers.size === 1) {
          const dx = pt.x - lastPan.x;
          const dy = pt.y - lastPan.y;
          if (tapCandidate && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
            tapCandidate.moved = true;
          }
          camera.x -= dx / camera.zoom;
          camera.y -= dy / camera.zoom;
          userAdjustedCamera = true;
          lastPan = { x: pt.x, y: pt.y };
          requestRender();
        }

        if (e.pointerType === "mouse") {
          const world = screenToWorld(pt.x, pt.y);
          hoverCell = worldToCell(world.x, world.y);
          requestRender();
        }
      }

      function handlePointerUp(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchStart = null;

        if (tapCandidate && !tapCandidate.moved && !state.gameOver) {
          const pt = getCanvasPoint(e.clientX, e.clientY);
          const world = screenToWorld(pt.x, pt.y);
          const cell = worldToCell(world.x, world.y);
          placeMove(cell);
        }

        if (pointers.size === 0) {
          isDragging = false;
          tapCandidate = null;
        }
      }

      canvas.addEventListener("pointerdown", handlePointerDown);
      canvas.addEventListener("pointermove", handlePointerMove);
      canvas.addEventListener("pointerup", handlePointerUp);
      canvas.addEventListener("pointercancel", handlePointerUp);

      canvas.addEventListener(
        "wheel",
        (e) => {
          if (!ALLOW_ZOOM) return;
          e.preventDefault();
          const pt = getCanvasPoint(e.clientX, e.clientY);
          const zoomAmount = -e.deltaY * 0.0015;
          const nextZoom = clampZoom(camera.zoom * (1 + zoomAmount));
          const before = screenToWorld(pt.x, pt.y);
          camera.zoom = nextZoom;
          userAdjustedCamera = true;
          const after = screenToWorld(pt.x, pt.y);
          camera.x += before.x - after.x;
          camera.y += before.y - after.y;
          requestRender();
        },
        { passive: false },
      );

        teamRow.style.display = count === 4 ? "inline-flex" : "none";

        aiRow.style.display = count === 2 ? "inline-flex" : "none";
        if (count !== 2) aiToggle.checked = false;

          <div class="player-head">

      function resolveColorConflicts() {
        const configs = Array.from(
          playerSettings.querySelectorAll(".player-config"),
        );
        const chosen = configs.map((cfg, idx) => {
          if (!cfg.dataset.color) {
            cfg.dataset.color = colorOptions[idx % colorOptions.length].value;
          }
          return cfg.dataset.color;
        });

        configs.forEach((cfg) => {
          const colorRow = cfg.querySelector(".color-options");
          colorRow.innerHTML = "";
          colorOptions.forEach((option) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "color-btn";
            btn.style.background = option.value;
            const usedByOther =
              chosen.includes(option.value) &&
              cfg.dataset.color !== option.value;
            if (usedByOther) btn.classList.add("disabled");
            if (cfg.dataset.color === option.value)
              btn.classList.add("selected");
            btn.addEventListener("click", () => {
              if (usedByOther) return;
              cfg.dataset.color = option.value;
              resolveColorConflicts();
              handleMenuChange();
            });
            colorRow.appendChild(btn);
          });
        });
        renderMarkButtons();
      }

      function renderMarkButtons() {
        const configs = Array.from(
          playerSettings.querySelectorAll(".player-config"),
        );
        const chosen = configs.map((cfg, idx) => {
          if (!cfg.dataset.mark) {
            cfg.dataset.mark = selectedEmoji
              ? emojiSet[idx % emojiSet.length]
              : shapeOptions[idx % shapeOptions.length].name;
          }
          return cfg.dataset.mark;
        });
        const ownerColor = new Map();
        configs.forEach((cfg) => {
          if (cfg.dataset.mark && cfg.dataset.color) {
            ownerColor.set(cfg.dataset.mark, cfg.dataset.color);
          }
        });

        configs.forEach((cfg) => {
          const pickRow = cfg.querySelector(".pick-row");
          if (!pickRow) return;
          pickRow.innerHTML = "";
          const options = selectedEmoji
            ? emojiSet
            : shapeOptions.map((shape) => shape.name);

          options.forEach((optionValue) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "pick-btn";
            const usedByOther =
              chosen.includes(optionValue) && cfg.dataset.mark !== optionValue;
            if (usedByOther) btn.classList.add("disabled");
            if (cfg.dataset.mark === optionValue) btn.classList.add("selected");

            if (selectedEmoji) {
              btn.innerHTML = `<span class="pick-icon"><span class="emoji">${optionValue}</span></span>`;
            } else {
              const shape = getShapeByName(optionValue);
              const stroke = usedByOther
                ? ownerColor.get(optionValue) ||
                  cfg.dataset.color ||
                  colorOptions[0].value
                : cfg.dataset.color || colorOptions[0].value;
              const svgMark =
                shape.kind === "circle"
                  ? `<circle cx="50" cy="50" r="${shape.r || 36}" fill="none" stroke="${stroke}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></circle>`
                  : `<path d="${shape.path}" fill="none" stroke="${stroke}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>`;
              btn.innerHTML = `<span class="pick-icon"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${svgMark}</svg></span>`;
            }

            btn.addEventListener("click", () => {
              if (usedByOther) return;
              cfg.dataset.mark = optionValue;
              renderMarkButtons();
              handleMenuChange();
            });
            pickRow.appendChild(btn);
          });
        });
      }

      function randomizeEmojiSet() {
        const pool = [...emojiPool];
        const next = [];
        while (next.length < 4 && pool.length > 0) {
          const idx = Math.floor(Math.random() * pool.length);
          next.push(pool.splice(idx, 1)[0]);
        }
        emojiSet = next.length === 4 ? next : ["😀", "😍", "😎", "🔥"];

        if (selectedEmoji) {
          const configs = Array.from(
            playerSettings.querySelectorAll(".player-config"),
          );
          configs.forEach((cfg, idx) => {
            cfg.dataset.mark = emojiSet[idx % emojiSet.length];
          });

        renderMarkButtons();

      function startGameFromMenu(fromLan = false) {
        let count = selectedPlayers;
        const mode = selectedMode;
        const lanMode = fromLan || net.enabled;

        if (lanMode) {
          count = 2;
          selectedPlayers = 2;
          aiToggle.checked = false;
          teamToggle.checked = false;
          setPlayerSelection(2);
        }

        const teamMode = !lanMode && teamToggle.checked && count === 4;
        const aiEnabled = !lanMode && aiToggle.checked && count === 2;

        const configs = Array.from(
          playerSettings.querySelectorAll(".player-config"),
        );
        const players = configs.slice(0, count).map((cfg, idx) => {
          const color =
            cfg.dataset.color || colorOptions[idx % colorOptions.length].value;
          const shapeName = selectedEmoji
            ? shapeOptions[idx % shapeOptions.length].name
            : cfg.dataset.mark || shapeOptions[idx % shapeOptions.length].name;
          return {
            name: `Player ${idx + 1}`,
            color,
            shapeName,
            emoji: selectedEmoji
              ? cfg.dataset.mark || emojiSet[idx % emojiSet.length]
              : emojiSet[idx % emojiSet.length],
          };
        });

        state.players = players;
        state.mode = mode;
        state.teamMode = teamMode;
        state.aiEnabled = aiEnabled;
        state.aiIndex = aiEnabled ? 1 : -1;
        state.aiLevel = aiLevel;
        state.emojiEnabled = selectedEmoji;

        clearBoard();
        updateHud();
        updateTurnQueue();
        updateUndoRedoButtons();
        fitToStones(false);
        menuOverlay.classList.add("hidden");
        resultOverlay.classList.add("hidden");
        maybeTriggerAI();
        saveState();
      }

      aiToggle.addEventListener("change", () => handleMenuChange());
      teamToggle.addEventListener("change", () => handleMenuChange());

      aiLevelBtn.addEventListener("click", () => {
        setAiLevel((aiLevel % 5) + 1);
        if (state.aiEnabled) {
          state.aiLevel = aiLevel;
        }
        saveState();
      });

      lanHostBtn.addEventListener("click", () => startLan("host"));
      lanJoinBtn.addEventListener("click", () => startLan("join"));
      lanTestBtn.addEventListener("click", () => testLan());
      lanReadyBtn.addEventListener("click", () => {
        if (!net.connected) return;
        net.readyLocal = !net.readyLocal;
        sendNet({
          type: "ready",
          ready: net.readyLocal,
          menu: buildMenuConfigFromUI(),
        });
        updateLobbyIndicators();
      });
      lanCopyBtn.addEventListener("click", async () => {
        const link = buildInviteLink();
        if (!link) return;
        try {
          await navigator.clipboard.writeText(link);
          setLanStatus("ok", "Invite copied");
          setTimeout(() => setLanStatus("idle", "Idle"), 1500);
        } catch (err) {
          setLanStatus("error", "Copy failed");
        }
      });

      function initDefaultPlayers() {
        state.players = [
          {
            name: "Player 1",
            color: colorOptions[0].value,
            shapePath: shapeOptions[0].path,
            emoji: emojiSet[0],
          },
          {
            name: "Player 2",
            color: colorOptions[1].value,
            shapePath: shapeOptions[1].path,
            emoji: emojiSet[1],
          },
        ];
      }

      initDefaultPlayers();
      setAiLevel(aiLevel);
      loadState();
      updateHud();
      updateTurnQueue();
      updateUndoRedoButtons();
      requestRender();
    </script>
  </body>
</html>

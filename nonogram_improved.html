<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram</title>
    <style>
        :root {
            --cell-size: 40px;
            --font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
            --background-color: #f3f3f3;
            --control-background-color: #ffffff;
            --control-border-color: #d1d1d1;
            --control-border-radius: 8px;
            --accent-color: #0078d4;
            --text-color: #1a1a1a;
            --input-padding: 12px;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body { 
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            text-align: center; 
        }
        .screen { 
            display: none; 
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active { 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-area-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #game-container, #editor-container, #solver-board-container {
            transform-origin: center center;
            transition: transform 0.3s ease-in-out;
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            border: 2px solid black;
            margin: 0;
        }

        .corner {
            grid-column: 1;
            grid-row: 1;
        }

        #game-board, #editor-board, #solver-board { 
            grid-column: 2;
            grid-row: 2;
            display: grid; 
        }

        .cell { 
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #ccc; 
            box-sizing: border-box; 
        }
        .cell.filled { background-color: black; }
        .cell.crossed::after { 
            content: 'X'; 
            color: red; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            font-weight: bold;
        }

        .row-clues, .row-clues-editor {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-right: 2px solid black;
            max-width: 150px;
            overflow-x: auto;
        }

        .row-clues > div, .row-clues-editor > div {
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 10px;
            border-top: 1px solid #ccc;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }
        .row-clues > div:first-child, .row-clues-editor > div:first-child {
             border-top: none;
        }

        .col-clues, .col-clues-editor {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid black;
            align-items: flex-end;
        }

        .clue-group {
            width: var(--cell-size);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 0;
            border-left: 1px solid #ccc;
            font-size: 20px;
            font-weight: bold;
        }
        .clue-group:first-child {
            border-left: none;
        }
        .clue-group > div {
             line-height: 1.1;
             text-align: center;
        }
        
        div[contenteditable="true"] {
            background-color: #f0f0f0;
            padding: 2px;
        }

        h1, h2, h3 {
            color: var(--text-color);
        }

        hr {
            border: none;
            border-top: 1px solid var(--control-border-color);
            margin: 20px 0;
        }

        label {
            margin: 0 10px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--control-border-radius);
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #005a9e;
        }

        input[type="number"] {
            border: 1px solid var(--control-border-color);
            border-radius: var(--control-border-radius);
            padding: var(--input-padding);
            font-size: 16px;
            margin: 5px;
            width: 80px;
        }

        .no-transition {
            transition: none !important;
        }

        /* Solver specific styles */
        #solver-input-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            min-height: 0;
            padding: 20px 0;
        }

        #solver-input-container {
            transform-origin: center center;
            transition: transform 0.3s ease-in-out;
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            border: 2px solid black;
        }

        .solver-col-clues {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid black;
            align-items: flex-end;
        }

        .solver-row-clues {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            border-right: 2px solid black;
            max-width: 200px;
            overflow-x: auto;
        }

        .solver-clue-col {
            width: var(--cell-size);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 0;
            border-left: 1px solid #ccc;
        }
        .solver-clue-col:first-child {
            border-left: none;
        }

        .solver-clue-row {
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 10px;
            border-top: 1px solid #ccc;
        }
        .solver-clue-row:first-child {
            border-top: none;
        }

        .solver-clue-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            text-align: center;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: text;
            user-select: none;
            outline: none;
        }

        .solver-clue-cell:hover {
            background: #f0f0f0;
        }

        .solver-clue-cell:focus {
            background: #e3f2fd;
            outline: 2px solid var(--accent-color);
        }

        #solver-preview-grid {
            grid-column: 2;
            grid-row: 2;
            display: grid;
        }

        .preview-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }
        
        .preview-cell.filled {
            background-color: black;
        }

        #solve-status {
            margin: 15px auto;
            padding: 12px 20px;
            max-width: 600px;
            border-radius: var(--control-border-radius);
            font-weight: 600;
            display: none;
        }

        #solve-status.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        #solve-status.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }

        #solve-status.solving {
            background-color: #d1ecf1;
            color: #0c5460;
            display: block;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <h1>Nonogram</h1>
        <div id="new-game-options">
            <h3>New Game</h3>
            <label for="puzzle-width-input">Width:</label>
            <input type="number" id="puzzle-width-input" min="4" max="20" value="5">
            <label for="puzzle-height-input">Height:</label>
            <input type="number" id="puzzle-height-input" min="4" max="20" value="5">
            <button id="start-new-game-btn">Start New Game</button>
        </div>
        <hr>
        <h3>Create, Load, or Solve</h3>
        <button id="create-puzzle-btn">Create Puzzle</button>
        <button id="solver-btn">Solver</button>
        <label for="load-puzzle-input">Load Puzzle:</label>
        <input type="file" id="load-puzzle-input" accept=".nonogram">
    </div>

    <div id="game-screen" class="screen">
        <h2>Nonogram Puzzle</h2>
        <div class="game-area-wrapper">
            <div id="game-container">
                <div class="corner"></div>
                <div class="col-clues"></div>
                <div class="row-clues"></div>
                <div id="game-board"></div>
            </div>
        </div>
        <button id="back-to-start-btn-game">Back to Start</button>
    </div>

    <div id="editor-screen" class="screen">
        <h2>Puzzle Editor</h2>
        <div>
            <label for="board-width">Width (4-20):</label>
            <input type="number" id="board-width" min="4" max="20" value="5">
            <label for="board-height">Height (4-20):</label>
            <input type="number" id="board-height" min="4" max="20" value="5">
            <button id="create-grid-btn">Create Grid</button>
        </div>
        <div class="game-area-wrapper">
            <div id="editor-container">
                <div class="corner"></div>
                <div class="col-clues-editor"></div>
                <div class="row-clues-editor"></div>
                <div id="editor-board"></div>
            </div>
        </div>
        <div class="button-group">
            <button id="save-puzzle-btn">Save Puzzle</button>
            <button id="test-puzzle-btn">Test Puzzle</button>
            <button id="validate-puzzle-btn">Validate Puzzle</button>
            <button id="back-to-start-btn-editor">Back to Start</button>
        </div>
    </div>

    <div id="solver-screen" class="screen">
        <h2>Nonogram Solver</h2>
        <div>
            <label for="solver-width">Width:</label>
            <input type="number" id="solver-width" min="3" max="20" value="5">
            <label for="solver-height">Height:</label>
            <input type="number" id="solver-height" min="3" max="20" value="5">
            <button id="create-solver-grid-btn">Create Grid</button>
        </div>
        
        <div id="solver-input-wrapper">
            <div id="solver-input-container">
                <div class="corner"></div>
                <div class="solver-col-clues"></div>
                <div class="solver-row-clues"></div>
                <div id="solver-preview-grid"></div>
            </div>
        </div>

        <div id="solve-status"></div>

        <div class="button-group">
            <button id="solve-puzzle-btn">Solve Puzzle</button>
            <button id="clear-solver-btn">Clear Clues</button>
            <button id="back-to-start-btn-solver">Back to Start</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const editorScreen = document.getElementById('editor-screen');
        const solverScreen = document.getElementById('solver-screen');

        const createPuzzleBtn = document.getElementById('create-puzzle-btn');
        const loadPuzzleInput = document.getElementById('load-puzzle-input');
        
        const startNewGameBtn = document.getElementById('start-new-game-btn');
        const puzzleWidthInput = document.getElementById('puzzle-width-input');
        const puzzleHeightInput = document.getElementById('puzzle-height-input');

        const backToStartBtnGame = document.getElementById('back-to-start-btn-game');
        const backToStartBtnEditor = document.getElementById('back-to-start-btn-editor');
        const backToStartBtnSolver = document.getElementById('back-to-start-btn-solver');

        const createGridBtn = document.getElementById('create-grid-btn');
        const boardWidthInput = document.getElementById('board-width');
        const boardHeightInput = document.getElementById('board-height');
        const editorBoard = document.getElementById('editor-board');
        const rowCluesEditor = document.querySelector('.row-clues-editor');
        const colCluesEditor = document.querySelector('.col-clues-editor');
        const savePuzzleBtn = document.getElementById('save-puzzle-btn');
        const testPuzzleBtn = document.getElementById('test-puzzle-btn');
        const validatePuzzleBtn = document.getElementById('validate-puzzle-btn');

        const gameBoard = document.getElementById('game-board');
        const rowCluesGame = document.querySelector('.row-clues');
        const colCluesGame = document.querySelector('.col-clues');

        // Solver Elements
        const solverBtn = document.getElementById('solver-btn');
        const solverWidthInput = document.getElementById('solver-width');
        const solverHeightInput = document.getElementById('solver-height');
        const createSolverGridBtn = document.getElementById('create-solver-grid-btn');
        const solverInputContainer = document.getElementById('solver-input-container');
        const solverPreviewGrid = document.getElementById('solver-preview-grid');
        const solverColClues = document.querySelector('.solver-col-clues');
        const solverRowClues = document.querySelector('.solver-row-clues');
        const solvePuzzleBtn = document.getElementById('solve-puzzle-btn');
        const clearSolverBtn = document.getElementById('clear-solver-btn');
        const solveStatus = document.getElementById('solve-status');

        let editorSolution = [];
        let editorManualClues = { rowClues: [], colClues: [] };
        let gameSolution = [];
        let currentPuzzle = {};
        let isDragging = false;
        let dragAction = null;
        let isEditorDragging = false;
        let editorDragMode = null;

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                dragAction = null;
                checkWin();
            }
            if (isEditorDragging) {
                isEditorDragging = false;
                editorDragMode = null;
                if(editorSolution.length > 0) {
                    const width = editorSolution[0].length;
                    const height = editorSolution.length;
                    updateEditorClues(width, height);
                }
            }
        });

        // Navigation
        function showScreen(screen) {
            startScreen.classList.remove('active');
            gameScreen.classList.remove('active');
            editorScreen.classList.remove('active');
            solverScreen.classList.remove('active');
            screen.classList.add('active');
        }

        solverBtn.addEventListener('click', () => {
            showScreen(solverScreen);
            createSolverGrid();
        });
        backToStartBtnSolver.addEventListener('click', () => showScreen(startScreen));

        startNewGameBtn.addEventListener('click', () => {
            const width = parseInt(puzzleWidthInput.value);
            const height = parseInt(puzzleHeightInput.value);
            
            if (width >= 4 && width <= 20 && height >= 4 && height <= 20) {
                const solution = Array.from({ length: height }, () => 
                    Array.from({ length: width }, () => Math.round(Math.random()))
                );
                const clues = calculateClues(solution, width, height);
                const puzzle = {
                    name: "Random Puzzle",
                    width: width,
                    height: height,
                    solution: solution,
                    clues: clues
                };
                startGame(puzzle);
            } else {
                alert('Board width and height must be between 4 and 20.');
            }
        });

        createPuzzleBtn.addEventListener('click', () => showScreen(editorScreen));
        loadPuzzleInput.addEventListener('change', loadPuzzle);
        backToStartBtnGame.addEventListener('click', () => showScreen(startScreen));
        backToStartBtnEditor.addEventListener('click', () => showScreen(startScreen));

        // Solver Grid Creation
        function createSolverGrid() {
            const width = parseInt(solverWidthInput.value);
            const height = parseInt(solverHeightInput.value);

            if (width < 3 || height < 3 || width > 20 || height > 20) {
                alert('Dimensions must be between 3 and 20');
                return;
            }

            solverInputContainer.classList.add('no-transition');
            solverInputContainer.style.transform = 'scale(0)';

            setTimeout(() => {
                solverInputContainer.dataset.puzzleWidth = width;
                solverInputContainer.dataset.puzzleHeight = height;

                // Clear existing
                solverColClues.innerHTML = '';
                solverRowClues.innerHTML = '';
                solverPreviewGrid.innerHTML = '';
                solverPreviewGrid.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;

                // Create column clue cells (max 5 clues per column)
                for (let c = 0; c < width; c++) {
                    const colDiv = document.createElement('div');
                    colDiv.className = 'solver-clue-col';
                    for (let i = 0; i < 5; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'solver-clue-cell';
                        cell.contentEditable = true;
                        cell.textContent = '';
                        cell.dataset.col = c;
                        cell.dataset.idx = i;
                        cell.dataset.type = 'col';
                        
                        cell.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                cell.blur();
                            }
                            // Only allow numbers and navigation keys
                            if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
                                e.preventDefault();
                            }
                        });
                        
                        cell.addEventListener('input', () => {
                            // Remove any non-digit characters
                            cell.textContent = cell.textContent.replace(/\D/g, '');
                        });
                        
                        cell.addEventListener('focus', () => {
                            // Select all text on focus for easy replacement
                            const range = document.createRange();
                            range.selectNodeContents(cell);
                            const sel = window.getSelection();
                            sel.removeAllRanges();
                            sel.addRange(range);
                        });
                        
                        colDiv.appendChild(cell);
                    }
                    solverColClues.appendChild(colDiv);
                }

                // Create row clue cells (max 5 clues per row)
                for (let r = 0; r < height; r++) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'solver-clue-row';
                    for (let i = 0; i < 5; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'solver-clue-cell';
                        cell.contentEditable = true;
                        cell.textContent = '';
                        cell.dataset.row = r;
                        cell.dataset.idx = i;
                        cell.dataset.type = 'row';
                        
                        cell.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                cell.blur();
                            }
                            if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
                                e.preventDefault();
                            }
                        });
                        
                        cell.addEventListener('input', () => {
                            cell.textContent = cell.textContent.replace(/\D/g, '');
                        });
                        
                        cell.addEventListener('focus', () => {
                            const range = document.createRange();
                            range.selectNodeContents(cell);
                            const sel = window.getSelection();
                            sel.removeAllRanges();
                            sel.addRange(range);
                        });
                        
                        rowDiv.appendChild(cell);
                    }
                    solverRowClues.appendChild(rowDiv);
                }

                // Create preview grid
                for (let r = 0; r < height; r++) {
                    for (let c = 0; c < width; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'preview-cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        solverPreviewGrid.appendChild(cell);
                    }
                }

                solveStatus.style.display = 'none';

                solverInputContainer.offsetHeight;
                solverInputContainer.classList.remove('no-transition');
                scaleBoard('solver-input-container');
            }, 100);
        }

        createSolverGridBtn.addEventListener('click', createSolverGrid);
        
        clearSolverBtn.addEventListener('click', () => {
            const cells = document.querySelectorAll('.solver-clue-cell');
            cells.forEach(cell => cell.textContent = '');
            const previewCells = document.querySelectorAll('.preview-cell');
            previewCells.forEach(cell => cell.classList.remove('filled'));
            solveStatus.style.display = 'none';
        });

        // Parse clues from solver inputs
        function parseSolverClues() {
            const width = parseInt(solverWidthInput.value);
            const height = parseInt(solverHeightInput.value);
            
            const rowClues = Array.from({ length: height }, () => []);
            const colClues = Array.from({ length: width }, () => []);

            // Parse row clues
            const rowDivs = solverRowClues.querySelectorAll('.solver-clue-row');
            rowDivs.forEach((rowDiv, r) => {
                const cells = rowDiv.querySelectorAll('.solver-clue-cell');
                cells.forEach(cell => {
                    const val = parseInt(cell.textContent);
                    if (!isNaN(val) && val > 0) {
                        rowClues[r].push(val);
                    }
                });
                if (rowClues[r].length === 0) rowClues[r] = [0];
            });

            // Parse column clues
            const colDivs = solverColClues.querySelectorAll('.solver-clue-col');
            colDivs.forEach((colDiv, c) => {
                const cells = colDiv.querySelectorAll('.solver-clue-cell');
                cells.forEach(cell => {
                    const val = parseInt(cell.textContent);
                    if (!isNaN(val) && val > 0) {
                        colClues[c].push(val);
                    }
                });
                if (colClues[c].length === 0) colClues[c] = [0];
            });

            return { rowClues, colClues, width, height };
        }

        // Advanced Nonogram Solver
        function solveNonogram(rowClues, colClues, width, height) {
            let grid = Array.from({ length: height }, () => Array(width).fill(0));
            
            function generateLinePossibilities(clues, length) {
                const possibilities = [];
                
                function backtrack(clueIdx, pos, current) {
                    if (clueIdx === clues.length) {
                        possibilities.push([...current]);
                        return;
                    }
                    
                    const clue = clues[clueIdx];
                    const remainingClues = clues.slice(clueIdx + 1);
                    const minSpaceNeeded = remainingClues.reduce((a, b) => a + b, 0) + remainingClues.length;
                    const maxStart = length - clue - minSpaceNeeded;
                    
                    for (let start = pos; start <= maxStart; start++) {
                        const newCurrent = [...current];
                        for (let i = start; i < start + clue; i++) {
                            newCurrent[i] = 1;
                        }
                        backtrack(clueIdx + 1, start + clue + 1, newCurrent);
                    }
                }
                
                if (clues.length === 1 && clues[0] === 0) {
                    return [Array(length).fill(-1)];
                }
                
                backtrack(0, 0, Array(length).fill(-1));
                return possibilities;
            }
            
            function filterPossibilities(possibilities, knownLine) {
                return possibilities.filter(poss => {
                    for (let i = 0; i < knownLine.length; i++) {
                        if (knownLine[i] !== 0 && knownLine[i] !== poss[i]) {
                            return false;
                        }
                    }
                    return true;
                });
            }
            
            function solveLine(line, clues) {
                let possibilities = generateLinePossibilities(clues, line.length);
                possibilities = filterPossibilities(possibilities, line);
                
                if (possibilities.length === 0) return null;
                
                const newLine = [...line];
                for (let i = 0; i < line.length; i++) {
                    if (line[i] === 0) {
                        const allFilled = possibilities.every(p => p[i] === 1);
                        const allEmpty = possibilities.every(p => p[i] === -1);
                        
                        if (allFilled) newLine[i] = 1;
                        else if (allEmpty) newLine[i] = -1;
                    }
                }
                
                return newLine;
            }
            
            let changed = true;
            let iterations = 0;
            const maxIterations = 100;
            
            while (changed && iterations < maxIterations) {
                changed = false;
                iterations++;
                
                for (let r = 0; r < height; r++) {
                    const result = solveLine(grid[r], rowClues[r]);
                    if (result === null) return null;
                    
                    for (let c = 0; c < width; c++) {
                        if (grid[r][c] === 0 && result[c] !== 0) {
                            grid[r][c] = result[c];
                            changed = true;
                        }
                    }
                }
                
                for (let c = 0; c < width; c++) {
                    const col = grid.map(row => row[c]);
                    const result = solveLine(col, colClues[c]);
                    if (result === null) return null;
                    
                    for (let r = 0; r < height; r++) {
                        if (grid[r][c] === 0 && result[r] !== 0) {
                            grid[r][c] = result[r];
                            changed = true;
                        }
                    }
                }
            }
            
            return grid.map(row => row.map(cell => cell === 1 ? 1 : 0));
        }

        // Solve button handler
        solvePuzzleBtn.addEventListener('click', () => {
            solveStatus.className = '';
            solveStatus.textContent = 'Solving puzzle...';
            solveStatus.classList.add('solving');
            
            setTimeout(() => {
                try {
                    const { rowClues, colClues, width, height } = parseSolverClues();
                    
                    const solution = solveNonogram(rowClues, colClues, width, height);
                    
                    if (solution === null) {
                        solveStatus.className = '';
                        solveStatus.textContent = 'No solution found! The puzzle may be invalid.';
                        solveStatus.classList.add('error');
                        return;
                    }
                    
                    displaySolutionInGrid(solution, width, height);
                    
                    solveStatus.className = '';
                    solveStatus.textContent = '✓ Puzzle solved successfully!';
                    solveStatus.classList.add('success');
                } catch (error) {
                    solveStatus.className = '';
                    solveStatus.textContent = 'Error: ' + error.message;
                    solveStatus.classList.add('error');
                }
            }, 100);
        });

        function displaySolutionInGrid(grid, width, height) {
            const previewCells = solverPreviewGrid.querySelectorAll('.preview-cell');
            
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    const idx = r * width + c;
                    const cell = previewCells[idx];
                    if (grid[r][c] === 1) {
                        cell.classList.add('filled');
                    } else {
                        cell.classList.remove('filled');
                    }
                }
            }
        }

        function displaySolvedGrid(grid, clues, width, height) {
            // This function is no longer needed - we display in the same grid
        }

        // Editor
        createGridBtn.addEventListener('click', () => {
            const width = parseInt(boardWidthInput.value);
            const height = parseInt(boardHeightInput.value);
            if (width >= 4 && width <= 20 && height >= 4 && height <= 20) {
                createEditorGrid(width, height);
            } else {
                alert('Board width and height must be between 4 and 20.');
            }
        });

        function applyEditorAction(cell, mode) {
            if (!cell.classList.contains('cell')) return;
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            if (isNaN(r) || isNaN(c)) return;

            const isFilled = editorSolution[r][c] === 1;

            if (mode === 'fill' && !isFilled) {
                editorSolution[r][c] = 1;
                cell.classList.add('filled');
            } else if (mode === 'erase' && isFilled) {
                editorSolution[r][c] = 0;
                cell.classList.remove('filled');
            }
        }

        function createEditorGrid(width, height) {
            const editorContainer = document.getElementById('editor-container');
            
            editorContainer.classList.add('no-transition');
            editorContainer.style.transform = 'scale(0)';

            setTimeout(() => {
                editorSolution = Array.from({ length: height }, () => Array(width).fill(0));
                editorBoard.innerHTML = '';
                editorBoard.addEventListener('contextmenu', e => e.preventDefault());
                editorContainer.dataset.puzzleWidth = width;
                editorContainer.dataset.puzzleHeight = height;
                editorBoard.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;
    
                for (let r = 0; r < height; r++) {
                    for (let c = 0; c < width; c++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            isEditorDragging = true;
                            editorDragMode = cell.classList.contains('filled') ? 'erase' : 'fill';
                            applyEditorAction(cell, editorDragMode);
                        });
                        cell.addEventListener('mouseover', () => {
                            if (isEditorDragging) {
                                applyEditorAction(cell, editorDragMode);
                            }
                        });
                        editorBoard.appendChild(cell);
                    }
                }
                updateEditorClues(width, height);

                editorContainer.offsetHeight; 
                editorContainer.classList.remove('no-transition');
                scaleBoard('editor-container');
            }, 100);
        }

        function updateEditorClues(width, height) {
            const clues = calculateClues(editorSolution, width, height);
            editorManualClues = clues;
            displayClues(clues.rowClues, clues.colClues, rowCluesEditor, colCluesEditor, width, height, true);
        }
        
        savePuzzleBtn.addEventListener('click', savePuzzle);
        testPuzzleBtn.addEventListener('click', () => {
            const height = editorSolution.length;
            if (height > 0) {
                const width = editorSolution[0].length;
                const puzzle = {
                    name: "Custom Puzzle",
                    width: width,
                    height: height,
                    solution: editorSolution,
                    clues: editorManualClues
                };
                startGame(puzzle);
            }
        });
        
        validatePuzzleBtn.addEventListener('click', validatePuzzle);

        function validatePuzzle() {
            if (editorSolution.length === 0) {
                alert("Create a grid first!");
                return;
            }
            const height = editorSolution.length;
            const width = editorSolution[0].length;

            const calculatedClues = calculateClues(editorSolution, width, height);
            
            const isValid = JSON.stringify(calculatedClues.rowClues) === JSON.stringify(editorManualClues.rowClues) &&
                            JSON.stringify(calculatedClues.colClues) === JSON.stringify(editorManualClues.colClues);
            
            if (isValid) {
                alert('Validation Successful: The drawing matches the clues.');
            } else {
                alert('Validation Failed: The drawing does not match the clues.');
            }
        }

        // Game
        function applyToggleAction(cell, action) {
            if (!cell.classList.contains('cell')) return;
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            if (isNaN(r) || isNaN(c)) return;

            if (action === 'toggleFill') {
                if (cell.classList.contains('crossed')) return;
                const isFilled = cell.classList.toggle('filled');
                gameSolution[r][c] = isFilled ? 1 : 0;
            } else if (action === 'toggleCross') {
                if (cell.classList.contains('filled')) return;
                cell.classList.toggle('crossed');
                gameSolution[r][c] = 0;
            }
        }

        function startGame(puzzle) {
            currentPuzzle = puzzle;
            const width = puzzle.width || puzzle.size;
            const height = puzzle.height || puzzle.size;
            const gameContainer = document.getElementById('game-container');

            gameContainer.classList.add('no-transition');
            gameContainer.style.transform = 'scale(0)';
            
            setTimeout(() => {
                gameSolution = Array.from({ length: height }, () => Array(width).fill(0));
                
                gameBoard.innerHTML = '';
                gameBoard.addEventListener('contextmenu', e => e.preventDefault());
                gameContainer.dataset.puzzleWidth = width;
                gameContainer.dataset.puzzleHeight = height;

                gameBoard.style.gridTemplateColumns = `repeat(${width}, var(--cell-size))`;
    
                for (let r = 0; r < height; r++) {
                    for (let c = 0; c < width; c++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.row = r;
                        cell.dataset.col = c;
    
                        cell.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            isDragging = true;
                            if (e.button === 0) {
                                dragAction = 'toggleFill';
                            } else if (e.button === 2) {
                                dragAction = 'toggleCross';
                            }
                            applyToggleAction(cell, dragAction);
                        });

                        cell.addEventListener('mouseover', () => {
                            if (isDragging) {
                                applyToggleAction(cell, dragAction);
                            }
                        });
                        gameBoard.appendChild(cell);
                    }
                }
                
                displayClues(puzzle.clues.rowClues, puzzle.clues.colClues, rowCluesGame, colCluesGame, width, height, false);
                showScreen(gameScreen);

                gameContainer.offsetHeight;
                gameContainer.classList.remove('no-transition');
                scaleBoard('game-container');
            }, 100);
        }
        
        function checkWin() {
            const solution = currentPuzzle.solution;
            if (!solution) return;
            let isWin = true;
            const height = solution.length;
            const width = solution[0].length;
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (solution[r][c] !== gameSolution[r][c]) {
                        isWin = false;
                        break;
                    }
                }
                if (!isWin) break;
            }

            if (isWin) {
                setTimeout(() => {
                    alert('You Win!');
                    showScreen(startScreen);
                }, 100);
            }
        }

        // Common Logic
        function calculateClues(grid, width, height) {
            const rowClues = [];
            const colClues = [];

            for (let r = 0; r < height; r++) {
                rowClues.push(getCluesForLine(grid[r]));
            }

            for (let c = 0; c < width; c++) {
                const col = grid.map(row => row[c]);
                colClues.push(getCluesForLine(col));
            }
            return { rowClues, colClues };
        }

        function getCluesForLine(line) {
            const clues = [];
            let count = 0;
            for (const cell of line) {
                if (cell === 1) {
                    count++;
                } else if (count > 0) {
                    clues.push(count);
                    count = 0;
                }
            }
            if (count > 0) {
                clues.push(count);
            }
            return clues.length > 0 ? clues : [0];
        }

        function displayClues(rowClues, colClues, rowEl, colEl, width, height, isEditable) {
            rowEl.innerHTML = '';
            colEl.innerHTML = '';

            for (let i = 0; i < height; i++) {
                const rClue = document.createElement('div');
                rClue.textContent = rowClues[i].join(' ') || '0';
                if (isEditable) {
                    rClue.contentEditable = true;
                    rClue.addEventListener('blur', (e) => {
                        editorManualClues.rowClues[i] = e.target.textContent.split(' ').map(s => parseInt(s, 10) || 0);
                    });
                }
                rowEl.appendChild(rClue);
            }

            for (let i = 0; i < width; i++) {
                const cClue = document.createElement('div');
                cClue.classList.add('clue-group');
                if (isEditable) {
                    const cClueInner = document.createElement('div');
                    cClueInner.textContent = colClues[i].join('\n') || '0';
                    cClueInner.contentEditable = true;
                    cClueInner.style.whiteSpace = "pre";
                    cClueInner.addEventListener('blur', (e) => {
                        editorManualClues.colClues[i] = e.target.textContent.split('\n').map(s => parseInt(s, 10) || 0);
                    });
                    cClue.appendChild(cClueInner);
                } else {
                    const cClueInner = document.createElement('div');
                    cClueInner.textContent = colClues[i].join('\n');
                    cClueInner.style.whiteSpace = "pre";
                    cClue.appendChild(cClueInner);
                }
                colEl.appendChild(cClue);
            }
        }
        
        function savePuzzle() {
            const height = editorSolution.length;
            if (height === 0) {
                alert("Create a grid first!");
                return;
            }
            const width = editorSolution[0].length;
            const puzzle = {
                name: "Custom Puzzle",
                width: width,
                height: height,
                solution: editorSolution,
                clues: editorManualClues
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(puzzle));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "puzzle.nonogram");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function loadPuzzle(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const puzzle = JSON.parse(e.target.result);
                    if ((puzzle.size || (puzzle.width && puzzle.height)) && puzzle.solution && puzzle.clues) {
                        startGame(puzzle);
                    } else {
                        alert('Invalid puzzle file format.');
                    }
                } catch (error) {
                    alert('Error reading puzzle file.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function scaleBoard(containerId) {
            const container = document.getElementById(containerId);
            if (!container || !container.parentElement) return;

            const wrapper = container.parentElement;
            
            container.style.transform = 'scale(1)';

            const availableWidth = wrapper.clientWidth;
            const availableHeight = wrapper.clientHeight;

            const currentWidth = container.offsetWidth;
            const currentHeight = container.offsetHeight;

            if (currentHeight === 0 || currentWidth === 0) return;

            const scale = Math.min(
                (availableWidth * 0.95) / currentWidth, 
                (availableHeight * 0.95) / currentHeight
            );

            container.style.transform = `scale(${scale})`;
        }

        function debouncedAdjust(containerId) {
            window.adjustTimers = window.adjustTimers || {};
            if (window.adjustTimers[containerId]) {
                clearTimeout(window.adjustTimers[containerId]);
            }
            window.adjustTimers[containerId] = setTimeout(() => {
                scaleBoard(containerId);
            }, 50);
        }

        const observerCallback = (mutationsList, observer) => {
            const containerId = observer.target.id;
            debouncedAdjust(containerId);
        };

        const observerConfig = { childList: true, subtree: true, characterData: true };

        const gameContainer = document.getElementById('game-container');
        const editorContainer = document.getElementById('editor-container');
        const gameObserver = new MutationObserver(observerCallback);
        const editorObserver = new MutationObserver(observerCallback);
        const solverInputObserver = new MutationObserver(observerCallback);

        if (gameContainer) {
            gameObserver.target = gameContainer; 
            gameObserver.observe(gameContainer, observerConfig);
        }
        if (editorContainer) {
            editorObserver.target = editorContainer;
            editorObserver.observe(editorContainer, observerConfig);
        }
        if (solverInputContainer) {
            solverInputObserver.target = solverInputContainer;
            solverInputObserver.observe(solverInputContainer, observerConfig);
        }

        window.addEventListener('resize', () => {
            if (gameScreen.classList.contains('active')) {
                scaleBoard('game-container');
            }
            if (editorScreen.classList.contains('active')) {
                scaleBoard('editor-container');
            }
            if (solverScreen.classList.contains('active')) {
                scaleBoard('solver-input-container');
            }
        });
    </script>
</body>
</html>
